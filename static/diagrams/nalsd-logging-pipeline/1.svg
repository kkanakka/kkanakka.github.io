<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 720" xmlns="http://www.w3.org/2000/svg"><style>.box-fill-blue{fill:#ddf4ff;stroke:#54aeff}
.box-fill-green{fill:#dafbe1;stroke:#4ac26b}
.box-fill-purple{fill:#fbefff;stroke:#c297ff}
.box-fill-gray{fill:#f6f8fa;stroke:#d0d7de}
.lbl-title{font-family:'Inter',sans-serif;font-weight:700;font-size:11.5px;fill:#1f2328}
.lbl-sub{font-family:'JetBrains Mono',monospace;font-size:9.5px;fill:#59636e}
.lbl-meta{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#818b98}
.arrow{stroke:#59636e;stroke-width:1.3;fill:none;marker-end:url(#arr)}
.arrow-dashed{stroke:#cf222e;stroke-width:1.2;fill:none;stroke-dasharray:4,3;marker-end:url(#arr-red)}
.arrow-green{stroke:#1a7f37;stroke-width:1.5;fill:none;marker-end:url(#arr-green)}</style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#59636e"></path>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"></path>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"></path>
    </marker>
  </defs>

  <!-- ============ STEP NUMBER BADGES ============ -->
  <!-- Step 1: Producers -->
  <circle cx="200" cy="42" r="11" fill="#0a66c2"></circle>
  <text x="200" y="46" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">1</text>
  <!-- Step 2: ATS edge -->
  <circle cx="405" cy="42" r="11" fill="#0a66c2"></circle>
  <text x="405" y="46" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">2</text>
  <!-- Step 3: Ingest gateway -->
  <circle cx="610" cy="42" r="11" fill="#0a66c2"></circle>
  <text x="610" y="46" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">3</text>
  <!-- Step 4: Kafka -->
  <circle cx="800" cy="172" r="11" fill="#0a66c2"></circle>
  <text x="800" y="176" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">4</text>
  <!-- Step 5: Flink -->
  <circle cx="800" cy="292" r="11" fill="#0a66c2"></circle>
  <text x="800" y="296" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">5</text>
  <!-- Step 6: 3-way fanout (storage) -->
  <circle cx="800" cy="432" r="11" fill="#0a66c2"></circle>
  <text x="800" y="436" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">6</text>
  <!-- Step 7: Query API + Alert engine -->
  <circle cx="800" cy="572" r="11" fill="#0a66c2"></circle>
  <text x="800" y="576" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">7</text>
  <!-- Step 8: Grafana / Notifier -->
  <circle cx="800" cy="692" r="11" fill="#0a66c2"></circle>
  <text x="800" y="696" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">8</text>

  <!-- ============ ROW 1: Producers · ATS edge · Ingest gateway · DLQ ============ -->
  <!-- Producers -->
  <g>
    <rect x="20" y="30" width="170" height="80" rx="6" class="box-fill-gray"></rect>
    <text x="105" y="52" text-anchor="middle" class="lbl-title">Producers</text>
    <text x="105" y="68" text-anchor="middle" class="lbl-sub">Feed · InMail · Jobs</text>
    <text x="105" y="82" text-anchor="middle" class="lbl-sub">Search · Profile · Notif</text>
    <text x="105" y="100" text-anchor="middle" class="lbl-meta">~2 M producer pods</text>
  </g>

  <!-- ATS edge -->
  <g>
    <rect x="225" y="30" width="170" height="80" rx="6" class="box-fill-blue"></rect>
    <text x="310" y="52" text-anchor="middle" class="lbl-title">ATS edge</text>
    <text x="310" y="68" text-anchor="middle" class="lbl-sub">TLS · rate limit</text>
    <text x="310" y="82" text-anchor="middle" class="lbl-sub">batch · gzip 4×</text>
    <text x="310" y="100" text-anchor="middle" class="lbl-meta">5-min local disk buffer</text>
  </g>

  <!-- Ingest gateway -->
  <g>
    <rect x="430" y="30" width="170" height="80" rx="6" class="box-fill-blue"></rect>
    <text x="515" y="52" text-anchor="middle" class="lbl-title">Ingest gateway</text>
    <text x="515" y="68" text-anchor="middle" class="lbl-sub">Envoy + Go · gunzip</text>
    <text x="515" y="82" text-anchor="middle" class="lbl-sub">schema · tenant quota</text>
    <text x="515" y="100" text-anchor="middle" class="lbl-meta">15 nodes · p99 200 ms</text>
  </g>

  <!-- DLQ -->
  <g>
    <rect x="640" y="30" width="170" height="80" rx="6" class="box-fill-gray"></rect>
    <text x="725" y="52" text-anchor="middle" class="lbl-title">DLQ</text>
    <text x="725" y="68" text-anchor="middle" class="lbl-sub">malformed · oversize</text>
    <text x="725" y="82" text-anchor="middle" class="lbl-sub">depth alert · 7-day retain</text>
    <text x="725" y="100" text-anchor="middle" class="lbl-meta">auto-replay valid · purge bad</text>
  </g>

  <!-- ============ ROW 2: Kafka ============ -->
  <g>
    <rect x="20" y="160" width="790" height="80" rx="6" class="box-fill-green"></rect>
    <text x="415" y="183" text-anchor="middle" class="lbl-title" style="font-size:13px">Kafka — sharded by tenant, multi-region</text>
    <text x="415" y="201" text-anchor="middle" class="lbl-sub">Durable log · replayable · MirrorMaker2 to peer region</text>
    <text x="415" y="216" text-anchor="middle" class="lbl-sub">Topics: logs.error · logs.warn · logs.info · logs.debug (10% sampled)</text>
    <text x="415" y="232" text-anchor="middle" class="lbl-meta">21 brokers · 700 MB/s peak · 3× replication · 7-day retention</text>
  </g>

  <!-- ============ ROW 3: Flink stream processors ============ -->
  <g>
    <rect x="20" y="280" width="790" height="100" rx="6" class="box-fill-blue"></rect>
    <text x="415" y="305" text-anchor="middle" class="lbl-title" style="font-size:13px">Flink stream processors</text>
    <text x="415" y="324" text-anchor="middle" class="lbl-sub">Aggregate · dedupe · SLI compute · rule eval · field extraction</text>
    <text x="415" y="342" text-anchor="middle" class="lbl-sub">RocksDB state on NVMe — checkpoints to object store every 30 s</text>
    <text x="415" y="362" text-anchor="middle" class="lbl-meta">12 nodes · 384 cores · 86 MB/s per core effective · replay from Kafka on restart</text>
  </g>

  <!-- ============ ROW 4: MDM · TSDS · Cold storage ============ -->
  <!-- MDM (hot) -->
  <g>
    <rect x="20" y="420" width="250" height="100" rx="6" class="box-fill-green"></rect>
    <text x="145" y="445" text-anchor="middle" class="lbl-title" style="font-size:13px">MDM</text>
    <text x="145" y="463" text-anchor="middle" class="lbl-sub">Hot in-memory · 2 h</text>
    <text x="145" y="481" text-anchor="middle" class="lbl-sub">sub-second query latency</text>
    <text x="145" y="500" text-anchor="middle" class="lbl-meta">recent-incident drill-down</text>
    <text x="145" y="514" text-anchor="middle" class="lbl-meta">RAM-backed · 1 TB · 4 nodes</text>
  </g>

  <!-- TSDS (30-day) -->
  <g>
    <rect x="285" y="420" width="250" height="100" rx="6" class="box-fill-green"></rect>
    <text x="410" y="445" text-anchor="middle" class="lbl-title" style="font-size:13px">TSDS</text>
    <text x="410" y="463" text-anchor="middle" class="lbl-sub">30-day compressed</text>
    <text x="410" y="481" text-anchor="middle" class="lbl-sub">OpenSearch · 3× repl · 65 shards</text>
    <text x="410" y="500" text-anchor="middle" class="lbl-meta">query &lt; 800 ms p99</text>
    <text x="410" y="514" text-anchor="middle" class="lbl-meta">17 NVMe nodes · 130 TB</text>
  </g>

  <!-- Cold storage -->
  <g>
    <rect x="550" y="420" width="260" height="100" rx="6" class="box-fill-green"></rect>
    <text x="680" y="445" text-anchor="middle" class="lbl-title" style="font-size:13px">Cold storage</text>
    <text x="680" y="463" text-anchor="middle" class="lbl-sub">3-year archive</text>
    <text x="680" y="481" text-anchor="middle" class="lbl-sub">Parquet · Glacier IR · 10× compressed</text>
    <text x="680" y="500" text-anchor="middle" class="lbl-meta">restore 1–5 min · 11 nines</text>
    <text x="680" y="514" text-anchor="middle" class="lbl-meta">670 TB · $10 K/mo</text>
  </g>

  <!-- ============ ROW 5: Query API + Alert engine ============ -->
  <g>
    <rect x="20" y="560" width="390" height="90" rx="6" class="box-fill-blue"></rect>
    <text x="215" y="585" text-anchor="middle" class="lbl-title" style="font-size:13px">Query API + cache</text>
    <text x="215" y="603" text-anchor="middle" class="lbl-sub">Redis · Couchbase — query results · metadata</text>
    <text x="215" y="620" text-anchor="middle" class="lbl-sub">Trino · unified across MDM + TSDS + cold</text>
    <text x="215" y="638" text-anchor="middle" class="lbl-meta">9 coordinators · 40 peak QPS · cache hit ratio 70%</text>
  </g>

  <g>
    <rect x="430" y="560" width="380" height="90" rx="6" class="box-fill-blue"></rect>
    <text x="620" y="585" text-anchor="middle" class="lbl-title" style="font-size:13px">Alert engine</text>
    <text x="620" y="603" text-anchor="middle" class="lbl-sub">Rule eval · error-budget burn · priority lanes</text>
    <text x="620" y="620" text-anchor="middle" class="lbl-sub">dedupe · group · suppress</text>
    <text x="620" y="638" text-anchor="middle" class="lbl-meta">stateless · canaried · rules versioned in Git</text>
  </g>

  <!-- ============ ROW 6: Grafana · Notifier ============ -->
  <g>
    <rect x="20" y="680" width="390" height="30" rx="6" class="box-fill-purple"></rect>
    <text x="215" y="700" text-anchor="middle" class="lbl-title">Grafana dashboards · SLI + error-budget views</text>
  </g>

  <g>
    <rect x="430" y="680" width="380" height="30" rx="6" class="box-fill-purple"></rect>
    <text x="620" y="700" text-anchor="middle" class="lbl-title">Notifier · PagerDuty / ChatOps / Email</text>
  </g>

  <!-- ============ ARROWS ============ -->
  <!-- Row 1 horizontal flow -->
  <path d="M190,70 L225,70" class="arrow"></path>
  <path d="M395,70 L430,70" class="arrow"></path>
  <path d="M600,70 L640,70" class="arrow-dashed"></path>

  <!-- Ingest gateway → Kafka (down) -->
  <path d="M515,110 L515,160" class="arrow"></path>

  <!-- Kafka replay loop -->
  <path d="M20,200 Q5,200 5,280 Q5,330 20,330" class="arrow-dashed"></path>
  <text x="12" y="245" text-anchor="middle" class="lbl-meta" fill="#cf222e" transform="rotate(-90 12 245)">replay</text>

  <!-- Kafka → Flink -->
  <path d="M415,240 L415,280" class="arrow"></path>

  <!-- Flink → MDM / TSDS / Cold (3-way fanout) -->
  <path d="M250,380 L145,420" class="arrow"></path>
  <path d="M415,380 L410,420" class="arrow"></path>
  <path d="M580,380 L680,420" class="arrow"></path>

  <!-- MDM → Query API -->
  <path d="M145,520 L200,560" class="arrow"></path>
  <!-- TSDS → Query API & Alert engine -->
  <path d="M380,520 L240,560" class="arrow"></path>
  <path d="M440,520 L590,560" class="arrow"></path>
  <!-- Cold → Query API -->
  <path d="M650,520 L290,560" class="arrow" stroke-opacity="0.5"></path>

  <!-- Query API → Grafana -->
  <path d="M215,650 L215,680" class="arrow"></path>
  <!-- Alert engine → Notifier -->
  <path d="M620,650 L620,680" class="arrow-green"></path>

  <!-- Legend -->
  <g transform="translate(20,5)">
    <line x1="0" y1="5" x2="22" y2="5" class="arrow"></line><text x="28" y="9" class="lbl-meta">data flow</text>
    <line x1="120" y1="5" x2="142" y2="5" class="arrow-dashed"></line><text x="148" y="9" class="lbl-meta">failure / replay</text>
    <line x1="260" y1="5" x2="282" y2="5" class="arrow-green"></line><text x="288" y="9" class="lbl-meta">page out</text>
  </g>
</svg>
