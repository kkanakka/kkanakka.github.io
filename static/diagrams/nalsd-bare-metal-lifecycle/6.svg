<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img"><style>svg{display:block; max-width:100%; height:auto;}</style><defs><marker id="ah-d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#444441" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#0f6e56" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#993c1d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#185fa5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#854f0b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-purp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#534ab7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><fedropshadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#1c1b18" flood-opacity="0.13"></fedropshadow></filter></defs><text x="450" y="24" text-anchor="middle" font-weight="700" font-size="12.5" fill="#1c1b18">Self-healing — a closed loop that fixes problems on its own, with safety limits</text><g><rect x="40" y="52" width="300" height="104" rx="11" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.3" filter="url(#soft)"></rect><text x="190.0" y="87.0" text-anchor="middle" font-weight="700" font-size="16" fill="#0c447c">Detect</text><text x="190.0" y="103.0" text-anchor="middle" font-weight="600" font-size="10.5" fill="#185fa5">Every server watches its own health.</text><text x="190.0" y="117.0" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">Aggregators spot patterns</text><text x="190.0" y="131.0" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">across many servers at once.</text></g><g><rect x="560" y="52" width="300" height="104" rx="11" fill="#d9d9d9" stroke="#1c1b18" stroke-width="1.3" filter="url(#soft)"></rect><text x="710.0" y="87.0" text-anchor="middle" font-weight="700" font-size="16" fill="#1c1b18">Decide</text><text x="710.0" y="103.0" text-anchor="middle" font-weight="600" font-size="10.5" fill="#1c1b18">A controller picks the fix —</text><text x="710.0" y="117.0" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">with strict limits on how many</text><text x="710.0" y="131.0" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">servers it may touch at once.</text></g><g><rect x="560" y="250" width="300" height="104" rx="11" fill="#faeeda" stroke="#854f0b" stroke-width="1.3" filter="url(#soft)"></rect><text x="710.0" y="285.0" text-anchor="middle" font-weight="700" font-size="16" fill="#633806">Act</text><text x="710.0" y="301.0" text-anchor="middle" font-weight="600" font-size="10.5" fill="#854f0b">Apply the fix:</text><text x="710.0" y="315.0" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">reinstall software, update firmware,</text><text x="710.0" y="329.0" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">or send hardware off for repair.</text></g><g><rect x="40" y="250" width="300" height="104" rx="11" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.3" filter="url(#soft)"></rect><text x="190.0" y="285.0" text-anchor="middle" font-weight="700" font-size="16" fill="#085041">Validate</text><text x="190.0" y="301.0" text-anchor="middle" font-weight="600" font-size="10.5" fill="#0f6e56">Re-run all the health checks.</text><text x="190.0" y="315.0" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">Only if everything passes does</text><text x="190.0" y="329.0" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">the server go back to work.</text></g><line x1="340" y1="104" x2="558" y2="104" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><text x="449.0" y="96.0" text-anchor="middle" font-weight="700" font-size="10" fill="#444441">problem found</text><line x1="710" y1="156" x2="710" y2="248" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><text x="710.0" y="202.0" text-anchor="middle" font-weight="700" font-size="9.5" fill="#444441">fix chosen</text><line x1="560" y1="302" x2="342" y2="302" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><text x="451.0" y="294.0" text-anchor="middle" font-weight="700" font-size="10" fill="#444441">fix applied</text><line x1="190" y1="250" x2="190" y2="158" stroke="#0f6e56" stroke-width="1.7" marker-end="url(#ah-ok)"></line><text x="190.0" y="204.0" text-anchor="middle" font-weight="700" font-size="9.5" fill="#0f6e56">all green → back to work</text><rect x="360" y="150" width="180" height="104" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.2"></rect><text x="450.0" y="178.0" text-anchor="middle" font-weight="600" font-size="9.5" fill="#0c447c">SAFETY RAILS</text><text x="450.0" y="192.0" text-anchor="middle" font-weight="600" font-size="9.5" fill="#0c447c">• fix only a few at once</text><text x="450.0" y="206.0" text-anchor="middle" font-weight="600" font-size="9.5" fill="#0c447c">• cooldowns stop flapping</text><text x="450.0" y="220.0" text-anchor="middle" font-weight="600" font-size="9.5" fill="#0c447c">• stuck → hand to a human</text><text x="450.0" y="234.0" text-anchor="middle" font-weight="600" font-size="9.5" fill="#0c447c">• instant kill-switch</text><text x="450" y="392" text-anchor="middle" font-weight="700" font-size="10.5" fill="#5f5e5a" font-style="italic">Nothing is fire-and-forget — every fix is followed by a re-check before the server is trusted again.</text></svg>
