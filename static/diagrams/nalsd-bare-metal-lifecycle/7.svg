<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img"><style>svg{display:block; max-width:100%; height:auto;}</style><defs><marker id="ah-d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#444441" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#0f6e56" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#993c1d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#185fa5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#854f0b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-purp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#534ab7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><fedropshadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#1c1b18" flood-opacity="0.13"></fedropshadow></filter></defs><text x="450" y="24" text-anchor="middle" font-weight="700" font-size="12" fill="#1c1b18">Many sites, no central boss — each site runs itself, and every server has exactly one owner</text><g><rect x="60" y="60" width="220" height="80" rx="11" fill="#d9d9d9" stroke="#1c1b18" stroke-width="1.3" filter="url(#soft)"></rect><text x="170.0" y="90.0" text-anchor="middle" font-weight="700" font-size="15" fill="#1c1b18">Site A</text><text x="170.0" y="106.0" text-anchor="middle" font-weight="600" font-size="10.5" fill="#1c1b18">owns its own servers</text><text x="170.0" y="120.0" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">runs its own control</text></g><g><rect x="340" y="60" width="220" height="80" rx="11" fill="#d9d9d9" stroke="#1c1b18" stroke-width="1.3" filter="url(#soft)"></rect><text x="450.0" y="90.0" text-anchor="middle" font-weight="700" font-size="15" fill="#1c1b18">Site B</text><text x="450.0" y="106.0" text-anchor="middle" font-weight="600" font-size="10.5" fill="#1c1b18">owns its own servers</text><text x="450.0" y="120.0" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">runs its own control</text></g><g><rect x="620" y="60" width="220" height="80" rx="11" fill="#d9d9d9" stroke="#1c1b18" stroke-width="1.3" filter="url(#soft)"></rect><text x="730.0" y="90.0" text-anchor="middle" font-weight="700" font-size="15" fill="#1c1b18">Site C</text><text x="730.0" y="106.0" text-anchor="middle" font-weight="600" font-size="10.5" fill="#1c1b18">owns its own servers</text><text x="730.0" y="120.0" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">runs its own control</text></g><g><rect x="340" y="180" width="220" height="64" rx="11" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.3" filter="url(#soft)"></rect><text x="450.0" y="202.0" text-anchor="middle" font-weight="700" font-size="14" fill="#085041">Witness</text><text x="450.0" y="218.0" text-anchor="middle" font-weight="600" font-size="11" fill="#0f6e56">a small neutral tie-breaker</text><text x="450.0" y="232.0" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">votes, but owns nothing</text></g><text x="450" y="162" text-anchor="middle" font-weight="700" font-size="9.5" fill="#085041">all four vote together for any cross-site decision</text><line x1="170" y1="140" x2="450" y2="178" stroke="#0f6e56" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#ah-ok)"></line><line x1="450" y1="140" x2="450" y2="178" stroke="#0f6e56" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#ah-ok)"></line><line x1="730" y1="140" x2="450" y2="178" stroke="#0f6e56" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#ah-ok)"></line><rect x="60" y="256" width="780" height="52" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.2"></rect><text x="450.0" y="279.0" text-anchor="middle" font-weight="600" font-size="10.5" fill="#0c447c">How split-brain is prevented:  each server is 'leased' to one site for a limited time. To change who owns a server,</text><text x="450.0" y="293.0" text-anchor="middle" font-weight="600" font-size="10.5" fill="#0c447c">a majority must agree. If a site gets cut off, it simply can't make changes — it can't out-vote the others. No two sites ever claim the same server.</text></svg>
