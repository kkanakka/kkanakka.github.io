<svg viewBox="0 0 900 250" xmlns="http://www.w3.org/2000/svg" role="img"><style>svg{display:block; max-width:100%; height:auto;}</style><defs><marker id="ah-d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#444441" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#0f6e56" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#993c1d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#185fa5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#854f0b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-purp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#534ab7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><fedropshadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#1c1b18" flood-opacity="0.13"></fedropshadow></filter></defs><text x="450" y="28" text-anchor="middle" font-weight="700" font-size="12" fill="#1c1b18">The one job: turn a server in a rack into a useful part of the fleet — and keep it that way — with no humans in the loop.</text><g><rect x="40" y="60" width="180" height="90" rx="11" fill="#ffffff" stroke="#a9a79e" stroke-width="1.3" filter="url(#soft)"></rect><text x="130.0" y="95.0" text-anchor="middle" font-weight="700" font-size="15" fill="#1c1b18">A new server</text><text x="130.0" y="111.0" text-anchor="middle" font-weight="600" font-size="11" fill="#a9a79e">arrives, racked,</text><text x="130.0" y="125.0" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">powered on — no OS yet</text></g><line x1="228" y1="105" x2="296" y2="105" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><text x="262" y="86" text-anchor="middle" font-weight="700" font-size="10" fill="#5f5e5a">within ~1 hour</text><g><rect x="300" y="60" width="300" height="90" rx="11" fill="#d9d9d9" stroke="#1c1b18" stroke-width="1.3" filter="url(#soft)"></rect><text x="450.0" y="95.0" text-anchor="middle" font-weight="700" font-size="15" fill="#1c1b18">The system handles everything</text><text x="450.0" y="111.0" text-anchor="middle" font-weight="600" font-size="11" fill="#1c1b18">find it → set it up → watch it</text><text x="450.0" y="125.0" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">→ fix it when it breaks</text></g><line x1="600" y1="105" x2="680" y2="105" stroke="#0f6e56" stroke-width="2.0" marker-end="url(#ah-ok)"></line><g><rect x="680" y="60" width="180" height="90" rx="11" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.3" filter="url(#soft)"></rect><text x="770.0" y="95.0" text-anchor="middle" font-weight="700" font-size="15" fill="#085041">Running real work</text><text x="770.0" y="111.0" text-anchor="middle" font-weight="600" font-size="11" fill="#0f6e56">part of the fleet,</text><text x="770.0" y="125.0" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">watched 24/7</text></g><rect x="120" y="170" width="660" height="56" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.2"></rect><text x="450.0" y="195.0" text-anchor="middle" font-weight="600" font-size="11" fill="#0c447c">Three things make it work:  five layers do the hands-on steps  ·  one global brain coordinates</text><text x="450.0" y="209.0" text-anchor="middle" font-weight="600" font-size="11" fill="#0c447c">across all sites  ·  a tamper-proof log records every single action.</text></svg>
