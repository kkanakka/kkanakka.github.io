<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" role="img"><style>svg{display:block; max-width:100%; height:auto;}</style><defs><marker id="ah-d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#444441" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#0f6e56" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#993c1d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#185fa5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#854f0b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-purp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#534ab7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><fedropshadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#1c1b18" flood-opacity="0.13"></fedropshadow></filter></defs><text x="450" y="26" text-anchor="middle" font-weight="700" font-size="12.5" fill="#1c1b18">Five layers do the work — each one has a simple, single job</text><g><rect x="60" y="54" width="150" height="58" rx="11" fill="#d9d9d9" stroke="#1c1b18" stroke-width="1.3" filter="url(#soft)"></rect><text x="135.0" y="80.0" text-anchor="middle" font-weight="700" font-size="13" fill="#1c1b18">Layer 1</text><text x="135.0" y="96.0" text-anchor="middle" font-weight="600" font-size="13" fill="#1c1b18">Discover</text></g><g><rect x="230" y="54" width="470" height="58" rx="11" fill="#ffffff" stroke="#a9a79e" stroke-width="1.3" filter="url(#soft)"></rect><text x="465.0" y="80.0" text-anchor="middle" font-weight="700" font-size="11.5" fill="#1c1b18">Find new servers and write down</text><text x="465.0" y="96.0" text-anchor="middle" font-weight="600" font-size="11.5" fill="#a9a79e">what they are and where they sit.</text></g><line x1="135" y1="112" x2="135" y2="124" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><g><rect x="60" y="124" width="150" height="58" rx="11" fill="#d9d9d9" stroke="#1c1b18" stroke-width="1.3" filter="url(#soft)"></rect><text x="135.0" y="150.0" text-anchor="middle" font-weight="700" font-size="13" fill="#1c1b18">Layer 2</text><text x="135.0" y="166.0" text-anchor="middle" font-weight="600" font-size="13" fill="#1c1b18">Provision</text></g><g><rect x="230" y="124" width="470" height="58" rx="11" fill="#ffffff" stroke="#a9a79e" stroke-width="1.3" filter="url(#soft)"></rect><text x="465.0" y="150.0" text-anchor="middle" font-weight="700" font-size="11.5" fill="#1c1b18">Install the standard software</text><text x="465.0" y="166.0" text-anchor="middle" font-weight="600" font-size="11.5" fill="#a9a79e">image and join the cluster.</text></g><line x1="135" y1="182" x2="135" y2="194" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><g><rect x="60" y="194" width="150" height="58" rx="11" fill="#d9d9d9" stroke="#1c1b18" stroke-width="1.3" filter="url(#soft)"></rect><text x="135.0" y="220.0" text-anchor="middle" font-weight="700" font-size="13" fill="#1c1b18">Layer 3</text><text x="135.0" y="236.0" text-anchor="middle" font-weight="600" font-size="13" fill="#1c1b18">Configure</text></g><g><rect x="230" y="194" width="470" height="58" rx="11" fill="#ffffff" stroke="#a9a79e" stroke-width="1.3" filter="url(#soft)"></rect><text x="465.0" y="220.0" text-anchor="middle" font-weight="700" font-size="11.5" fill="#1c1b18">Apply the right settings for</text><text x="465.0" y="236.0" text-anchor="middle" font-weight="600" font-size="11.5" fill="#a9a79e">this server's job and location.</text></g><line x1="135" y1="252" x2="135" y2="264" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><g><rect x="60" y="264" width="150" height="58" rx="11" fill="#d9d9d9" stroke="#1c1b18" stroke-width="1.3" filter="url(#soft)"></rect><text x="135.0" y="290.0" text-anchor="middle" font-weight="700" font-size="13" fill="#1c1b18">Layer 4</text><text x="135.0" y="306.0" text-anchor="middle" font-weight="600" font-size="13" fill="#1c1b18">Monitor</text></g><g><rect x="230" y="264" width="470" height="58" rx="11" fill="#ffffff" stroke="#a9a79e" stroke-width="1.3" filter="url(#soft)"></rect><text x="465.0" y="290.0" text-anchor="middle" font-weight="700" font-size="11.5" fill="#1c1b18">Watch health constantly —</text><text x="465.0" y="306.0" text-anchor="middle" font-weight="600" font-size="11.5" fill="#a9a79e">emit metrics, catch problems early.</text></g><line x1="135" y1="322" x2="135" y2="334" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><g><rect x="60" y="334" width="150" height="58" rx="11" fill="#d9d9d9" stroke="#1c1b18" stroke-width="1.3" filter="url(#soft)"></rect><text x="135.0" y="360.0" text-anchor="middle" font-weight="700" font-size="13" fill="#1c1b18">Layer 5</text><text x="135.0" y="376.0" text-anchor="middle" font-weight="600" font-size="13" fill="#1c1b18">Remediate</text></g><g><rect x="230" y="334" width="470" height="58" rx="11" fill="#ffffff" stroke="#a9a79e" stroke-width="1.3" filter="url(#soft)"></rect><text x="465.0" y="360.0" text-anchor="middle" font-weight="700" font-size="11.5" fill="#1c1b18">When something breaks, fix it</text><text x="465.0" y="376.0" text-anchor="middle" font-weight="600" font-size="11.5" fill="#a9a79e">or route it for repair — automatically.</text></g><g><rect x="720" y="54" width="150" height="200" rx="11" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.3" filter="url(#soft)"></rect><text x="795.0" y="137.0" text-anchor="middle" font-weight="700" font-size="13" fill="#085041">Global brain</text><text x="795.0" y="153.0" text-anchor="middle" font-weight="600" font-size="11" fill="#0f6e56">coordinates all five</text><text x="795.0" y="167.0" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">layers, across every</text><text x="795.0" y="181.0" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">site, all at once</text></g><g><rect x="720" y="266" width="150" height="128" rx="11" fill="#faeeda" stroke="#854f0b" stroke-width="1.3" filter="url(#soft)"></rect><text x="795.0" y="313.0" text-anchor="middle" font-weight="700" font-size="13" fill="#633806">Tamper-proof log</text><text x="795.0" y="329.0" text-anchor="middle" font-weight="600" font-size="11" fill="#854f0b">records every</text><text x="795.0" y="343.0" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">action, forever —</text><text x="795.0" y="357.0" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">who, what, when</text></g><line x1="700" y1="150" x2="718" y2="150" stroke="#0f6e56" stroke-width="1.7" stroke-dasharray="5 3" marker-end="url(#ah-ok)"></line><line x1="700" y1="320" x2="718" y2="320" stroke="#854f0b" stroke-width="1.7" stroke-dasharray="5 3" marker-end="url(#ah-warn)"></line><rect x="60" y="408" width="640" height="0" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.2"></rect></svg>
