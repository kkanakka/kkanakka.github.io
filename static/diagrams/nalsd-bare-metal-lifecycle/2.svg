<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" role="img"><style>svg{display:block; max-width:100%; height:auto;}</style><defs><marker id="ah-d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#444441" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#0f6e56" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#993c1d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#185fa5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#854f0b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-purp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#534ab7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><fedropshadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#1c1b18" flood-opacity="0.13"></fedropshadow></filter></defs><text x="450" y="26" text-anchor="middle" font-weight="700" font-size="12.5" fill="#1c1b18">A server's journey — eight phases from 'ordered' to 'doing real work'</text><g><rect x="26" y="50" width="196" height="116" rx="11" fill="#ffffff" stroke="#a9a79e" stroke-width="1.3" filter="url(#soft)"></rect><text x="124.0" y="98.0" text-anchor="middle" font-weight="700" font-size="14" fill="#1c1b18">Ordered &amp; received</text><text x="124.0" y="114.0" text-anchor="middle" font-weight="600" font-size="10.5" fill="#a9a79e">Hardware is bought, shipped,</text><text x="124.0" y="128.0" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">racked and cabled.</text></g><g><circle cx="42" cy="66" r="9.5" fill="#1c1b18"></circle><text x="42" y="69.6" text-anchor="middle" font-weight="800" font-size="11" fill="#fff">1</text></g><line x1="222" y1="108.0" x2="238" y2="108.0" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><g><rect x="238" y="50" width="196" height="116" rx="11" fill="#ffffff" stroke="#a9a79e" stroke-width="1.3" filter="url(#soft)"></rect><text x="336.0" y="98.0" text-anchor="middle" font-weight="700" font-size="14" fill="#1c1b18">Checked</text><text x="336.0" y="114.0" text-anchor="middle" font-weight="600" font-size="10.5" fill="#a9a79e">Is this the exact hardware</text><text x="336.0" y="128.0" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">we paid for? Verify every part.</text></g><g><circle cx="254" cy="66" r="9.5" fill="#1c1b18"></circle><text x="254" y="69.6" text-anchor="middle" font-weight="800" font-size="11" fill="#fff">2</text></g><line x1="434" y1="108.0" x2="450" y2="108.0" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><g><rect x="450" y="50" width="196" height="116" rx="11" fill="#ffffff" stroke="#a9a79e" stroke-width="1.3" filter="url(#soft)"></rect><text x="548.0" y="98.0" text-anchor="middle" font-weight="700" font-size="14" fill="#1c1b18">Tested</text><text x="548.0" y="114.0" text-anchor="middle" font-weight="600" font-size="10.5" fill="#a9a79e">Run benchmarks. Is it as</text><text x="548.0" y="128.0" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">fast as it should be?</text></g><g><circle cx="466" cy="66" r="9.5" fill="#1c1b18"></circle><text x="466" y="69.6" text-anchor="middle" font-weight="800" font-size="11" fill="#fff">3</text></g><line x1="646" y1="108.0" x2="662" y2="108.0" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><g><rect x="662" y="50" width="196" height="116" rx="11" fill="#d9d9d9" stroke="#1c1b18" stroke-width="1.3" filter="url(#soft)"></rect><text x="760.0" y="98.0" text-anchor="middle" font-weight="700" font-size="14" fill="#1c1b18">Spare pool</text><text x="760.0" y="114.0" text-anchor="middle" font-weight="600" font-size="10.5" fill="#1c1b18">Certified and idle — ready to</text><text x="760.0" y="128.0" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">deploy in minutes when needed.</text></g><g><circle cx="678" cy="66" r="9.5" fill="#1c1b18"></circle><text x="678" y="69.6" text-anchor="middle" font-weight="800" font-size="11" fill="#fff">4</text></g><line x1="760.0" y1="166" x2="760.0" y2="184.0" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><line x1="760.0" y1="184.0" x2="124.0" y2="184.0" stroke="#444441" stroke-width="1.7"></line><line x1="124.0" y1="184.0" x2="124.0" y2="202" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><g><rect x="26" y="202" width="196" height="116" rx="11" fill="#ffffff" stroke="#a9a79e" stroke-width="1.3" filter="url(#soft)"></rect><text x="124.0" y="250.0" text-anchor="middle" font-weight="700" font-size="14" fill="#1c1b18">Set up</text><text x="124.0" y="266.0" text-anchor="middle" font-weight="600" font-size="10.5" fill="#a9a79e">Wipe disks, install the standard</text><text x="124.0" y="280.0" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">software image, join the cluster.</text></g><g><circle cx="42" cy="218" r="9.5" fill="#1c1b18"></circle><text x="42" y="221.6" text-anchor="middle" font-weight="800" font-size="11" fill="#fff">5</text></g><line x1="222" y1="260.0" x2="238" y2="260.0" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><g><rect x="238" y="202" width="196" height="116" rx="11" fill="#ffffff" stroke="#a9a79e" stroke-width="1.3" filter="url(#soft)"></rect><text x="336.0" y="250.0" text-anchor="middle" font-weight="700" font-size="14" fill="#1c1b18">Validated</text><text x="336.0" y="266.0" text-anchor="middle" font-weight="600" font-size="10.5" fill="#a9a79e">Final health checks. Everything</text><text x="336.0" y="280.0" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">green before it takes work.</text></g><g><circle cx="254" cy="218" r="9.5" fill="#1c1b18"></circle><text x="254" y="221.6" text-anchor="middle" font-weight="800" font-size="11" fill="#fff">6</text></g><line x1="434" y1="260.0" x2="450" y2="260.0" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><g><rect x="450" y="202" width="196" height="116" rx="11" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.3" filter="url(#soft)"></rect><text x="548.0" y="250.0" text-anchor="middle" font-weight="700" font-size="14" fill="#085041">Production</text><text x="548.0" y="266.0" text-anchor="middle" font-weight="600" font-size="10.5" fill="#0f6e56">Doing real work. Watched</text><text x="548.0" y="280.0" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">continuously for any problem.</text></g><g><circle cx="466" cy="218" r="9.5" fill="#1c1b18"></circle><text x="466" y="221.6" text-anchor="middle" font-weight="800" font-size="11" fill="#fff">7</text></g><line x1="646" y1="260.0" x2="662" y2="260.0" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><g><rect x="662" y="202" width="196" height="116" rx="11" fill="#faeeda" stroke="#854f0b" stroke-width="1.3" filter="url(#soft)"></rect><text x="760.0" y="250.0" text-anchor="middle" font-weight="700" font-size="14" fill="#633806">Ongoing care</text><text x="760.0" y="266.0" text-anchor="middle" font-weight="600" font-size="10.5" fill="#854f0b">If it breaks: fix it automatically,</text><text x="760.0" y="280.0" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">re-check, put it back. Or replace it.</text></g><g><circle cx="678" cy="218" r="9.5" fill="#1c1b18"></circle><text x="678" y="221.6" text-anchor="middle" font-weight="800" font-size="11" fill="#fff">8</text></g><rect x="26" y="420" width="848" height="38" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.2"></rect><text x="450.0" y="443.0" text-anchor="middle" font-weight="600" font-size="10.5" fill="#0c447c">The gates that matter:  wrong hardware → quarantine    ·    too slow → triage    ·    fails health check → hold, don't ship it to production.</text></svg>
