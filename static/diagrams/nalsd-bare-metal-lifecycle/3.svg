<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img"><style>svg{display:block; max-width:100%; height:auto;}</style><defs><marker id="ah-d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#444441" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#0f6e56" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#993c1d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#185fa5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#854f0b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-purp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#534ab7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><fedropshadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#1c1b18" flood-opacity="0.13"></fedropshadow></filter></defs><text x="450" y="24" text-anchor="middle" font-weight="700" font-size="12.5" fill="#1c1b18">Every server moves through these states — all tracked in one inventory database</text><g><rect x="22" y="66" width="86" height="50" rx="11" fill="#ffffff" stroke="#a9a79e" stroke-width="1.3" filter="url(#soft)"></rect><text x="65.0" y="95.0" text-anchor="middle" font-weight="700" font-size="10.5" fill="#1c1b18">Ordered</text></g><g><rect x="116" y="66" width="86" height="50" rx="11" fill="#ffffff" stroke="#a9a79e" stroke-width="1.3" filter="url(#soft)"></rect><text x="159.0" y="95.0" text-anchor="middle" font-weight="700" font-size="10.5" fill="#1c1b18">Received</text></g><g><rect x="210" y="66" width="86" height="50" rx="11" fill="#ffffff" stroke="#a9a79e" stroke-width="1.3" filter="url(#soft)"></rect><text x="253.0" y="95.0" text-anchor="middle" font-weight="700" font-size="10.5" fill="#1c1b18">Discovered</text></g><g><rect x="304" y="66" width="86" height="50" rx="11" fill="#ffffff" stroke="#a9a79e" stroke-width="1.3" filter="url(#soft)"></rect><text x="347.0" y="95.0" text-anchor="middle" font-weight="700" font-size="10.5" fill="#1c1b18">Checked</text></g><g><rect x="398" y="66" width="86" height="50" rx="11" fill="#ffffff" stroke="#a9a79e" stroke-width="1.3" filter="url(#soft)"></rect><text x="441.0" y="95.0" text-anchor="middle" font-weight="700" font-size="10.5" fill="#1c1b18">Tested</text></g><g><rect x="492" y="66" width="86" height="50" rx="11" fill="#d9d9d9" stroke="#1c1b18" stroke-width="1.3" filter="url(#soft)"></rect><text x="535.0" y="95.0" text-anchor="middle" font-weight="700" font-size="10.5" fill="#1c1b18">Spare</text></g><g><rect x="586" y="66" width="86" height="50" rx="11" fill="#ffffff" stroke="#a9a79e" stroke-width="1.3" filter="url(#soft)"></rect><text x="629.0" y="95.0" text-anchor="middle" font-weight="700" font-size="10.5" fill="#1c1b18">Setting up</text></g><g><rect x="680" y="66" width="86" height="50" rx="11" fill="#ffffff" stroke="#a9a79e" stroke-width="1.3" filter="url(#soft)"></rect><text x="723.0" y="95.0" text-anchor="middle" font-weight="700" font-size="10.5" fill="#1c1b18">Validating</text></g><g><rect x="774" y="66" width="86" height="50" rx="11" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.3" filter="url(#soft)"></rect><text x="817.0" y="95.0" text-anchor="middle" font-weight="700" font-size="10.5" fill="#085041">Active</text></g><line x1="108.0" y1="91" x2="116.0" y2="91" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><line x1="202.0" y1="91" x2="210.0" y2="91" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><line x1="296.0" y1="91" x2="304.0" y2="91" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><line x1="390.0" y1="91" x2="398.0" y2="91" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><line x1="484.0" y1="91" x2="492.0" y2="91" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><line x1="578.0" y1="91" x2="586.0" y2="91" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><line x1="672.0" y1="91" x2="680.0" y2="91" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><line x1="766.0" y1="91" x2="774.0" y2="91" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><text x="450" y="52" text-anchor="middle" font-weight="700" font-size="10" fill="#27500a">THE HAPPY PATH — ordered, all the way to doing real work</text><text x="450" y="150" text-anchor="middle" font-weight="700" font-size="10.5" fill="#633806">THE REPAIR LOOP — when an active server breaks</text><line x1="817.0" y1="116" x2="817.0" y2="166" stroke="#854f0b" stroke-width="1.7" marker-end="url(#ah-warn)"></line><text x="817.0" y="159.0" text-anchor="middle" font-weight="700" font-size="9" fill="#854f0b">breaks</text><g><rect x="362.0" y="170" width="150" height="52" rx="11" fill="#faeeda" stroke="#854f0b" stroke-width="1.3" filter="url(#soft)"></rect><text x="437.0" y="193.0" text-anchor="middle" font-weight="700" font-size="12" fill="#633806">Cordoned</text><text x="437.0" y="209.0" text-anchor="middle" font-weight="600" font-size="11" fill="#854f0b">no new work</text></g><g><rect x="552.0" y="170" width="150" height="52" rx="11" fill="#faeeda" stroke="#854f0b" stroke-width="1.3" filter="url(#soft)"></rect><text x="627.0" y="193.0" text-anchor="middle" font-weight="700" font-size="12" fill="#633806">Draining</text><text x="627.0" y="209.0" text-anchor="middle" font-weight="600" font-size="11" fill="#854f0b">move work off</text></g><g><rect x="742.0" y="170" width="150" height="52" rx="11" fill="#faeeda" stroke="#854f0b" stroke-width="1.3" filter="url(#soft)"></rect><text x="817.0" y="193.0" text-anchor="middle" font-weight="700" font-size="12" fill="#633806">Recovering</text><text x="817.0" y="209.0" text-anchor="middle" font-weight="600" font-size="11" fill="#854f0b">fix in progress</text></g><line x1="742.0" y1="196" x2="702.0" y2="196" stroke="#854f0b" stroke-width="1.7" marker-end="url(#ah-warn)"></line><line x1="552.0" y1="196" x2="512.0" y2="196" stroke="#854f0b" stroke-width="1.7" marker-end="url(#ah-warn)"></line><line x1="817.0" y1="170" x2="817.0" y2="128" stroke="#0f6e56" stroke-width="1.8" marker-end="url(#ah-ok)"></line><line x1="817.0" y1="128" x2="723.0" y2="128" stroke="#0f6e56" stroke-width="1.8"></line><line x1="723.0" y1="128" x2="723.0" y2="116" stroke="#0f6e56" stroke-width="1.7" marker-end="url(#ah-ok)"></line><text x="573.0" y="134" text-anchor="middle" font-weight="700" font-size="9.5" fill="#085041">fixed → re-check → back to Active</text><text x="450" y="270" text-anchor="middle" font-weight="700" font-size="10.5" fill="#791f1f">THE TWO DEAD ENDS</text><g><rect x="180" y="290" width="230" height="64" rx="11" fill="#faece7" stroke="#993c1d" stroke-width="1.3" filter="url(#soft)"></rect><text x="295.0" y="312.0" text-anchor="middle" font-weight="700" font-size="12" fill="#712b13">Quarantined</text><text x="295.0" y="328.0" text-anchor="middle" font-weight="600" font-size="11" fill="#993c1d">wrong hardware on arrival</text><text x="295.0" y="342.0" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">→ held for a human to review</text></g><g><rect x="490" y="290" width="230" height="64" rx="11" fill="#faece7" stroke="#993c1d" stroke-width="1.3" filter="url(#soft)"></rect><text x="605.0" y="312.0" text-anchor="middle" font-weight="700" font-size="12" fill="#712b13">Decommissioned</text><text x="605.0" y="328.0" text-anchor="middle" font-weight="600" font-size="11" fill="#993c1d">hardware that can't be fixed</text><text x="605.0" y="342.0" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">→ wiped, pulled, RMA or recycled</text></g><line x1="347.0" y1="116" x2="295" y2="288" stroke="#993c1d" stroke-width="1.7" stroke-dasharray="5 3" marker-end="url(#ah-fail)"></line><text x="321.0" y="198.0" text-anchor="middle" font-weight="700" font-size="9" fill="#993c1d">fails the hardware check</text><line x1="817.0" y1="222" x2="605" y2="288" stroke="#993c1d" stroke-width="1.7" stroke-dasharray="5 3" marker-end="url(#ah-fail)"></line><text x="711.0" y="251.0" text-anchor="middle" font-weight="700" font-size="9" fill="#993c1d">can't be fixed</text><rect x="60" y="372" width="780" height="36" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.2"></rect><text x="450.0" y="394.0" text-anchor="middle" font-weight="600" font-size="10" fill="#0c447c">When a server is decommissioned, a replacement is automatically pulled from the spare pool and sent through the setup phase — the fleet self-replenishes.</text></svg>
