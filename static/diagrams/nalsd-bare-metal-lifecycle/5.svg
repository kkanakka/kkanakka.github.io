<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 372" xmlns="http://www.w3.org/2000/svg" role="img"><style>svg{display:block; max-width:100%; height:auto;}</style><defs><marker id="ah-d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#444441" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#0f6e56" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#993c1d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#185fa5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#854f0b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="ah-purp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#534ab7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><fedropshadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#1c1b18" flood-opacity="0.13"></fedropshadow></filter></defs><text x="450" y="24" text-anchor="middle" font-weight="700" font-size="12" fill="#1c1b18">Discovery — who kicks off each step? One software service: the Discovery Controller.</text><g><rect x="30" y="40" width="150" height="42" rx="11" fill="#ffffff" stroke="#a9a79e" stroke-width="1.3" filter="url(#soft)"></rect><text x="105.0" y="65.0" text-anchor="middle" font-weight="700" font-size="11" fill="#1c1b18">New server</text></g><g><rect x="210" y="40" width="150" height="42" rx="11" fill="#ffffff" stroke="#a9a79e" stroke-width="1.3" filter="url(#soft)"></rect><text x="285.0" y="65.0" text-anchor="middle" font-weight="700" font-size="11" fill="#1c1b18">DHCP server</text></g><g><rect x="400" y="40" width="200" height="42" rx="11" fill="#d9d9d9" stroke="#1c1b18" stroke-width="1.3" filter="url(#soft)"></rect><text x="500.0" y="65.0" text-anchor="middle" font-weight="700" font-size="11" fill="#1c1b18">Discovery Controller</text></g><g><rect x="620" y="40" width="150" height="42" rx="11" fill="#ffffff" stroke="#a9a79e" stroke-width="1.3" filter="url(#soft)"></rect><text x="695.0" y="65.0" text-anchor="middle" font-weight="700" font-size="11" fill="#1c1b18">Probe image</text></g><g><rect x="790" y="40" width="90" height="42" rx="11" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.3" filter="url(#soft)"></rect><text x="835.0" y="65.0" text-anchor="middle" font-weight="700" font-size="11" fill="#085041">Inventory DB</text></g><line x1="105.0" y1="82" x2="105.0" y2="350" stroke="#c9c7bf" stroke-width="1.3" stroke-dasharray="4 4"></line><line x1="285.0" y1="82" x2="285.0" y2="350" stroke="#c9c7bf" stroke-width="1.3" stroke-dasharray="4 4"></line><line x1="500.0" y1="82" x2="500.0" y2="350" stroke="#c9c7bf" stroke-width="1.3" stroke-dasharray="4 4"></line><line x1="695.0" y1="82" x2="695.0" y2="350" stroke="#c9c7bf" stroke-width="1.3" stroke-dasharray="4 4"></line><line x1="835.0" y1="82" x2="835.0" y2="350" stroke="#c9c7bf" stroke-width="1.3" stroke-dasharray="4 4"></line><g><circle cx="18" cy="108" r="9.5" fill="#1c1b18"></circle><text x="18" y="111.6" text-anchor="middle" font-weight="800" font-size="11" fill="#fff">1</text></g><line x1="105.0" y1="108" x2="281.0" y2="108" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><text x="193.0" y="101.0" text-anchor="middle" font-weight="700" font-size="9.5" fill="#444441">powers on → asks for an IP</text><g><circle cx="18" cy="140" r="9.5" fill="#1c1b18"></circle><text x="18" y="143.6" text-anchor="middle" font-weight="800" font-size="11" fill="#fff">2</text></g><line x1="285.0" y1="140" x2="496.0" y2="140" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><text x="390.5" y="133.0" text-anchor="middle" font-weight="700" font-size="9.5" fill="#444441">new device seen → controller notified</text><g><circle cx="18" cy="172" r="9.5" fill="#1c1b18"></circle><text x="18" y="175.6" text-anchor="middle" font-weight="800" font-size="11" fill="#fff">3</text></g><line x1="500.0" y1="172" x2="109.0" y2="172" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><text x="304.5" y="165.0" text-anchor="middle" font-weight="700" font-size="9.5" fill="#444441">quick scan: serial, model (no OS needed)</text><g><circle cx="18" cy="204" r="9.5" fill="#1c1b18"></circle><text x="18" y="207.6" text-anchor="middle" font-weight="800" font-size="11" fill="#fff">4</text></g><line x1="500.0" y1="204" x2="109.0" y2="204" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><text x="304.5" y="197.0" text-anchor="middle" font-weight="700" font-size="9.5" fill="#444441">force network-boot a tiny probe image</text><g><circle cx="18" cy="240" r="9.5" fill="#1c1b18"></circle><text x="18" y="243.6" text-anchor="middle" font-weight="800" font-size="11" fill="#fff">5</text></g><line x1="695.0" y1="240" x2="504.0" y2="240" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><text x="599.5" y="233.0" text-anchor="middle" font-weight="700" font-size="9.5" fill="#444441">probe reports full hardware detail back</text><g><circle cx="18" cy="276" r="9.5" fill="#1c1b18"></circle><text x="18" y="279.6" text-anchor="middle" font-weight="800" font-size="11" fill="#fff">6</text></g><line x1="500.0" y1="276" x2="831.0" y2="276" stroke="#0f6e56" stroke-width="1.7" marker-end="url(#ah-ok)"></line><text x="665.5" y="269.0" text-anchor="middle" font-weight="700" font-size="9.5" fill="#0f6e56">write everything to the inventory DB</text><rect x="40" y="290" width="820" height="58" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.2"></rect><text x="450.0" y="309.0" text-anchor="middle" font-weight="600" font-size="9.5" fill="#0c447c">The key idea: the server never PUSHES data — it just responds. The Discovery Controller</text><text x="450.0" y="323.0" text-anchor="middle" font-weight="600" font-size="9.5" fill="#0c447c">is the active initiator: it reacts to the 'new device' event and pulls everything it needs.</text><text x="450.0" y="337.0" text-anchor="middle" font-weight="600" font-size="9.5" fill="#0c447c">Switch wiring (which rack, which port) is read separately from the switch — no human input.</text></svg>
