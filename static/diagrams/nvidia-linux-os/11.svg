<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" style="width:100%;">
      <text x="20" y="28" font-family="ui-monospace,monospace" font-size="10" font-weight="700" fill="#1f2328">HOST VIEW — what /proc on the node shows</text>
      <rect x="20" y="40" width="320" height="28" fill="#fff" stroke="#1f2328" stroke-width="1"></rect>
      <text x="30" y="59" font-family="ui-monospace,monospace" font-size="11" fill="#1f2328">PID 1: systemd</text>
      <line x1="45" y1="68" x2="45" y2="82" stroke="#1f2328"></line><line x1="45" y1="82" x2="70" y2="82" stroke="#1f2328"></line>
      <rect x="70" y="72" width="320" height="28" fill="#fff" stroke="#1f2328" stroke-width="1"></rect>
      <text x="80" y="91" font-family="ui-monospace,monospace" font-size="11" fill="#1f2328">PID 8231: containerd</text>
      <text x="260" y="91" font-family="Arial,sans-serif" font-size="9" font-style="italic" fill="#59636e">host namespaces</text>
      <line x1="95" y1="100" x2="95" y2="114" stroke="#1f2328"></line><line x1="95" y1="114" x2="120" y2="114" stroke="#1f2328"></line>
      <rect x="120" y="104" width="360" height="28" fill="#fff" stroke="#1f2328" stroke-width="1"></rect>
      <text x="130" y="123" font-family="ui-monospace,monospace" font-size="11" fill="#1f2328">PID 9402: containerd-shim-runc-v2</text>
      <text x="370" y="123" font-family="Arial,sans-serif" font-size="9" font-style="italic" fill="#59636e">host ns</text>
      <line x1="145" y1="132" x2="145" y2="146" stroke="#1f2328"></line><line x1="145" y1="146" x2="170" y2="146" stroke="#1f2328"></line>
      <rect x="170" y="136" width="320" height="28" fill="#fffaf0" stroke="#a04000" stroke-width="1.5"></rect>
      <text x="180" y="155" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#a04000">PID 9420: nginx (master)</text>
      <text x="380" y="155" font-family="Arial,sans-serif" font-size="9" font-style="italic" fill="#a04000">container ns!</text>
      <line x1="195" y1="164" x2="195" y2="178" stroke="#a04000"></line><line x1="195" y1="178" x2="220" y2="178" stroke="#a04000"></line>
      <rect x="220" y="168" width="240" height="28" fill="#fffaf0" stroke="#a04000" stroke-width="1.5"></rect>
      <text x="230" y="187" font-family="ui-monospace,monospace" font-size="11" fill="#a04000">PID 9421: nginx worker</text>
      <line x1="195" y1="196" x2="195" y2="210" stroke="#a04000"></line><line x1="195" y1="210" x2="220" y2="210" stroke="#a04000"></line>
      <rect x="220" y="200" width="240" height="28" fill="#fffaf0" stroke="#a04000" stroke-width="1.5"></rect>
      <text x="230" y="219" font-family="ui-monospace,monospace" font-size="11" fill="#a04000">PID 9422: nginx worker</text>
      <line x1="20" y1="248" x2="740" y2="248" stroke="#d1d9e0"></line>
      <text x="20" y="272" font-family="ui-monospace,monospace" font-size="10" font-weight="700" fill="#1f2328">CONTAINER VIEW — same processes, renumbered PIDs</text>
      <rect x="20" y="284" width="260" height="28" fill="#fffaf0" stroke="#a04000" stroke-width="1"></rect>
      <text x="30" y="303" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#a04000">PID 1: nginx (was 9420)</text>
      <line x1="45" y1="312" x2="45" y2="326" stroke="#a04000"></line><line x1="45" y1="326" x2="70" y2="326" stroke="#a04000"></line>
      <rect x="70" y="316" width="260" height="28" fill="#fffaf0" stroke="#a04000" stroke-width="1"></rect>
      <text x="80" y="335" font-family="ui-monospace,monospace" font-size="11" fill="#a04000">PID 8: nginx worker (was 9421)</text>
      <line x1="45" y1="344" x2="45" y2="358" stroke="#a04000"></line><line x1="45" y1="358" x2="70" y2="358" stroke="#a04000"></line>
      <rect x="70" y="348" width="260" height="28" fill="#fffaf0" stroke="#a04000" stroke-width="1"></rect>
      <text x="80" y="367" font-family="ui-monospace,monospace" font-size="11" fill="#a04000">PID 9: nginx worker (was 9422)</text>
      <text x="20" y="408" font-family="Arial,sans-serif" font-size="11" font-style="italic" fill="#59636e">Same processes, different PID namespaces. Kernel translates via task_struct→nsproxy→pid_ns.</text>
    </svg>
