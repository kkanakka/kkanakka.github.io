<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg" style="width:100%;">
        <rect x="20" y="20" width="130" height="70" rx="6" fill="#f8f9fa" stroke="#202122"></rect>
        <text x="85" y="40" text-anchor="middle" fill="#202122" font-size="11" font-weight="700">NIC HW Ring</text>
        <text x="85" y="56" text-anchor="middle" fill="#54595d" font-size="11">RX ring full?</text>
        <text x="85" y="68" text-anchor="middle" fill="#54595d" font-size="11">ethtool -S: rx_missed</text>
        <text x="85" y="80" text-anchor="middle" fill="#54595d" font-size="11">Fix: ethtool -G rx 4096</text>
        <text x="170" y="55" fill="#72777d" font-size="14">➜</text>
        <rect x="185" y="20" width="130" height="70" rx="6" fill="#f8f9fa" stroke="#202122"></rect>
        <text x="250" y="40" text-anchor="middle" fill="#202122" font-size="11" font-weight="700">Driver/IRQ</text>
        <text x="250" y="56" text-anchor="middle" fill="#54595d" font-size="11">IRQ not balanced?</text>
        <text x="250" y="68" text-anchor="middle" fill="#54595d" font-size="11">cat /proc/interrupts</text>
        <text x="250" y="80" text-anchor="middle" fill="#54595d" font-size="11">Fix: irqbalance / smp_affinity</text>
        <text x="335" y="55" fill="#72777d" font-size="14">➜</text>
        <rect x="350" y="20" width="130" height="70" rx="6" fill="#f5f5f5" stroke="#222"></rect>
        <text x="415" y="40" text-anchor="middle" fill="#222" font-size="11" font-weight="700">Kernel Backlog</text>
        <text x="415" y="56" text-anchor="middle" fill="#54595d" font-size="11">netdev_budget exhausted?</text>
        <text x="415" y="68" text-anchor="middle" fill="#54595d" font-size="11">nstat: TcpExtListenDrops</text>
        <text x="415" y="80" text-anchor="middle" fill="#54595d" font-size="11">Fix: netdev_budget=600</text>
        <text x="500" y="55" fill="#72777d" font-size="14">➜</text>
        <rect x="515" y="20" width="130" height="70" rx="6" fill="#f8f9fa" stroke="#222"></rect>
        <text x="580" y="40" text-anchor="middle" fill="#222" font-size="11" font-weight="700">Socket Buffer</text>
        <text x="580" y="56" text-anchor="middle" fill="#54595d" font-size="11">rmem/wmem too small?</text>
        <text x="580" y="68" text-anchor="middle" fill="#54595d" font-size="11">ss -nmpti</text>
        <text x="580" y="80" text-anchor="middle" fill="#54595d" font-size="11">Fix: rmem_max=16MB</text>
        <text x="665" y="55" fill="#72777d" font-size="14">➜</text>
        <rect x="680" y="20" width="130" height="70" rx="6" fill="#f5f5f5" stroke="#222"></rect>
        <text x="745" y="40" text-anchor="middle" fill="#222" font-size="11" font-weight="700">Conntrack</text>
        <text x="745" y="56" text-anchor="middle" fill="#54595d" font-size="11">Table full?</text>
        <text x="745" y="68" text-anchor="middle" fill="#54595d" font-size="11">dmesg: nf_conntrack full</text>
        <text x="745" y="80" text-anchor="middle" fill="#54595d" font-size="11">Fix: nf_conntrack_max</text>
        <!-- Summary command bar -->
        <rect x="20" y="110" width="860" height="55" rx="8" fill="#f0f0f0" stroke="var(--border)"></rect>
        <text x="450" y="130" text-anchor="middle" fill="#202122" font-size="12" font-weight="700">Quick Diagnosis Commands</text>
        <text x="130" y="152" text-anchor="middle" fill="#222" font-size="11">ethtool -S eth0 | grep drop</text>
        <text x="350" y="152" text-anchor="middle" fill="#222" font-size="11">nstat -az TcpExtListenDrops</text>
        <text x="560" y="152" text-anchor="middle" fill="#222" font-size="11">dropwatch -l kas</text>
        <text x="750" y="152" text-anchor="middle" fill="#222" font-size="11">tc -s qdisc show</text>
    </svg>
