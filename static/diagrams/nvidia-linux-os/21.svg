<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 210" xmlns="http://www.w3.org/2000/svg" style="width:100%;">
        <!-- K8s Layer -->
        <rect x="20" y="10" width="860" height="55" rx="8" fill="#f5f5f5" stroke="#222"></rect>
        <text x="450" y="30" text-anchor="middle" fill="#222" font-size="13" font-weight="700">K8s Pod Spec</text>
        <text x="200" y="50" text-anchor="middle" fill="#54595d" font-size="11">requests.cpu: 500m → cpu.weight: 19</text>
        <text x="500" y="50" text-anchor="middle" fill="#54595d" font-size="11">limits.cpu: 2000m → cpu.max: 200000/100000</text>
        <text x="750" y="50" text-anchor="middle" fill="#54595d" font-size="11">limits.memory: 4Gi → memory.max: 4294967296</text>
        <!-- cgroups layer -->
        <line x1="450" y1="65" x2="450" y2="85" stroke="#a2a9b1"></line>
        <rect x="20" y="85" width="860" height="55" rx="8" fill="#f8f9fa" stroke="#222"></rect>
        <text x="450" y="105" text-anchor="middle" fill="#222" font-size="13" font-weight="700">cgroup v2 (kubepods.slice/&lt;pod-uid&gt;/&lt;container-id&gt;)</text>
        <text x="200" y="125" text-anchor="middle" fill="#54595d" font-size="11">cpu.weight = shares (proportional)</text>
        <text x="500" y="125" text-anchor="middle" fill="#54595d" font-size="11">cpu.max = quota/period (hard cap)</text>
        <text x="750" y="125" text-anchor="middle" fill="#54595d" font-size="11">memory.max = OOMKill trigger</text>
        <!-- Kernel layer -->
        <line x1="450" y1="140" x2="450" y2="155" stroke="#a2a9b1"></line>
        <rect x="20" y="155" width="860" height="45" rx="8" fill="#f8f9fa" stroke="#202122"></rect>
        <text x="450" y="175" text-anchor="middle" fill="#202122" font-size="13" font-weight="700">Linux Kernel CFS Scheduler + OOM Killer</text>
        <text x="250" y="192" text-anchor="middle" fill="#54595d" font-size="11">CFS bandwidth throttling: nr_throttled++</text>
        <text x="600" y="192" text-anchor="middle" fill="#54595d" font-size="11">OOM score: oom_score_adj = 1000 - QoS</text>
    </svg>
