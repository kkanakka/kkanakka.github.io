<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" style="width:100%;">
      <text x="20" y="26" font-family="ui-monospace,monospace" font-size="10" font-weight="700" fill="#1f2328">DUAL-SOCKET SERVER — 2 NUMA nodes, 8 cores each</text>
      <!-- NUMA 0 -->
      <rect x="20" y="40" width="350" height="200" fill="none" stroke="#1f2328" stroke-width="2"></rect>
      <text x="35" y="60" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">NUMA Node 0</text>
      <text x="200" y="60" font-family="ui-monospace,monospace" font-size="9" fill="#59636e">cpuset.mems: 0</text>
      <rect x="35" y="72" width="70" height="30" fill="#f0f0f0" stroke="#1f2328" stroke-width="1"></rect>
      <text x="70" y="91" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" font-weight="700" fill="#1f2328">core 0</text>
      <rect x="110" y="72" width="70" height="30" fill="#f0f0f0" stroke="#1f2328" stroke-width="1"></rect>
      <text x="145" y="91" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" font-weight="700" fill="#1f2328">core 1</text>
      <text x="230" y="91" font-family="ui-monospace,monospace" font-size="8" fill="#59636e">reserved (system)</text>
      <rect x="35" y="110" width="70" height="30" fill="#fff5e8" stroke="#a04000" stroke-width="1.5"></rect>
      <text x="70" y="129" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" font-weight="700" fill="#a04000">core 4</text>
      <rect x="110" y="110" width="70" height="30" fill="#fff5e8" stroke="#a04000" stroke-width="1.5"></rect>
      <text x="145" y="129" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" font-weight="700" fill="#a04000">core 5</text>
      <rect x="185" y="110" width="70" height="30" fill="#fff5e8" stroke="#a04000" stroke-width="1.5"></rect>
      <text x="220" y="129" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" font-weight="700" fill="#a04000">core 6</text>
      <rect x="260" y="110" width="70" height="30" fill="#fff5e8" stroke="#a04000" stroke-width="1.5"></rect>
      <text x="295" y="129" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" font-weight="700" fill="#a04000">core 7</text>
      <text x="35" y="158" font-family="Arial,sans-serif" font-size="10" fill="#a04000">Pod-A (Guaranteed, 4 CPU) — cpuset.cpus: 4-7</text>
      <rect x="35" y="170" width="300" height="25" fill="#f0f0f0" stroke="#1f2328"></rect>
      <text x="185" y="187" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#1f2328">L3 cache 32 MB (shared cores 0-7)</text>
      <rect x="35" y="200" width="300" height="25" fill="#e8f0e8" stroke="#1f2328"></rect>
      <text x="185" y="217" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#1f2328">Local RAM 64 GB — ~80 ns latency</text>
      <!-- NUMA 1 -->
      <rect x="390" y="40" width="350" height="200" fill="none" stroke="#1f2328" stroke-width="2"></rect>
      <text x="405" y="60" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">NUMA Node 1</text>
      <text x="570" y="60" font-family="ui-monospace,monospace" font-size="9" fill="#59636e">cpuset.mems: 1</text>
      <rect x="405" y="110" width="70" height="30" fill="#e8f0ff" stroke="#0044aa" stroke-width="1.5"></rect>
      <text x="440" y="129" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" font-weight="700" fill="#0044aa">core 12</text>
      <rect x="480" y="110" width="70" height="30" fill="#e8f0ff" stroke="#0044aa" stroke-width="1.5"></rect>
      <text x="515" y="129" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" font-weight="700" fill="#0044aa">core 13</text>
      <text x="405" y="158" font-family="Arial,sans-serif" font-size="10" fill="#0044aa">Pod-B (Guaranteed, 2 CPU) — cpuset.cpus: 12-13</text>
      <rect x="405" y="170" width="300" height="25" fill="#f0f0f0" stroke="#1f2328"></rect>
      <text x="555" y="187" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#1f2328">L3 cache 32 MB (shared cores 8-15)</text>
      <rect x="405" y="200" width="300" height="25" fill="#e8f0e8" stroke="#1f2328"></rect>
      <text x="555" y="217" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#1f2328">Local RAM 64 GB — ~80 ns latency</text>
      <!-- UPI link -->
      <line x1="370" y1="212" x2="390" y2="212" stroke="#1f2328" stroke-width="2"></line>
      <text x="380" y="205" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#1f2328">UPI</text>
      <text x="380" y="230" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#59636e">~140 ns cross-NUMA</text>
      <!-- Config -->
      <text x="20" y="275" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#1f2328">How CPU Manager Static Works:</text>
      <text x="20" y="295" font-family="Arial,sans-serif" font-size="11" fill="#1f2328">1. Kubelet asks topology manager for cores satisfying request</text>
      <text x="20" y="312" font-family="Arial,sans-serif" font-size="11" fill="#1f2328">2. Topology manager picks N cores from a single NUMA node</text>
      <text x="20" y="329" font-family="Arial,sans-serif" font-size="11" fill="#1f2328">3. Kubelet writes cores to pod’s cpuset.cpus file</text>
      <text x="20" y="346" font-family="Arial,sans-serif" font-size="11" fill="#1f2328">4. Those cores removed from shared pool</text>
      <text x="20" y="363" font-family="Arial,sans-serif" font-size="11" fill="#1f2328">5. All other pods restricted to remaining shared cores</text>
      <text x="20" y="392" font-family="ui-monospace,monospace" font-size="10" fill="#1f2328">cpuManagerPolicy: static  |  reservedSystemCPUs: "0,1"  |  topologyManagerPolicy: single-numa-node</text>
    </svg>
