<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" style="width:100%;">
        <rect x="20" y="10" width="170" height="80" rx="8" fill="#f8f9fa" stroke="#202122"></rect>
        <text x="105" y="30" text-anchor="middle" fill="#202122" font-size="11" font-weight="700">Kernel Config</text>
        <text x="105" y="48" text-anchor="middle" fill="#54595d" font-size="11">PREEMPT_RT patch</text>
        <text x="105" y="60" text-anchor="middle" fill="#54595d" font-size="11">CONFIG_NO_HZ_FULL</text>
        <text x="105" y="72" text-anchor="middle" fill="#54595d" font-size="11">CONFIG_IRQ_FORCED_THREADING</text>
        <text x="105" y="84" text-anchor="middle" fill="#54595d" font-size="11">Disable kernel debug</text>
        <rect x="205" y="10" width="170" height="80" rx="8" fill="#f5f5f5" stroke="#222"></rect>
        <text x="290" y="30" text-anchor="middle" fill="#222" font-size="11" font-weight="700">CPU Isolation</text>
        <text x="290" y="48" text-anchor="middle" fill="#54595d" font-size="11">isolcpus=2-7 (app cores)</text>
        <text x="290" y="60" text-anchor="middle" fill="#54595d" font-size="11">nohz_full=2-7 (tickless)</text>
        <text x="290" y="72" text-anchor="middle" fill="#54595d" font-size="11">rcu_nocbs=2-7</text>
        <text x="290" y="84" text-anchor="middle" fill="#54595d" font-size="11">Disable C-states &amp; turbo</text>
        <rect x="390" y="10" width="170" height="80" rx="8" fill="#f8f9fa" stroke="#222"></rect>
        <text x="475" y="30" text-anchor="middle" fill="#222" font-size="11" font-weight="700">Network Bypass</text>
        <text x="475" y="48" text-anchor="middle" fill="#54595d" font-size="11">DPDK poll-mode driver</text>
        <text x="475" y="60" text-anchor="middle" fill="#54595d" font-size="11">Hugepage-backed mbufs</text>
        <text x="475" y="72" text-anchor="middle" fill="#54595d" font-size="11">Userspace TCP (mTCP)</text>
        <text x="475" y="84" text-anchor="middle" fill="#54595d" font-size="11">or XDP for in-kernel</text>
        <rect x="575" y="10" width="170" height="80" rx="8" fill="#f8f9fa" stroke="#202122"></rect>
        <text x="660" y="30" text-anchor="middle" fill="#202122" font-size="11" font-weight="700">Memory</text>
        <text x="660" y="48" text-anchor="middle" fill="#54595d" font-size="11">1GB huge pages reserved</text>
        <text x="660" y="60" text-anchor="middle" fill="#54595d" font-size="11">mlock() all app memory</text>
        <text x="660" y="72" text-anchor="middle" fill="#54595d" font-size="11">NUMA-pinned allocation</text>
        <text x="660" y="84" text-anchor="middle" fill="#54595d" font-size="11">Disable swap, THP, KSM</text>
        <rect x="760" y="10" width="120" height="80" rx="8" fill="#f5f5f5" stroke="#222"></rect>
        <text x="820" y="30" text-anchor="middle" fill="#222" font-size="11" font-weight="700">Storage</text>
        <text x="820" y="48" text-anchor="middle" fill="#54595d" font-size="11">io_uring async I/O</text>
        <text x="820" y="60" text-anchor="middle" fill="#54595d" font-size="11">O_DIRECT bypass cache</text>
        <text x="820" y="72" text-anchor="middle" fill="#54595d" font-size="11">NVMe polling mode</text>
        <text x="820" y="84" text-anchor="middle" fill="#54595d" font-size="11">Scheduler: none</text>
        <!-- Result -->
        <rect x="150" y="110" width="600" height="35" rx="8" fill="#f8f9fa" stroke="#222"></rect>
        <text x="450" y="132" text-anchor="middle" fill="#222" font-size="13" font-weight="700">Result: &lt;100μs P99 NIC-to-app, &lt;1ms end-to-end including processing</text>
        <!-- DPDK vs XDP -->
        <rect x="150" y="155" width="290" height="35" rx="6" fill="#f5f5f5" stroke="#222"></rect>
        <text x="295" y="177" text-anchor="middle" fill="#222" font-size="11"><tspan font-weight="700">DPDK:</tspan> Best latency, dedicated cores, userspace stack</text>
        <rect x="460" y="155" width="290" height="35" rx="6" fill="#f8f9fa" stroke="#222"></rect>
        <text x="605" y="177" text-anchor="middle" fill="#222" font-size="11"><tspan font-weight="700">XDP:</tspan> In-kernel, less CPU cost, integrates with stack</text>
    </svg>
