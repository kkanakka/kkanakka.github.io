<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" style="max-width:800px;width:100%;">
        <!-- Node 0 -->
        <rect x="20" y="20" width="350" height="180" rx="10" fill="#f5f5f5" stroke="#222" stroke-dasharray="6"></rect>
        <text x="195" y="42" text-anchor="middle" fill="#222" font-size="14" font-weight="700">NUMA Node 0</text>
        <rect x="40" y="55" width="150" height="50" rx="6" fill="#f5f5f5" stroke="#a2a9b1"></rect>
        <text x="115" y="75" text-anchor="middle" fill="#222" font-size="12" font-weight="600">CPU 0-15</text>
        <text x="115" y="92" text-anchor="middle" fill="#54595d" font-size="11">L1/L2/L3 cache</text>
        <rect x="200" y="55" width="150" height="50" rx="6" fill="#f8f9fa" stroke="#222"></rect>
        <text x="275" y="75" text-anchor="middle" fill="#222" font-size="12" font-weight="600">Local Memory</text>
        <text x="275" y="92" text-anchor="middle" fill="#54595d" font-size="11">64 GB DDR5</text>
        <text x="195" y="130" text-anchor="middle" fill="#222" font-size="11" font-weight="600">Local access: ~80ns</text>
        <rect x="40" y="145" width="310" height="40" rx="6" fill="#f5f5f5" stroke="#222"></rect>
        <text x="195" y="170" text-anchor="middle" fill="#222" font-size="11">PCIe: NIC, NVMe (NUMA-local I/O)</text>
        <!-- Node 1 -->
        <rect x="430" y="20" width="350" height="180" rx="10" fill="#f8f9fa" stroke="#202122" stroke-dasharray="6"></rect>
        <text x="605" y="42" text-anchor="middle" fill="#202122" font-size="14" font-weight="700">NUMA Node 1</text>
        <rect x="450" y="55" width="150" height="50" rx="6" fill="#f8f9fa" stroke="#a2a9b1"></rect>
        <text x="525" y="75" text-anchor="middle" fill="#202122" font-size="12" font-weight="600">CPU 16-31</text>
        <text x="525" y="92" text-anchor="middle" fill="#54595d" font-size="11">L1/L2/L3 cache</text>
        <rect x="610" y="55" width="150" height="50" rx="6" fill="#f8f9fa" stroke="#222"></rect>
        <text x="685" y="75" text-anchor="middle" fill="#222" font-size="12" font-weight="600">Local Memory</text>
        <text x="685" y="92" text-anchor="middle" fill="#54595d" font-size="11">64 GB DDR5</text>
        <text x="605" y="130" text-anchor="middle" fill="#222" font-size="11" font-weight="600">Local access: ~80ns</text>
        <rect x="450" y="145" width="310" height="40" rx="6" fill="#f5f5f5" stroke="#222"></rect>
        <text x="605" y="170" text-anchor="middle" fill="#222" font-size="11">PCIe: GPU, SAS controller</text>
        <!-- Interconnect -->
        <line x1="370" y1="100" x2="430" y2="100" stroke="#202122" stroke-width="2" stroke-dasharray="6"></line>
        <text x="400" y="92" text-anchor="middle" fill="#202122" font-size="11" font-weight="700">QPI/UPI</text>
        <text x="400" y="118" text-anchor="middle" fill="#202122" font-size="11">~150ns (remote)</text>
    </svg>
