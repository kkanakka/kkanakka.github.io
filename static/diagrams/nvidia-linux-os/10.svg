<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:1000px;">
  <defs>
    <marker id="ahcg" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#000"></path></marker>
  </defs>

  <!-- Row 1: K8s layer -->
  <rect x="20" y="10" width="960" height="55" rx="8" fill="#f5f5f5" stroke="#000" stroke-width="1.5"></rect>
  <text x="500" y="30" font-size="13" font-weight="bold" text-anchor="middle">K8s API (Pod Spec)</text>
  <text x="500" y="50" font-size="11" text-anchor="middle" fill="#555">resources: { requests: { cpu: 500m, memory: 1Gi }, limits: { cpu: 2, memory: 4Gi } }</text>

  <line x1="500" y1="65" x2="500" y2="85" stroke="#000" stroke-width="1.5" marker-end="url(#ahcg)"></line>

  <!-- Row 2: kubelet -->
  <rect x="200" y="85" width="600" height="50" rx="8" fill="#e8e8e8" stroke="#000" stroke-width="2"></rect>
  <text x="500" y="105" font-size="12" font-weight="bold" text-anchor="middle">kubelet (translates K8s spec → cgroup writes)</text>
  <text x="500" y="122" font-size="10" text-anchor="middle" fill="#555">Calls containerd → runc → writes to /sys/fs/cgroup/kubepods.slice/kubepods-pod&lt;uid&gt;.slice/</text>

  <line x1="500" y1="135" x2="500" y2="155" stroke="#000" stroke-width="1.5" marker-end="url(#ahcg)"></line>

  <!-- Row 3: cgroup filesystem (4 columns) -->
  <rect x="20" y="155" width="960" height="90" rx="8" fill="#f0f0f0" stroke="#000" stroke-width="1.5"></rect>
  <text x="500" y="175" font-size="12" font-weight="bold" text-anchor="middle">cgroup v2 files written by kubelet/runc</text>

  <rect x="40" y="185" width="210" height="50" rx="6" fill="#fff" stroke="#000" stroke-width="1"></rect>
  <text x="145" y="203" font-size="11" font-weight="bold" text-anchor="middle">cpu.max = 200000 100000</text>
  <text x="145" y="220" font-size="10" text-anchor="middle" fill="#555">200ms quota per 100ms period</text>
  <text x="145" y="232" font-size="10" text-anchor="middle" fill="#555">= 2 CPU cores max</text>

  <rect x="270" y="185" width="210" height="50" rx="6" fill="#fff" stroke="#000" stroke-width="1"></rect>
  <text x="375" y="203" font-size="11" font-weight="bold" text-anchor="middle">cpu.weight = 19</text>
  <text x="375" y="220" font-size="10" text-anchor="middle" fill="#555">proportional share (from 500m)</text>
  <text x="375" y="232" font-size="10" text-anchor="middle" fill="#555">relative to other pods</text>

  <rect x="500" y="185" width="230" height="50" rx="6" fill="#fff" stroke="#000" stroke-width="1"></rect>
  <text x="615" y="203" font-size="11" font-weight="bold" text-anchor="middle">memory.max = 4294967296</text>
  <text x="615" y="220" font-size="10" text-anchor="middle" fill="#555">4 GiB hard limit in bytes</text>
  <text x="615" y="232" font-size="10" text-anchor="middle" fill="#555">exceed → OOM kill</text>

  <rect x="750" y="185" width="210" height="50" rx="6" fill="#fff" stroke="#000" stroke-width="1"></rect>
  <text x="855" y="203" font-size="11" font-weight="bold" text-anchor="middle">memory.min = 1073741824</text>
  <text x="855" y="220" font-size="10" text-anchor="middle" fill="#555">1 GiB reservation (from requests)</text>
  <text x="855" y="232" font-size="10" text-anchor="middle" fill="#555">guaranteed, not reclaimable</text>

  <!-- Arrows down -->
  <line x1="145" y1="245" x2="145" y2="275" stroke="#000" stroke-width="1.5" marker-end="url(#ahcg)"></line>
  <line x1="615" y1="245" x2="615" y2="275" stroke="#000" stroke-width="1.5" marker-end="url(#ahcg)"></line>

  <!-- Row 4: Kernel enforcement -->
  <rect x="20" y="275" width="460" height="100" rx="8" fill="#fff" stroke="#000" stroke-width="2"></rect>
  <text x="250" y="295" font-size="12" font-weight="bold" text-anchor="middle">CFS Bandwidth Throttling (CPU enforcement)</text>
  <text x="250" y="315" font-size="10" text-anchor="middle" fill="#555">Every 100ms (period), kernel tracks how much CPU time this cgroup used.</text>
  <text x="250" y="330" font-size="10" text-anchor="middle" fill="#555">If cgroup used 200ms of CPU time → THROTTLED. All tasks in this cgroup</text>
  <text x="250" y="345" font-size="10" text-anchor="middle" fill="#555">are paused until next period starts. Check: cpu.stat → nr_throttled</text>
  <text x="250" y="365" font-size="10" text-anchor="middle" fill="#555">cpu.weight: CFS assigns proportional vruntime. Lower weight = slower vruntime growth = less CPU.</text>

  <rect x="520" y="275" width="460" height="100" rx="8" fill="#fff" stroke="#000" stroke-width="2"></rect>
  <text x="750" y="295" font-size="12" font-weight="bold" text-anchor="middle">OOM Killer (Memory enforcement)</text>
  <text x="750" y="315" font-size="10" text-anchor="middle" fill="#555">When a process in the cgroup tries to allocate memory beyond memory.max:</text>
  <text x="750" y="330" font-size="10" text-anchor="middle" fill="#555">1. Kernel tries to reclaim pages (page cache, inactive anon pages)</text>
  <text x="750" y="345" font-size="10" text-anchor="middle" fill="#555">2. If reclaim fails → OOM killer selects victim (highest oom_score_adj)</text>
  <text x="750" y="365" font-size="10" text-anchor="middle" fill="#555">3. Sends SIGKILL → container restarts. Check: memory.events → oom_kill</text>

  <!-- Row 5: QoS mapping -->
  <rect x="20" y="395" width="960" height="90" rx="8" fill="#f5f5f5" stroke="#000" stroke-width="1.5"></rect>
  <text x="500" y="415" font-size="12" font-weight="bold" text-anchor="middle">K8s QoS Classes → Kernel Behavior</text>

  <rect x="40" y="425" width="290" height="50" rx="6" fill="#fff" stroke="#000" stroke-width="1"></rect>
  <text x="185" y="442" font-size="11" font-weight="bold" text-anchor="middle">Guaranteed (requests == limits)</text>
  <text x="185" y="458" font-size="10" text-anchor="middle" fill="#555">oom_score_adj = -997</text>
  <text x="185" y="470" font-size="10" text-anchor="middle" fill="#555">Last to be killed. Fixed CPU/mem.</text>

  <rect x="350" y="425" width="290" height="50" rx="6" fill="#fff" stroke="#000" stroke-width="1"></rect>
  <text x="495" y="442" font-size="11" font-weight="bold" text-anchor="middle">Burstable (requests &lt; limits)</text>
  <text x="495" y="458" font-size="10" text-anchor="middle" fill="#555">oom_score_adj = 2-999</text>
  <text x="495" y="470" font-size="10" text-anchor="middle" fill="#555">Can burst above requests. OOM after BestEffort.</text>

  <rect x="660" y="425" width="300" height="50" rx="6" fill="#fff" stroke="#000" stroke-width="1"></rect>
  <text x="810" y="442" font-size="11" font-weight="bold" text-anchor="middle">BestEffort (no requests/limits)</text>
  <text x="810" y="458" font-size="10" text-anchor="middle" fill="#555">oom_score_adj = 1000</text>
  <text x="810" y="470" font-size="10" text-anchor="middle" fill="#555">First to be killed. No guarantees.</text>

</svg>
