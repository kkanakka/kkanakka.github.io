<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 140" xmlns="http://www.w3.org/2000/svg" style="width:100%;">
        <rect x="20" y="10" width="270" height="110" rx="10" fill="#f5f5f5" stroke="#222"></rect>
        <text x="155" y="32" text-anchor="middle" fill="#222" font-size="13" font-weight="700">none / noop</text>
        <text x="155" y="52" text-anchor="middle" fill="#54595d" font-size="11">Simple FIFO queue</text>
        <text x="155" y="68" text-anchor="middle" fill="#54595d" font-size="11">No reordering or merging</text>
        <text x="155" y="84" text-anchor="middle" fill="#54595d" font-size="11">Best for: NVMe, SSD, VMs</text>
        <text x="155" y="104" text-anchor="middle" fill="#222" font-size="11" font-weight="600">Device does its own scheduling</text>
        <rect x="315" y="10" width="270" height="110" rx="10" fill="#f8f9fa" stroke="#222"></rect>
        <text x="450" y="32" text-anchor="middle" fill="#222" font-size="13" font-weight="700">mq-deadline</text>
        <text x="450" y="52" text-anchor="middle" fill="#54595d" font-size="11">Deadline per request (read: 500ms, write: 5s)</text>
        <text x="450" y="68" text-anchor="middle" fill="#54595d" font-size="11">Prevents starvation</text>
        <text x="450" y="84" text-anchor="middle" fill="#54595d" font-size="11">Best for: databases, latency-sensitive</text>
        <text x="450" y="104" text-anchor="middle" fill="#222" font-size="11" font-weight="600">Reads prioritized over writes</text>
        <rect x="610" y="10" width="270" height="110" rx="10" fill="#f8f9fa" stroke="#202122"></rect>
        <text x="745" y="32" text-anchor="middle" fill="#202122" font-size="13" font-weight="700">BFQ (Budget Fair Queueing)</text>
        <text x="745" y="52" text-anchor="middle" fill="#54595d" font-size="11">Fair bandwidth allocation per process</text>
        <text x="745" y="68" text-anchor="middle" fill="#54595d" font-size="11">Prevents I/O hogging</text>
        <text x="745" y="84" text-anchor="middle" fill="#54595d" font-size="11">Best for: desktops, multi-tenant</text>
        <text x="745" y="104" text-anchor="middle" fill="#202122" font-size="11" font-weight="600">Higher CPU overhead</text>
    </svg>
