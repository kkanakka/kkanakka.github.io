<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" style="width:100%;">
      <text x="380" y="32" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#1f2328">MORE URGENT  ←—————————————————————————————→  LESS URGENT</text>
      <text x="20" y="88" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">RT priority</text>
      <text x="20" y="106" font-family="ui-monospace,monospace" font-size="10" fill="#59636e">via chrt(1)</text>
      <line x1="200" y1="96" x2="700" y2="96" stroke="#1f2328" stroke-width="2"></line>
      <circle cx="200" cy="96" r="6" fill="#1f2328"></circle>
      <circle cx="700" cy="96" r="6" fill="#ffffff" stroke="#1f2328" stroke-width="2"></circle>
      <text x="200" y="124" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#1f2328">99</text>
      <text x="450" y="124" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#59636e">50</text>
      <text x="700" y="124" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#59636e">1</text>
      <line x1="20" y1="160" x2="740" y2="160" stroke="#d1d9e0" stroke-dasharray="4 4"></line>
      <text x="20" y="198" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">Nice value</text>
      <text x="20" y="216" font-family="ui-monospace,monospace" font-size="10" fill="#59636e">via nice / renice</text>
      <line x1="200" y1="206" x2="700" y2="206" stroke="#1f2328" stroke-width="2"></line>
      <circle cx="200" cy="206" r="6" fill="#1f2328"></circle>
      <circle cx="700" cy="206" r="6" fill="#ffffff" stroke="#1f2328" stroke-width="2"></circle>
      <text x="200" y="234" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#1f2328">−20</text>
