      <text x="700" y="234" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#59636e">+19</text>
      <text x="380" y="266" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-style="italic" fill="#59636e">Both put "more urgent" on the LEFT — only the numbers run in opposite directions.</text>
