<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" style="width:100%;">
      <defs>
        <marker id="slb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2328" stroke-width="1.5" stroke-linecap="round"></path>
        </marker>
        <pattern id="diagp" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="6" stroke="#1f2328" stroke-width="0.6"></line>
        </pattern>
      </defs>
      <rect x="20" y="20" width="720" height="170" fill="url(#diagp)" opacity="0.08"></rect>
      <rect x="20" y="20" width="720" height="170" fill="none" stroke="#1f2328" stroke-width="2"></rect>
      <text x="40" y="46" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#1f2328">REAL-TIME REALM — checked first</text>
      <text x="40" y="72" font-family="Arial,sans-serif" font-size="14" fill="#1f2328">Tasks here run before anything in the realm below.</text>
      <rect x="40" y="90" width="220" height="80" fill="#ffffff" stroke="#1f2328" stroke-width="1"></rect>
      <text x="150" y="116" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#1f2328">SCHED_DEADLINE</text>
      <text x="150" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#59636e">earliest deadline first</text>
      <text x="150" y="158" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#818b98">runtime / period budget</text>
      <rect x="270" y="90" width="220" height="80" fill="#ffffff" stroke="#1f2328" stroke-width="1"></rect>
      <text x="380" y="116" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#1f2328">SCHED_FIFO</text>
      <text x="380" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#59636e">run until block or yield</text>
      <text x="380" y="158" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#818b98">priority 1–99</text>
      <rect x="500" y="90" width="220" height="80" fill="#ffffff" stroke="#1f2328" stroke-width="1"></rect>
      <text x="610" y="116" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#1f2328">SCHED_RR</text>
      <text x="610" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#59636e">round-robin timeslice</text>
      <text x="610" y="158" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#818b98">priority 1–99</text>
      <line x1="380" y1="200" x2="380" y2="240" stroke="#1f2328" stroke-width="1.5" marker-end="url(#slb)"></line>
      <text x="395" y="225" font-family="Arial,sans-serif" font-size="11" fill="#59636e">checked only if RT realm is empty</text>
      <rect x="20" y="250" width="720" height="170" fill="none" stroke="#1f2328" stroke-width="1" stroke-dasharray="4 4"></rect>
      <text x="40" y="276" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#1f2328">NORMAL REALM — runs only when RT realm is idle</text>
      <text x="40" y="302" font-family="Arial,sans-serif" font-size="14" fill="#1f2328">CFS shares CPU fairly here, weighted by nice value.</text>
      <rect x="40" y="320" width="220" height="80" fill="#ffffff" stroke="#1f2328" stroke-width="1"></rect>
      <text x="150" y="346" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#1f2328">SCHED_OTHER</text>
      <text x="150" y="368" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#59636e">CFS — default for everyone</text>
      <text x="150" y="388" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#818b98">nice −20 to +19</text>
      <rect x="270" y="320" width="220" height="80" fill="#ffffff" stroke="#1f2328" stroke-width="1"></rect>
      <text x="380" y="346" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#1f2328">SCHED_BATCH</text>
      <text x="380" y="368" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#59636e">long CPU-bound work</text>
      <text x="380" y="388" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#818b98">nice −20 to +19</text>
      <rect x="500" y="320" width="220" height="80" fill="#ffffff" stroke="#1f2328" stroke-width="1"></rect>
      <text x="610" y="346" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#1f2328">SCHED_IDLE</text>
      <text x="610" y="368" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#59636e">runs only when system is idle</text>
      <text x="610" y="388" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#818b98">lowest of all</text>
      <text x="380" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-style="italic" fill="#1f2328">Iron rule: any RT task beats every normal task — even RT priority 1 beats nice −20.</text>
    </svg>
