<text x="26.0" y="271.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13.5" fill="#1a1f24" text-anchor="start">At t = 0.2, elapsed 0.2 × rate 5 = exactly 1 token refilled, so the next request passes.</text>
