w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_B_C_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-T-0" data-look="classic" transform="translate(409.6875, 44)"><rect class="basic label-container" style="" x="-210" y="-36" width="420" height="72"/><g class="label" style="" transform="translate(-180, -21)"><rect/><foreignObject width="360" height="42"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 360px; text-align: center; width: 360px;"><span class="nodeLabel"><p>rate 5/s, burst 3 — the ENTIRE state is two numbers per key</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-S-2" data-look="classic" transform="translate(409.6875, 176.5)"><rect class="basic label-container" style="" x="-130.421875" y="-46.5" width="260.84375" height="93"/><g class="label" style="" transform="translate(-100.421875, -31.5)"><rect/><foreignObject width="200.84375" height="63"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 360px; text-align: center;"><span class="nodeLabel"><p>_state<br />'user:1' → [tokens 0.0, last 0.0]<br />'user:2' → [tokens 2.0, last 0.4]</p></span></div></foreignObject></g></g><g class="node default warn" id="my-svg-flowchart-A-4" data-look="classic" transform="translate(197.484375, 309)"><rect class="basic label-container" style="fill:#fff8e6 !important;stroke:#d4a72c !important" x="-189.484375" y="-36" width="378.96875" height="72"/><g class="label" style="" transform="translate(-159.484375, -21)"><rect/><foreignObject width="318.96875" height="42"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 360px; text-align: center;"><span class="nodeLabel"><p>at t = 0 the third request emptied user:1's bucket;<br />the fourth and fifth were rejected</p></span></div></foreignObject></g></g><g class="node default good" id="my-svg-flowchart-B-6" data-look="classic" transform="translate(621.890625, 309)"><rect class="basic label-container" style="fill:#dafbe1 !important;stroke:#1a7f37 !important" x="-184.921875" y="-36" width="369.84375" height="72"/><g class="label" style="" transform="translate(-154.921875, -21)"><rect/><foreignObject width="309.84375" height="42"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 360px; text-align: center;"><span class="nodeLabel"><p>at t = 0.2, elapsed 0.2 × rate 5 = exactly 1 token,<br />so the next request passes — no timer ever ran</p></span></div></foreignObject></g></g><g class="node default good" id="my-svg-flowchart-C-8" data-look="classic" transform="translate(621.890625, 431)"><rect class="basic label-container" style="fill:#dafbe1 !important;stroke:#1a7f37 !important" x="-189.234375" y="-36" width="378.46875" height="72"/><g class="label" style="" transform="translate(-159.234375, -21)"><rect/><foreignObject width="318.46875" height="42"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 360px; text-align: center;"><span class="nodeLabel"><p>nothing stores a history of requests, which is why<br />this scales to millions of keys</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0969da" stop-opacity="1"/><stop offset="100%" stop-color="hsl(132.7272727273, 40.487804878%, 81.9607843137%)" stop-opacity="1"/></linearGradient></svg>