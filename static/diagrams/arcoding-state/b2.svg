<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 422" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<rect x="0" y="0" width="672" height="422" fill="#ffffff"/>
<text x="26.0" y="43.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#1a1f24" text-anchor="start" font-weight="600">B2 · the frame stack, just after load starts</text>
<text x="26.0" y="63.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#5b6570" text-anchor="start" letter-spacing="1.2">WHAT WE STORE</text>
<text x="26.0" y="93.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#1a1f24" text-anchor="start" font-weight="600">stack</text>
<text x="76.3" y="93.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13.5" fill="#5b6570" text-anchor="start">each frame = [ name, entry, resume ]</text>
<rect x="26.0" y="105.0" width="101.5" height="77.0" rx="7" fill="#ffffff" stroke="#1a1f24" stroke-width="1.4"/>
<text x="76.8" y="129.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#1a1f24" text-anchor="middle">main</text>
<text x="76.8" y="148.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#1a1f24" text-anchor="middle">entry   0</text>
<text x="76.8" y="167.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#1a1f24" text-anchor="middle">resume  2</text>
<rect x="141.5" y="105.0" width="101.5" height="77.0" rx="7" fill="#ffffff" stroke="#1a1f24" stroke-width="2.4"/>
<text x="192.3" y="129.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#1a1f24" text-anchor="middle">load</text>
<text x="192.3" y="148.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#1a1f24" text-anchor="middle">entry   2</text>
<text x="192.3" y="167.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#1a1f24" text-anchor="middle">resume  2</text>
<text x="26.0" y="216.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#1a1f24" text-anchor="start" font-weight="600">excl</text>
<text x="67.9" y="216.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13.5" fill="#5b6570" text-anchor="start">exclusive time credited so far</text>
<rect x="26.0" y="228.0" width="93.3" height="39.0" rx="7" fill="#ffffff" stroke="#1a1f24" stroke-width="1.4"/>
<text x="72.7" y="252.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#1a1f24" text-anchor="middle">main → 2</text>
<line x1="26.0" y1="289.0" x2="646.1" y2="289.0" stroke="#e2e6ea" stroke-width="1.2"/>
<text x="26.0" y="309.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#5b6570" text-anchor="start" letter-spacing="1.2">WHAT WE&#x27;RE DOING</text>
<text x="26.0" y="329.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13.5" fill="#1a1f24" text-anchor="start">START paused main: it was credited 2 − 0 = 2, then load was pushed.</text>
<text x="26.0" y="354.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13.5" fill="#1a1f24" text-anchor="start">At END load@5: load += 6 − 2 = 4; main resumes at 6 and later collects 7 − 6 = 1 → total</text>
<text x="26.0" y="375.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13.5" fill="#1a1f24" text-anchor="start">3.</text>
