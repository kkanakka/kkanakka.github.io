<text x="26.0" y="349.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13.5" fill="#1a1f24" text-anchor="start">One lock means a notify can never slip past a thread that is between its check and its</text>
