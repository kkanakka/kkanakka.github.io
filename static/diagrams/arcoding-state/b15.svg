 class="basic label-container" style="fill:#dafbe1 !important;stroke:#1a7f37 !important" x="-171.203125" y="-46.5" width="342.40625" height="93"/><g class="label" style="" transform="translate(-141.203125, -31.5)"><rect/><foreignObject width="282.40625" height="63"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 320px; text-align: center;"><span class="nodeLabel"><p>both waiting rooms hang off the SAME lock,<br />so a notify can never slip past a waiter<br />that is between its check and its sleep</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0969da" stop-opacity="1"/><stop offset="100%" stop-color="hsl(132.7272727273, 40.487804878%, 81.9607843137%)" stop-opacity="1"/></linearGradient></svg>