<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg"><style>.sb-b{fill:#ddf4ff;stroke:var(--accent);stroke-width:1}
.sb-g{fill:#dafbe1;stroke:var(--success);stroke-width:1}
.sb-r{fill:#ffebe9;stroke:var(--danger);stroke-width:1}
.sl{font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--fg)}
.ss{font-family:var(--mono);font-size:10px;fill:var(--fg-muted)}</style>
      <text class="sl" x="20" y="18">Feed Service (stateless → horizontal scaling)</text>
      <rect class="sb-b" x="20" y="28" width="360" height="55" rx="6"></rect>
      <text class="ss" x="200" y="48" text-anchor="middle">Each instance handles 10K-100K concurrent connections</text>
      <text class="ss" x="200" y="62" text-anchor="middle">10M users / 100K = 100 instances. Auto-scale via d2.</text>
      <text class="ss" x="200" y="76" text-anchor="middle">Stateless → spin up in seconds, tear down on cool-off.</text>
      <rect class="sb-g" x="400" y="28" width="370" height="55" rx="6"></rect>
      <text class="sl" x="585" y="48" text-anchor="middle">d2 auto-scaling</text>
      <text class="ss" x="585" y="62" text-anchor="middle">LinkedIn’s d2 framework detects load and adds instances</text>
      <text class="ss" x="585" y="76" text-anchor="middle">No AWS ALB needed — client-side LB built into d2</text>

      <line x1="20" y1="100" x2="780" y2="100" stroke="var(--border-muted)"></line>

      <text class="sl" x="20" y="118">Espresso (database — mostly bypassed)</text>
      <rect class="sb-g" x="20" y="128" width="750" height="40" rx="6"></rect>
      <text class="ss" x="395" y="148" text-anchor="middle">All feed reads hit cache (Couchbase). Espresso only handles writes + CDC. Cache absorbs the spike.</text>
      <text class="ss" x="395" y="162" text-anchor="middle">At LinkedIn, Espresso handles 4.8M reads/sec anyway — but we don’t need it for feed reads.</text>

      <line x1="20" y1="185" x2="780" y2="185" stroke="var(--border-muted)"></line>

      <text class="sl" x="20" y="203">Couchbase / Redis (cache — the hot path)</text>
      <rect class="sb-r" x="20" y="213" width="370" height="55" rx="6"></rect>
      <text class="ss" x="205" y="233" text-anchor="middle">Single Redis: ~100K req/sec</text>
      <text class="ss" x="205" y="247" text-anchor="middle">10M concurrent → need ~100 instances</text>
      <text class="ss" x="205" y="261" text-anchor="middle">Read replicas for throughput, master for writes</text>
      <rect class="sb-g" x="410" y="213" width="360" height="55" rx="6"></rect>
      <text class="sl" x="590" y="233" text-anchor="middle">Regional deployment</text>
      <text class="ss" x="590" y="247" text-anchor="middle">US spike doesn’t affect India cluster</text>
      <text class="ss" x="590" y="261" text-anchor="middle">Each region scales independently</text>
    </svg>
