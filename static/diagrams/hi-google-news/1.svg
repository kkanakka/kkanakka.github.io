<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 110" xmlns="http://www.w3.org/2000/svg"><style>.sb-b{fill:#ddf4ff;stroke:#0969da;stroke-width:1}
.sb-g{fill:#dafbe1;stroke:#1a7f37;stroke-width:1}
.sb-y{fill:#fff8e6;stroke:#9a6700;stroke-width:1}
.sb-p{fill:#fbefff;stroke:#8250df;stroke-width:1}
.sl{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;fill:#1f2328}
.ss{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:10px;fill:#59636e}</style>
      <defs><marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#656d76"></path></marker></defs>
      <rect class="sb-b" x="20" y="10" width="175" height="85" rx="6"></rect>
      <text class="sl" x="107" y="30" text-anchor="middle">Availability &gt; Consistency</text>
      <text class="ss" x="107" y="48" text-anchor="middle">AP system (CAP)</text>
      <text class="ss" x="107" y="62" text-anchor="middle">stale news &gt; no news</text>
      <text class="ss" x="107" y="76" text-anchor="middle">eventual consistency OK</text>
      <rect class="sb-y" x="210" y="10" width="175" height="85" rx="6"></rect>
      <text class="sl" x="297" y="30" text-anchor="middle">Scale</text>
      <text class="ss" x="297" y="48" text-anchor="middle">100M DAU</text>
      <text class="ss" x="297" y="62" text-anchor="middle">spikes to 500M</text>
      <text class="ss" x="297" y="76" text-anchor="middle">thousands of publishers</text>
      <rect class="sb-g" x="400" y="10" width="175" height="85" rx="6"></rect>
      <text class="sl" x="487" y="30" text-anchor="middle">Latency</text>
      <text class="ss" x="487" y="48" text-anchor="middle">feed load &lt; 200ms</text>
      <text class="ss" x="487" y="62" text-anchor="middle">pre-computed feeds</text>
      <text class="ss" x="487" y="76" text-anchor="middle">edge caching</text>
      <rect class="sb-p" x="590" y="10" width="175" height="85" rx="6"></rect>
      <text class="sl" x="677" y="30" text-anchor="middle">Freshness</text>
      <text class="ss" x="677" y="48" text-anchor="middle">breaking news &lt; 30min</text>
      <text class="ss" x="677" y="62" text-anchor="middle">webhooks for real-time</text>
      <text class="ss" x="677" y="76" text-anchor="middle">RSS polling fallback</text>
    </svg>
