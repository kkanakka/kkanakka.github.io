<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg"><style>.sb{fill:var(--bg-subtle);stroke:var(--border);stroke-width:1}
.sb-b{fill:#ddf4ff;stroke:var(--accent);stroke-width:1}
.sb-g{fill:#dafbe1;stroke:var(--success);stroke-width:1}
.sb-r{fill:#ffebe9;stroke:var(--danger);stroke-width:1}
.sb-y{fill:#fff8e6;stroke:var(--attention);stroke-width:1}
.sb-p{fill:#fbefff;stroke:var(--done);stroke-width:1}
.sb-o{fill:#fff1e5;stroke:var(--orange);stroke-width:1}
.sl{font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--fg)}
.ss{font-family:var(--mono);font-size:10px;fill:var(--fg-muted)}
.sn{font-family:var(--mono);font-weight:700;font-size:11px;fill:var(--accent)}
.sa{stroke:var(--fg-muted);stroke-width:1.2;fill:none}
.sa-b{stroke:var(--accent);stroke-width:1.5;fill:none}
.sa-g{stroke:var(--success);stroke-width:1.5;fill:none}
.sa-r{stroke:var(--danger);stroke-width:1.5;fill:none}
.sa-p{stroke:var(--done);stroke-width:1.5;fill:none}</style>
      <rect class="sb-b" x="20" y="20" width="160" height="50" rx="6"></rect><text class="sl" x="100" y="42" text-anchor="middle">Data Collection Svc</text><text class="ss" x="100" y="56" text-anchor="middle">writes new article</text>

      <rect class="sb-g" x="230" y="20" width="130" height="50" rx="6"></rect><text class="sl" x="295" y="42" text-anchor="middle">Espresso</text><text class="ss" x="295" y="56" text-anchor="middle">INSERT article</text>

      <rect class="sb-y" x="410" y="20" width="160" height="50" rx="6"></rect><text class="sl" x="490" y="42" text-anchor="middle">Kafka (CDC topic)</text><text class="ss" x="490" y="56" text-anchor="middle">new-article event</text>

      <rect class="sb-p" x="620" y="20" width="160" height="50" rx="6"></rect><text class="sl" x="700" y="42" text-anchor="middle">Samza workers</text><text class="ss" x="700" y="56" text-anchor="middle">determine region feeds</text>

      <rect class="sb-r" x="620" y="110" width="160" height="55" rx="6"></rect><text class="sl" x="700" y="130" text-anchor="middle">Couchbase / Redis</text><text class="ss" x="700" y="146" text-anchor="middle">ZADD feed:US score=ts</text>
      <text class="ss" x="700" y="158" text-anchor="middle">ZREMRANGEBYRANK (cap N)</text>

      <path class="sa-b" d="M180,45 L228,45" marker-end="url(#ab)"></path><text class="sn" x="204" y="38">1</text>
      <path class="sa-b" d="M360,45 L408,45" marker-end="url(#ab)"></path><text class="sn" x="384" y="38">2</text>
      <path class="sa-b" d="M570,45 L618,45" marker-end="url(#ab)"></path><text class="sn" x="594" y="38">3</text>
      <path class="sa-r" d="M700,70 L700,108" marker-end="url(#a1)"></path><text class="sn" x="715" y="92" fill="var(--danger)">4</text>

      <rect class="sb" x="20" y="110" width="120" height="50" rx="6"></rect><text class="sl" x="80" y="132" text-anchor="middle">Client</text><text class="ss" x="80" y="146" text-anchor="middle">GET /feed</text>
      <rect class="sb-b" x="180" y="110" width="130" height="50" rx="6"></rect><text class="sl" x="245" y="132" text-anchor="middle">Feed Service</text>
      <path class="sa-g" d="M310,135 L618,135" marker-end="url(#ag)"></path><text class="ss" x="460" y="128" fill="var(--success)">ZREVRANGE feed:US 0 19 (&lt; 5ms)</text>
      <path class="sa" d="M140,135 L178,135" marker-end="url(#a1)"></path>

      <rect class="sb-y" x="20" y="200" width="760" height="45" rx="6"></rect>
      <text class="sl" x="400" y="218" text-anchor="middle">Cache strategy: sorted sets per region, capped at ~2000 articles</text>
      <text class="ss" x="400" y="234" text-anchor="middle">New articles added via ZADD (score=timestamp) · Old articles trimmed via ZREMRANGEBYRANK · No TTL needed</text>
    </svg>
