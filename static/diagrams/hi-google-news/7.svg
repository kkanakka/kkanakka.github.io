<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 100" xmlns="http://www.w3.org/2000/svg"><style>.sb-b{fill:#ddf4ff;stroke:#0969da;stroke-width:1}
.sb-g{fill:#dafbe1;stroke:#1a7f37;stroke-width:1}
.sl{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;fill:#1f2328}
.ss{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:10px;fill:#59636e}</style>
      <rect class="sb-b" x="60" y="20" width="300" height="50" rx="6"></rect>
      <text class="sl" x="210" y="42" text-anchor="middle">Timestamp (48 bits)</text>
      <text class="ss" x="210" y="58" text-anchor="middle">ms since Unix epoch → sortable</text>
      <rect class="sb-g" x="370" y="20" width="300" height="50" rx="6"></rect>
      <text class="sl" x="520" y="42" text-anchor="middle">Randomness (80 bits)</text>
      <text class="ss" x="520" y="58" text-anchor="middle">uniqueness within same ms</text>
      <text class="ss" x="400" y="90" text-anchor="middle">01HX9F3K7M... = 2024-01-15T10:30:00.123Z + random</text>
    </svg>
