      <rect class="sb-b" x="470" y="90" width="120" height="40" rx="4"></rect><text class="ss" x="530" y="114" text-anchor="middle">Replica N</text>
      <rect class="sb" x="610" y="90" width="120" height="40" rx="4"></rect><text class="ss" x="670" y="106" text-anchor="middle">... scale out</text><text class="ss" x="670" y="120" text-anchor="middle">as needed</text>

      <path class="sa" d="M340,60 L110,88" marker-end="url(#a1)"></path>
      <path class="sa" d="M360,60 L250,88" marker-end="url(#a1)"></path>
