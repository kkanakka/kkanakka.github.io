      <rect class="sb-r" x="300" y="15" width="150" height="45" rx="6"></rect><text class="sl" x="375" y="35" text-anchor="middle">Master</text><text class="ss" x="375" y="50" text-anchor="middle">writes only (ZADD)</text>

      <rect class="sb-b" x="50" y="90" width="120" height="40" rx="4"></rect><text class="ss" x="110" y="114" text-anchor="middle">Replica 1</text>
      <rect class="sb-b" x="190" y="90" width="120" height="40" rx="4"></rect><text class="ss" x="250" y="114" text-anchor="middle">Replica 2</text>
