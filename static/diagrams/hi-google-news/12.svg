      <path class="sa" d="M410,60 L530,88" marker-end="url(#a1)"></path>

      <text class="ss" x="375" y="148" text-anchor="middle">Reads round-robin across replicas · Replication lag &lt; 200ms · Sentinel auto-failover</text>
