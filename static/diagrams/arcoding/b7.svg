-S2-3" data-look="classic" transform="translate(238.359375, 267)"><rect class="basic label-container" style="" x="-147.5078125" y="-36" width="295.015625" height="72"/><g class="label" style="" transform="translate(-117.5078125, -21)"><rect/><foreignObject width="235.015625" height="42"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 480px; text-align: center;"><span class="nodeLabel"><p>stage 2 — only groups of 2+ survive:<br />hash the first 4 KB (one cheap read)</p></span></div></foreignObject></g></g><g class="node default good" id="my-svg-flowchart-S3-5" data-look="classic" transform="translate(192.1640625, 410)"><rect class="basic label-container" style="fill:#dafbe1 !important;stroke:#1a7f37 !important" x="-173.796875" y="-36" width="347.59375" height="72"/><g class="label" style="" transform="translate(-143.796875, -21)"><rect/><foreignObject width="287.59375" height="42"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 480px; text-align: center;"><span class="nodeLabel"><p>stage 3 — survivors only: full streaming hash<br />(the one genuinely expensive read)</p></span></div></foreignObject></g></g><g class="node default good" id="my-svg-flowchart-DUP-7" data-look="classic" transform="translate(192.1640625, 521.5)"><rect class="basic label-container" style="fill:#dafbe1 !important;stroke:#1a7f37 !important" x="-184.1640625" y="-25.5" width="368.328125" height="51"/><g class="label" style="" transform="translate(-154.1640625, -10.5)"><rect/><foreignObject width="308.328125" height="21"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 480px; text-align: center;"><span class="nodeLabel"><p>whatever still shares a hash is a duplicate group</p></span></div></foreignObject></g></g><g class="node default warn" id="my-svg-flowchart-OUT-9" data-look="classic" transform="translate(560.953125, 410)"><rect class="basic label-container" style="fill:#fff8e6 !important;stroke:#d4a72c !important" x="-144.9921875" y="-36" width="289.984375" height="72"/><g class="label" style="" transform="translate(-114.9921875, -21)"><rect/><foreignObject width="229.984375" height="42"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 480px; text-align: center;"><span class="nodeLabel"><p>never opened at all —<br />the cheap stages do the eliminating</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0969da" stop-opacity="1"/><stop offset="100%" stop-color="hsl(132.7272727273, 40.487804878%, 81.9607843137%)" stop-opacity="1"/></linearGradient></svg>