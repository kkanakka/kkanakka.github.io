SP-7" data-look="classic" transform="translate(538.8671875, 267)"><rect class="basic label-container" style="fill:#dafbe1 !important;stroke:#1a7f37 !important" x="-182.5703125" y="-36" width="365.140625" height="72"/><g class="label" style="" transform="translate(-152.5703125, -21)"><rect/><foreignObject width="305.140625" height="42"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 400px; text-align: center;"><span class="nodeLabel"><p>spend draws from the SOONEST-expiring grant<br />first, mutating its cell in place — no re-push</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-TO-9" data-look="classic" transform="translate(538.8671875, 378.5)"><rect class="basic label-container" style="" x="-147.1875" y="-25.5" width="294.375" height="51"/><g class="label" style="" transform="translate(-117.1875, -10.5)"><rect/><foreignObject width="234.375" height="21"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 400px; text-align: center;"><span class="nodeLabel"><p>a running total makes balance() O(1)</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0969da" stop-opacity="1"/><stop offset="100%" stop-color="hsl(132.7272727273, 40.487804878%, 81.9607843137%)" stop-opacity="1"/></linearGradient></svg>