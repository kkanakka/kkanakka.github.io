ect width="133.5" height="21"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 360px; text-align: center;"><span class="nodeLabel"><p>allow(key, now, cost)</p></span></div></foreignObject></g></g><g class="node default good" id="my-svg-flowchart-R-1" data-look="classic" transform="translate(473.1484375, 155.5)"><rect class="basic label-container" style="fill:#dafbe1 !important;stroke:#1a7f37 !important" x="-173.0859375" y="-46.5" width="346.171875" height="93"/><g class="label" style="" transform="translate(-143.0859375, -31.5)"><rect/><foreignObject width="286.171875" height="63"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 360px; text-align: center;"><span class="nodeLabel"><p>tokens = min(burst, tokens + elapsed × rate)<br />— refilled lazily from the clock,<br />so there is no timer thread anywhere</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-C-3" data-look="classic" transform="translate(326.203125, 328.953125)"><polygon points="76.953125,0 153.90625,-76.953125 76.953125,-153.90625 0,-76.953125" class="label-container" transform="translate(-76.453125, 76.953125)"/><g class="label" style="" transform="translate(-51.453125, -10.5)"><rect/><foreignObject width="102.90625" height="21"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 360px; text-align: center;"><span class="nodeLabel"><p>tokens &gt;= cost?</p></span></div></foreignObject></g></g><g class="node default good" id="my-svg-flowchart-Y-5" data-look="classic" transform="translate(152.3203125, 512.90625)"><rect class="basic label-container" style="fill:#dafbe1 !important;stroke:#1a7f37 !important" x="-144.3203125" y="-25.5" width="288.640625" height="51"/><g class="label" style="" transform="translate(-114.3203125, -10.5)"><rect/><foreignObject width="228.640625" height="21"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 360px; text-align: center;"><span class="nodeLabel"><p>subtract the cost, allow the request</p></span></div></foreignObject></g></g><g class="node default warn" id="my-svg-flowchart-N-7" data-look="classic" transform="translate(500.0859375, 512.90625)"><rect class="basic label-container" style="fill:#fff8e6 !important;stroke:#d4a72c !important" x="-153.4453125" y="-36" width="306.890625" height="72"/><g class="label" style="" transform="translate(-123.4453125, -21)"><rect/><foreignObject width="246.890625" height="42"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 360px; text-align: center;"><span class="nodeLabel"><p>reject — but still write back the refilled<br />tokens and the new timestamp</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-SK-9" data-look="classic" transform="translate(620.09375, 328.953125)"><rect class="basic label-container" style="" x="-166.9375" y="-36" width="333.875" height="72"/><g class="label" style="" transform="translate(-136.9375, -21)"><rect/><foreignObject width="273.875" height="42"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 360px; text-align: center;"><span class="nodeLabel"><p>now &lt; last? clamp it forward —<br />a backwards clock must never mint tokens</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundin