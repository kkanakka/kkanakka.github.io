text-align: center;"><span class="nodeLabel"><p>ONE lock, with TWO condition<br />variables sharing it</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-P-1" data-look="classic" transform="translate(133.484375, 176.5)"><rect class="basic label-container" style="" x="-125.484375" y="-46.5" width="250.96875" height="93"/><g class="label" style="" transform="translate(-95.484375, -31.5)"><rect/><foreignObject width="190.96875" height="63"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 330px; text-align: center;"><span class="nodeLabel"><p>put: while full and not closed<br />→ wait(not_full), then append<br />and notify(not_empty)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-G-3" data-look="classic" transform="translate(457.4140625, 176.5)"><rect class="basic label-container" style="" x="-148.4453125" y="-36" width="296.890625" height="72"/><g class="label" style="" transform="translate(-118.4453125, -21)"><rect/><foreignObject width="236.890625" height="42"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 330px; text-align: center;"><span class="nodeLabel"><p>get: while empty → wait(not_empty),<br />then popleft and notify(not_full)</p></span></div></foreignObject></g></g><g class="node default warn" id="my-svg-flowchart-W-5" data-look="classic" transform="translate(295.44921875, 319.5)"><rect class="basic label-container" style="fill:#fff8e6 !important;stroke:#d4a72c !important" x="-147.8671875" y="-46.5" width="295.734375" height="93"/><g class="label" style="" transform="translate(-117.8671875, -31.5)"><rect/><foreignObject width="235.734375" height="63"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 330px; text-align: center;"><span class="nodeLabel"><p>'while', never 'if' — a wake-up is only<br />a hint, so the predicate must be<br />re-checked after waking</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-C-9" data-look="classic" transform="translate(812.0546875, 176.5)"><rect class="basic label-container" style="" x="-156.1953125" y="-46.5" width="312.390625" height="93"/><g class="label" style="" transform="translate(-126.1953125, -31.5)"><rect/><foreignObject width="252.390625" height="63"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 330px; text-align: center;"><span class="nodeLabel"><p>close(): notify_all on both —<br />consumers drain what is left, then see<br />QueueClosed; blocked producers wake</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0969da" stop-opacity="1"/><stop offset="100%" stop-color="hsl(132.7272727273, 40.487804878%, 81.9607843137%)" stop-opacity="1"/></linearGradient></svg>