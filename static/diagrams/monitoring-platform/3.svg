<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 280" xmlns="http://www.w3.org/2000/svg"><style>/* SVG styling tokens used inside diagrams */
.box-fill-blue{fill:#ddf4ff;stroke:#54aeff}
.box-fill-green{fill:#dafbe1;stroke:#4ac26b}
.box-fill-purple{fill:#fbefff;stroke:#c297ff}
.box-fill-orange{fill:#fff1e5;stroke:#fd8c73}
.lbl-title{font-family:'Inter',sans-serif;font-weight:700;font-size:11.5px;fill:#1f2328}
.lbl-sub{font-family:'JetBrains Mono',monospace;font-size:9.5px;fill:#59636e}
.lbl-meta{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#818b98}
.arrow{stroke:#59636e;stroke-width:1.3;fill:none;marker-end:url(#arr)}
.arrow-dashed{stroke:#cf222e;stroke-width:1.2;fill:none;stroke-dasharray:4,3;marker-end:url(#arr-red)}
.arrow-green{stroke:#1a7f37;stroke-width:1.5;fill:none;marker-end:url(#arr-green)}</style>
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#59636e"></path>
    </marker>
  </defs>

  <!-- 7 stage pipeline -->
  <g>
    <rect x="20" y="80" width="120" height="100" rx="6" class="box-fill-blue"></rect>
    <text x="80" y="100" text-anchor="middle" class="lbl-title">1 · Sliding</text>
    <text x="80" y="114" text-anchor="middle" class="lbl-title">window</text>
    <text x="80" y="132" text-anchor="middle" class="lbl-sub">10-min tumbling</text>
    <text x="80" y="148" text-anchor="middle" class="lbl-sub">+ 1-min hop</text>
    <text x="80" y="168" text-anchor="middle" class="lbl-meta">budget: 4 s</text>
  </g>
  <g>
    <rect x="155" y="80" width="120" height="100" rx="6" class="box-fill-blue"></rect>
    <text x="215" y="100" text-anchor="middle" class="lbl-title">2 · SLI</text>
    <text x="215" y="114" text-anchor="middle" class="lbl-title">compute</text>
    <text x="215" y="132" text-anchor="middle" class="lbl-sub">success / total</text>
    <text x="215" y="148" text-anchor="middle" class="lbl-sub">per service</text>
    <text x="215" y="168" text-anchor="middle" class="lbl-meta">budget: 2 s</text>
  </g>
  <g>
    <rect x="290" y="80" width="120" height="100" rx="6" class="box-fill-purple"></rect>
    <text x="350" y="100" text-anchor="middle" class="lbl-title">3 · Rule</text>
    <text x="350" y="114" text-anchor="middle" class="lbl-title">match</text>
    <text x="350" y="132" text-anchor="middle" class="lbl-sub">threshold +</text>
    <text x="350" y="148" text-anchor="middle" class="lbl-sub">EB-burn</text>
    <text x="350" y="168" text-anchor="middle" class="lbl-meta">budget: 1 s</text>
  </g>
  <g>
    <rect x="425" y="80" width="120" height="100" rx="6" class="box-fill-purple"></rect>
    <text x="485" y="100" text-anchor="middle" class="lbl-title">4 · Verify</text>
    <text x="485" y="114" text-anchor="middle" class="lbl-title">window</text>
    <text x="485" y="132" text-anchor="middle" class="lbl-sub">3 consecutive</text>
    <text x="485" y="148" text-anchor="middle" class="lbl-sub">breaches</text>
    <text x="485" y="168" text-anchor="middle" class="lbl-meta">budget: 3 s</text>
  </g>
  <g>
    <rect x="560" y="80" width="120" height="100" rx="6" class="box-fill-orange"></rect>
    <text x="620" y="100" text-anchor="middle" class="lbl-title">5 · Dedupe</text>
    <text x="620" y="114" text-anchor="middle" class="lbl-title">+ group</text>
    <text x="620" y="132" text-anchor="middle" class="lbl-sub">Spanner CAS</text>
    <text x="620" y="148" text-anchor="middle" class="lbl-sub">by fingerprint</text>
    <text x="620" y="168" text-anchor="middle" class="lbl-meta">budget: 1 s</text>
  </g>
  <g>
    <rect x="695" y="80" width="120" height="100" rx="6" class="box-fill-orange"></rect>
    <text x="755" y="100" text-anchor="middle" class="lbl-title">6 · Priority</text>
    <text x="755" y="114" text-anchor="middle" class="lbl-title">queue</text>
    <text x="755" y="132" text-anchor="middle" class="lbl-sub">p0 bypass</text>
    <text x="755" y="148" text-anchor="middle" class="lbl-sub">throttle</text>
    <text x="755" y="168" text-anchor="middle" class="lbl-meta">budget: 1 s</text>
  </g>
  <g>
    <rect x="830" y="80" width="130" height="100" rx="6" class="box-fill-green"></rect>
    <text x="895" y="100" text-anchor="middle" class="lbl-title">7 · Notifier</text>
    <text x="895" y="114" text-anchor="middle" class="lbl-title">delivery</text>
    <text x="895" y="132" text-anchor="middle" class="lbl-sub">PD · Slack · SMS</text>
    <text x="895" y="148" text-anchor="middle" class="lbl-sub">ACK required</text>
    <text x="895" y="168" text-anchor="middle" class="lbl-meta">budget: 8 s</text>
  </g>

  <!-- arrows -->
  <path d="M140,130 L155,130" class="arrow"></path>
  <path d="M275,130 L290,130" class="arrow"></path>
  <path d="M410,130 L425,130" class="arrow"></path>
  <path d="M545,130 L560,130" class="arrow"></path>
  <path d="M680,130 L695,130" class="arrow"></path>
  <path d="M815,130 L830,130" class="arrow"></path>

  <!-- Latency budget bar -->
  <text x="20" y="40" class="lbl-title">End-to-end latency budget (p99 ≤ 30 s)</text>
  <rect x="20" y="50" width="940" height="14" rx="3" fill="#f6f8fa" stroke="#d0d7de"></rect>
  <rect x="22" y="52" width="125" height="10" fill="#ddf4ff"></rect>
  <rect x="147" y="52" width="62" height="10" fill="#ddf4ff"></rect>
  <rect x="209" y="52" width="31" height="10" fill="#fbefff"></rect>
  <rect x="240" y="52" width="94" height="10" fill="#fbefff"></rect>
  <rect x="334" y="52" width="31" height="10" fill="#fff1e5"></rect>
  <rect x="365" y="52" width="31" height="10" fill="#fff1e5"></rect>
  <rect x="396" y="52" width="250" height="10" fill="#dafbe1"></rect>
  <rect x="646" y="52" width="312" height="10" fill="#fff8c5"></rect>
  <text x="958" y="60" text-anchor="end" class="lbl-meta">+ 10 s headroom</text>

  <text x="20" y="225" class="lbl-meta">Sum of stage budgets: 20 s · headroom: 10 s · margin under SLO target: 33%</text>
  <text x="20" y="248" class="lbl-sub">Observed p99 in load tests (March 2026): 18.4 s — comfortably inside budget.</text>
  <text x="20" y="266" class="lbl-meta">Critical paths (Feed availability, InMail delivery) bypass step 4 verification with shorter 1-min window — sacrificing precision for latency on highest-priority paths only.</text>
</svg>
