<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="fig8d-title">
      <title id="fig8d-title">full namespace architecture task_struct nsproxy eight namespace types</title>
      <defs>
        <marker id="abf" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
          <polygon points="0 0, 9 3, 0 6" fill="#0969da"></polygon>
        </marker>
      </defs>
      <rect x="20" y="140" width="140" height="80" rx="4" fill="#fff8c5" stroke="#9a6700" stroke-width="2"></rect>
      <text x="90" y="172" text-anchor="middle" font-size="13" font-weight="700">task_struct</text>
      <text x="90" y="192" text-anchor="middle" font-size="10" fill="#59636e">→ nsproxy</text>

      <line x1="160" y1="180" x2="198" y2="180" stroke="#0969da" stroke-width="2" marker-end="url(#abf)"></line>

      <rect x="200" y="100" width="220" height="200" rx="6" fill="#f0f7ff" stroke="#0969da" stroke-width="2.5"></rect>
      <text x="310" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#0969da">nsproxy</text>
      <text x="310" y="146" text-anchor="middle" font-size="10" fill="#59636e">pointers to all namespace types</text>

      <!-- Column 1 ns boxes x=480 -->
      <rect x="480" y="35" width="190" height="44" rx="3" fill="#dafbe1" stroke="#1a7f37"></rect>
      <text x="575" y="54" text-anchor="middle" font-size="11" font-weight="600">pid_namespace</text>
      <text x="575" y="70" text-anchor="middle" font-size="10" fill="#59636e">PID view · own pid=1</text>

      <rect x="480" y="88" width="190" height="44" rx="3" fill="#ddf4ff" stroke="#0969da"></rect>
      <text x="575" y="107" text-anchor="middle" font-size="11" font-weight="600">mnt_namespace</text>
      <text x="575" y="123" text-anchor="middle" font-size="10" fill="#59636e">mount table · own /</text>

      <rect x="480" y="141" width="190" height="44" rx="3" fill="#fff8c5" stroke="#9a6700"></rect>
      <text x="575" y="160" text-anchor="middle" font-size="11" font-weight="600">net_namespace</text>
      <text x="575" y="176" text-anchor="middle" font-size="10" fill="#59636e">network stack · own NICs</text>

      <rect x="480" y="194" width="190" height="44" rx="3" fill="#ffebe9" stroke="#d1242f"></rect>
      <text x="575" y="213" text-anchor="middle" font-size="11" font-weight="600">uts_namespace</text>
      <text x="575" y="229" text-anchor="middle" font-size="10" fill="#59636e">hostname · domainname</text>

      <!-- Column 2 x=700 -->
      <rect x="700" y="35" width="180" height="44" rx="3" fill="#f5f0ff" stroke="#8250df"></rect>
      <text x="790" y="54" text-anchor="middle" font-size="11" font-weight="600">ipc_namespace</text>
      <text x="790" y="70" text-anchor="middle" font-size="10" fill="#59636e">SysV IPC · POSIX mq</text>

      <rect x="700" y="88" width="180" height="44" rx="3" fill="#dafbe1" stroke="#1a7f37"></rect>
      <text x="790" y="107" text-anchor="middle" font-size="11" font-weight="600">user_namespace</text>
      <text x="790" y="123" text-anchor="middle" font-size="10" fill="#59636e">UID/GID mapping</text>

      <rect x="700" y="141" width="180" height="44" rx="3" fill="#ddf4ff" stroke="#0969da"></rect>
      <text x="790" y="160" text-anchor="middle" font-size="11" font-weight="600">cgroup_namespace</text>
      <text x="790" y="176" text-anchor="middle" font-size="10" fill="#59636e">cgroup root view</text>

      <rect x="700" y="194" width="180" height="44" rx="3" fill="#fff8c5" stroke="#9a6700"></rect>
      <text x="790" y="213" text-anchor="middle" font-size="11" font-weight="600">time_namespace</text>
      <text x="790" y="229" text-anchor="middle" font-size="10" fill="#59636e">clock offsets</text>

      <!-- Fan-out arrows from nsproxy right edge -->
      <line x1="420" y1="125" x2="468" y2="57" stroke="#0969da" stroke-width="1.25" marker-end="url(#abf)"></line>
      <line x1="420" y1="155" x2="468" y2="110" stroke="#0969da" stroke-width="1.25" marker-end="url(#abf)"></line>
      <line x1="420" y1="185" x2="468" y2="163" stroke="#0969da" stroke-width="1.25" marker-end="url(#abf)"></line>
      <line x1="420" y1="215" x2="468" y2="216" stroke="#0969da" stroke-width="1.25" marker-end="url(#abf)"></line>

      <line x1="380" y1="115" x2="688" y2="57" stroke="#0969da" stroke-width="1.25" marker-end="url(#abf)"></line>
      <line x1="400" y1="175" x2="688" y2="110" stroke="#0969da" stroke-width="1.25" marker-end="url(#abf)"></line>
      <line x1="400" y1="200" x2="688" y2="163" stroke="#0969da" stroke-width="1.25" marker-end="url(#abf)"></line>
      <line x1="380" y1="255" x2="688" y2="216" stroke="#0969da" stroke-width="1.25" marker-end="url(#abf)"></line>
    </svg>
