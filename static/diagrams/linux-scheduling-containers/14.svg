<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="From pod YAML to kernel syscalls">
        <defs>
          <marker id="arrow8e" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <polygon points="0 0, 8 4, 0 8" fill="#59636e"></polygon>
          </marker>
          <marker id="arrow8e-dash" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <polygon points="0 0, 8 4, 0 8" fill="#8250df"></polygon>
          </marker>
        </defs>
        <!-- Left chain boxes -->
        <rect x="40" y="12" width="240" height="38" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="2"></rect>
        <text x="160" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#0969da" font-weight="600">Pod YAML</text>
        <line x1="160" y1="50" x2="160" y2="68" stroke="#59636e" stroke-width="2" marker-end="url(#arrow8e)"></line>
        <rect x="40" y="72" width="240" height="38" rx="6" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"></rect>
        <text x="160" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#1f2328">API Server</text>
        <line x1="160" y1="110" x2="160" y2="128" stroke="#59636e" stroke-width="2" marker-end="url(#arrow8e)"></line>
        <rect x="40" y="132" width="240" height="38" rx="6" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"></rect>
        <text x="160" y="157" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1f2328">Scheduler picks node</text>
        <line x1="160" y1="170" x2="160" y2="188" stroke="#59636e" stroke-width="2" marker-end="url(#arrow8e)"></line>
        <rect x="40" y="192" width="240" height="38" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"></rect>
        <text x="160" y="216" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#1a7f37" font-weight="600">kubelet</text>
        <line x1="160" y1="230" x2="160" y2="248" stroke="#59636e" stroke-width="2" marker-end="url(#arrow8e)"></line>
        <rect x="40" y="252" width="240" height="38" rx="6" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"></rect>
        <text x="160" y="276" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#1f2328">containerd / CRI-O</text>
        <line x1="160" y1="290" x2="160" y2="308" stroke="#59636e" stroke-width="2" marker-end="url(#arrow8e)"></line>
        <rect x="40" y="312" width="240" height="38" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="2"></rect>
        <text x="160" y="336" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#9a6700" font-weight="600">runc</text>
        <line x1="160" y1="350" x2="160" y2="368" stroke="#59636e" stroke-width="2" marker-end="url(#arrow8e)"></line>
        <rect x="40" y="372" width="240" height="38" rx="6" fill="#ffebe9" stroke="#d1242f" stroke-width="3"></rect>
        <text x="160" y="396" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#d1242f" font-weight="600">Kernel syscalls</text>
        <!-- Dashed connector runc -> right -->
        <path d="M 280 331 Q 340 331 380 220" fill="none" stroke="#8250df" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow8e-dash)"></path>
        <!-- Right column: runc actions -->
        <rect x="400" y="20" width="460" height="44" rx="4" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"></rect>
        <text x="415" y="47" font-family="ui-monospace,monospace" font-size="11" fill="#1f2328">mkdir /sys/fs/cgroup/.../container.scope</text>
        <rect x="400" y="76" width="460" height="36" rx="4" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"></rect>
        <text x="415" y="99" font-family="ui-monospace,monospace" font-size="11" fill="#1f2328">echo 536870912 &gt; memory.max</text>
        <rect x="400" y="124" width="460" height="36" rx="4" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"></rect>
        <text x="415" y="147" font-family="ui-monospace,monospace" font-size="11" fill="#1f2328">clone(CLONE_NEWPID | CLONE_NEWNS | ...)</text>
        <rect x="400" y="172" width="460" height="36" rx="4" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"></rect>
        <text x="415" y="195" font-family="ui-monospace,monospace" font-size="11" fill="#1f2328">echo &lt;pid&gt; &gt; cgroup.procs</text>
        <rect x="400" y="220" width="460" height="36" rx="4" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"></rect>
        <text x="415" y="243" font-family="ui-monospace,monospace" font-size="11" fill="#1f2328">pivot_root + mount</text>
        <rect x="400" y="268" width="460" height="36" rx="4" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"></rect>
        <text x="415" y="291" font-family="ui-monospace,monospace" font-size="11" fill="#1f2328">seccomp(SECCOMP_SET_MODE_FILTER)</text>
        <rect x="400" y="316" width="460" height="36" rx="4" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"></rect>
        <text x="415" y="339" font-family="ui-monospace,monospace" font-size="11" fill="#1f2328">execve(container entrypoint)</text>
        <text x="630" y="395" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#59636e" font-style="italic">What runc applies on the host</text>
      </svg>
