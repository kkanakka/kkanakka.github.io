  <line x1="800" y1="175" x2="800" y2="42" stroke="#d1d9e0"></line>
  <text x="20" y="60" fill="#59636e" font-size="11">PREEMPT_RT (~30µs bounded)</text>
  <rect x="120" y="46" width="201" height="22" fill="#dafbe1" stroke="#1a7f37"></rect>
  <text x="220" y="62" text-anchor="middle" font-size="11" fill="#1a7f37" font-weight="600">PREEMPT_RT</text>
  <text x="20" y="100" fill="#59636e" font-size="11">PREEMPT (~500µs)</text>
  <rect x="120" y="86" width="367" height="22" fill="#ddf4ff" stroke="#0969da"></rect>
