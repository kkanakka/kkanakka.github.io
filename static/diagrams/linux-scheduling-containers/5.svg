  <text x="20" y="180" fill="#59636e" font-size="11">PREEMPT_NONE (~50ms)</text>
  <rect x="120" y="166" width="639" height="22" fill="#ffebe9" stroke="#d1242f"></rect>
  <text x="440" y="182" text-anchor="middle" font-size="11" fill="#d1242f">PREEMPT_NONE</text>
</svg>
