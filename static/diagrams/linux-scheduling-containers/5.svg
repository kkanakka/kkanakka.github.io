  <text x="528" y="198" font-size="9" fill="#59636e">1ms</text>
  <text x="664" y="198" font-size="9" fill="#59636e">10ms</text>
  <text x="800" y="198" text-anchor="end" font-size="9" fill="#59636e">100ms</text>
  <line x1="120" y1="175" x2="120" y2="42" stroke="#d1d9e0"></line>
  <line x1="256" y1="175" x2="256" y2="42" stroke="#d1d9e0" stroke-dasharray="2,3"></line>
