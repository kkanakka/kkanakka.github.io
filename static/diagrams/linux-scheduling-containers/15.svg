<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Cgroup scoped OOM">
        <rect x="12" y="30" width="176" height="118" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"></rect>
        <text x="100" y="58" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#9a6700">memory.current</text>
        <text x="100" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#9a6700" font-weight="700">&gt;</text>
        <text x="100" y="98" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#9a6700">memory.max</text>
        <text x="100" y="128" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#1f2328">→ mem_cgroup_oom()</text>
        <rect x="210" y="20" width="200" height="110" rx="6" fill="#ffebe9" stroke="#d1242f" stroke-width="2.5"></rect>
        <text x="310" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#d1242f" font-weight="700">Container A cgroup</text>
        <text x="225" y="68" font-family="ui-monospace,monospace" font-size="13" fill="#1f2328">pid 101</text>
        <text x="225" y="88" font-family="ui-monospace,monospace" font-size="13" fill="#1f2328">pid 102</text>
        <text x="225" y="108" font-family="ui-monospace,monospace" font-size="13" fill="#1f2328">pid 103</text>
        <line x1="290" y1="100" x2="345" y2="100" stroke="#d1242f" stroke-width="2"></line>
        <text x="358" y="105" font-family="system-ui,sans-serif" font-size="12" fill="#d1242f" font-weight="700">✕ OOM-killed</text>
        <rect x="430" y="20" width="200" height="90" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"></rect>
        <text x="530" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1a7f37" font-weight="700">Container B cgroup</text>
        <text x="445" y="68" font-family="ui-monospace,monospace" font-size="13" fill="#1f2328">pid 201</text>
        <text x="445" y="88" font-family="ui-monospace,monospace" font-size="13" fill="#1f2328">pid 202</text>
        <text x="530" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1a7f37">unaffected</text>
        <rect x="650" y="20" width="230" height="90" rx="6" fill="#eaeef2" stroke="#59636e" stroke-width="1.5"></rect>
        <text x="765" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#59636e" font-weight="600">Host processes</text>
        <text x="765" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#59636e">kernel threads, systemd, …</text>
        <text x="765" y="92" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#59636e">unaffected</text>
        <text x="450" y="168" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#d1242f" font-weight="700">NOT system-wide OOM. Only inside that cgroup.</text>
      </svg>
