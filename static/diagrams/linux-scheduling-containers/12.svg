<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="fig8c-title">
      <title id="fig8c-title">PID namespace nesting</title>
      <defs>
        <marker id="ag2" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto">
          <polygon points="0 0, 8 2.5, 0 5" fill="#59636e"></polygon>
        </marker>
      </defs>
      <!-- HOST -->
      <rect x="20" y="20" width="860" height="300" rx="6" fill="#fffef5" stroke="#9a6700" stroke-width="3"></rect>
      <text x="40" y="44" font-size="13" font-weight="700" fill="#9a6700">HOST PID NS · level 0</text>
      <rect x="50" y="58" width="120" height="36" rx="3" fill="#fff8c5" stroke="#d1d9e0"></rect>
      <text x="110" y="80" text-anchor="middle" font-size="11">systemd (pid=1)</text>
      <rect x="190" y="58" width="120" height="36" rx="3" fill="#fff8c5" stroke="#d1d9e0"></rect>
      <text x="250" y="80" text-anchor="middle" font-size="11">dockerd (pid=842)</text>

      <line x1="110" y1="94" x2="190" y2="58" stroke="#59636e" stroke-width="1.25" marker-end="url(#ag2)"></line>
      <line x1="250" y1="94" x2="450" y2="130" stroke="#59636e" stroke-width="1.5" marker-end="url(#ag2)"></line>

      <!-- Container A -->
      <rect x="60" y="120" width="780" height="190" rx="6" fill="#f6fff8" stroke="#1a7f37" stroke-width="2.5"></rect>
      <text x="80" y="144" font-size="13" font-weight="700" fill="#1a7f37">Container A PID NS · level 1</text>
      <rect x="90" y="158" width="200" height="40" rx="3" fill="#dafbe1" stroke="#d1d9e0"></rect>
      <text x="190" y="176" text-anchor="middle" font-size="10" fill="#1f2328">nginx</text>
      <text x="190" y="190" text-anchor="middle" font-size="10" fill="#59636e">ns-pid=1, host-pid=5234</text>
      <rect x="310" y="158" width="200" height="40" rx="3" fill="#dafbe1" stroke="#d1d9e0"></rect>
      <text x="410" y="176" text-anchor="middle" font-size="10" fill="#1f2328">worker</text>
      <text x="410" y="190" text-anchor="middle" font-size="10" fill="#59636e">ns-pid=7, host-pid=5235</text>

      <line x1="190" y1="198" x2="410" y2="158" stroke="#59636e" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#ag2)"></line>
      <line x1="190" y1="198" x2="320" y2="230" stroke="#59636e" stroke-width="1.5" marker-end="url(#ag2)"></line>

      <!-- Container B nested -->
      <rect x="120" y="215" width="680" height="85" rx="6" fill="#faf8ff" stroke="#0969da" stroke-width="2" stroke-dasharray="6 4"></rect>
      <text x="140" y="236" font-size="12" font-weight="700" fill="#0969da">Container B PID NS · level 2</text>
      <rect x="200" y="248" width="520" height="44" rx="3" fill="#ddf4ff" stroke="#0969da"></rect>
      <text x="460" y="268" text-anchor="middle" font-size="10" fill="#1f2328">app</text>
      <text x="460" y="282" text-anchor="middle" font-size="10" fill="#59636e">pid=1/lvl2, pid=27/lvl1, pid=9102/lvl0</text>
    </svg>
