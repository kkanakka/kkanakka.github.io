      <rect x="272" y="118" width="30" height="2" fill="#f6f8fa" stroke="#d1d9e0"></rect><text x="278" y="135" fill="#59636e" font-size="11">o5–10</text>
    </g>
    <text x="620" y="285" fill="#59636e" font-size="13">Interpretation: runt supply at middle orders vanished—THP/unmovable pinning common culprits.</text>
  </svg>
