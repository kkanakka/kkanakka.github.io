<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="fig8a-title"><style>.topbar .crumbs .sep{color:var(--border)}
.subtitle{color: var(--fg-muted); font-size: 16px; margin-bottom: 28px; max-width: 720px}
pre .str{color:#0a3069}</style>
      <title id="fig8a-title">eight kernel primitives that compose a container</title>
      <defs>
        <filter id="s" x="-2%" y="-2%" width="104%" height="104%"><fedropshadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.08"></fedropshadow></filter>
      </defs>
      <!-- Kernel shell -->
      <rect x="10" y="10" width="880" height="500" rx="14" ry="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="2"></rect>
      <text x="450" y="38" text-anchor="middle" font-size="13" font-weight="600" fill="#59636e">Linux kernel · primitives used by containers</text>

      <!-- Row 1 -->
      <!-- Box 1 Processes -->
      <g filter="url(#s)">
        <rect x="40" y="60" width="190" height="180" rx="4" fill="#dafbe1" stroke="#d1d9e0"></rect>
        <rect x="40" y="60" width="190" height="30" rx="4" fill="#1a7f37"></rect>
        <rect x="40" y="84" width="190" height="6" fill="#1a7f37"></rect>
        <text x="135" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Processes</text>
        <text x="135" y="112" text-anchor="middle" font-size="11" fill="#1f2328">task_struct · fork/exec</text>
        <text x="135" y="128" text-anchor="middle" font-size="11" fill="#1f2328">the schedulable unit</text>
      </g>
      <!-- Box 2 Namespaces -->
      <g filter="url(#s)">
        <rect x="250" y="60" width="190" height="180" rx="4" fill="#ddf4ff" stroke="#d1d9e0"></rect>
        <rect x="250" y="60" width="190" height="30" rx="4" fill="#0969da"></rect>
        <rect x="250" y="84" width="190" height="6" fill="#0969da"></rect>
        <text x="345" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Namespaces</text>
        <text x="345" y="112" text-anchor="middle" font-size="11" fill="#1f2328">8 types · isolate kernel views</text>
        <text x="345" y="128" text-anchor="middle" font-size="11" fill="#1f2328">what you see</text>
      </g>
      <!-- Box 3 cgroups -->
      <g filter="url(#s)">
        <rect x="460" y="60" width="190" height="180" rx="4" fill="#fff8c5" stroke="#d1d9e0"></rect>
        <rect x="460" y="60" width="190" height="30" rx="4" fill="#9a6700"></rect>
        <rect x="460" y="84" width="190" height="6" fill="#9a6700"></rect>
        <text x="555" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">cgroups v2</text>
        <text x="555" y="112" text-anchor="middle" font-size="11" fill="#1f2328">resource limits · what you consume</text>
      </g>
      <!-- Box 4 VFS -->
      <g filter="url(#s)">
        <rect x="670" y="60" width="190" height="180" rx="4" fill="#ffebe9" stroke="#d1d9e0"></rect>
        <rect x="670" y="60" width="190" height="30" rx="4" fill="#d1242f"></rect>
        <rect x="670" y="84" width="190" height="6" fill="#d1242f"></rect>
        <text x="765" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">VFS</text>
        <text x="765" y="112" text-anchor="middle" font-size="11" fill="#1f2328">virtual filesystem switch</text>
        <text x="765" y="128" text-anchor="middle" font-size="11" fill="#1f2328">single API to all FS</text>
      </g>

      <!-- Row 2 -->
      <!-- Box 5 overlayfs -->
      <g filter="url(#s)">
        <rect x="40" y="280" width="190" height="180" rx="4" fill="#f5f0ff" stroke="#8250df" stroke-width="1.5"></rect>
        <rect x="40" y="280" width="190" height="30" rx="4" fill="#8250df"></rect>
        <rect x="40" y="304" width="190" height="6" fill="#8250df"></rect>
        <text x="135" y="301" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">overlayfs</text>
        <text x="135" y="332" text-anchor="middle" font-size="11" fill="#1f2328">layer union · image +</text>
        <text x="135" y="348" text-anchor="middle" font-size="11" fill="#1f2328">writable layer</text>
      </g>
      <!-- Box 6 Schedulers -->
      <g filter="url(#s)">
        <rect x="250" y="280" width="190" height="180" rx="4" fill="#ddf4ff" stroke="#d1d9e0"></rect>
        <rect x="250" y="280" width="190" height="30" rx="4" fill="#0969da"></rect>
        <rect x="250" y="304" width="190" height="6" fill="#0969da"></rect>
        <text x="345" y="301" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Schedulers</text>
        <text x="345" y="332" text-anchor="middle" font-size="11" fill="#1f2328">CFS/EEVDF · per-cgroup</text>
        <text x="345" y="348" text-anchor="middle" font-size="11" fill="#1f2328">runqueues · cpu.max</text>
      </g>
      <!-- Box 7 Memory accounting -->
      <g filter="url(#s)">
        <rect x="460" y="280" width="190" height="180" rx="4" fill="#fff8c5" stroke="#d1d9e0"></rect>
        <rect x="460" y="280" width="190" height="30" rx="4" fill="#9a6700"></rect>
        <rect x="460" y="304" width="190" height="6" fill="#9a6700"></rect>
        <text x="555" y="301" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Memory accounting</text>
        <text x="555" y="332" text-anchor="middle" font-size="11" fill="#1f2328">memcg · per-cgroup OOM</text>
        <text x="555" y="348" text-anchor="middle" font-size="11" fill="#1f2328">memory.max</text>
      </g>
      <!-- Box 8 Capabilities -->
      <g filter="url(#s)">
        <rect x="670" y="280" width="190" height="180" rx="4" fill="#dafbe1" stroke="#d1d9e0"></rect>
        <rect x="670" y="280" width="190" height="30" rx="4" fill="#1a7f37"></rect>
        <rect x="670" y="304" width="190" height="6" fill="#1a7f37"></rect>
        <text x="765" y="301" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Capabilities &amp; Security</text>
        <text x="765" y="332" text-anchor="middle" font-size="11" fill="#1f2328">seccomp · LSM · cap bounding set</text>
      </g>

      <text x="450" y="498" text-anchor="middle" font-size="11.5" fill="#1f2328" font-weight="500">A 'container' = process + namespaces + cgroup + overlayfs root + seccomp filter + reduced capabilities</text>
    </svg>
