<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="fig22-soc" xmlns="http://www.w3.org/2000/svg">
    <title>Figure 22: Stylized processor socket internals</title>
    <rect x="30" y="30" width="840" height="340" rx="16" fill="#f6f8fa" stroke="#59636e" stroke-width="2"></rect>
    <text x="50" y="58" font-size="17" font-weight="700">CPU package / socket</text>
    <!-- Core 1 -->
    <rect x="70" y="90" width="320" height="190" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.8"></rect>
    <text x="90" y="115" fill="#0969da" font-size="14" font-weight="700">Physical core #0</text>
    <rect x="110" y="135" width="110" height="70" rx="6" fill="#ddf4ff" stroke="#0969da"></rect><text x="125" y="165" font-size="13">LCPU0</text><text x="125" y="183" font-size="11">SMT thread A</text>
    <rect x="230" y="135" width="110" height="70" rx="6" fill="#ddf4ff" stroke="#0969da"></rect><text x="248" y="165" font-size="13">LCPU1</text><text x="248" y="183" font-size="11">SMT thread B</text>
    <rect x="110" y="215" width="230" height="45" rx="6" fill="#fff8c5" stroke="#9a6700"></rect><text x="180" y="242" font-size="13">Private L2 (per core)</text>
    <!-- Core 2 -->
    <rect x="420" y="90" width="320" height="190" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.8"></rect>
    <text x="440" y="115" fill="#0969da" font-size="14" font-weight="700">Physical core #1</text>
    <rect x="450" y="135" width="110" height="70" rx="6" fill="#ddf4ff" stroke="#0969da"></rect><text x="468" y="165" font-size="13">LCPU2</text><text x="468" y="183" font-size="11">SMT thread A</text>
    <rect x="570" y="135" width="110" height="70" rx="6" fill="#ddf4ff" stroke="#0969da"></rect><text x="588" y="165" font-size="13">LCPU3</text><text x="588" y="183" font-size="11">SMT thread B</text>
    <rect x="450" y="215" width="230" height="45" rx="6" fill="#fff8c5" stroke="#9a6700"></rect><text x="518" y="242" font-size="13">Private L2 (per core)</text>
    <text x="750" y="160" fill="#59636e" font-size="12" font-style="italic">Cores 2–3 similar</text>
    <!-- L3 -->
    <rect x="90" y="295" width="720" height="38" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"></rect>
    <text x="400" y="319" font-size="14" font-weight="700">Shared L3 / LLC (all cores)</text>
    <!-- DRAM -->
    <rect x="90" y="340" width="720" height="40" rx="8" fill="#ffebe9" stroke="#d1242f"></rect>
    <text x="415" y="365" font-size="14" font-weight="700">DRAM channels (NUMA nodes optional)</text>
  </svg>
