<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig12-title">
        <title id="fig12-title">Figure 12: Page table walk depth vs page size</title>
        <!-- Row labels -->
        <text x="20" y="55" fill="#59636e" font-size="13" font-weight="700">4 KiB pages</text>
        <text x="20" y="185" fill="#59636e" font-size="13" font-weight="700">2 MiB huge</text>

        <!-- 4K walk -->
        <g font-size="11" fill="#1f2328">
          <rect x="100" y="30" width="70" height="36" rx="6" fill="#ffebe9" stroke="#d1242f"></rect>
          <text x="135" y="52" text-anchor="middle" font-weight="600">CR3</text>
          <line x1="170" y1="48" x2="185" y2="48" stroke="#59636e" marker-end="url(#arrG)"></line>
          <rect x="185" y="30" width="70" height="36" rx="6" fill="#ffebe9" stroke="#d1242f"></rect>
          <text x="220" y="52" text-anchor="middle" font-weight="600">PGD</text>
          <line x1="255" y1="48" x2="270" y2="48" stroke="#59636e" marker-end="url(#arrG)"></line>
          <rect x="270" y="30" width="70" height="36" rx="6" fill="#ffebe9" stroke="#d1242f"></rect>
          <text x="305" y="52" text-anchor="middle" font-weight="600">PUD</text>
          <line x1="340" y1="48" x2="355" y2="48" stroke="#59636e" marker-end="url(#arrG)"></line>
          <rect x="355" y="30" width="70" height="36" rx="6" fill="#ffebe9" stroke="#d1242f"></rect>
          <text x="390" y="52" text-anchor="middle" font-weight="600">PMD</text>
          <line x1="425" y1="48" x2="440" y2="48" stroke="#59636e" marker-end="url(#arrG)"></line>
          <rect x="440" y="30" width="70" height="36" rx="6" fill="#ffebe9" stroke="#d1242f"></rect>
          <text x="475" y="52" text-anchor="middle" font-weight="600">PTE</text>
          <line x1="510" y1="48" x2="525" y2="48" stroke="#59636e" marker-end="url(#arrG)"></line>
          <rect x="525" y="24" width="95" height="48" rx="6" fill="#ffebe9" stroke="#d1242f" stroke-width="2"></rect>
          <text x="572" y="48" text-anchor="middle" font-weight="700">4K frame</text>
          <text x="572" y="64" text-anchor="middle" font-size="10" fill="#59636e">4-level walk</text>
        </g>

        <!-- 2M walk -->
        <g font-size="11" fill="#1f2328">
          <rect x="100" y="160" width="70" height="36" rx="6" fill="#dafbe1" stroke="#1a7f37"></rect>
          <text x="135" y="182" text-anchor="middle" font-weight="600">CR3</text>
          <line x1="170" y1="178" x2="185" y2="178" stroke="#59636e" marker-end="url(#arrG)"></line>
          <rect x="185" y="160" width="70" height="36" rx="6" fill="#dafbe1" stroke="#1a7f37"></rect>
          <text x="220" y="182" text-anchor="middle" font-weight="600">PGD</text>
          <line x1="255" y1="178" x2="270" y2="178" stroke="#59636e" marker-end="url(#arrG)"></line>
          <rect x="270" y="160" width="70" height="36" rx="6" fill="#dafbe1" stroke="#1a7f37"></rect>
          <text x="305" y="182" text-anchor="middle" font-weight="600">PUD</text>
          <line x1="340" y1="178" x2="355" y2="178" stroke="#59636e" marker-end="url(#arrG)"></line>
          <rect x="355" y="160" width="90" height="36" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"></rect>
          <text x="400" y="182" text-anchor="middle" font-weight="700">PMD huge</text>
          <line x1="445" y1="178" x2="460" y2="178" stroke="#59636e" marker-end="url(#arrG)"></line>
          <rect x="460" y="154" width="115" height="48" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"></rect>
          <text x="517" y="174" text-anchor="middle" font-weight="700">2 MiB frame</text>
          <text x="517" y="190" text-anchor="middle" font-size="10" fill="#59636e">3-level walk</text>
        </g>

        <defs>
          <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#59636e"></polygon>
          </marker>
        </defs>

        <!-- TLB bars -->
        <text x="100" y="250" fill="#59636e" font-size="13" font-weight="700">TLB reach (schematic)</text>
        <text x="100" y="272" fill="#59636e" font-size="11">4K granular mapping</text>
        <rect x="100" y="280" width="220" height="22" rx="4" fill="#ffebe9" stroke="#d1242f"></rect>
        <rect x="100" y="280" width="70" height="22" rx="4" fill="#ffebe9" stroke="#d1242f"></rect>

        <text x="340" y="272" fill="#59636e" font-size="11">2M huge mapping (same #entries)</text>
        <rect x="340" y="280" width="520" height="22" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.8"></rect>
        <rect x="340" y="280" width="420" height="22" rx="4" fill="#dafbe1" stroke="#1a7f37"></rect>
        <text x="600" y="296" text-anchor="middle" font-size="11" fill="#1a7f37" font-weight="600">wider VA coverage per TLB slot</text>
      </svg>
