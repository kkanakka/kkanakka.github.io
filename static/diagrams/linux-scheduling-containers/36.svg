<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="fig24-pin" xmlns="http://www.w3.org/2000/svg">
    <title>Figure 24: Partitioning eight logical CPUs</title>
    <rect x="0" y="0" width="900" height="400" fill="#fff"></rect>
    <g transform="translate(50,55)">
      <rect x="0" y="0" width="90" height="70" rx="6" fill="#fff8c5" stroke="#9a6700"></rect><text x="30" y="40" font-size="14">LCPU0</text>
      <rect x="98" y="0" width="90" height="70" rx="6" fill="#fff8c5" stroke="#9a6700"></rect><text x="128" y="40" font-size="14">LCPU1</text>
      <rect x="196" y="0" width="90" height="70" rx="6" fill="#ddf4ff" stroke="#0969da"></rect><text x="226" y="40" font-size="14">LCPU2</text>
      <rect x="294" y="0" width="90" height="70" rx="6" fill="#ddf4ff" stroke="#0969da"></rect><text x="324" y="40" font-size="14">LCPU3</text>
      <rect x="392" y="0" width="90" height="70" rx="6" fill="#ddf4ff" stroke="#0969da"></rect><text x="422" y="40" font-size="14">LCPU4</text>
      <rect x="490" y="0" width="90" height="70" rx="6" fill="#ddf4ff" stroke="#0969da"></rect><text x="520" y="40" font-size="14">LCPU5</text>
      <rect x="588" y="0" width="90" height="70" rx="6" fill="#dafbe1" stroke="#1a7f37"></rect><text x="615" y="40" font-size="14">LCPU6</text>
      <rect x="686" y="0" width="90" height="70" rx="6" fill="#dafbe1" stroke="#1a7f37"></rect><text x="715" y="40" font-size="14">LCPU7</text>
    </g>
    <rect x="50" y="145" width="188" height="75" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-dasharray="4 3"></rect>
    <text x="65" y="175" font-size="13" font-weight="700">Kernel / reserved</text><text x="65" y="195" font-size="11" fill="#59636e">systemd, kubelet, IRQ house-keeping</text>
    <rect x="248" y="145" width="385" height="75" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-dasharray="4 3"></rect>
    <text x="265" y="175" font-size="13" font-weight="700">Shared pool</text><text x="265" y="195" font-size="11" fill="#59636e">Burstable / BestEffort mix · CFS fair share</text>
    <rect x="643" y="145" width="188" height="75" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-dasharray="4 3"></rect>
    <text x="658" y="175" font-size="13" font-weight="700">Pinned / exclusive</text><text x="658" y="195" font-size="11" fill="#59636e">Guaranteed + static policy / device plugin</text>
    <text x="50" y="270" fill="#1f2328" font-size="14" font-weight="700">How regions are established</text>
    <text x="50" y="295" fill="#59636e" font-size="13">Reserved: kube --reserved-cpus + system.slice affinity / static pods on dedicated MCS.</text>
    <text x="50" y="318" fill="#59636e" font-size="13">Shared: default pod cgroup cpuset unset → full-node mask minus reserved.</text>
    <text x="50" y="341" fill="#59636e" font-size="13">Pinned: CPU Manager static policy + Guaranteed integer CPU requests → explicit cpuset files.</text>
  </svg>
