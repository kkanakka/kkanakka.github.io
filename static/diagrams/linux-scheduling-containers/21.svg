<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig9-title fig9-desc">
        <title id="fig9-title">Figure 9: Congestion window evolution by algorithm</title>
        <desc id="fig9-desc">Three cwnd curves: Reno sawtooth, CUBIC cubic growth, BBR smoothing around BDP; shared slow start; loss markers.</desc>
        <defs>
          <linearGradient id="bbrBand" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1a7f37" stop-opacity="0.35"></stop>
            <stop offset="100%" stop-color="#1a7f37" stop-opacity="0.12"></stop>
          </linearGradient>
        </defs>
        <!-- Axes -->
        <line x1="70" y1="40" x2="70" y2="260" stroke="#59636e" stroke-width="2"></line>
        <line x1="70" y1="260" x2="860" y2="260" stroke="#59636e" stroke-width="2"></line>
        <text x="30" y="155" fill="#59636e" font-size="13" transform="rotate(-90 30 155)">cwnd (segments)</text>
        <text x="420" y="345" fill="#59636e" font-size="13" text-anchor="middle">time / RTTs</text>
        <!-- Y ticks -->
        <g fill="#59636e" font-size="11">
          <text x="55" y="264" text-anchor="end">0</text>
          <text x="55" y="204" text-anchor="end">25</text>
          <text x="55" y="144" text-anchor="end">50</text>
          <text x="55" y="84" text-anchor="end">75</text>
          <text x="55" y="44" text-anchor="end">100</text>
        </g>
        <g stroke="#d8dee4" stroke-width="1">
          <line x1="70" y1="240" x2="860" y2="240"></line><line x1="70" y1="200" x2="860" y2="200"></line>
          <line x1="70" y1="160" x2="860" y2="160"></line><line x1="70" y1="120" x2="860" y2="120"></line>
          <line x1="70" y1="80" x2="860" y2="80"></line>
        </g>
        <!-- X ticks -->
        <g fill="#59636e" font-size="11" text-anchor="middle">
          <text x="150" y="278">4</text><text x="280" y="278">8</text><text x="410" y="278">12</text>
          <text x="540" y="278">16</text><text x="670" y="278">20</text><text x="800" y="278">24</text>
        </g>
        <!-- BDP reference -->
        <line x1="70" y1="115" x2="860" y2="115" stroke="#8250df" stroke-width="2" stroke-dasharray="8 6"></line>
        <text x="875" y="118" fill="#8250df" font-size="12" font-weight="600">BDP</text>
        <!-- Shared slow start (exponential) through ~RTT 4 -->
        <path d="M 70 260 L 95 248 L 118 230 L 142 195 L 165 150" fill="none" stroke="#59636e" stroke-width="2.5"></path>
        <text x="175" y="138" fill="#59636e" font-size="11" font-weight="600">slow start</text>
        <!-- Reno: red sawtooth -->
        <polyline fill="none" stroke="#d1242f" stroke-width="2.5" points="165,150 200,120 230,95 260,75 290,60 320,78 350,55 380,70 410,48 440,65 470,50 500,68 530,52 560,70 590,55 620,72 650,58 680,74 710,62 740,76 770,63 800,74 830,62"></polyline>
        <!-- Loss markers Reno -->
        <circle cx="320" cy="78" r="5" fill="#d1242f" stroke="#1f2328" stroke-width="1"></circle>
        <text x="328" y="72" fill="#d1242f" font-size="11" font-weight="600">L</text>
        <circle cx="500" cy="68" r="5" fill="#d1242f" stroke="#1f2328" stroke-width="1"></circle>
        <text x="508" y="62" fill="#d1242f" font-size="11" font-weight="600">L</text>
        <circle cx="680" cy="74" r="5" fill="#d1242f" stroke="#1f2328" stroke-width="1"></circle>
        <text x="688" y="68" fill="#d1242f" font-size="11" font-weight="600">L</text>
        <!-- CUBIC: blue, concave then convex-ish -->
        <path d="M 165 150 C 260 148, 300 138, 330 155 C 395 182, 420 158, 460 148 C 520 132, 555 172, 600 148 C 655 118, 700 158, 750 138 C 800 118, 820 148, 850 132" fill="none" stroke="#0969da" stroke-width="2.5"></path>
        <circle cx="460" cy="148" r="5" fill="#0969da" stroke="#1f2328" stroke-width="1"></circle>
        <text x="468" y="142" fill="#0969da" font-size="11" font-weight="600">L</text>
        <circle cx="600" cy="148" r="5" fill="#0969da" stroke="#1f2328" stroke-width="1"></circle>
        <text x="608" y="142" fill="#0969da" font-size="11" font-weight="600">L</text>
        <!-- BBR band + smooth curve -->
        <path d="M 165 150 L 220 138 L 300 126 L 400 118 L 520 114 L 650 112 L 800 114 L 850 116" fill="url(#bbrBand)" stroke="none"></path>
        <path d="M 162 146 L 220 134 L 300 122 L 400 114 L 520 110 L 650 108 L 800 110 L 853 114" fill="none" stroke="#1a7f37" stroke-width="2.5"></path>
        <path d="M 168 154 L 220 142 L 300 130 L 400 122 L 520 118 L 650 116 L 800 118 L 848 118" fill="none" stroke="#1a7f37" stroke-width="2.5"></path>
        <!-- Legend -->
        <rect x="70" y="275" width="760" height="72" rx="6" fill="#ffffff" stroke="#d1d9e0"></rect>
        <text x="85" y="298" font-size="12" font-weight="600" fill="#1f2328">Legend</text>
        <line x1="85" y1="318" x2="125" y2="318" stroke="#d1242f" stroke-width="3"></line>
        <text x="135" y="322" font-size="12" fill="#1f2328">Reno (loss-driven halving)</text>
        <line x1="330" y1="318" x2="370" y2="318" stroke="#0969da" stroke-width="3"></line>
        <text x="380" y="322" font-size="12" fill="#1f2328">CUBIC (cubic window growth)</text>
        <rect x="560" y="308" width="36" height="12" fill="#1a7f37" fill-opacity="0.35" stroke="#1a7f37"></rect>
        <text x="605" y="322" font-size="12" fill="#1f2328">BBR (probe + drain around model)</text>
        <line x1="85" y1="338" x2="125" y2="338" stroke="#8250df" stroke-width="2" stroke-dasharray="6 4"></line>
        <text x="135" y="342" font-size="12" fill="#8250df">BDP reference (dashed)</text>
        <text x="420" y="342" font-size="12" fill="#59636e">L = loss event (Reno/CUBIC)</text>
      </svg>
