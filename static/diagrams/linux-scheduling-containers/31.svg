    <circle cx="120" cy="200" r="35" fill="#ddf4ff" stroke="#0969da" stroke-width="2"></circle><text x="105" y="195" font-size="14" font-weight="700">10</text><text x="88" y="212" font-size="11" fill="#59636e">0.1%</text>
    <text x="70" y="140" fill="#1a7f37" font-size="12" font-weight="600">health OK</text>
