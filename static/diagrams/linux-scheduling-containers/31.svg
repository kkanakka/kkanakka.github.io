    <path d="M 780 295 Q 440 340 140 285" stroke="#d1242f" stroke-width="2.5" fill="none" stroke-dasharray="8 6"></path>
    <text x="360" y="335" fill="#d1242f" font-size="13" font-weight="700">Rollback / kexec-prev-kernel cohort</text>
