<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="fig19-roll" xmlns="http://www.w3.org/2000/svg">
    <title>Figure 19: Staged kernel rollout with health gates</title>
