<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 740" xmlns="http://www.w3.org/2000/svg"><style>.box-fill-blue{fill:#ddf4ff;stroke:#54aeff}
.box-fill-green{fill:#dafbe1;stroke:#4ac26b}
.box-fill-purple{fill:#fbefff;stroke:#c297ff}
.box-fill-orange{fill:#fff1e5;stroke:#fd8c73}
.box-fill-red{fill:#ffebe9;stroke:#ff8182}
.box-fill-yellow{fill:#fff8c5;stroke:#d4a72c}
.box-fill-gray{fill:#f6f8fa;stroke:#d0d7de}
.lbl-title{font-family:'Inter',sans-serif;font-weight:700;font-size:11.5px;fill:#1f2328}
.lbl-sub{font-family:'JetBrains Mono',monospace;font-size:9.5px;fill:#59636e}
.lbl-meta{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#818b98}
.arrow{stroke:#59636e;stroke-width:1.3;fill:none;marker-end:url(#arr)}
.arrow-dashed{stroke:#cf222e;stroke-width:1.2;fill:none;stroke-dasharray:4,3;marker-end:url(#arr-red)}
.arrow-green{stroke:#1a7f37;stroke-width:1.5;fill:none;marker-end:url(#arr-green)}</style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#59636e"></path>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"></path>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"></path>
    </marker>
  </defs>

  <!-- SLO ribbon -->
  <text x="490" y="20" text-anchor="middle" class="lbl-title" style="font-size:13px">3,000 deploys/day · detect &lt; 60s · rollback 99.99% · FP &lt; 0.1% · 5-stage progression</text>

  <!-- ============ STEP NUMBER BADGES ============ -->
  <circle cx="155" cy="58" r="11" fill="#0a66c2"></circle>
  <text x="155" y="62" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">1</text>
  <circle cx="490" cy="58" r="11" fill="#0a66c2"></circle>
  <text x="490" y="62" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">2</text>
  <circle cx="800" cy="58" r="11" fill="#0a66c2"></circle>
  <text x="800" y="62" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">3</text>
  <circle cx="490" cy="195" r="11" fill="#0a66c2"></circle>
  <text x="490" y="199" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">4</text>
  <circle cx="490" cy="330" r="11" fill="#0a66c2"></circle>
  <text x="490" y="334" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">5</text>
  <circle cx="155" cy="470" r="11" fill="#0a66c2"></circle>
  <text x="155" y="474" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">6</text>
  <circle cx="490" cy="470" r="11" fill="#0a66c2"></circle>
  <text x="490" y="474" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">7</text>
  <circle cx="820" cy="470" r="11" fill="#0a66c2"></circle>
  <text x="820" y="474" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">8</text>
  <circle cx="490" cy="620" r="11" fill="#0a66c2"></circle>
  <text x="490" y="624" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">9</text>

  <!-- ============ ROW 1: CI/CD → Controller → Audit ============ -->
  <g>
    <rect x="20" y="80" width="240" height="80" rx="6" class="box-fill-gray"></rect>
    <text x="140" y="103" text-anchor="middle" class="lbl-title">CI/CD trigger</text>
    <text x="140" y="121" text-anchor="middle" class="lbl-sub">Spinnaker · Jenkins · Argo</text>
    <text x="140" y="137" text-anchor="middle" class="lbl-sub">"deploy v2.3.1 of feed-ranker"</text>
    <text x="140" y="153" text-anchor="middle" class="lbl-meta">~3,000 deploys/day</text>
  </g>

  <g>
    <rect x="320" y="80" width="340" height="80" rx="6" class="box-fill-blue"></rect>
    <text x="490" y="103" text-anchor="middle" class="lbl-title">Canary controller (orchestrator)</text>
    <text x="490" y="121" text-anchor="middle" class="lbl-sub">accept deploy · plan stages · drive state machine</text>
    <text x="490" y="137" text-anchor="middle" class="lbl-sub">leader-elected · multi-region hot standby</text>
    <text x="490" y="153" text-anchor="middle" class="lbl-meta">15 nodes · ~170 active deploys</text>
  </g>

  <g>
    <rect x="700" y="80" width="260" height="80" rx="6" class="box-fill-yellow"></rect>
    <text x="830" y="103" text-anchor="middle" class="lbl-title">Audit log (Kafka)</text>
    <text x="830" y="121" text-anchor="middle" class="lbl-sub">event-sourced state transitions</text>
    <text x="830" y="137" text-anchor="middle" class="lbl-sub">immutable · 1y retention</text>
    <text x="830" y="153" text-anchor="middle" class="lbl-meta">every decision recorded</text>
  </g>

  <!-- ============ ROW 2: Traffic splitter (Istio) ============ -->
  <g>
    <rect x="20" y="220" width="940" height="80" rx="6" class="box-fill-orange"></rect>
    <text x="490" y="245" text-anchor="middle" class="lbl-title" style="font-size:13px">Traffic splitter — Istio / Envoy service mesh</text>
    <text x="490" y="263" text-anchor="middle" class="lbl-sub">weighted virtual service: 1% → 5% → 25% → 50% → 100% canary</text>
    <text x="490" y="280" text-anchor="middle" class="lbl-meta">per-cluster · per-region · live mutation via K8s CRD (rollout time ~2 s)</text>
  </g>

  <!-- ============ ROW 3: Baseline + Canary ============ -->
  <g>
    <rect x="40" y="350" width="400" height="80" rx="6" class="box-fill-green"></rect>
    <text x="240" y="375" text-anchor="middle" class="lbl-title">Baseline (v2.3.0)</text>
    <text x="240" y="393" text-anchor="middle" class="lbl-sub">current production version</text>
    <text x="240" y="410" text-anchor="middle" class="lbl-meta">95% traffic at stage 1 · used as control group</text>
  </g>

  <g>
    <rect x="460" y="350" width="240" height="80" rx="6" class="box-fill-orange"></rect>
    <text x="580" y="375" text-anchor="middle" class="lbl-title">Canary (v2.3.1)</text>
    <text x="580" y="393" text-anchor="middle" class="lbl-sub">new version under test</text>
    <text x="580" y="410" text-anchor="middle" class="lbl-meta">1–100% per stage</text>
  </g>

  <g>
    <rect x="720" y="350" width="240" height="80" rx="6" class="box-fill-purple"></rect>
    <text x="840" y="375" text-anchor="middle" class="lbl-title">Metrics collector</text>
    <text x="840" y="393" text-anchor="middle" class="lbl-sub">Prometheus + Grafana</text>
    <text x="840" y="410" text-anchor="middle" class="lbl-meta">SLI scrape @ 15 s · per-version labels</text>
  </g>

  <!-- ============ ROW 4: Decision engine inputs ============ -->
  <g>
    <rect x="40" y="490" width="240" height="100" rx="6" class="box-fill-blue"></rect>
    <text x="160" y="513" text-anchor="middle" class="lbl-title">SLI comparator</text>
    <text x="160" y="531" text-anchor="middle" class="lbl-sub">Mann-Whitney U</text>
    <text x="160" y="547" text-anchor="middle" class="lbl-sub">Welch's t-test · Cohen's d</text>
    <text x="160" y="565" text-anchor="middle" class="lbl-meta">p-value &lt; 0.01 threshold</text>
    <text x="160" y="580" text-anchor="middle" class="lbl-meta">12 SLIs compared</text>
  </g>

  <g>
    <rect x="300" y="490" width="240" height="100" rx="6" class="box-fill-blue"></rect>
    <text x="420" y="513" text-anchor="middle" class="lbl-title">ML decision engine</text>
    <text x="420" y="531" text-anchor="middle" class="lbl-sub">Random Forest ensemble</text>
    <text x="420" y="547" text-anchor="middle" class="lbl-sub">trained on 2y of deploys</text>
    <text x="420" y="565" text-anchor="middle" class="lbl-meta">confidence score 0..1</text>
    <text x="420" y="580" text-anchor="middle" class="lbl-meta">12 nodes · 30 ms inference</text>
  </g>

  <g>
    <rect x="560" y="490" width="240" height="100" rx="6" class="box-fill-yellow"></rect>
    <text x="680" y="513" text-anchor="middle" class="lbl-title">Error-budget service</text>
    <text x="680" y="531" text-anchor="middle" class="lbl-sub">per-service monthly budget</text>
    <text x="680" y="547" text-anchor="middle" class="lbl-sub">current burn rate</text>
    <text x="680" y="565" text-anchor="middle" class="lbl-meta">&gt; 80% used → tighter</text>
    <text x="680" y="580" text-anchor="middle" class="lbl-meta">thresholds + shorter window</text>
  </g>

  <g>
    <rect x="820" y="490" width="140" height="100" rx="6" class="box-fill-gray"></rect>
    <text x="890" y="513" text-anchor="middle" class="lbl-title">Manual override</text>
    <text x="890" y="531" text-anchor="middle" class="lbl-sub">SRE escape hatch</text>
    <text x="890" y="547" text-anchor="middle" class="lbl-sub">force promote</text>
    <text x="890" y="565" text-anchor="middle" class="lbl-meta">or force rollback</text>
    <text x="890" y="580" text-anchor="middle" class="lbl-meta">audited</text>
  </g>

  <!-- ============ ROW 5: Action — promote / hold / rollback ============ -->
  <g>
    <rect x="20" y="640" width="280" height="80" rx="6" class="box-fill-green"></rect>
    <text x="160" y="665" text-anchor="middle" class="lbl-title">✓ PROMOTE</text>
    <text x="160" y="683" text-anchor="middle" class="lbl-sub">advance to next stage</text>
    <text x="160" y="700" text-anchor="middle" class="lbl-meta">1% → 5% → 25% → 50% → 100%</text>
  </g>

  <g>
    <rect x="320" y="640" width="280" height="80" rx="6" class="box-fill-yellow"></rect>
    <text x="460" y="665" text-anchor="middle" class="lbl-title">⏸ HOLD</text>
    <text x="460" y="683" text-anchor="middle" class="lbl-sub">wait one more cycle</text>
    <text x="460" y="700" text-anchor="middle" class="lbl-meta">inconclusive · extend observation</text>
  </g>

  <g>
    <rect x="620" y="640" width="340" height="80" rx="6" class="box-fill-red"></rect>
    <text x="790" y="665" text-anchor="middle" class="lbl-title">✗ ROLLBACK</text>
    <text x="790" y="683" text-anchor="middle" class="lbl-sub">restore baseline · alert deploy owner</text>
    <text x="790" y="700" text-anchor="middle" class="lbl-meta">circuit-break further deploys until reviewed</text>
  </g>

  <!-- ============ ARROWS ============ -->
  <path d="M260,120 L320,120" class="arrow"></path>
  <path d="M660,110 L700,100" class="arrow" stroke-dasharray="3,2"></path>
  <path d="M490,160 L490,220" class="arrow"></path>
  <path d="M490,300 L490,350" class="arrow"></path>
  <path d="M240,430 L840,430" stroke="#59636e" stroke-width="0.8" stroke-dasharray="2,2"></path>
  <path d="M240,430 L160,490" class="arrow"></path>
  <path d="M580,430 L420,490" class="arrow"></path>
  <path d="M840,430 L680,490" class="arrow"></path>
  <path d="M160,590 L160,640" class="arrow-green"></path>
  <path d="M420,590 L460,640" class="arrow"></path>
  <path d="M420,590 L790,640" class="arrow-dashed" stroke-opacity="0.6"></path>
  <path d="M680,590 L790,640" class="arrow-dashed"></path>
  <!-- Rollback feedback to traffic splitter -->
  <path d="M790,640 Q940,640 940,260 Q940,220 920,220" class="arrow-dashed"></path>
  <path d="M160,720 Q20,720 20,260 Q20,220 40,220" class="arrow-green"></path>
</svg>
