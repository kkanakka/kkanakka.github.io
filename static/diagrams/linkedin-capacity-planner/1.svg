<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" height="650" style="background:#fafafa;border:1px solid #ddd;border-radius:8px;margin:16px 0;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1122 650">
    <!-- Data Sources -->
    <rect x="50" y="50" width="120" height="70" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="4"></rect>
    <text x="110" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">Metrics</text>
    <text x="110" y="85" text-anchor="middle" font-size="9" fill="#1b5e20">RPS, CPU</text>
    <text x="110" y="100" text-anchor="middle" font-size="9" fill="#1b5e20">Memory, Storage</text>
    <text x="110" y="115" text-anchor="middle" font-size="9" fill="#1b5e20">Network I/O</text>
    
    <rect x="190" y="50" width="120" height="70" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="4"></rect>
    <text x="250" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">Events</text>
    <text x="250" y="85" text-anchor="middle" font-size="9" fill="#e65100">Product launches</text>
    <text x="250" y="100" text-anchor="middle" font-size="9" fill="#e65100">Marketing campaigns</text>
    <text x="250" y="115" text-anchor="middle" font-size="9" fill="#e65100">Holiday calendar</text>
    
    <rect x="330" y="50" width="120" height="70" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="4"></rect>
    <text x="390" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">SLO Targets</text>
    <text x="390" y="85" text-anchor="middle" font-size="9" fill="#0d47a1">Latency limits</text>
    <text x="390" y="100" text-anchor="middle" font-size="9" fill="#0d47a1">Availability goals</text>
    <text x="390" y="115" text-anchor="middle" font-size="9" fill="#0d47a1">Error budgets</text>
    
    <rect x="470" y="50" width="120" height="70" fill="#ffebee" stroke="#d32f2f" stroke-width="2" rx="4"></rect>
    <text x="530" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">Historical Data</text>
    <text x="530" y="85" text-anchor="middle" font-size="9" fill="#c62828">2+ years</text>
    <text x="530" y="100" text-anchor="middle" font-size="9" fill="#c62828">Seasonality</text>
    <text x="530" y="115" text-anchor="middle" font-size="9" fill="#c62828">Trend analysis</text>
    
    <!-- Ingest Pipeline -->
    <rect x="50" y="150" width="540" height="60" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2" rx="8"></rect>
    <text x="320" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a148c">Ingest Pipeline</text>
    <text x="320" y="190" text-anchor="middle" font-size="10" fill="#4a148c">Real-time Kafka Streams • Data Quality Validation • Outlier Detection • Gap Filling</text>
    <text x="320" y="205" text-anchor="middle" font-size="10" fill="#4a148c">Multi-source correlation • Schema evolution • 10-minute freshness SLO</text>
    
    <!-- Feature Builder -->
    <rect x="50" y="240" width="180" height="80" fill="#e1f5fe" stroke="#0288d1" stroke-width="2" rx="8"></rect>
    <text x="140" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#01579b">Feature Builder</text>
    <text x="140" y="285" text-anchor="middle" font-size="10" fill="#01579b">• Seasonality extraction</text>
    <text x="140" y="300" text-anchor="middle" font-size="10" fill="#01579b">• Trend decomposition</text>
    <text x="140" y="315" text-anchor="middle" font-size="10" fill="#01579b">• Event feature engineering</text>
    
    <!-- ML Forecasting Engine -->
    <rect x="260" y="240" width="180" height="80" fill="#fff8e1" stroke="#fbc02d" stroke-width="2" rx="8"></rect>
    <text x="350" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#f57c00">ML Forecaster</text>
    <text x="350" y="285" text-anchor="middle" font-size="10" fill="#f57c00">• Prophet + ETS models</text>
    <text x="350" y="300" text-anchor="middle" font-size="10" fill="#f57c00">• XGBoost ensemble</text>
    <text x="350" y="315" text-anchor="middle" font-size="10" fill="#f57c00">• Hierarchical reconciliation</text>
    
    <!-- Risk Engine -->
    <rect x="470" y="240" width="180" height="80" fill="#fce4ec" stroke="#e91e63" stroke-width="2" rx="8"></rect>
    <text x="560" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#ad1457">Risk Engine</text>
    <text x="560" y="285" text-anchor="middle" font-size="10" fill="#ad1457">• Capacity Error Budget</text>
    <text x="560" y="300" text-anchor="middle" font-size="10" fill="#ad1457">• Saturation probability</text>
    <text x="560" y="315" text-anchor="middle" font-size="10" fill="#ad1457">• Quantile analysis</text>
    
    <!-- Action Planner -->
    <rect x="50" y="350" width="220" height="80" fill="#e0f2f1" stroke="#00695c" stroke-width="2" rx="8"></rect>
    <text x="160" y="375" text-anchor="middle" font-size="12" font-weight="bold" fill="#004d40">Action Planner</text>
    <text x="160" y="395" text-anchor="middle" font-size="10" fill="#004d40">• Node pool reservations</text>
    <text x="160" y="410" text-anchor="middle" font-size="10" fill="#004d40">• Storage provisioning</text>
    <text x="160" y="425" text-anchor="middle" font-size="10" fill="#004d40">• Network bandwidth quota</text>
    
    <!-- Approval Workflow -->
    <rect x="300" y="350" width="180" height="80" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2" rx="8"></rect>
    <text x="390" y="375" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a237e">Approval System</text>
    <text x="390" y="395" text-anchor="middle" font-size="10" fill="#1a237e">• Change governance</text>
    <text x="390" y="410" text-anchor="middle" font-size="10" fill="#1a237e">• Budget validation</text>
    <text x="390" y="425" text-anchor="middle" font-size="10" fill="#1a237e">• Risk assessment</text>
    
    <!-- Feedback Loop -->
    <rect x="510" y="350" width="140" height="80" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="8"></rect>
    <text x="580" y="375" text-anchor="middle" font-size="12" font-weight="bold" fill="#6a1b9a">Feedback Loop</text>
    <text x="580" y="395" text-anchor="middle" font-size="10" fill="#6a1b9a">• Actual vs forecast</text>
    <text x="580" y="410" text-anchor="middle" font-size="10" fill="#6a1b9a">• Model retraining</text>
    <text x="580" y="425" text-anchor="middle" font-size="10" fill="#6a1b9a">• Accuracy tracking</text>
    
    <!-- Regional Deployment -->
    <rect x="50" y="460" width="140" height="60" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="4"></rect>
    <text x="120" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d32">LTX1 Planning</text>
    <text x="120" y="495" text-anchor="middle" font-size="9" fill="#2e7d32">40% of global</text>
    <text x="120" y="510" text-anchor="middle" font-size="9" fill="#2e7d32">Primary region</text>
    
    <rect x="210" y="460" width="140" height="60" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="4"></rect>
    <text x="280" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d32">LVA1 Planning</text>
    <text x="280" y="495" text-anchor="middle" font-size="9" fill="#2e7d32">35% of global</text>
    <text x="280" y="510" text-anchor="middle" font-size="9" fill="#2e7d32">Secondary region</text>
    
    <rect x="370" y="460" width="140" height="60" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="4"></rect>
    <text x="440" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d32">EI4 Planning</text>
    <text x="440" y="495" text-anchor="middle" font-size="9" fill="#2e7d32">15% of global</text>
    <text x="440" y="510" text-anchor="middle" font-size="9" fill="#2e7d32">Dev/test region</text>
    
    <rect x="530" y="460" width="140" height="60" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="4"></rect>
    <text x="600" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d32">Grid2 Planning</text>
    <text x="600" y="495" text-anchor="middle" font-size="9" fill="#2e7d32">10% of global</text>
    <text x="600" y="510" text-anchor="middle" font-size="9" fill="#2e7d32">DR region</text>
    
    <!-- API & UI Layer -->
    <rect x="50" y="550" width="620" height="50" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="8"></rect>
    <text x="360" y="570" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">Planner API &amp; Dashboard UI</text>
    <text x="360" y="590" text-anchor="middle" font-size="10" fill="#0d47a1">REST APIs • GraphQL queries • Real-time dashboards • Capacity burn-down charts • Forecast accuracy reports</text>
    
    <!-- Arrows -->
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#666"></polygon>
      </marker>
    </defs>
    
    <!-- Data flow -->
    <line x1="320" y1="120" x2="320" y2="150" stroke="#666" stroke-width="3" marker-end="url(#arrow)"></line>
    <line x1="140" y1="210" x2="140" y2="240" stroke="#666" stroke-width="2" marker-end="url(#arrow)"></line>
    <line x1="350" y1="210" x2="350" y2="240" stroke="#666" stroke-width="2" marker-end="url(#arrow)"></line>
    <line x1="560" y1="210" x2="560" y2="240" stroke="#666" stroke-width="2" marker-end="url(#arrow)"></line>
    
    <!-- Planning flow -->
    <line x1="230" y1="280" x2="260" y2="280" stroke="#666" stroke-width="2" marker-end="url(#arrow)"></line>
    <line x1="440" y1="280" x2="470" y2="280" stroke="#666" stroke-width="2" marker-end="url(#arrow)"></line>
    <line x1="160" y1="320" x2="160" y2="350" stroke="#666" stroke-width="2" marker-end="url(#arrow)"></line>
    <line x1="390" y1="320" x2="390" y2="350" stroke="#666" stroke-width="2" marker-end="url(#arrow)"></line>
    <line x1="580" y1="320" x2="580" y2="350" stroke="#666" stroke-width="2" marker-end="url(#arrow)"></line>
    
    <!-- Regional deployment -->
    <line x1="320" y1="430" x2="320" y2="460" stroke="#4caf50" stroke-width="2" marker-end="url(#arrow)"></line>
    
    <!-- API access -->
    <line x1="360" y1="530" x2="360" y2="550" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"></line>
    
    <!-- Feedback loop -->
    <line x1="580" y1="430" x2="350" y2="240" stroke="#9c27b0" stroke-width="2" stroke-dasharray="5,5"></line>
    
    <!-- Labels -->
    <text x="340" y="135" font-size="9" fill="#666">ingest</text>
    <text x="195" y="275" font-size="9" fill="#666">features</text>
    <text x="455" y="275" font-size="9" fill="#666">risk</text>
    <text x="340" y="445" font-size="9" fill="#4caf50">deploy</text>
    <text x="380" y="535" font-size="9" fill="#1976d2">serve</text>
    <text x="460" y="340" font-size="9" fill="#9c27b0">learn</text>
  </svg>
