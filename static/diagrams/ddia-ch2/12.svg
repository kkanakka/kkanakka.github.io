<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" style="max-width:750px;">
      <defs>
        <marker id="arr5" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#546e7a"></polygon>
        </marker>
      </defs>

      <!-- Multiple members -->
      <rect x="30" y="20" width="150" height="40" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"></rect>
      <text x="105" y="45" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#0d47a1">Satya (regionId:91)</text>
      <rect x="30" y="70" width="150" height="40" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"></rect>
      <text x="105" y="95" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#0d47a1">Amy (regionId:91)</text>
      <rect x="30" y="120" width="150" height="40" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"></rect>
      <text x="105" y="145" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#0d47a1">Kevin (regionId:91)</text>
      <rect x="30" y="170" width="150" height="40" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"></rect>
      <text x="105" y="195" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#0d47a1">Priya (regionId:42)</text>

      <!-- Arrows to shared entity -->
      <line x1="180" y1="40" x2="310" y2="75" stroke="#546e7a" stroke-width="1.2" marker-end="url(#arr5)"></line>
      <line x1="180" y1="90" x2="310" y2="80" stroke="#546e7a" stroke-width="1.2" marker-end="url(#arr5)"></line>
      <line x1="180" y1="140" x2="310" y2="85" stroke="#546e7a" stroke-width="1.2" marker-end="url(#arr5)"></line>
      <line x1="180" y1="190" x2="310" y2="155" stroke="#546e7a" stroke-width="1.2" marker-end="url(#arr5)"></line>

      <text x="240" y="55" font-family="Inter,sans-serif" font-weight="600" font-size="10" fill="#c62828">N : 1</text>

      <!-- Shared entities -->
      <rect x="310" y="55" width="180" height="50" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"></rect>
      <text x="400" y="78" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="12" fill="#1b5e20">Bay Area</text>
      <text x="400" y="95" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#787774">region_id: 91</text>

      <rect x="310" y="130" width="180" height="50" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"></rect>
      <text x="400" y="153" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="12" fill="#bf360c">Bangalore</text>
      <text x="400" y="170" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#787774">region_id: 42</text>

      <!-- Why normalize -->
      <rect x="540" y="40" width="240" height="150" rx="10" fill="#f7f6f3" stroke="#e3e2de" stroke-width="1"></rect>
      <text x="660" y="65" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="12" fill="#00695c">Why use IDs, not strings?</text>
      <text x="555" y="88" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Update name in one place</text>
      <text x="555" y="106" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Consistent spelling</text>
      <text x="555" y="124" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Localization (i18n)</text>
      <text x="555" y="142" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Better search (semantic)</text>
      <text x="555" y="164" font-family="Inter,sans-serif" font-weight="600" font-size="10" fill="#c62828">= Normalization</text>
      <text x="555" y="180" font-family="Inter,sans-serif" font-size="10" fill="#37352f">Removes duplication → needs JOINs</text>
    </svg>
