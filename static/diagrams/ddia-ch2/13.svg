<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" style="max-width:780px;">
      <defs>
        <marker id="arr6" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#546e7a"></polygon>
        </marker>
      </defs>

      <text x="400" y="25" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="14" fill="#00695c">Many-to-Many: Members ↔ Skills (with Endorsements)</text>

      <!-- Members -->
      <rect x="30" y="60" width="140" height="40" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"></rect>
      <text x="100" y="85" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#0d47a1">Satya</text>
      <rect x="30" y="120" width="140" height="40" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"></rect>
      <text x="100" y="145" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#0d47a1">Amy</text>
      <rect x="30" y="180" width="140" height="40" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"></rect>
      <text x="100" y="205" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#0d47a1">Kevin</text>

      <!-- Skills -->
      <rect x="350" y="60" width="140" height="40" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"></rect>
      <text x="420" y="85" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#1b5e20">Cloud</text>
      <rect x="350" y="120" width="140" height="40" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"></rect>
      <text x="420" y="145" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#1b5e20">AI / ML</text>
      <rect x="350" y="180" width="140" height="40" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"></rect>
      <text x="420" y="205" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#1b5e20">Java</text>

      <!-- Cross connections (many-to-many) -->
      <line x1="170" y1="75" x2="350" y2="75" stroke="#1565c0" stroke-width="1.2" marker-end="url(#arr6)"></line>
      <line x1="170" y1="80" x2="350" y2="135" stroke="#1565c0" stroke-width="1" marker-end="url(#arr6)"></line>
      <line x1="170" y1="135" x2="350" y2="80" stroke="#e65100" stroke-width="1" marker-end="url(#arr6)"></line>
      <line x1="170" y1="140" x2="350" y2="140" stroke="#e65100" stroke-width="1.2" marker-end="url(#arr6)"></line>
      <line x1="170" y1="145" x2="350" y2="195" stroke="#e65100" stroke-width="1" marker-end="url(#arr6)"></line>
      <line x1="170" y1="200" x2="350" y2="195" stroke="#6a1b9a" stroke-width="1.2" marker-end="url(#arr6)"></line>
      <line x1="170" y1="195" x2="350" y2="140" stroke="#6a1b9a" stroke-width="1" marker-end="url(#arr6)"></line>

      <text x="260" y="55" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="10" fill="#c62828">N : M</text>

      <!-- How to model in each system -->
      <rect x="540" y="50" width="240" height="75" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"></rect>
      <text x="660" y="72" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="11" fill="#0d47a1">Relational / Espresso</text>
      <text x="555" y="90" font-family="JetBrains Mono,monospace" font-size="9" fill="#37352f">endorsements(member_id,</text>
      <text x="555" y="103" font-family="JetBrains Mono,monospace" font-size="9" fill="#37352f">  skill_id, endorser_id)</text>
      <text x="555" y="118" font-family="Inter,sans-serif" font-size="9" fill="#787774">Junction table with FKs</text>

      <rect x="540" y="135" width="240" height="60" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1"></rect>
      <text x="660" y="157" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="11" fill="#4a148c">Graph / Liquid</text>
      <text x="555" y="175" font-family="JetBrains Mono,monospace" font-size="9" fill="#37352f">(Satya)--[HAS_SKILL]--&gt;(Cloud)</text>
      <text x="555" y="188" font-family="Inter,sans-serif" font-size="9" fill="#787774">Edges with properties</text>

      <rect x="540" y="205" width="240" height="60" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="1"></rect>
      <text x="660" y="227" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="11" fill="#c62828">Document (anti-pattern!)</text>
      <text x="555" y="245" font-family="Inter,sans-serif" font-size="9" fill="#37352f">Denormalize → duplicated data</text>
      <text x="555" y="258" font-family="Inter,sans-serif" font-size="9" fill="#c62828">Updates become inconsistent</text>

      <!-- Summary bar -->
      <rect x="30" y="270" width="460" height="40" rx="8" fill="#f7f6f3" stroke="#e3e2de" stroke-width="1"></rect>
      <text x="260" y="295" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="11" fill="#00695c">Rule: As data becomes more interconnected, move from Document → Relational → Graph</text>
    </svg>
