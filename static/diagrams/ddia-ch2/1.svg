<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" style="max-width:750px;">
      <defs>
        <marker id="arr1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#546e7a"></polygon>
        </marker>
        <filter id="sh1" x="-3%" y="-3%" width="106%" height="110%">
          <fedropshadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"></fedropshadow>
        </filter>
      </defs>

      <!-- Layer 4: Application -->
      <rect x="150" y="15" width="500" height="60" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" filter="url(#sh1)"></rect>
      <text x="400" y="38" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="13" fill="#1b5e20">Layer 4: Application Developer</text>
      <text x="400" y="58" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#546e7a">Real world → objects, data structures, APIs</text>
      <text x="20" y="50" font-family="Inter,sans-serif" font-size="11" fill="#787774">People, orgs,</text>
      <text x="20" y="65" font-family="Inter,sans-serif" font-size="11" fill="#787774">goods, actions</text>

      <line x1="400" y1="75" x2="400" y2="95" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arr1)"></line>

      <!-- Layer 3: Data Model -->
      <rect x="150" y="95" width="500" height="60" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#sh1)"></rect>
      <text x="400" y="118" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="13" fill="#0d47a1">Layer 3: Data Model</text>
      <text x="400" y="138" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#546e7a">JSON, tables, documents, graphs, columns</text>
      <text x="20" y="130" font-family="Inter,sans-serif" font-size="11" fill="#787774">This chapter!</text>

      <line x1="400" y1="155" x2="400" y2="175" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arr1)"></line>

      <!-- Layer 2: Storage Engine -->
      <rect x="150" y="175" width="500" height="60" rx="12" fill="#fff3e0" stroke="#e65100" stroke-width="2" filter="url(#sh1)"></rect>
      <text x="400" y="198" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="13" fill="#bf360c">Layer 2: Storage Engine</text>
      <text x="400" y="218" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#546e7a">Bytes in memory, on disk, on network (B-trees, LSM, SSTable)</text>
      <text x="20" y="210" font-family="Inter,sans-serif" font-size="11" fill="#787774">Chapter 3</text>

      <line x1="400" y1="235" x2="400" y2="255" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arr1)"></line>

      <!-- Layer 1: Hardware -->
      <rect x="150" y="255" width="500" height="60" rx="12" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2" filter="url(#sh1)"></rect>
      <text x="400" y="278" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="13" fill="#4a148c">Layer 1: Hardware</text>
      <text x="400" y="298" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#546e7a">Electrical currents, magnetic fields, photons</text>
    </svg>
