<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg"><style>.d-box{fill: var(--bg-subtle); stroke: var(--border); stroke-width: 1;}
.d-box-accent{fill: #ddf4ff; stroke: var(--accent); stroke-width: 1;}
.d-box-cool{fill: #f0f7ff; stroke: #0969da; stroke-width: 1;}
.d-box-warn{fill: #fff8e6; stroke: var(--attention); stroke-width: 1;}
.d-box-success{fill: #dafbe1; stroke: var(--success); stroke-width: 1;}
.d-text{font-family: var(--sans); font-size: 13px; font-weight: 600; fill: var(--fg);}
.d-text-sm{font-family: var(--sans); font-size: 11px; fill: var(--fg-muted);}
.d-text-accent{font-family: var(--mono); font-size: 11px; fill: var(--accent); letter-spacing: 0.06em; font-weight: 600;}
.d-arrow{stroke: var(--fg-muted); stroke-width: 1.2; fill: none;}
.d-arrow-accent{stroke: var(--accent); stroke-width: 1.2; fill: none;}
.d-divider{stroke: var(--border); stroke-width: 0.5; stroke-dasharray: 3 4;}</style>
      <defs>
        <marker id="arr1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L9 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
        </marker>
      </defs>
      <rect x="280" y="20" width="240" height="50" rx="6" class="d-box"></rect>
      <text class="d-text" x="400" y="42" text-anchor="middle">Pod spec</text>
      <text class="d-text-sm" x="400" y="60" text-anchor="middle">limits: nvidia.com/gpu: 1</text>
      <line x1="400" y1="70" x2="400" y2="98" class="d-arrow" marker-end="url(#arr1)"></line>
      <rect x="140" y="100" width="520" height="74" rx="8" class="d-box-accent"></rect>
      <text class="d-text-accent" x="400" y="122" text-anchor="middle">KUBELET — THE COORDINATOR</text>
      <text class="d-text-sm" x="400" y="145" text-anchor="middle">Allocates advertised resources. Injects env, mounts, devices.</text>
      <text class="d-text-sm" x="400" y="161" text-anchor="middle">Does not understand SMs, HBM, CUDA contexts, or MIG slices.</text>
      <line x1="240" y1="174" x2="160" y2="218" class="d-arrow" marker-end="url(#arr1)"></line>
      <line x1="400" y1="174" x2="400" y2="218" class="d-arrow" marker-end="url(#arr1)"></line>
      <line x1="560" y1="174" x2="640" y2="218" class="d-arrow" marker-end="url(#arr1)"></line>
      <rect x="40" y="220" width="240" height="64" rx="6" class="d-box-cool"></rect>
      <text class="d-text" x="160" y="242" text-anchor="middle">Device plugin / DRA</text>
      <text class="d-text-sm" x="160" y="260" text-anchor="middle">Advertises resources</text>
      <text class="d-text-sm" x="160" y="274" text-anchor="middle">Returns IDs, env, mounts</text>
      <rect x="300" y="220" width="200" height="64" rx="6" class="d-box-cool"></rect>
      <text class="d-text" x="400" y="242" text-anchor="middle">Container runtime</text>
      <text class="d-text-sm" x="400" y="260" text-anchor="middle">containerd / CRI-O</text>
      <text class="d-text-sm" x="400" y="274" text-anchor="middle">Starts the container</text>
      <rect x="520" y="220" width="240" height="64" rx="6" class="d-box-cool"></rect>
      <text class="d-text" x="640" y="242" text-anchor="middle">cgroups devices</text>
      <text class="d-text-sm" x="640" y="260" text-anchor="middle">Gates /dev/nvidia*</text>
      <text class="d-text-sm" x="640" y="274" text-anchor="middle">No memory / SM limits</text>
      <line x1="160" y1="284" x2="280" y2="328" class="d-arrow" marker-end="url(#arr1)"></line>
      <line x1="400" y1="284" x2="400" y2="328" class="d-arrow" marker-end="url(#arr1)"></line>
      <line x1="640" y1="284" x2="520" y2="328" class="d-arrow" marker-end="url(#arr1)"></line>
      <rect x="80" y="330" width="640" height="100" rx="8" class="d-box-warn"></rect>
      <text class="d-text-accent" x="400" y="352" text-anchor="middle" style="fill: var(--attention);">VENDOR STACK — WHERE SLICING ACTUALLY HAPPENS</text>
      <text class="d-text-sm" x="400" y="372" text-anchor="middle">NVIDIA driver · Container Toolkit · CUDA runtime · MIG · MPS · time-slicing</text>
      <line x1="180" y1="395" x2="620" y2="395" class="d-divider"></line>
      <text class="d-text-sm" x="400" y="414" text-anchor="middle">This layer decides how the GPU is actually carved up or shared.</text>
      <line x1="400" y1="430" x2="400" y2="450" class="d-arrow" marker-end="url(#arr1)"></line>
      <text class="d-text" x="400" y="472" text-anchor="middle" style="fill: var(--accent);">Physical GPU</text>
    </svg>
