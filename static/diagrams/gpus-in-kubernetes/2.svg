<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 540" xmlns="http://www.w3.org/2000/svg"><style>.d-box{fill: var(--bg-subtle); stroke: var(--border); stroke-width: 1;}
.d-box-accent{fill: #ddf4ff; stroke: var(--accent); stroke-width: 1;}
.d-box-cool{fill: #f0f7ff; stroke: #0969da; stroke-width: 1;}
.d-box-warn{fill: #fff8e6; stroke: var(--attention); stroke-width: 1;}
.d-box-success{fill: #dafbe1; stroke: var(--success); stroke-width: 1;}
.d-text{font-family: var(--sans); font-size: 13px; font-weight: 600; fill: var(--fg);}
.d-text-sm{font-family: var(--sans); font-size: 11px; fill: var(--fg-muted);}
.d-text-accent{font-family: var(--mono); font-size: 11px; fill: var(--accent); letter-spacing: 0.06em; font-weight: 600;}
.d-arrow{stroke: var(--fg-muted); stroke-width: 1.2; fill: none;}
.d-arrow-accent{stroke: var(--accent); stroke-width: 1.2; fill: none;}</style>
      <defs>
        <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L9 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
        </marker>
      </defs>
      <text class="d-text-accent" x="200" y="25" text-anchor="middle">STANDARD CNI</text>
      <text class="d-text-accent" x="600" y="25" text-anchor="middle" style="fill: var(--success);">GPU-AWARE CNI</text>
      <rect x="60" y="50" width="280" height="50" rx="6" class="d-box"></rect>
      <text class="d-text" x="200" y="72" text-anchor="middle">Pod — eth0 only</text>
      <text class="d-text-sm" x="200" y="90" text-anchor="middle">Default CNI (Calico/Cilium/Flannel)</text>
      <line x1="200" y1="100" x2="200" y2="128" class="d-arrow" marker-end="url(#arr2)"></line>
      <rect x="60" y="130" width="280" height="50" rx="6" class="d-box-warn"></rect>
      <text class="d-text" x="200" y="152" text-anchor="middle">Kernel TCP/IP stack</text>
      <text class="d-text-sm" x="200" y="170" text-anchor="middle">iptables · conntrack · sockets</text>
      <line x1="200" y1="180" x2="200" y2="208" class="d-arrow" marker-end="url(#arr2)"></line>
      <rect x="60" y="210" width="280" height="50" rx="6" class="d-box-warn"></rect>
      <text class="d-text" x="200" y="232" text-anchor="middle">Host memory copy</text>
      <text class="d-text-sm" x="200" y="250" text-anchor="middle">GPU mem → RAM → NIC</text>
      <line x1="200" y1="260" x2="200" y2="288" class="d-arrow" marker-end="url(#arr2)"></line>
      <rect x="60" y="290" width="280" height="50" rx="6" class="d-box"></rect>
      <text class="d-text" x="200" y="312" text-anchor="middle">NIC — standard Ethernet</text>
      <text class="d-text-sm" x="200" y="330" text-anchor="middle">Sockets API · per-packet copies</text>
      <rect x="60" y="370" width="280" height="70" rx="6" class="d-box-warn"></rect>
      <text class="d-text-accent" x="200" y="392" text-anchor="middle" style="fill: var(--attention);">COST</text>
      <text class="d-text-sm" x="200" y="410" text-anchor="middle">Multiple memory copies</text>
      <text class="d-text-sm" x="200" y="426" text-anchor="middle">Millisecond latency · CPU bound</text>
      <rect x="460" y="50" width="280" height="50" rx="6" class="d-box"></rect>
      <text class="d-text" x="600" y="72" text-anchor="middle">Pod — eth0 + net1</text>
      <text class="d-text-sm" x="600" y="90" text-anchor="middle">Multus attaches secondary iface</text>
      <line x1="600" y1="100" x2="600" y2="128" class="d-arrow-accent" marker-end="url(#arr2)"></line>
      <rect x="460" y="130" width="280" height="50" rx="6" class="d-box-success"></rect>
      <text class="d-text" x="600" y="152" text-anchor="middle">SR-IOV / RDMA CNI</text>
      <text class="d-text-sm" x="600" y="170" text-anchor="middle">VF attached directly to pod</text>
      <line x1="600" y1="180" x2="600" y2="208" class="d-arrow-accent" marker-end="url(#arr2)"></line>
      <rect x="460" y="210" width="280" height="50" rx="6" class="d-box-success"></rect>
      <text class="d-text" x="600" y="232" text-anchor="middle">GPUDirect RDMA</text>
      <text class="d-text-sm" x="600" y="250" text-anchor="middle">GPU mem → NIC, no host copy</text>
      <line x1="600" y1="260" x2="600" y2="288" class="d-arrow-accent" marker-end="url(#arr2)"></line>
      <rect x="460" y="290" width="280" height="50" rx="6" class="d-box"></rect>
      <text class="d-text" x="600" y="312" text-anchor="middle">RoCE NIC — ConnectX</text>
      <text class="d-text-sm" x="600" y="330" text-anchor="middle">Verbs API · kernel bypass</text>
      <rect x="460" y="370" width="280" height="70" rx="6" class="d-box-success"></rect>
      <text class="d-text-accent" x="600" y="392" text-anchor="middle" style="fill: var(--success);">PAYOFF</text>
      <text class="d-text-sm" x="600" y="410" text-anchor="middle">Zero-copy GPU-to-GPU</text>
      <text class="d-text-sm" x="600" y="426" text-anchor="middle">Microsecond latency · CPU free</text>
      <rect x="60" y="465" width="680" height="60" rx="6" class="d-box-accent"></rect>
      <text class="d-text-accent" x="400" y="488" text-anchor="middle">PHYSICAL FABRIC — RoCE or InfiniBand</text>
      <text class="d-text-sm" x="400" y="510" text-anchor="middle">Node-to-node GPU-to-GPU at line rate · NCCL all-reduce sits here</text>
    </svg>
