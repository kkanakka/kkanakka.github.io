<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg"><style>.sb{fill:var(--bg-subtle);stroke:var(--border);stroke-width:1}
.sb-b{fill:#ddf4ff;stroke:var(--accent);stroke-width:1}
.sb-g{fill:#dafbe1;stroke:var(--success);stroke-width:1}
.sb-r{fill:#ffebe9;stroke:var(--danger);stroke-width:1}
.sb-y{fill:#fff8e6;stroke:var(--attention);stroke-width:1}
.sb-p{fill:#fbefff;stroke:var(--done);stroke-width:1}
.sb-o{fill:#fff1e5;stroke:var(--orange);stroke-width:1}
.sl{font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--fg)}
.ss{font-family:var(--mono);font-size:10px;fill:var(--fg-muted)}</style>
      <text class="sl" x="20" y="18" fill="var(--danger)">Forward index (Espresso) — scan all rows</text>
      <rect class="sb" x="20" y="28" width="360" height="75" rx="6"></rect>
      <text class="ss" x="34" y="46">event_1 → “Taylor Swift Eras Tour at MetLife”</text>
      <text class="ss" x="34" y="60">event_2 → “Coldplay World Tour at SoFi”</text>
      <text class="ss" x="34" y="74">event_3 → “Taylor Mac at Carnegie Hall”</text>
      <text class="ss" x="34" y="92" fill="var(--danger)">search “Taylor”: must scan ALL rows</text>

      <text class="sl" x="420" y="18" fill="var(--success)">Inverted index (Galene) — O(1) lookup</text>
      <rect class="sb-g" x="420" y="28" width="360" height="75" rx="6"></rect>
      <text class="ss" x="434" y="46">“taylor”     → [event_1, event_3]</text>
      <text class="ss" x="434" y="60">“swift”      → [event_1]</text>
      <text class="ss" x="434" y="74">“coldplay”   → [event_2]</text>
      <text class="ss" x="434" y="92" fill="var(--success)">search “taylor”: instant lookup</text>

      <rect class="sb-b" x="20" y="120" width="760" height="65" rx="6"></rect>
      <text class="sl" x="34" y="140">Galene adds on top of Lucene:</text>
      <text class="ss" x="34" y="156">Tokenization (Taylor’s → [“taylor”]) · Stemming (“running” matches “run”)</text>
      <text class="ss" x="34" y="170">Fuzzy matching (typo “Taylr” still finds “Taylor”) · Geo queries, date range filters</text>
    </svg>
