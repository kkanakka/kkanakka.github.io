<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg"><style>.sb{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1}
.sb-b{fill:#ddf4ff;stroke:#0969da;stroke-width:1}
.sb-g{fill:#dafbe1;stroke:#1a7f37;stroke-width:1}
.sb-r{fill:#ffebe9;stroke:#d1242f;stroke-width:1}
.sb-y{fill:#fff8e6;stroke:#9a6700;stroke-width:1}
.sb-p{fill:#fbefff;stroke:#8250df;stroke-width:1}
.sb-o{fill:#fff1e5;stroke:#bc4c00;stroke-width:1}
.sl{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;fill:#1f2328}
.ss{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:10px;fill:#59636e}
.sn{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-weight:700;font-size:11px;fill:#0969da}
.sa{stroke:#59636e;stroke-width:1.2;fill:none}
.sa-b{stroke:#0969da;stroke-width:1.5;fill:none}
.sa-g{stroke:#1a7f37;stroke-width:1.5;fill:none}
.sa-r{stroke:#d1242f;stroke-width:1.5;fill:none}
.sa-p{stroke:#8250df;stroke-width:1.5;fill:none}</style>
      <rect class="sb-g" x="20" y="20" width="150" height="50" rx="6"></rect><text class="sl" x="95" y="42" text-anchor="middle">Espresso</text><text class="ss" x="95" y="56" text-anchor="middle">source of truth</text>
      <rect class="sb-y" x="210" y="20" width="150" height="50" rx="6"></rect><text class="sl" x="285" y="42" text-anchor="middle">CDC (Brooklin)</text><text class="ss" x="285" y="56" text-anchor="middle">reads change log</text>
      <rect class="sb-p" x="400" y="20" width="150" height="50" rx="6"></rect><text class="sl" x="475" y="42" text-anchor="middle">Kafka</text><text class="ss" x="475" y="56" text-anchor="middle">event change topic</text>
      <rect class="sb-b" x="590" y="20" width="150" height="50" rx="6"></rect><text class="sl" x="665" y="42" text-anchor="middle">Galene</text><text class="ss" x="665" y="56" text-anchor="middle">indexes events</text>

      <path class="sa" d="M170,45 L208,45" marker-end="url(#a1)"></path><text class="sn" x="189" y="38">1</text>
      <path class="sa-p" d="M360,45 L398,45" marker-end="url(#a1)"></path><text class="sn" x="379" y="38">2</text>
      <path class="sa" d="M550,45 L588,45" marker-end="url(#a1)"></path><text class="sn" x="569" y="38">3</text>

      <rect class="sb" x="20" y="90" width="720" height="45" rx="6"></rect>
      <text class="ss" x="380" y="108" text-anchor="middle">1. Admin updates event in Espresso. 2. Brooklin (LinkedIn CDC) captures change, publishes to Kafka.</text>
      <text class="ss" x="380" y="124" text-anchor="middle">3. Galene indexer consumer reads from Kafka, updates inverted index. Search results stay fresh.</text>
    </svg>
