<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 290" xmlns="http://www.w3.org/2000/svg"><style>.sb{fill:var(--bg-subtle);stroke:var(--border);stroke-width:1}
.sb-b{fill:#ddf4ff;stroke:var(--accent);stroke-width:1}
.sb-g{fill:#dafbe1;stroke:var(--success);stroke-width:1}
.sb-r{fill:#ffebe9;stroke:var(--danger);stroke-width:1}
.sb-y{fill:#fff8e6;stroke:var(--attention);stroke-width:1}
.sb-p{fill:#fbefff;stroke:var(--done);stroke-width:1}
.sb-o{fill:#fff1e5;stroke:var(--orange);stroke-width:1}
.sl{font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--fg)}
.ss{font-family:var(--mono);font-size:10px;fill:var(--fg-muted)}
.sa{stroke:var(--fg-muted);stroke-width:1.2;fill:none}
.sa-b{stroke:var(--accent);stroke-width:1.5;fill:none}
.sa-g{stroke:var(--success);stroke-width:1.5;fill:none}
.sa-r{stroke:var(--danger);stroke-width:1.5;fill:none}
.sa-p{stroke:var(--done);stroke-width:1.5;fill:none}</style>
      <rect class="sb" x="20" y="20" width="160" height="90" rx="6"></rect>
      <text class="sl" x="100" y="40" text-anchor="middle">User</text>
      <line x1="34" y1="48" x2="166" y2="48" stroke="var(--border-muted)"></line>
      <text class="ss" x="34" y="64">id, email, name</text>
      <text class="ss" x="34" y="78">created_at</text>

      <rect class="sb-p" x="220" y="20" width="180" height="90" rx="6"></rect>
      <text class="sl" x="310" y="40" text-anchor="middle">Event</text>
      <line x1="234" y1="48" x2="386" y2="48" stroke="var(--border-muted)"></line>
      <text class="ss" x="234" y="64">id, name, description</text>
      <text class="ss" x="234" y="78">date, venue_id</text>
      <text class="ss" x="234" y="92">performer_id, type</text>

      <rect class="sb-b" x="440" y="20" width="150" height="90" rx="6"></rect>
      <text class="sl" x="515" y="40" text-anchor="middle">Performer</text>
      <line x1="454" y1="48" x2="576" y2="48" stroke="var(--border-muted)"></line>
      <text class="ss" x="454" y="64">id, name</text>
      <text class="ss" x="454" y="78">bio, image_url</text>

      <rect class="sb-y" x="620" y="20" width="150" height="90" rx="6"></rect>
      <text class="sl" x="695" y="40" text-anchor="middle">Venue</text>
      <line x1="634" y1="48" x2="756" y2="48" stroke="var(--border-muted)"></line>
      <text class="ss" x="634" y="64">id, name, address</text>
      <text class="ss" x="634" y="78">capacity, seat_map</text>

      <rect class="sb-g" x="220" y="155" width="180" height="110" rx="6"></rect>
      <text class="sl" x="310" y="175" text-anchor="middle">Ticket</text>
      <line x1="234" y1="183" x2="386" y2="183" stroke="var(--border-muted)"></line>
      <text class="ss" x="234" y="199">id, event_id</text>
      <text class="ss" x="234" y="213">section, row, seat</text>
      <text class="ss" x="234" y="227">price, status</text>
      <text class="ss" x="234" y="245" fill="var(--success)">(available | booked)</text>

      <rect class="sb-r" x="440" y="155" width="180" height="110" rx="6"></rect>
      <text class="sl" x="530" y="175" text-anchor="middle">Booking</text>
      <line x1="454" y1="183" x2="606" y2="183" stroke="var(--border-muted)"></line>
      <text class="ss" x="454" y="199">id, user_id</text>
      <text class="ss" x="454" y="213">ticket_ids[]</text>
      <text class="ss" x="454" y="227">total_price, status</text>
      <text class="ss" x="454" y="245" fill="var(--danger)">(in-progress | confirmed)</text>

      <path class="sa" d="M400,65 L438,65" marker-end="url(#a1)"></path><text class="ss" x="419" y="58" text-anchor="middle">by</text>
      <path class="sa" d="M400,85 L618,85" marker-end="url(#a1)"></path><text class="ss" x="510" y="78" text-anchor="middle">at</text>
      <path class="sa" d="M310,110 L310,153" marker-end="url(#a1)"></path><text class="ss" x="320" y="138">has</text>
      <path class="sa" d="M400,210 L438,210" marker-end="url(#a1)"></path><text class="ss" x="419" y="204" text-anchor="middle">in</text>
      <path class="sa" d="M100,110 L500,153" marker-end="url(#a1)"></path><text class="ss" x="285" y="140" text-anchor="middle">books</text>
    </svg>
