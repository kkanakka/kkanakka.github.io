<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg"><style>.sb{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1}
.sb-b{fill:#ddf4ff;stroke:#0969da;stroke-width:1}
.sb-g{fill:#dafbe1;stroke:#1a7f37;stroke-width:1}
.sb-r{fill:#ffebe9;stroke:#d1242f;stroke-width:1}
.sb-y{fill:#fff8e6;stroke:#9a6700;stroke-width:1}
.sb-p{fill:#fbefff;stroke:#8250df;stroke-width:1}
.sb-o{fill:#fff1e5;stroke:#bc4c00;stroke-width:1}
.sl{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;fill:#1f2328}
.ss{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:10px;fill:#59636e}
.sn{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-weight:700;font-size:11px;fill:#0969da}
.sa-b{stroke:#0969da;stroke-width:1.5;fill:none}</style>
      <defs><marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#0969da"></path></marker></defs>
      <rect class="sb" x="20" y="30" width="120" height="50" rx="6"></rect><text class="sl" x="80" y="52" text-anchor="middle">Client</text><text class="ss" x="80" y="66" text-anchor="middle">web / mobile</text>
      <rect class="sb-y" x="170" y="30" width="140" height="50" rx="6"></rect><text class="sl" x="240" y="52" text-anchor="middle">API Gateway (d2)</text><text class="ss" x="240" y="66" text-anchor="middle">auth, rate limit</text>
      <rect class="sb-b" x="340" y="30" width="160" height="50" rx="6"></rect><text class="sl" x="420" y="52" text-anchor="middle">Event Service</text><text class="ss" x="420" y="66" text-anchor="middle">fetch details</text>
      <rect class="sb-g" x="530" y="30" width="140" height="50" rx="6"></rect><text class="sl" x="600" y="52" text-anchor="middle">Espresso</text><text class="ss" x="600" y="66" text-anchor="middle">events + tickets</text>

      <path class="sa-b" d="M140,55 L168,55" marker-end="url(#ab)"></path><text class="sn" x="154" y="48">1</text>
      <path class="sa-b" d="M310,55 L338,55" marker-end="url(#ab)"></path><text class="sn" x="324" y="48">2</text>
      <path class="sa-b" d="M500,55 L528,55" marker-end="url(#ab)"></path><text class="sn" x="514" y="48">3</text>

      <text class="ss" x="400" y="110" text-anchor="middle">Returns: event + venue + performer + tickets[] → client renders seat map</text>
      <text class="ss" x="400" y="125" text-anchor="middle">Ticket statuses overlaid on venue’s seat_map JSON to show available/booked</text>
    </svg>
