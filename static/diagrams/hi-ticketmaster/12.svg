<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 180" xmlns="http://www.w3.org/2000/svg"><style>.sb{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1}
.sb-b{fill:#ddf4ff;stroke:#0969da;stroke-width:1}
.sb-g{fill:#dafbe1;stroke:#1a7f37;stroke-width:1}
.sb-r{fill:#ffebe9;stroke:#d1242f;stroke-width:1}
.sb-y{fill:#fff8e6;stroke:#9a6700;stroke-width:1}
.sb-p{fill:#fbefff;stroke:#8250df;stroke-width:1}
.sb-o{fill:#fff1e5;stroke:#bc4c00;stroke-width:1}
.sl{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;fill:#1f2328}
.ss{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:10px;fill:#59636e}
.sn{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-weight:700;font-size:11px;fill:#0969da}
.sa-b{stroke:#0969da;stroke-width:1.5;fill:none}
.sa-g{stroke:#1a7f37;stroke-width:1.5;fill:none}
.sa-p{stroke:#8250df;stroke-width:1.5;fill:none}</style>
      <rect class="sb-b" x="20" y="20" width="160" height="50" rx="6"></rect><text class="sl" x="100" y="42" text-anchor="middle">Booking Service</text><text class="ss" x="100" y="56" text-anchor="middle">seat locked/booked</text>
      <rect class="sb-p" x="220" y="20" width="160" height="50" rx="6"></rect><text class="sl" x="300" y="42" text-anchor="middle">Kafka topic</text><text class="ss" x="300" y="56" text-anchor="middle">event:42:seats</text>
      <rect class="sb-g" x="420" y="20" width="160" height="50" rx="6"></rect><text class="sl" x="500" y="42" text-anchor="middle">Samza consumer</text><text class="ss" x="500" y="56" text-anchor="middle">→ SSE servers</text>
      <rect class="sb" x="620" y="20" width="140" height="50" rx="6"></rect><text class="sl" x="690" y="42" text-anchor="middle">Viewers</text><text class="ss" x="690" y="56" text-anchor="middle">live seat update</text>

      <path class="sa-b" d="M180,45 L218,45" marker-end="url(#ab)"></path><text class="sn" x="199" y="38">1</text>
      <path class="sa-p" d="M380,45 L418,45" marker-end="url(#a1)"></path><text class="sn" x="399" y="38">2</text>
      <path class="sa-g" d="M580,45 L618,45" marker-end="url(#ag)"></path><text class="sn" x="599" y="38">3</text>

      <rect class="sb-y" x="20" y="95" width="740" height="65" rx="6"></rect>
      <text class="sl" x="34" y="115">How it works</text>
      <text class="ss" x="34" y="132">1. Seat state changes (reserved/booked) → Booking Service publishes to Kafka topic.</text>
      <text class="ss" x="34" y="148">2. Samza consumer reads events, pushes to SSE servers. 3. SSE servers push to open browser connections.</text>
    </svg>
