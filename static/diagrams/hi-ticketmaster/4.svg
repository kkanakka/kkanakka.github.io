      <text class="ss" x="400" y="100" text-anchor="middle" fill="#d1242f">LIKE '%Taylor%' can’t use B-tree index = full table scan = seconds per query</text>
      <text class="ss" x="400" y="115" text-anchor="middle" fill="#d1242f">Section 10 replaces this with Galene (LinkedIn’s search engine)</text>
