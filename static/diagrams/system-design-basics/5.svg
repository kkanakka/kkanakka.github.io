<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#e879f9"></path></marker></defs>
<text x="100" y="30" text-anchor="middle" font-family="Inter" font-size="12" font-weight="700" fill="#22d3ee">CLIENT</text>
<text x="700" y="30" text-anchor="middle" font-family="Inter" font-size="12" font-weight="700" fill="#e879f9">SERVER</text>
<line x1="100" y1="40" x2="100" y2="220" stroke="#22d3ee" stroke-width="2" stroke-dasharray="3,4"></line>
<line x1="700" y1="40" x2="700" y2="220" stroke="#e879f9" stroke-width="2" stroke-dasharray="3,4"></line>
<line x1="100" y1="60" x2="700" y2="60" stroke="#22d3ee" stroke-width="2" marker-end="url(#aw)"></line>
<text x="400" y="55" text-anchor="middle" font-family="monospace" font-size="11" fill="#cbd5e1">GET /ws  Upgrade: websocket</text>
<line x1="700" y1="85" x2="100" y2="85" stroke="#fde047" stroke-width="2" marker-end="url(#aw)"></line>
<text x="400" y="80" text-anchor="middle" font-family="monospace" font-size="11" fill="#fde047">101 Switching Protocols</text>
<rect x="180" y="100" width="440" height="2" fill="#fbbf24"></rect>
<text x="400" y="118" text-anchor="middle" font-family="Inter" font-size="11" fill="#fbbf24" font-weight="700">→ TCP connection now owned by WebSocket protocol ←</text>
<line x1="100" y1="140" x2="700" y2="140" stroke="#e879f9" stroke-width="1.5" marker-end="url(#aw)"></line>
<text x="400" y="135" text-anchor="middle" font-family="monospace" font-size="11" fill="#e879f9">{"type":"chat","msg":"hi"}</text>
<line x1="700" y1="160" x2="100" y2="160" stroke="#e879f9" stroke-width="1.5" marker-end="url(#aw)"></line>
<text x="400" y="155" text-anchor="middle" font-family="monospace" font-size="11" fill="#e879f9">{"type":"presence","user":"42","online":true}</text>
<line x1="100" y1="180" x2="700" y2="180" stroke="#e879f9" stroke-width="1.5" marker-end="url(#aw)"></line>
<text x="400" y="175" text-anchor="middle" font-family="monospace" font-size="11" fill="#e879f9">{"type":"chat","msg":"hey!"}</text>
<text x="400" y="215" text-anchor="middle" font-family="Inter" font-size="11" fill="#94a3b8" font-style="italic">Both sides send whenever. Connection stays open until either explicitly closes.</text>
</svg>
