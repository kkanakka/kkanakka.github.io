<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#fb923c"></path></marker></defs>
<rect x="20" y="30" width="220" height="220" rx="10" fill="#7c2d12" opacity=".5" stroke="#fb923c"></rect>
<text x="130" y="55" text-anchor="middle" font-family="Inter" font-size="13" font-weight="700" fill="#fde047">CLIENT QUERY</text>
<text x="40" y="80" font-family="monospace" font-size="11" fill="#cbd5e1">query {</text>
<text x="40" y="98" font-family="monospace" font-size="11" fill="#cbd5e1">  user(id: 42) {</text>
<text x="40" y="116" font-family="monospace" font-size="11" fill="#4ade80">    name</text>
<text x="40" y="134" font-family="monospace" font-size="11" fill="#4ade80">    avatar</text>
<text x="40" y="152" font-family="monospace" font-size="11" fill="#cbd5e1">    posts(limit:5) {</text>
<text x="40" y="170" font-family="monospace" font-size="11" fill="#4ade80">      title</text>
<text x="40" y="188" font-family="monospace" font-size="11" fill="#4ade80">      likes</text>
<text x="40" y="206" font-family="monospace" font-size="11" fill="#cbd5e1">    }</text>
<text x="40" y="224" font-family="monospace" font-size="11" fill="#cbd5e1">  }</text>
<text x="40" y="242" font-family="monospace" font-size="11" fill="#cbd5e1">}</text>
<line x1="240" y1="140" x2="320" y2="140" stroke="#fb923c" stroke-width="2" marker-end="url(#ag)"></line>
<text x="280" y="130" text-anchor="middle" font-family="Inter" font-size="10" fill="#94a3b8">single</text>
<text x="280" y="158" text-anchor="middle" font-family="Inter" font-size="10" fill="#94a3b8">request</text>
<rect x="320" y="30" width="220" height="220" rx="10" fill="#581c87" opacity=".5" stroke="#c084fc"></rect>
<text x="430" y="55" text-anchor="middle" font-family="Inter" font-size="13" font-weight="700" fill="#fde047">GRAPHQL SERVER</text>
<text x="430" y="100" text-anchor="middle" font-family="monospace" font-size="11" fill="#cbd5e1">resolve user → DB</text>
<text x="430" y="125" text-anchor="middle" font-family="monospace" font-size="11" fill="#cbd5e1">resolve posts → DB</text>
<text x="430" y="160" text-anchor="middle" font-family="monospace" font-size="11" fill="#cbd5e1">project requested fields only</text>
<text x="430" y="185" text-anchor="middle" font-family="monospace" font-size="11" fill="#cbd5e1">return shape that matches query</text>
<line x1="540" y1="140" x2="620" y2="140" stroke="#fb923c" stroke-width="2" marker-end="url(#ag)"></line>
<rect x="620" y="30" width="160" height="220" rx="10" fill="#14532d" opacity=".5" stroke="#4ade80"></rect>
<text x="700" y="55" text-anchor="middle" font-family="Inter" font-size="13" font-weight="700" fill="#fde047">RESPONSE</text>
<text x="640" y="85" font-family="monospace" font-size="10" fill="#4ade80">{</text>
<text x="640" y="100" font-family="monospace" font-size="10" fill="#4ade80">  user: {</text>
<text x="640" y="115" font-family="monospace" font-size="10" fill="#4ade80">    name: "Ada"</text>
<text x="640" y="130" font-family="monospace" font-size="10" fill="#4ade80">    avatar: "..."</text>
<text x="640" y="145" font-family="monospace" font-size="10" fill="#4ade80">    posts: [</text>
<text x="640" y="160" font-family="monospace" font-size="10" fill="#4ade80">      {title, likes}</text>
<text x="640" y="175" font-family="monospace" font-size="10" fill="#4ade80">      {title, likes}</text>
<text x="640" y="190" font-family="monospace" font-size="10" fill="#4ade80">      ...</text>
<text x="640" y="205" font-family="monospace" font-size="10" fill="#4ade80">    ]</text>
<text x="640" y="220" font-family="monospace" font-size="10" fill="#4ade80">  }</text>
<text x="640" y="235" font-family="monospace" font-size="10" fill="#4ade80">}</text>
</svg>
