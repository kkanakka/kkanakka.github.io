<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="aw2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c084fc"></path></marker></defs>
<rect x="40" y="40" width="160" height="80" rx="10" fill="#14532d" opacity=".6" stroke="#4ade80"></rect>
<text x="120" y="65" text-anchor="middle" font-family="Inter" font-size="13" font-weight="700" fill="#4ade80">Peer A</text>
<text x="120" y="85" text-anchor="middle" font-family="monospace" font-size="11" fill="#cbd5e1">behind NAT</text>
<text x="120" y="103" text-anchor="middle" font-family="monospace" font-size="11" fill="#cbd5e1">192.168.1.42</text>
<rect x="600" y="40" width="160" height="80" rx="10" fill="#7c2d12" opacity=".6" stroke="#fb923c"></rect>
<text x="680" y="65" text-anchor="middle" font-family="Inter" font-size="13" font-weight="700" fill="#fb923c">Peer B</text>
<text x="680" y="85" text-anchor="middle" font-family="monospace" font-size="11" fill="#cbd5e1">behind NAT</text>
<text x="680" y="103" text-anchor="middle" font-family="monospace" font-size="11" fill="#cbd5e1">10.0.0.7</text>
<rect x="320" y="20" width="160" height="60" rx="8" fill="#1e3a5f" opacity=".7" stroke="#60a5fa"></rect>
<text x="400" y="42" text-anchor="middle" font-family="Inter" font-size="12" font-weight="700" fill="#60a5fa">Signaling server</text>
<text x="400" y="62" text-anchor="middle" font-family="monospace" font-size="10" fill="#cbd5e1">SDP &amp; ICE candidates</text>
<rect x="320" y="100" width="160" height="60" rx="8" fill="#365314" opacity=".7" stroke="#a3e635"></rect>
<text x="400" y="122" text-anchor="middle" font-family="Inter" font-size="12" font-weight="700" fill="#a3e635">STUN server</text>
<text x="400" y="142" text-anchor="middle" font-family="monospace" font-size="10" fill="#cbd5e1">"what's my public IP?"</text>
<rect x="320" y="180" width="160" height="60" rx="8" fill="#831843" opacity=".7" stroke="#f472b6"></rect>
<text x="400" y="202" text-anchor="middle" font-family="Inter" font-size="12" font-weight="700" fill="#f472b6">TURN relay</text>
<text x="400" y="222" text-anchor="middle" font-family="monospace" font-size="10" fill="#cbd5e1">fallback: bounce traffic</text>
<line x1="200" y1="60" x2="320" y2="50" stroke="#60a5fa" stroke-width="2" marker-end="url(#aw2)"></line>
<line x1="600" y1="60" x2="480" y2="50" stroke="#60a5fa" stroke-width="2" marker-end="url(#aw2)"></line>
<line x1="200" y1="90" x2="320" y2="125" stroke="#a3e635" stroke-width="2" marker-end="url(#aw2)"></line>
<line x1="600" y1="90" x2="480" y2="125" stroke="#a3e635" stroke-width="2" marker-end="url(#aw2)"></line>
<line x1="200" y1="100" x2="600" y2="100" stroke="#fde047" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#aw2)"></line>
<text x="400" y="280" text-anchor="middle" font-family="Inter" font-size="13" font-weight="700" fill="#fde047">DIRECT PEER-TO-PEER (UDP) — once ICE finishes</text>
<text x="400" y="300" text-anchor="middle" font-family="Inter" font-size="11" fill="#94a3b8" font-style="italic">If hole-punching fails, traffic falls back through TURN.</text>
</svg>
