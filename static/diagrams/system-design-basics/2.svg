<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22d3ee"></path></marker></defs>
<text x="120" y="22" text-anchor="middle" font-family="Inter" font-size="13" font-weight="700" fill="#22d3ee">CLIENT</text>
<text x="420" y="22" text-anchor="middle" font-family="Inter" font-size="13" font-weight="700" fill="#a78bfa">DNS</text>
<text x="700" y="22" text-anchor="middle" font-family="Inter" font-size="13" font-weight="700" fill="#f472b6">SERVER</text>
<line x1="120" y1="35" x2="120" y2="440" stroke="#22d3ee" stroke-width="2" stroke-dasharray="3,4"></line>
<line x1="420" y1="35" x2="420" y2="100" stroke="#a78bfa" stroke-width="2" stroke-dasharray="3,4"></line>
<line x1="700" y1="35" x2="700" y2="440" stroke="#f472b6" stroke-width="2" stroke-dasharray="3,4"></line>
<line x1="120" y1="60" x2="420" y2="60" stroke="#22d3ee" stroke-width="2" marker-end="url(#ar)"></line>
<text x="270" y="55" text-anchor="middle" font-family="monospace" font-size="11" fill="#cbd5e1">resolve "hellointerview.com"</text>
<line x1="420" y1="85" x2="120" y2="85" stroke="#22d3ee" stroke-width="2" marker-end="url(#ar)"></line>
<text x="270" y="80" text-anchor="middle" font-family="monospace" font-size="11" fill="#4ade80">→ 32.42.52.62</text>
<line x1="120" y1="125" x2="700" y2="125" stroke="#22d3ee" stroke-width="2" marker-end="url(#ar)"></line>
<text x="410" y="120" text-anchor="middle" font-family="monospace" font-size="11" fill="#cbd5e1">SYN</text>
<line x1="700" y1="150" x2="120" y2="150" stroke="#22d3ee" stroke-width="2" marker-end="url(#ar)"></line>
<text x="410" y="145" text-anchor="middle" font-family="monospace" font-size="11" fill="#cbd5e1">SYN-ACK</text>
<line x1="120" y1="175" x2="700" y2="175" stroke="#22d3ee" stroke-width="2" marker-end="url(#ar)"></line>
<text x="410" y="170" text-anchor="middle" font-family="monospace" font-size="11" fill="#cbd5e1">ACK <tspan fill="#fbbf24">(connection established)</tspan></text>
<line x1="120" y1="215" x2="700" y2="215" stroke="#4ade80" stroke-width="2" marker-end="url(#ar)"></line>
<text x="410" y="210" text-anchor="middle" font-family="monospace" font-size="11" fill="#4ade80">HTTP GET /feed</text>
<rect x="660" y="225" width="80" height="34" rx="4" fill="#86198f" opacity=".5"></rect>
<text x="700" y="245" text-anchor="middle" font-family="monospace" font-size="10" fill="#fde047">processing</text>
<line x1="700" y1="280" x2="120" y2="280" stroke="#4ade80" stroke-width="2" marker-end="url(#ar)"></line>
<text x="410" y="275" text-anchor="middle" font-family="monospace" font-size="11" fill="#4ade80">HTTP 200 OK + body</text>
<line x1="120" y1="320" x2="700" y2="320" stroke="#f472b6" stroke-width="2" marker-end="url(#ar)"></line>
<text x="410" y="315" text-anchor="middle" font-family="monospace" font-size="11" fill="#cbd5e1">FIN</text>
<line x1="700" y1="345" x2="120" y2="345" stroke="#f472b6" stroke-width="2" marker-end="url(#ar)"></line>
<text x="410" y="340" text-anchor="middle" font-family="monospace" font-size="11" fill="#cbd5e1">ACK</text>
<line x1="700" y1="370" x2="120" y2="370" stroke="#f472b6" stroke-width="2" marker-end="url(#ar)"></line>
<text x="410" y="365" text-anchor="middle" font-family="monospace" font-size="11" fill="#cbd5e1">FIN</text>
<line x1="120" y1="395" x2="700" y2="395" stroke="#f472b6" stroke-width="2" marker-end="url(#ar)"></line>
<text x="410" y="390" text-anchor="middle" font-family="monospace" font-size="11" fill="#cbd5e1">ACK <tspan fill="#fbbf24">(connection closed)</tspan></text>
<text x="40" y="125" font-family="monospace" font-size="10" fill="#94a3b8">3-way</text>
<text x="40" y="138" font-family="monospace" font-size="10" fill="#94a3b8">handshake</text>
<text x="40" y="245" font-family="monospace" font-size="10" fill="#94a3b8">request</text>
<text x="40" y="345" font-family="monospace" font-size="10" fill="#94a3b8">4-way</text>
<text x="40" y="358" font-family="monospace" font-size="10" fill="#94a3b8">teardown</text>
<text x="400" y="440" text-anchor="middle" font-family="Inter" font-size="11" fill="#94a3b8" font-style="italic">With keep-alive / HTTP/2 multiplexing the teardown is skipped — the same TCP connection serves many requests.</text>
</svg>
