<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#a78bfa"></path></marker></defs>
<rect x="20" y="40" width="380" height="180" rx="10" fill="#14532d" opacity=".4" stroke="#4ade80"></rect>
<text x="210" y="65" text-anchor="middle" font-family="Inter" font-size="14" font-weight="700" fill="#4ade80">L4 Load Balancer</text>
<text x="210" y="85" text-anchor="middle" font-family="monospace" font-size="11" fill="#cbd5e1">routes by (src/dst IP, port)</text>
<rect x="50" y="105" width="80" height="40" rx="6" fill="#22d3ee" opacity=".4"></rect>
<text x="90" y="128" text-anchor="middle" font-family="Inter" font-size="11" fill="#f1f5f9">client</text>
<rect x="180" y="105" width="80" height="40" rx="6" fill="#a78bfa" opacity=".5"></rect>
<text x="220" y="128" text-anchor="middle" font-family="Inter" font-size="11" fill="#f1f5f9">L4 LB</text>
<rect x="310" y="105" width="80" height="40" rx="6" fill="#fb923c" opacity=".5"></rect>
<text x="350" y="128" text-anchor="middle" font-family="Inter" font-size="11" fill="#f1f5f9">server</text>
<line x1="130" y1="125" x2="180" y2="125" stroke="#a78bfa" stroke-width="2" marker-end="url(#al)"></line>
<line x1="260" y1="125" x2="310" y2="125" stroke="#a78bfa" stroke-width="2" marker-end="url(#al)"></line>
<text x="210" y="180" text-anchor="middle" font-family="monospace" font-size="11" fill="#fde047">TCP connection persists end-to-end</text>
<text x="210" y="200" text-anchor="middle" font-family="Inter" font-size="11" fill="#94a3b8">→ great for WebSockets, raw perf</text>
<rect x="420" y="40" width="360" height="180" rx="10" fill="#7c2d12" opacity=".4" stroke="#fb923c"></rect>
<text x="600" y="65" text-anchor="middle" font-family="Inter" font-size="14" font-weight="700" fill="#fb923c">L7 Load Balancer</text>
<text x="600" y="85" text-anchor="middle" font-family="monospace" font-size="11" fill="#cbd5e1">routes by URL, header, cookie</text>
<rect x="440" y="105" width="80" height="40" rx="6" fill="#22d3ee" opacity=".4"></rect>
<text x="480" y="128" text-anchor="middle" font-family="Inter" font-size="11" fill="#f1f5f9">client</text>
<rect x="560" y="105" width="80" height="40" rx="6" fill="#a78bfa" opacity=".5"></rect>
<text x="600" y="128" text-anchor="middle" font-family="Inter" font-size="11" fill="#f1f5f9">L7 LB</text>
<rect x="680" y="105" width="80" height="40" rx="6" fill="#fb923c" opacity=".5"></rect>
<text x="720" y="128" text-anchor="middle" font-family="Inter" font-size="11" fill="#f1f5f9">server</text>
<line x1="520" y1="125" x2="560" y2="125" stroke="#a78bfa" stroke-width="2" marker-end="url(#al)"></line>
<text x="540" y="118" text-anchor="middle" font-family="monospace" font-size="9" fill="#cbd5e1">TCP A</text>
<line x1="640" y1="125" x2="680" y2="125" stroke="#a78bfa" stroke-width="2" marker-end="url(#al)"></line>
<text x="660" y="118" text-anchor="middle" font-family="monospace" font-size="9" fill="#cbd5e1">TCP B</text>
<text x="600" y="180" text-anchor="middle" font-family="monospace" font-size="11" fill="#fde047">terminates client TCP, opens new TCP to server</text>
<text x="600" y="200" text-anchor="middle" font-family="Inter" font-size="11" fill="#94a3b8">→ great for HTTP routing, A/B, canary</text>
</svg>
