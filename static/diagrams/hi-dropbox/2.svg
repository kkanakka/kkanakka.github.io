<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 160" xmlns="http://www.w3.org/2000/svg"><style>.sb{fill:var(--bg-subtle);stroke:var(--border);stroke-width:1}
.sb-b{fill:#ddf4ff;stroke:var(--accent);stroke-width:1}
.sb-g{fill:#dafbe1;stroke:var(--success);stroke-width:1}
.sb-r{fill:#ffebe9;stroke:var(--danger);stroke-width:1}
.sb-y{fill:#fff8e6;stroke:var(--attention);stroke-width:1}
.sb-p{fill:#fbefff;stroke:var(--done);stroke-width:1}
.sb-o{fill:#fff1e5;stroke:var(--orange);stroke-width:1}
.sl{font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--fg)}
.ss{font-family:var(--mono);font-size:10px;fill:var(--fg-muted)}
.sa{stroke:var(--fg-muted);stroke-width:1.2;fill:none}
.sa-b{stroke:var(--accent);stroke-width:1.5;fill:none}
.sa-g{stroke:var(--success);stroke-width:1.5;fill:none}
.sa-r{stroke:var(--danger);stroke-width:1.5;fill:none}
.sa-p{stroke:var(--done);stroke-width:1.5;fill:none}</style>
      <rect class="sb" x="20" y="20" width="160" height="120" rx="6"></rect>
      <text class="sl" x="100" y="42" text-anchor="middle">User</text>
      <line x1="34" y1="50" x2="166" y2="50" stroke="var(--border-muted)"></line>
      <text class="ss" x="34" y="68">id: UUID</text>
      <text class="ss" x="34" y="84">email: string</text>
      <text class="ss" x="34" y="100">name: string</text>
      <rect class="sb-b" x="240" y="20" width="200" height="120" rx="6"></rect>
      <text class="sl" x="340" y="42" text-anchor="middle">FileMetadata</text>
      <line x1="254" y1="50" x2="426" y2="50" stroke="var(--border-muted)"></line>
      <text class="ss" x="254" y="68">id: UUID</text>
      <text class="ss" x="254" y="84">name, size, mimeType</text>
      <text class="ss" x="254" y="100">uploadedBy: userId</text>
      <text class="ss" x="254" y="116">fingerprint, chunks[]</text>
      <rect class="sb-g" x="500" y="20" width="180" height="120" rx="6"></rect>
      <text class="sl" x="590" y="42" text-anchor="middle">File (raw bytes)</text>
      <line x1="514" y1="50" x2="666" y2="50" stroke="var(--border-muted)"></line>
      <text class="ss" x="514" y="68">stored in Ambry</text>
      <text class="ss" x="514" y="84">(LinkedIn blob store)</text>
      <text class="ss" x="514" y="104" fill="var(--attention)">separated from</text>
      <text class="ss" x="514" y="118" fill="var(--attention)">metadata for a reason</text>
      <path class="sa" d="M180,80 L238,80" marker-end="url(#a1)"></path>
      <text class="ss" x="209" y="74" text-anchor="middle">owns</text>
      <path class="sa" d="M440,80 L498,80" marker-end="url(#a1)"></path>
      <text class="ss" x="469" y="74" text-anchor="middle">points to</text>
    </svg>
