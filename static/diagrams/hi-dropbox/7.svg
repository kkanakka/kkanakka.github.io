<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg"><style>.sb-b{fill:#ddf4ff;stroke:#0969da;stroke-width:1}
.sb-y{fill:#fff8e6;stroke:#9a6700;stroke-width:1}
.sb-p{fill:#fbefff;stroke:#8250df;stroke-width:1}
.sl{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;fill:#1f2328}
.ss{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:10px;fill:#59636e}
.sn{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-weight:700;font-size:11px;fill:#0969da}</style>
      <defs><marker id="ap" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#8250df"></path></marker>
            <marker id="ay" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#9a6700"></path></marker></defs>
      <rect class="sb-p" x="20" y="20" width="170" height="60" rx="6"></rect>
      <text class="sl" x="105" y="40" text-anchor="middle">Kafka + Samza</text>
      <text class="ss" x="105" y="56" text-anchor="middle">WebSocket per device</text>
      <text class="ss" x="105" y="70" text-anchor="middle">pushes ChangeEvent</text>
      <rect class="sb-b" x="280" y="20" width="150" height="60" rx="6"></rect>
      <text class="sl" x="355" y="40" text-anchor="middle">Local Client</text>
      <text class="ss" x="355" y="56" text-anchor="middle">listens for events</text>
      <text class="ss" x="355" y="70" text-anchor="middle">downloads changes</text>
      <path d="M190,50 L278,50" stroke="#8250df" stroke-width="1.5" marker-end="url(#ap)" fill="none"></path>
      <text class="sn" x="234" y="42" text-anchor="middle" fill="#8250df">push (primary)</text>

      <line x1="20" y1="105" x2="780" y2="105" stroke="#d8dee4" stroke-dasharray="3,2"></line>

      <rect class="sb-y" x="20" y="120" width="170" height="60" rx="6"></rect>
      <text class="sl" x="105" y="140" text-anchor="middle">Sync Service</text>
      <text class="ss" x="105" y="156" text-anchor="middle">GET /files/changes</text>
      <text class="ss" x="105" y="170" text-anchor="middle">?since=&lt;kafka-offset&gt;</text>
      <rect class="sb-b" x="280" y="120" width="150" height="60" rx="6"></rect>
      <text class="sl" x="355" y="140" text-anchor="middle">Local Client</text>
      <text class="ss" x="355" y="156" text-anchor="middle">polls every few min</text>
      <text class="ss" x="355" y="170" text-anchor="middle">as safety net</text>
      <path d="M278,150 L200,150" stroke="#9a6700" stroke-width="1.5" marker-end="url(#ay)" fill="none"></path>
      <text class="sn" x="234" y="195" text-anchor="middle" fill="#9a6700">poll (fallback)</text>

      <text class="ss" x="460" y="155">WebSockets drop. The poll catches misses.</text>
      <text class="ss" x="460" y="170">Guarantees eventual consistency.</text>
    </svg>
