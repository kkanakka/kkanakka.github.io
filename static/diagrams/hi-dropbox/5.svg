      <rect class="sb" x="20" y="90" width="140" height="50" rx="6"></rect><text class="sl" x="90" y="112" text-anchor="middle">Bob downloads</text><text class="ss" x="90" y="128" text-anchor="middle">GET /files/:id</text>
      <rect class="sb-y" x="190" y="90" width="160" height="50" rx="6"></rect><text class="sl" x="270" y="112" text-anchor="middle">Auth check</text><text class="ss" x="270" y="128" text-anchor="middle">SELECT FROM SharedFiles</text>
      <rect class="sb-g" x="380" y="90" width="180" height="50" rx="6"></rect><text class="sl" x="470" y="112" text-anchor="middle">Bob ∈ ACL → signed URL</text><text class="ss" x="470" y="128" text-anchor="middle">access granted</text>
      <path class="sa" d="M160,115 L188,115" marker-end="url(#a1)"></path>
