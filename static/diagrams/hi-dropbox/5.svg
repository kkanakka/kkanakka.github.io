      <rect class="sb" x="20" y="15" width="110" height="40" rx="6"></rect><text class="sl" x="75" y="38" text-anchor="middle">Alice (owner)</text>
      <rect class="sb-b" x="160" y="15" width="140" height="40" rx="6"></rect><text class="ss" x="230" y="32" text-anchor="middle">POST /share</text><text class="ss" x="230" y="46" text-anchor="middle">[bob@linkedin.com]</text>
      <rect class="sb-y" x="330" y="15" width="140" height="40" rx="6"></rect><text class="sl" x="400" y="32" text-anchor="middle">File Service</text><text class="ss" x="400" y="46" text-anchor="middle">writes share record</text>
      <rect class="sb-g" x="500" y="15" width="180" height="40" rx="6"></rect><text class="sl" x="590" y="32" text-anchor="middle">SharedFiles (Espresso)</text><text class="ss" x="590" y="46" text-anchor="middle">fileId → userId</text>
      <path class="sa" d="M130,35 L158,35" marker-end="url(#a1)"></path>
      <path class="sa" d="M300,35 L328,35" marker-end="url(#a1)"></path>
