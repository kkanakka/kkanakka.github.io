<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg"><style>.sb-b{fill:#ddf4ff;stroke:var(--accent);stroke-width:1}
.sb-g{fill:#dafbe1;stroke:var(--success);stroke-width:1}
.sb-r{fill:#ffebe9;stroke:var(--danger);stroke-width:1}
.sb-y{fill:#fff8e6;stroke:var(--attention);stroke-width:1}
.sb-p{fill:#fbefff;stroke:var(--done);stroke-width:1}
.sb-o{fill:#fff1e5;stroke:var(--orange);stroke-width:1}
.sl{font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--fg)}
.ss{font-family:var(--mono);font-size:10px;fill:var(--fg-muted)}</style>
      <rect class="sb-b" x="20" y="20" width="140" height="50" rx="6"></rect><text class="sl" x="90" y="42" text-anchor="middle">Uploader</text><text class="ss" x="90" y="56" text-anchor="middle">web/mobile/desktop</text>
      <rect class="sb-g" x="20" y="100" width="140" height="50" rx="6"></rect><text class="sl" x="90" y="122" text-anchor="middle">Downloader</text><text class="ss" x="90" y="136" text-anchor="middle">any device</text>

      <rect class="sb-y" x="220" y="60" width="150" height="50" rx="6"></rect><text class="sl" x="295" y="82" text-anchor="middle">LB + API Gateway</text><text class="ss" x="295" y="96" text-anchor="middle">TLS, rate-limit, auth</text>

      <rect class="sb-b" x="420" y="60" width="180" height="50" rx="6"></rect><text class="sl" x="510" y="82" text-anchor="middle">File Service</text><text class="ss" x="510" y="96" text-anchor="middle">metadata + signed URLs</text>

      <rect class="sb-g" x="660" y="20" width="180" height="60" rx="6"></rect><text class="sl" x="750" y="42" text-anchor="middle">Espresso (metadata)</text><text class="ss" x="750" y="58" text-anchor="middle">FileMetadata + SharedFiles</text>

      <rect class="sb-p" x="420" y="200" width="180" height="50" rx="6"></rect><text class="sl" x="510" y="222" text-anchor="middle">Ambry (blob store)</text><text class="ss" x="510" y="236" text-anchor="middle">raw file bytes</text>

      <rect class="sb-o" x="220" y="200" width="150" height="50" rx="6"></rect><text class="sl" x="295" y="222" text-anchor="middle">LinkedIn CDN</text><text class="ss" x="295" y="236" text-anchor="middle">edge caches</text>

      <rect class="sb-r" x="420" y="300" width="180" height="50" rx="6"></rect><text class="sl" x="510" y="322" text-anchor="middle">Kafka + Samza</text><text class="ss" x="510" y="336" text-anchor="middle">push ChangeEvents</text>

      <path d="M160,45 L218,80" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#ab)" fill="none"></path>
      <path d="M160,125 L218,95" stroke="var(--success)" stroke-width="1.5" marker-end="url(#a1)" fill="none"></path>
      <path d="M370,85 L418,85" stroke="var(--fg-muted)" stroke-width="1.5" marker-end="url(#a1)" fill="none"></path>
      <path d="M600,80 L658,55" stroke="var(--fg-muted)" stroke-width="1.5" marker-end="url(#a1)" fill="none"></path>

      <path d="M90,70 L90,200 L418,222" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ab)" fill="none"></path>
      <text class="ss" x="140" y="195" fill="var(--accent)">direct upload (presigned URL)</text>

      <path d="M160,150 L240,198" stroke="var(--success)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a1)" fill="none"></path>
      <text class="ss" x="130" y="200" fill="var(--success)">via CDN</text>

      <path d="M510,250 L370,225" stroke="var(--fg-muted)" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#a1)" fill="none"></path>
      <text class="ss" x="440" y="243" text-anchor="middle">cache fill</text>

      <path d="M510,350 L90,155" stroke="var(--danger)" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a1)" fill="none"></path>
      <text class="ss" x="280" y="340" fill="var(--danger)">push change events</text>

      <text class="ss" x="20" y="390" fill="var(--accent)">—— control plane (metadata + signed URLs)</text>
      <text class="ss" x="350" y="390" fill="var(--accent)">···· data plane (bytes direct to Ambry)</text>
      <text class="ss" x="650" y="390" fill="var(--danger)">···· push notifications (Kafka)</text>
    </svg>
