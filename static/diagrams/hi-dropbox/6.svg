<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 140" xmlns="http://www.w3.org/2000/svg"><style>.sb-b{fill:#ddf4ff;stroke:var(--accent);stroke-width:1}
.sb-g{fill:#dafbe1;stroke:var(--success);stroke-width:1}
.sb-y{fill:#fff8e6;stroke:var(--attention);stroke-width:1}
.sb-p{fill:#fbefff;stroke:var(--done);stroke-width:1}
.sl{font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--fg)}
.ss{font-family:var(--mono);font-size:10px;fill:var(--fg-muted)}
.sa{stroke:var(--fg-muted);stroke-width:1.2;fill:none}
.sa-b{stroke:var(--accent);stroke-width:1.5;fill:none}
.sa-g{stroke:var(--success);stroke-width:1.5;fill:none}
.sa-r{stroke:var(--danger);stroke-width:1.5;fill:none}
.sa-p{stroke:var(--done);stroke-width:1.5;fill:none}</style>
      <rect class="sb-b" x="20" y="20" width="150" height="90" rx="6"></rect>
      <text class="sl" x="95" y="40" text-anchor="middle">Sync Agent</text>
      <text class="ss" x="95" y="56" text-anchor="middle">watches folder</text>
      <text class="ss" x="95" y="70" text-anchor="middle">FSEvents / inotify</text>
      <text class="ss" x="95" y="84" text-anchor="middle">FileSystemWatcher</text>
      <rect class="sb-y" x="200" y="40" width="120" height="45" rx="6"></rect><text class="sl" x="260" y="58" text-anchor="middle">Local queue</text><text class="ss" x="260" y="72" text-anchor="middle">changed files</text>
      <rect class="sb-g" x="350" y="40" width="120" height="45" rx="6"></rect><text class="sl" x="410" y="58" text-anchor="middle">Upload API</text><text class="ss" x="410" y="72" text-anchor="middle">presigned URL</text>
      <rect class="sb-p" x="500" y="40" width="180" height="45" rx="6"></rect><text class="sl" x="590" y="58" text-anchor="middle">Ambry + Espresso</text><text class="ss" x="590" y="72" text-anchor="middle">source of truth</text>
      <path class="sa" d="M170,65 L198,65" marker-end="url(#a1)"></path>
      <path class="sa" d="M320,65 L348,65" marker-end="url(#a1)"></path>
      <path class="sa" d="M470,65 L498,65" marker-end="url(#a1)"></path>
      <text class="ss" x="400" y="120" text-anchor="middle">Conflict resolution: last-write-wins.</text>
    </svg>
