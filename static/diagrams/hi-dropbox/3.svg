<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg"><style>.sb{fill:var(--bg-subtle);stroke:var(--border);stroke-width:1}
.sb-b{fill:#ddf4ff;stroke:var(--accent);stroke-width:1}
.sb-g{fill:#dafbe1;stroke:var(--success);stroke-width:1}
.sb-r{fill:#ffebe9;stroke:var(--danger);stroke-width:1}
.sb-y{fill:#fff8e6;stroke:var(--attention);stroke-width:1}
.sb-p{fill:#fbefff;stroke:var(--done);stroke-width:1}
.sb-o{fill:#fff1e5;stroke:var(--orange);stroke-width:1}
.sl{font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--fg)}
.ss{font-family:var(--mono);font-size:10px;fill:var(--fg-muted)}
.sn{font-family:var(--mono);font-weight:700;font-size:11px;fill:var(--accent)}
.sa-b{stroke:var(--accent);stroke-width:1.5;fill:none}
.sa-g{stroke:var(--success);stroke-width:1.5;fill:none}
.sa-r{stroke:var(--danger);stroke-width:1.5;fill:none}</style>
      <defs>
        <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#cf222e"></path></marker>
        <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#1a7f37"></path></marker>
      </defs>
      <text class="sl" x="20" y="18" fill="var(--danger)">✗ Option 1: Upload through the server</text>
      <rect class="sb" x="20" y="28" width="100" height="40" rx="4"></rect><text class="ss" x="70" y="52" text-anchor="middle">Client 50GB</text>
      <rect class="sb-r" x="150" y="28" width="110" height="40" rx="4"></rect><text class="ss" x="205" y="52" text-anchor="middle">App Server</text>
      <rect class="sb-g" x="290" y="28" width="90" height="40" rx="4"></rect><text class="ss" x="335" y="52" text-anchor="middle">Ambry</text>
      <path class="sa-r" d="M120,48 L148,48" marker-end="url(#ar)"></path>
      <path class="sa-r" d="M260,48 L288,48" marker-end="url(#ar)"></path>
      <text class="ss" x="420" y="42">Wastes bandwidth. Server is bottleneck.</text>
      <text class="ss" x="420" y="56">File goes over the wire 2×.</text>

      <line x1="20" y1="85" x2="780" y2="85" stroke="var(--border-muted)"></line>
      <text class="sl" x="20" y="105" fill="var(--danger)">✗ Option 2: Direct upload (no auth)</text>
      <rect class="sb" x="20" y="115" width="100" height="40" rx="4"></rect><text class="ss" x="70" y="139" text-anchor="middle">Client</text>
      <rect class="sb-g" x="150" y="115" width="100" height="40" rx="4"></rect><text class="ss" x="200" y="139" text-anchor="middle">Ambry (public)</text>
      <path class="sa-r" d="M120,135 L148,135" marker-end="url(#ar)"></path>
      <text class="ss" x="280" y="130">Fast but insecure. Anyone could upload anything.</text>

      <line x1="20" y1="175" x2="780" y2="175" stroke="var(--border-muted)"></line>
      <text class="sl" x="20" y="195" fill="var(--success)">✓ Option 3: Presigned URL (the winner)</text>
      <rect class="sb" x="20" y="205" width="90" height="40" rx="4"></rect><text class="ss" x="65" y="229" text-anchor="middle">Client</text>
      <rect class="sb-b" x="130" y="205" width="120" height="40" rx="4"></rect><text class="ss" x="190" y="222" text-anchor="middle">File Service</text><text class="ss" x="190" y="236" text-anchor="middle">(metadata only)</text>
      <rect class="sb-y" x="270" y="205" width="120" height="40" rx="4"></rect><text class="ss" x="330" y="222" text-anchor="middle">presigned URL</text><text class="ss" x="330" y="236" text-anchor="middle">expires 15min</text>
      <rect class="sb-g" x="410" y="205" width="90" height="40" rx="4"></rect><text class="ss" x="455" y="229" text-anchor="middle">Ambry</text>
      <path class="sa-b" d="M110,225 L128,225" marker-end="url(#a1)"></path><text class="sn" x="119" y="218">1</text>
      <path class="sa-b" d="M250,225 L268,225" marker-end="url(#a1)"></path><text class="sn" x="259" y="218">2</text>
      <path class="sa-g" d="M65,245 L65,280 L455,280 L455,248" marker-end="url(#ag)"></path>
      <text class="sn" x="250" y="295">3 PUT directly to Ambry</text>
      <text class="ss" x="540" y="218">1: ask for URL · 2: receive signed URL</text>
      <text class="ss" x="540" y="232">3: PUT bytes to blob store directly</text>
    </svg>
