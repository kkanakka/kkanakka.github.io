<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" style="max-width:700px;">
      <defs>
        <marker id="arr2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#546e7a"></polygon>
        </marker>
      </defs>
      <!-- Fault box -->
      <rect x="30" y="40" width="200" height="140" rx="12" fill="#fff3e0" stroke="#e65100" stroke-width="2"></rect>
      <text x="130" y="70" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="16" fill="#e65100">FAULT</text>
      <text x="130" y="95" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#37352f">One component deviates</text>
      <text x="130" y="112" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#37352f">from its spec</text>
      <text x="130" y="140" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#787774">Example: one disk dies,</text>
      <text x="130" y="155" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#787774">one process crashes</text>

      <!-- Arrow -->
      <line x1="230" y1="110" x2="310" y2="110" stroke="#546e7a" stroke-width="2" marker-end="url(#arr2)"></line>
      <text x="270" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#c62828">can cause</text>

      <!-- Fault Tolerance Shield -->
      <rect x="310" y="40" width="180" height="140" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"></rect>
      <text x="400" y="70" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="14" fill="#2e7d32">FAULT TOLERANCE</text>
      <text x="400" y="95" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#37352f">Mechanisms that</text>
      <text x="400" y="112" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#37352f">prevent faults from</text>
      <text x="400" y="129" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#37352f">becoming failures</text>
      <text x="400" y="155" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#787774">Redundancy, retries, etc.</text>

      <!-- Arrow -->
      <line x1="490" y1="90" x2="570" y2="60" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4"></line>
      <line x1="490" y1="130" x2="570" y2="160" stroke="#c62828" stroke-width="1.5" marker-end="url(#arr2)"></line>

      <!-- Success -->
      <rect x="570" y="20" width="190" height="60" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"></rect>
      <text x="665" y="48" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="12" fill="#2e7d32">System keeps working</text>
      <text x="665" y="66" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#787774">Fault handled gracefully</text>

      <!-- Failure -->
      <rect x="570" y="140" width="190" height="60" rx="10" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"></rect>
      <text x="665" y="165" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="14" fill="#c62828">FAILURE</text>
      <text x="665" y="185" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#37352f">System stops serving users</text>

      <text x="540" y="55" font-family="Inter,sans-serif" font-size="10" fill="#2e7d32">handled</text>
      <text x="530" y="155" font-family="Inter,sans-serif" font-size="10" fill="#c62828">unhandled</text>
    </svg>
