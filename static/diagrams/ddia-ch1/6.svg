      <text x="743" y="48" font-family="Inter,sans-serif" font-weight="600" font-size="10" fill="#4a148c">p999</text>

      <!-- Legend -->
      <text x="400" y="325" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#787774">Higher percentiles = tail latency = the customers with the most data (most valuable!)</text>
      <text x="400" y="345" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="11" fill="#c62828">Amazon: 100ms slower = 1% less revenue. p999 matters.</text>
