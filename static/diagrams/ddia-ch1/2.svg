<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" style="max-width:750px;">
      <defs>
        <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#546e7a"></polygon>
        </marker>
        <filter id="shadow2" x="-4%" y="-4%" width="108%" height="112%">
          <fedropshadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"></fedropshadow>
        </filter>
      </defs>

      <!-- Client -->
      <rect x="310" y="10" width="180" height="50" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow2)"></rect>
      <text x="400" y="40" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="13" fill="#0d47a1">Client Request</text>

      <!-- API Layer -->
      <rect x="230" y="90" width="340" height="50" rx="10" fill="#e8eaf6" stroke="#283593" stroke-width="2" filter="url(#shadow2)"></rect>
      <text x="400" y="120" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="14" fill="#1a237e">Application Code / API</text>

      <!-- Arrow client -> API -->
      <line x1="400" y1="60" x2="400" y2="90" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arrowhead)"></line>

      <!-- Primary DB -->
      <rect x="40" y="190" width="150" height="70" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow2)"></rect>
      <text x="115" y="218" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="12" fill="#0d47a1">Primary Database</text>
      <text x="115" y="238" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#546e7a">Source of truth</text>

      <!-- Cache -->
      <rect x="230" y="190" width="150" height="70" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" filter="url(#shadow2)"></rect>
      <text x="305" y="218" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="12" fill="#1b5e20">Cache</text>
      <text x="305" y="238" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#546e7a">Redis / Memcached</text>

      <!-- Search Index -->
      <rect x="420" y="190" width="150" height="70" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="1.5" filter="url(#shadow2)"></rect>
      <text x="495" y="218" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="12" fill="#bf360c">Full-Text Search</text>
      <text x="495" y="238" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#546e7a">Elasticsearch</text>

      <!-- Message Queue -->
      <rect x="610" y="190" width="150" height="70" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5" filter="url(#shadow2)"></rect>
      <text x="685" y="218" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="12" fill="#4a148c">Message Queue</text>
      <text x="685" y="238" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#546e7a">Kafka / RabbitMQ</text>

      <!-- Arrows from API to components -->
      <line x1="320" y1="140" x2="115" y2="190" stroke="#546e7a" stroke-width="1.2" marker-end="url(#arrowhead)"></line>
      <line x1="370" y1="140" x2="305" y2="190" stroke="#546e7a" stroke-width="1.2" marker-end="url(#arrowhead)"></line>
      <line x1="430" y1="140" x2="495" y2="190" stroke="#546e7a" stroke-width="1.2" marker-end="url(#arrowhead)"></line>
      <line x1="480" y1="140" x2="685" y2="190" stroke="#546e7a" stroke-width="1.2" marker-end="url(#arrowhead)"></line>

      <!-- Sync arrows between DB and Cache/Search -->
      <line x1="190" y1="225" x2="230" y2="225" stroke="#c62828" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowhead)"></line>
      <line x1="190" y1="235" x2="420" y2="235" stroke="#c62828" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowhead)"></line>

      <!-- Labels for sync -->
      <text x="210" y="215" font-family="Inter,sans-serif" font-size="9" fill="#c62828">invalidate</text>
      <text x="310" y="248" font-family="Inter,sans-serif" font-size="9" fill="#c62828">sync index</text>

      <!-- Downstream Consumer -->
      <rect x="610" y="310" width="150" height="55" rx="10" fill="#fce4ec" stroke="#c62828" stroke-width="1.5" filter="url(#shadow2)"></rect>
      <text x="685" y="335" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="12" fill="#b71c1c">Async Consumer</text>
      <text x="685" y="352" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#546e7a">Email, Analytics</text>

      <line x1="685" y1="260" x2="685" y2="310" stroke="#546e7a" stroke-width="1.2" marker-end="url(#arrowhead)"></line>

      <!-- API boundary label -->
      <rect x="10" y="88" width="80" height="24" rx="4" fill="#283593"></rect>
      <text x="50" y="104" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="10" fill="#fff">API hides all</text>
    </svg>
