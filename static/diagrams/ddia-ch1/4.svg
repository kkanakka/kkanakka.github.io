<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" style="max-width:750px;">
      <!-- Center label -->
      <rect x="280" y="10" width="240" height="40" rx="8" fill="#283593"></rect>
      <text x="400" y="35" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="14" fill="#fff">Types of Faults</text>

      <!-- Hardware -->
      <rect x="20" y="80" width="230" height="200" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"></rect>
      <text x="135" y="108" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="13" fill="#0d47a1">Hardware Faults</text>
      <text x="135" y="128" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#787774">Random &amp; independent</text>
      <line x1="50" y1="140" x2="220" y2="140" stroke="#e3e2de" stroke-width="1"></line>
      <text x="40" y="160" font-family="Inter,sans-serif" font-size="11" fill="#37352f">• Disk crashes</text>
      <text x="40" y="180" font-family="Inter,sans-serif" font-size="11" fill="#37352f">• Faulty RAM</text>
      <text x="40" y="200" font-family="Inter,sans-serif" font-size="11" fill="#37352f">• Power blackout</text>
      <text x="40" y="220" font-family="Inter,sans-serif" font-size="11" fill="#37352f">• Wrong cable unplugged</text>
      <rect x="40" y="240" width="190" height="24" rx="6" fill="#e8f5e9"></rect>
      <text x="135" y="256" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#2e7d32">Fix: RAID, dual PSU, redundancy</text>

      <!-- Software -->
      <rect x="285" y="80" width="230" height="200" rx="12" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"></rect>
      <text x="400" y="108" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="13" fill="#e65100">Software Faults</text>
      <text x="400" y="128" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#787774">Systematic &amp; correlated</text>
      <line x1="315" y1="140" x2="485" y2="140" stroke="#e3e2de" stroke-width="1"></line>
      <text x="305" y="160" font-family="Inter,sans-serif" font-size="11" fill="#37352f">• Leap-second bug (2012)</text>
      <text x="305" y="180" font-family="Inter,sans-serif" font-size="11" fill="#37352f">• Runaway resource usage</text>
      <text x="305" y="200" font-family="Inter,sans-serif" font-size="11" fill="#37352f">• Cascading failures</text>
      <text x="305" y="220" font-family="Inter,sans-serif" font-size="11" fill="#37352f">• Dependency slowdown</text>
      <rect x="305" y="240" width="190" height="24" rx="6" fill="#e8f5e9"></rect>
      <text x="400" y="256" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#2e7d32">Fix: Isolation, monitoring, chaos</text>

      <!-- Human -->
      <rect x="550" y="80" width="230" height="200" rx="12" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"></rect>
      <text x="665" y="108" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="13" fill="#c62828">Human Errors</text>
      <text x="665" y="128" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#787774">Leading cause of outages</text>
      <line x1="580" y1="140" x2="750" y2="140" stroke="#e3e2de" stroke-width="1"></line>
      <text x="570" y="160" font-family="Inter,sans-serif" font-size="11" fill="#37352f">• Config errors (#1 cause)</text>
      <text x="570" y="180" font-family="Inter,sans-serif" font-size="11" fill="#37352f">• Bad deployments</text>
      <text x="570" y="200" font-family="Inter,sans-serif" font-size="11" fill="#37352f">• Wrong commands</text>
      <text x="570" y="220" font-family="Inter,sans-serif" font-size="11" fill="#37352f">• HW only 10-25% of outages</text>
      <rect x="570" y="240" width="190" height="24" rx="6" fill="#e8f5e9"></rect>
      <text x="665" y="256" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#2e7d32">Fix: Sandbox, rollback, testing</text>
    </svg>
