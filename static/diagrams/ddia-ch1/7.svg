<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" style="max-width:750px;">
      <defs>
        <marker id="arr4" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#546e7a"></polygon>
        </marker>
      </defs>

      <!-- User -->
      <circle cx="80" cy="160" r="22" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"></circle>
      <text x="80" y="155" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#0d47a1">End</text>
      <text x="80" y="167" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#0d47a1">User</text>

      <!-- Web App -->
      <rect x="160" y="125" width="130" height="70" rx="10" fill="#e8eaf6" stroke="#283593" stroke-width="1.5"></rect>
      <text x="225" y="158" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="12" fill="#283593">Web App</text>
      <text x="225" y="175" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#787774">Parallel calls</text>

      <line x1="102" y1="160" x2="160" y2="160" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arr4)"></line>

      <!-- Backend services -->
      <rect x="370" y="15" width="110" height="36" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"></rect>
      <text x="425" y="38" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#1b5e20">Backend 1</text>
      <text x="490" y="38" font-family="Inter,sans-serif" font-weight="600" font-size="10" fill="#2e7d32">92ms</text>

      <rect x="370" y="60" width="110" height="36" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"></rect>
      <text x="425" y="83" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#1b5e20">Backend 2</text>
      <text x="490" y="83" font-family="Inter,sans-serif" font-weight="600" font-size="10" fill="#2e7d32">76ms</text>

      <rect x="370" y="105" width="110" height="36" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"></rect>
      <text x="425" y="128" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#1b5e20">Backend 3</text>
      <text x="490" y="128" font-family="Inter,sans-serif" font-weight="600" font-size="10" fill="#2e7d32">103ms</text>

      <rect x="370" y="150" width="110" height="36" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"></rect>
      <text x="425" y="173" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#1b5e20">Backend 4</text>
      <text x="490" y="173" font-family="Inter,sans-serif" font-weight="600" font-size="10" fill="#2e7d32">143ms</text>

      <rect x="370" y="195" width="110" height="36" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"></rect>
      <text x="425" y="218" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#1b5e20">Backend 5</text>
      <text x="490" y="218" font-family="Inter,sans-serif" font-weight="600" font-size="10" fill="#2e7d32">86ms</text>

      <!-- Slow backend! -->
      <rect x="370" y="240" width="110" height="36" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="2"></rect>
      <text x="425" y="263" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="10" fill="#c62828">Backend 6</text>
      <text x="490" y="263" font-family="Inter,sans-serif" font-weight="700" font-size="11" fill="#c62828">487ms</text>

      <rect x="370" y="285" width="110" height="36" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"></rect>
      <text x="425" y="308" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#1b5e20">Backend 7</text>
      <text x="490" y="308" font-family="Inter,sans-serif" font-weight="600" font-size="10" fill="#2e7d32">133ms</text>

      <!-- Arrows from Web App to backends -->
      <line x1="290" y1="140" x2="370" y2="33" stroke="#546e7a" stroke-width="1" marker-end="url(#arr4)"></line>
      <line x1="290" y1="145" x2="370" y2="78" stroke="#546e7a" stroke-width="1" marker-end="url(#arr4)"></line>
      <line x1="290" y1="150" x2="370" y2="123" stroke="#546e7a" stroke-width="1" marker-end="url(#arr4)"></line>
      <line x1="290" y1="155" x2="370" y2="168" stroke="#546e7a" stroke-width="1" marker-end="url(#arr4)"></line>
      <line x1="290" y1="160" x2="370" y2="213" stroke="#546e7a" stroke-width="1" marker-end="url(#arr4)"></line>
      <line x1="290" y1="170" x2="370" y2="258" stroke="#c62828" stroke-width="1.5" marker-end="url(#arr4)"></line>
      <line x1="290" y1="180" x2="370" y2="303" stroke="#546e7a" stroke-width="1" marker-end="url(#arr4)"></line>

      <!-- Result box -->
      <rect x="570" y="130" width="200" height="70" rx="10" fill="#fce4ec" stroke="#c62828" stroke-width="2"></rect>
      <text x="670" y="155" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="12" fill="#c62828">Total Response: 487ms</text>
      <text x="670" y="175" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#37352f">Slowest backend wins</text>
      <text x="670" y="190" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#787774">Even though 6/7 were fast!</text>

      <line x1="490" y1="258" x2="570" y2="175" stroke="#c62828" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr4)"></line>
    </svg>
