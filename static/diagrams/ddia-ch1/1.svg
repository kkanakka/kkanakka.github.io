<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" style="max-width:750px;">
      <defs>
        <filter id="shadow1" x="-4%" y="-4%" width="108%" height="112%">
          <fedropshadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"></fedropshadow>
        </filter>
      </defs>
      <!-- Boxes -->
      <rect x="20" y="20" width="140" height="120" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow1)"></rect>
      <text x="90" y="52" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="13" fill="#0d47a1">Databases</text>
      <text x="90" y="72" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#546e7a">Store data</text>
      <text x="90" y="86" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#546e7a">for later retrieval</text>
      <text x="90" y="115" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#1565c0">PostgreSQL, MySQL</text>
      <text x="90" y="128" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#1565c0">MongoDB, DynamoDB</text>

      <rect x="180" y="20" width="140" height="120" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" filter="url(#shadow1)"></rect>
      <text x="250" y="52" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="13" fill="#1b5e20">Caches</text>
      <text x="250" y="72" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#546e7a">Speed up reads by</text>
      <text x="250" y="86" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#546e7a">remembering results</text>
      <text x="250" y="115" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#2e7d32">Redis, Memcached</text>
      <text x="250" y="128" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#2e7d32">CDN, Varnish</text>

      <rect x="340" y="20" width="140" height="120" rx="12" fill="#fff3e0" stroke="#e65100" stroke-width="1.5" filter="url(#shadow1)"></rect>
      <text x="410" y="52" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="13" fill="#bf360c">Search Indexes</text>
      <text x="410" y="72" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#546e7a">Search by keyword</text>
      <text x="410" y="86" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#546e7a">or filter data</text>
      <text x="410" y="115" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#e65100">Elasticsearch, Solr</text>
      <text x="410" y="128" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#e65100">Lucene, Galene</text>

      <rect x="500" y="20" width="140" height="120" rx="12" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5" filter="url(#shadow1)"></rect>
      <text x="570" y="48" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="13" fill="#4a148c">Stream</text>
      <text x="570" y="63" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="13" fill="#4a148c">Processing</text>
      <text x="570" y="83" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#546e7a">Async message</text>
      <text x="570" y="97" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#546e7a">handling</text>
      <text x="570" y="128" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#6a1b9a">Kafka, Flink, Samza</text>

      <rect x="660" y="20" width="120" height="120" rx="12" fill="#fce4ec" stroke="#c62828" stroke-width="1.5" filter="url(#shadow1)"></rect>
      <text x="720" y="48" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="13" fill="#b71c1c">Batch</text>
      <text x="720" y="63" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="13" fill="#b71c1c">Processing</text>
      <text x="720" y="83" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#546e7a">Crunch large</text>
      <text x="720" y="97" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#546e7a">accumulated data</text>
      <text x="720" y="128" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#c62828">Spark, Hadoop, MR</text>

      <!-- Bottom: Three Pillars -->
      <rect x="100" y="200" width="600" height="100" rx="14" fill="#e8eaf6" stroke="#283593" stroke-width="2" filter="url(#shadow1)"></rect>
      <text x="400" y="230" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="15" fill="#1a237e">Every System Must Be:</text>
      <text x="220" y="265" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="13" fill="#1565c0">Reliable</text>
      <text x="220" y="282" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#546e7a">Works correctly under faults</text>
      <text x="400" y="265" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="13" fill="#2e7d32">Scalable</text>
      <text x="400" y="282" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#546e7a">Handles growth gracefully</text>
      <text x="580" y="265" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="13" fill="#6a1b9a">Maintainable</text>
      <text x="580" y="282" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#546e7a">Easy to operate &amp; evolve</text>

      <!-- Arrows -->
      <line x1="90" y1="140" x2="200" y2="200" stroke="#90a4ae" stroke-width="1" stroke-dasharray="4"></line>
      <line x1="250" y1="140" x2="300" y2="200" stroke="#90a4ae" stroke-width="1" stroke-dasharray="4"></line>
      <line x1="410" y1="140" x2="400" y2="200" stroke="#90a4ae" stroke-width="1" stroke-dasharray="4"></line>
      <line x1="570" y1="140" x2="500" y2="200" stroke="#90a4ae" stroke-width="1" stroke-dasharray="4"></line>
      <line x1="720" y1="140" x2="600" y2="200" stroke="#90a4ae" stroke-width="1" stroke-dasharray="4"></line>
    </svg>
