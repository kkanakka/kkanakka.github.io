<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 270" xmlns="http://www.w3.org/2000/svg" style="max-width:750px;">
      <!-- Scale Up -->
      <rect x="30" y="20" width="340" height="230" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"></rect>
      <text x="200" y="50" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="15" fill="#0d47a1">Scale Up (Vertical)</text>
      <text x="200" y="70" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#787774">Bigger machine</text>

      <!-- Big server icon -->
      <rect x="130" y="90" width="140" height="80" rx="8" fill="#bbdefb" stroke="#1565c0" stroke-width="1"></rect>
      <text x="200" y="118" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="20" fill="#0d47a1">SERVER</text>
      <text x="200" y="138" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#546e7a">64 cores, 512GB RAM</text>
      <text x="200" y="155" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#546e7a">NVMe SSDs</text>

      <text x="60" y="195" font-family="Inter,sans-serif" font-size="11" fill="#2e7d32">+ Simpler architecture</text>
      <text x="60" y="212" font-family="Inter,sans-serif" font-size="11" fill="#2e7d32">+ No distributed complexity</text>
      <text x="60" y="232" font-family="Inter,sans-serif" font-size="11" fill="#c62828">− Very expensive at top end</text>

      <!-- Scale Out -->
      <rect x="430" y="20" width="340" height="230" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"></rect>
      <text x="600" y="50" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="15" fill="#1b5e20">Scale Out (Horizontal)</text>
      <text x="600" y="70" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#787774">Many smaller machines</text>

      <!-- Multiple small servers -->
      <rect x="460" y="90" width="65" height="45" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"></rect>
      <text x="492" y="117" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#1b5e20">Node 1</text>
      <rect x="535" y="90" width="65" height="45" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"></rect>
      <text x="567" y="117" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#1b5e20">Node 2</text>
      <rect x="610" y="90" width="65" height="45" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"></rect>
      <text x="642" y="117" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#1b5e20">Node 3</text>
      <rect x="685" y="90" width="65" height="45" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"></rect>
      <text x="717" y="117" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#1b5e20">Node N</text>

      <text x="600" y="155" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#787774">Shared-nothing architecture</text>

      <text x="460" y="180" font-family="Inter,sans-serif" font-size="11" fill="#2e7d32">+ Near-linear cost scaling</text>
      <text x="460" y="197" font-family="Inter,sans-serif" font-size="11" fill="#2e7d32">+ Better fault tolerance</text>
      <text x="460" y="217" font-family="Inter,sans-serif" font-size="11" fill="#c62828">− Distributed state is complex</text>
      <text x="460" y="234" font-family="Inter,sans-serif" font-size="11" fill="#c62828">− Network partitions, consensus</text>
    </svg>
