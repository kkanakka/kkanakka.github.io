    <text x="115" y="375" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a237e">LTX1 Sandbox</text>
    <text x="115" y="390" text-anchor="middle" font-size="9" fill="#1a237e">K8s cluster</text>
    <text x="115" y="405" text-anchor="middle" font-size="9" fill="#1a237e">Team A training</text>
    <text x="115" y="420" text-anchor="middle" font-size="9" fill="#1a237e">Network isolation</text>
    
    <rect x="200" y="350" width="130" height="80" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2" rx="4"></rect>
    <text x="265" y="375" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a237e">LVA1 Sandbox</text>
    <text x="265" y="390" text-anchor="middle" font-size="9" fill="#1a237e">VM cluster</text>
    <text x="265" y="405" text-anchor="middle" font-size="9" fill="#1a237e">Team B testing</text>
    <text x="265" y="420" text-anchor="middle" font-size="9" fill="#1a237e">Resource limits</text>
    
    <rect x="350" y="350" width="130" height="80" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2" rx="4"></rect>
    <text x="415" y="375" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a237e">EI4 Sandbox</text>
    <text x="415" y="390" text-anchor="middle" font-size="9" fill="#1a237e">Docker swarm</text>
    <text x="415" y="405" text-anchor="middle" font-size="9" fill="#1a237e">Chaos testing</text>
    <text x="415" y="420" text-anchor="middle" font-size="9" fill="#1a237e">Multi-service</text>
    
    <rect x="500" y="350" width="130" height="80" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2" stroke-dasharray="5,5" rx="4"></rect>
    <text x="565" y="375" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a237e">Auto-Scale</text>
    <text x="565" y="390" text-anchor="middle" font-size="9" fill="#1a237e">Dynamic</text>
    <text x="565" y="405" text-anchor="middle" font-size="9" fill="#1a237e">On-demand</text>
    <text x="565" y="420" text-anchor="middle" font-size="9" fill="#1a237e">Ephemeral</text>
    
    <!-- Training Dashboard -->
    <rect x="50" y="460" width="200" height="80" fill="#e8f4f8" stroke="#0077b5" stroke-width="2" rx="8"></rect>
    <text x="150" y="485" text-anchor="middle" font-size="12" font-weight="bold" fill="#01579b">Trainer Dashboard</text>
