<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" height="650" style="background:#fafafa;border:1px solid #ddd;border-radius:8px;margin:16px 0;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1119 650">
    <!-- Production Incident Sources -->
    <rect x="50" y="50" width="120" height="70" fill="#ffebee" stroke="#d32f2f" stroke-width="2" rx="4"></rect>
    <text x="110" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">Incident Logs</text>
    <text x="110" y="85" text-anchor="middle" font-size="9" fill="#c62828">Application logs</text>
    <text x="110" y="100" text-anchor="middle" font-size="9" fill="#c62828">System events</text>
    <text x="110" y="115" text-anchor="middle" font-size="9" fill="#c62828">Error traces</text>
    
    <rect x="190" y="50" width="120" height="70" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="4"></rect>
    <text x="250" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">Metrics Data</text>
    <text x="250" y="85" text-anchor="middle" font-size="9" fill="#e65100">CPU, Memory</text>
    <text x="250" y="100" text-anchor="middle" font-size="9" fill="#e65100">Latency, Errors</text>
    <text x="250" y="115" text-anchor="middle" font-size="9" fill="#e65100">Custom SLIs</text>
    
    <rect x="330" y="50" width="120" height="70" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="4"></rect>
