    <text x="350" y="590" text-anchor="middle" font-size="14" font-weight="bold" fill="#6a1b9a">Learning Analytics &amp; Effectiveness Measurement</text>
    <text x="350" y="610" text-anchor="middle" font-size="10" fill="#6a1b9a">Team skill progression • Incident pattern recognition • Knowledge retention analysis • Training ROI metrics</text>
    
    <!-- Arrows -->
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#666"></polygon>
      </marker>
    </defs>
    
    <!-- Data ingestion -->
    <line x1="320" y1="120" x2="320" y2="150" stroke="#666" stroke-width="3" marker-end="url(#arrow)"></line>
    
    <!-- Orchestration flow -->
    <line x1="140" y1="210" x2="140" y2="240" stroke="#666" stroke-width="2" marker-end="url(#arrow)"></line>
    <line x1="350" y1="210" x2="350" y2="240" stroke="#666" stroke-width="2" marker-end="url(#arrow)"></line>
    <line x1="560" y1="210" x2="560" y2="240" stroke="#666" stroke-width="2" marker-end="url(#arrow)"></line>
    
    <!-- Sandbox deployment -->
    <line x1="320" y1="320" x2="320" y2="350" stroke="#3f51b5" stroke-width="2" marker-end="url(#arrow)"></line>
    
    <!-- Training interface -->
    <line x1="320" y1="430" x2="320" y2="460" stroke="#0077b5" stroke-width="2" marker-end="url(#arrow)"></line>
    
    <!-- Analytics collection -->
    <line x1="350" y1="540" x2="350" y2="570" stroke="#9c27b0" stroke-width="2" marker-end="url(#arrow)"></line>
    
    <!-- Cross-connections -->
    <line x1="230" y1="280" x2="260" y2="280" stroke="#666" stroke-width="2" marker-end="url(#arrow)"></line>
    <line x1="440" y1="280" x2="470" y2="280" stroke="#666" stroke-width="2" marker-end="url(#arrow)"></line>
    
    <!-- Labels -->
    <text x="340" y="135" font-size="9" fill="#666">archive</text>
    <text x="245" y="275" font-size="9" fill="#666">orchestrate</text>
    <text x="455" y="275" font-size="9" fill="#666">inject</text>
    <text x="340" y="345" font-size="9" fill="#3f51b5">sandbox</text>
    <text x="340" y="455" font-size="9" fill="#0077b5">train</text>
    <text x="370" y="565" font-size="9" fill="#9c27b0">analyze</text>
  </svg>
