    <text x="150" y="520" text-anchor="middle" font-size="10" fill="#01579b">• Alert storm view</text>
    <text x="150" y="535" text-anchor="middle" font-size="10" fill="#01579b">• Log stream replay</text>
    
    <!-- Scoring Engine -->
    <rect x="280" y="460" width="180" height="80" fill="#fff8e1" stroke="#fbc02d" stroke-width="2" rx="8"></rect>
    <text x="370" y="485" text-anchor="middle" font-size="12" font-weight="bold" fill="#f57c00">Scoring Engine</text>
    <text x="370" y="505" text-anchor="middle" font-size="10" fill="#f57c00">• MTTD tracking</text>
    <text x="370" y="520" text-anchor="middle" font-size="10" fill="#f57c00">• MTTR measurement</text>
    <text x="370" y="535" text-anchor="middle" font-size="10" fill="#f57c00">• Action scoring</text>
    
    <!-- Self-Service Portal -->
    <rect x="490" y="460" width="160" height="80" fill="#e0f2f1" stroke="#00695c" stroke-width="2" rx="8"></rect>
    <text x="570" y="485" text-anchor="middle" font-size="12" font-weight="bold" fill="#004d40">Self-Service Portal</text>
    <text x="570" y="505" text-anchor="middle" font-size="10" fill="#004d40">• Incident catalog</text>
    <text x="570" y="520" text-anchor="middle" font-size="10" fill="#004d40">• Session launcher</text>
    <text x="570" y="535" text-anchor="middle" font-size="10" fill="#004d40">• Progress tracking</text>
    
