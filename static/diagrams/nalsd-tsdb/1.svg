  <path d="M660,665 L460,460" class="arrow" stroke-dasharray="3,2" stroke-opacity="0.5"></path>
  <path d="M660,665 L795,460" class="arrow" stroke-dasharray="3,2" stroke-opacity="0.5"></path>
  <text x="600" y="565" class="lbl-meta">query reads</text>
