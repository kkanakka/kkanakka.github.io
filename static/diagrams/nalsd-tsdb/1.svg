  <path d="M490,160 L490,220" class="arrow"></path>
  <path d="M490,320 L155,360" class="arrow" stroke-dasharray="3,2"></path>
  <text x="280" y="345" class="lbl-meta">index updates</text>
  <path d="M490,320 L460,360" class="arrow"></path>
  <path d="M490,320 L795,360" class="arrow" stroke-dasharray="3,2"></path>
  <text x="700" y="345" class="lbl-meta">async compact → warm</text>
  <path d="M460,460 L155,515" class="arrow"></path>
  <path d="M460,460 L460,515" class="arrow"></path>
  <path d="M460,460 L795,515" class="arrow"></path>
