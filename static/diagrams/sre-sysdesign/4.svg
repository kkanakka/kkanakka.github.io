<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" height="350" style="margin:12px 0;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 529 350">
    <rect width="100%" height="100%" fill="#fafafa" stroke="#e0e0e0"></rect>
    
    <!-- Build Clients -->
    <rect x="20" y="30" width="100" height="60" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="8"></rect>
    <text x="70" y="50" text-anchor="middle" font-size="12" font-weight="bold" fill="#1976d2">Build Client</text>
    <text x="70" y="65" text-anchor="middle" font-size="10" fill="#1976d2">CI/CD Pipeline</text>
    <text x="70" y="78" text-anchor="middle" font-size="9" fill="#1976d2">Bazel/Gradle</text>
    
    <!-- Cache Gateway -->
    <rect x="160" y="30" width="120" height="60" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="8"></rect>
    <text x="220" y="50" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">Cache Gateway</text>
    <text x="220" y="65" text-anchor="middle" font-size="10" fill="#2e7d32">Load Balancer</text>
    <text x="220" y="78" text-anchor="middle" font-size="9" fill="#2e7d32">Auth &amp; Routing</text>
    
    <!-- Hot Cache Layer (L1) -->
    <rect x="320" y="30" width="140" height="60" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="8"></rect>
    <text x="390" y="50" text-anchor="middle" font-size="12" font-weight="bold" fill="#f57c00">L1 Hot Cache</text>
    <text x="390" y="65" text-anchor="middle" font-size="10" fill="#f57c00">SSD Storage</text>
    <text x="390" y="78" text-anchor="middle" font-size="9" fill="#f57c00">Recent Artifacts</text>
    
    <!-- Cold Storage Layer (L2) -->
    <rect x="320" y="120" width="140" height="60" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="8"></rect>
    <text x="390" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#7b1fa2">L2 Cold Store</text>
    <text x="390" y="155" text-anchor="middle" font-size="10" fill="#7b1fa2">Object Storage</text>
    <text x="390" y="168" text-anchor="middle" font-size="9" fill="#7b1fa2">Long-term</text>
    
    <!-- Index Service -->
    <rect x="20" y="120" width="100" height="60" fill="#e0f2f1" stroke="#009688" stroke-width="2" rx="8"></rect>
    <text x="70" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#00695c">Index Service</text>
    <text x="70" y="155" text-anchor="middle" font-size="10" fill="#00695c">Bloom Filter</text>
    <text x="70" y="168" text-anchor="middle" font-size="9" fill="#00695c">Metadata DB</text>
    
    <!-- Lease Manager -->
    <rect x="160" y="120" width="120" height="60" fill="#fce4ec" stroke="#e91e63" stroke-width="2" rx="8"></rect>
    <text x="220" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2185b">Lease Manager</text>
    <text x="220" y="155" text-anchor="middle" font-size="10" fill="#c2185b">Eviction Control</text>
    <text x="220" y="168" text-anchor="middle" font-size="9" fill="#c2185b">Active Build Lock</text>
    
    <!-- Checksum Validator -->
    <rect x="20" y="210" width="260" height="50" fill="#fff8e1" stroke="#fbc02d" stroke-width="2" rx="8"></rect>
    <text x="150" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#f57c00">Checksum Validator</text>
    <text x="150" y="245" text-anchor="middle" font-size="10" fill="#f57c00">CRC32 + SHA-256 Verification | Bit-rot Detection</text>
    
    <!-- Replication Service -->
    <rect x="320" y="210" width="140" height="50" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2" rx="8"></rect>
    <text x="390" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#303f9f">Replication</text>
    <text x="390" y="245" text-anchor="middle" font-size="10" fill="#303f9f">Multi-Region Sync</text>
    
    <!-- Content Flow -->
    <line x1="120" y1="60" x2="160" y2="60" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"></line>
    <line x1="280" y1="60" x2="320" y2="60" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"></line>
    <line x1="390" y1="90" x2="390" y2="120" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"></line>
    
    <!-- Index queries -->
    <line x1="70" y1="120" x2="220" y2="90" stroke="#009688" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"></line>
    
    <!-- Lease coordination -->
    <line x1="220" y1="120" x2="220" y2="90" stroke="#e91e63" stroke-width="2" stroke-dasharray="3,3"></line>
    
    <!-- Labels -->
    <text x="140" y="55" font-size="9" fill="#666">PUT/GET</text>
    <text x="300" y="55" font-size="9" fill="#666">store</text>
    <text x="395" y="110" font-size="9" fill="#666">evict</text>
    <text x="140" y="100" font-size="9" fill="#009688">bloom check</text>
  </svg>
