<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" height="350" style="margin:12px 0;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 693 350">
    <rect width="100%" height="100%" fill="#fafafa" stroke="#e0e0e0"></rect>
    
    <!-- Metrics Sources -->
    <rect x="20" y="30" width="90" height="50" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="6"></rect>
    <text x="65" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#1976d2">Metrics Server</text>
    <text x="65" y="65" text-anchor="middle" font-size="9" fill="#1976d2">CPU/Memory</text>
    
    <rect x="20" y="90" width="90" height="50" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="6"></rect>
    <text x="65" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#1976d2">Custom Metrics</text>
    <text x="65" y="125" text-anchor="middle" font-size="9" fill="#1976d2">Latency/RPS</text>
    
    <!-- HPA Controller -->
    <rect x="150" y="30" width="120" height="60" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="8"></rect>
    <text x="210" y="50" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">HPA Controller</text>
    <text x="210" y="70" text-anchor="middle" font-size="10" fill="#2e7d32">Target Calculation</text>
    <text x="210" y="83" text-anchor="middle" font-size="9" fill="#2e7d32">Scale Decision Engine</text>
    
    <!-- VPA Controller -->
    <rect x="150" y="100" width="120" height="60" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="8"></rect>
    <text x="210" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#f57c00">VPA Controller</text>
    <text x="210" y="140" text-anchor="middle" font-size="10" fill="#f57c00">Resource Requests</text>
    <text x="210" y="153" text-anchor="middle" font-size="9" fill="#f57c00">Right-sizing</text>
    
    <!-- Workloads -->
    <rect x="320" y="30" width="80" height="40" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="6"></rect>
    <text x="360" y="45" text-anchor="middle" font-size="11" font-weight="bold" fill="#7b1fa2">Service A</text>
    <text x="360" y="58" text-anchor="middle" font-size="9" fill="#7b1fa2">3→6 replicas</text>
    
    <rect x="320" y="80" width="80" height="40" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="6"></rect>
    <text x="360" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#7b1fa2">Service B</text>
    <text x="360" y="108" text-anchor="middle" font-size="9" fill="#7b1fa2">2→4 replicas</text>
    
    <rect x="320" y="130" width="80" height="40" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="6"></rect>
    <text x="360" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#7b1fa2">Service C</text>
    <text x="360" y="158" text-anchor="middle" font-size="9" fill="#7b1fa2">1.2→2.0 CPU</text>
    
    <!-- Cluster Autoscaler -->
    <rect x="440" y="60" width="100" height="80" fill="#e0f2f1" stroke="#009688" stroke-width="2" rx="8"></rect>
    <text x="490" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#00695c">Cluster</text>
    <text x="490" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#00695c">Autoscaler</text>
    <text x="490" y="115" text-anchor="middle" font-size="9" fill="#00695c">Node Provisioning</text>
    <text x="490" y="128" text-anchor="middle" font-size="9" fill="#00695c">Bin Packing</text>
    
    <!-- PDB Manager -->
    <rect x="150" y="200" width="120" height="50" fill="#fce4ec" stroke="#e91e63" stroke-width="2" rx="8"></rect>
    <text x="210" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2185b">PDB Manager</text>
    <text x="210" y="235" text-anchor="middle" font-size="10" fill="#c2185b">Disruption Budget</text>
    
    <!-- Control Loops -->
    <rect x="20" y="280" width="480" height="50" fill="#fff8e1" stroke="#fbc02d" stroke-width="2" rx="8"></rect>
    <text x="260" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#f57c00">Control Loop Timing</text>
    <text x="260" y="318" text-anchor="middle" font-size="10" fill="#f57c00">HPA: 15s cycle | VPA: 1min | CA: 10s scan | PDB: continuous</text>
    
    <!-- Data flow arrows -->
    <defs>
      <marker id="arrowhead3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#666"></polygon>
      </marker>
    </defs>
    
    <!-- Metrics to controllers -->
    <line x1="110" y1="55" x2="150" y2="60" stroke="#666" stroke-width="2" marker-end="url(#arrowhead3)"></line>
    <line x1="110" y1="115" x2="150" y2="130" stroke="#666" stroke-width="2" marker-end="url(#arrowhead3)"></line>
    
    <!-- Controllers to workloads -->
    <line x1="270" y1="60" x2="320" y2="60" stroke="#4caf50" stroke-width="2" marker-end="url(#arrowhead3)"></line>
    <line x1="270" y1="130" x2="320" y2="150" stroke="#ff9800" stroke-width="2" marker-end="url(#arrowhead3)"></line>
    
    <!-- Workloads to cluster autoscaler -->
    <line x1="400" y1="100" x2="440" y2="100" stroke="#666" stroke-width="2" marker-end="url(#arrowhead3)"></line>
    
    <!-- PDB coordination -->
    <line x1="210" y1="200" x2="210" y2="160" stroke="#e91e63" stroke-width="2" stroke-dasharray="5,5"></line>
    
    <!-- Labels -->
    <text x="130" y="50" font-size="9" fill="#666">read</text>
    <text x="295" y="55" font-size="9" fill="#4caf50">scale H</text>
    <text x="295" y="145" font-size="9" fill="#ff9800">scale V</text>
    <text x="420" y="95" font-size="9" fill="#666">nodes</text>
  </svg>
