<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" height="450" style="margin:12px 0;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 594 450">
    <rect width="100%" height="100%" fill="#fafafa" stroke="#e0e0e0"></rect>
    
    <!-- Data Sources -->
    <rect x="20" y="30" width="80" height="40" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="6"></rect>
    <text x="60" y="45" text-anchor="middle" font-size="10" font-weight="bold" fill="#1976d2">Node Agent</text>
    <text x="60" y="58" text-anchor="middle" font-size="8" fill="#1976d2">Prometheus</text>
    
    <rect x="20" y="80" width="80" height="40" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="6"></rect>
    <text x="60" y="95" text-anchor="middle" font-size="10" font-weight="bold" fill="#1976d2">App Metrics</text>
    <text x="60" y="108" text-anchor="middle" font-size="8" fill="#1976d2">Custom SDK</text>
    
    <rect x="20" y="130" width="80" height="40" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="6"></rect>
    <text x="60" y="145" text-anchor="middle" font-size="10" font-weight="bold" fill="#1976d2">K8s Events</text>
    <text x="60" y="158" text-anchor="middle" font-size="8" fill="#1976d2">kube-state</text>
    
    <!-- Ingestion Layer -->
    <rect x="140" y="60" width="100" height="80" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="8"></rect>
    <text x="190" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">Ingestion</text>
    <text x="190" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">Gateway</text>
    <text x="190" y="110" text-anchor="middle" font-size="9" fill="#2e7d32">Load Balancer</text>
    <text x="190" y="125" text-anchor="middle" font-size="9" fill="#2e7d32">Rate Limiting</text>
    
    <!-- Stream Processing -->
    <rect x="280" y="30" width="120" height="110" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="8"></rect>
    <text x="340" y="50" text-anchor="middle" font-size="12" font-weight="bold" fill="#f57c00">Stream Processor</text>
    <text x="340" y="70" text-anchor="middle" font-size="10" fill="#f57c00">• Deduplication</text>
    <text x="340" y="85" text-anchor="middle" font-size="10" fill="#f57c00">• Aggregation (1m)</text>
    <text x="340" y="100" text-anchor="middle" font-size="10" fill="#f57c00">• Compression</text>
    <text x="340" y="115" text-anchor="middle" font-size="10" fill="#f57c00">• Cardinality Control</text>
    <text x="340" y="130" text-anchor="middle" font-size="9" fill="#f57c00">Kafka Streams</text>
    
    <!-- Hot Storage -->
    <rect x="440" y="30" width="100" height="60" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="8"></rect>
    <text x="490" y="50" text-anchor="middle" font-size="12" font-weight="bold" fill="#7b1fa2">Hot TSDB</text>
    <text x="490" y="65" text-anchor="middle" font-size="10" fill="#7b1fa2">In-Memory</text>
    <text x="490" y="78" text-anchor="middle" font-size="9" fill="#7b1fa2">Last 2 hours</text>
    
    <!-- Warm Storage -->
    <rect x="440" y="100" width="100" height="60" fill="#e0f2f1" stroke="#009688" stroke-width="2" rx="8"></rect>
    <text x="490" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#00695c">Warm TSDB</text>
    <text x="490" y="135" text-anchor="middle" font-size="10" fill="#00695c">SSD Storage</text>
    <text x="490" y="148" text-anchor="middle" font-size="9" fill="#00695c">Last 7 days</text>
    
    <!-- Cold Storage -->
    <rect x="440" y="170" width="100" height="60" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2" rx="8"></rect>
    <text x="490" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#303f9f">Cold Storage</text>
    <text x="490" y="205" text-anchor="middle" font-size="10" fill="#303f9f">Object Store</text>
    <text x="490" y="218" text-anchor="middle" font-size="9" fill="#303f9f">6+ months</text>
    
    <!-- Query Engine -->
    <rect x="280" y="180" width="120" height="80" fill="#fce4ec" stroke="#e91e63" stroke-width="2" rx="8"></rect>
    <text x="340" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2185b">Query Engine</text>
    <text x="340" y="220" text-anchor="middle" font-size="10" fill="#c2185b">PromQL Parser</text>
    <text x="340" y="235" text-anchor="middle" font-size="10" fill="#c2185b">Fan-out Router</text>
    <text x="340" y="250" text-anchor="middle" font-size="9" fill="#c2185b">Result Merger</text>
    
    <!-- Dashboards -->
    <rect x="20" y="300" width="80" height="40" fill="#fff8e1" stroke="#fbc02d" stroke-width="2" rx="6"></rect>
    <text x="60" y="315" text-anchor="middle" font-size="10" font-weight="bold" fill="#f57c00">Grafana</text>
    <text x="60" y="328" text-anchor="middle" font-size="8" fill="#f57c00">Dashboards</text>
    
    <!-- Alerting -->
    <rect x="20" y="350" width="80" height="40" fill="#fff8e1" stroke="#fbc02d" stroke-width="2" rx="6"></rect>
    <text x="60" y="365" text-anchor="middle" font-size="10" font-weight="bold" fill="#f57c00">Alertmanager</text>
    <text x="60" y="378" text-anchor="middle" font-size="8" fill="#f57c00">PagerDuty</text>
    
    <!-- Cardinality Monitor -->
    <rect x="140" y="280" width="100" height="60" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="8"></rect>
    <text x="190" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#d32f2f">Cardinality</text>
    <text x="190" y="315" text-anchor="middle" font-size="11" font-weight="bold" fill="#d32f2f">Monitor</text>
    <text x="190" y="330" text-anchor="middle" font-size="9" fill="#d32f2f">Series Explosion Detection</text>
    
    <!-- Data flow arrows -->
    <defs>
      <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#666"></polygon>
      </marker>
    </defs>
    
    <line x1="100" y1="100" x2="140" y2="100" stroke="#666" stroke-width="2" marker-end="url(#arrowhead2)"></line>
    <line x1="240" y1="100" x2="280" y2="85" stroke="#666" stroke-width="2" marker-end="url(#arrowhead2)"></line>
    
    <!-- Hot path -->
    <line x1="400" y1="60" x2="440" y2="60" stroke="#9c27b0" stroke-width="3" marker-end="url(#arrowhead2)"></line>
    <text x="420" y="55" font-size="8" fill="#9c27b0">hot</text>
    
    <!-- Warm path -->
    <line x1="400" y1="90" x2="440" y2="120" stroke="#009688" stroke-width="2" marker-end="url(#arrowhead2)"></line>
    <text x="415" y="110" font-size="8" fill="#009688">warm</text>
    
    <!-- Cold path -->
    <line x1="400" y1="120" x2="440" y2="180" stroke="#3f51b5" stroke-width="2" marker-end="url(#arrowhead2)"></line>
    <text x="415" y="155" font-size="8" fill="#3f51b5">cold</text>
    
    <!-- Query paths -->
    <line x1="400" y1="220" x2="440" y2="140" stroke="#e91e63" stroke-width="2" stroke-dasharray="5,5"></line>
    <line x1="400" y1="230" x2="440" y2="200" stroke="#e91e63" stroke-width="2" stroke-dasharray="5,5"></line>
    
    <!-- Client queries -->
    <line x1="100" y1="320" x2="280" y2="240" stroke="#666" stroke-width="2" marker-end="url(#arrowhead2)"></line>
    <line x1="100" y1="370" x2="280" y2="250" stroke="#666" stroke-width="2" marker-end="url(#arrowhead2)"></line>
    
    <!-- Cardinality feedback -->
    <line x1="190" y1="280" x2="190" y2="140" stroke="#f44336" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowhead2)"></line>
    
    <!-- Labels -->
    <text x="120" y="95" font-size="9" fill="#666">10M/s</text>
    <text x="260" y="80" font-size="9" fill="#666">batch</text>
    <text x="420" y="80" font-size="8" fill="#666">tier</text>
    <text x="190" y="365" font-size="8" fill="#666">alerts</text>
  </svg>
