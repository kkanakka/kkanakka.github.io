<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 820" xmlns="http://www.w3.org/2000/svg"><style>.box-fill-blue{fill:#ddf4ff;stroke:#54aeff}
.box-fill-green{fill:#dafbe1;stroke:#4ac26b}
.box-fill-purple{fill:#fbefff;stroke:#c297ff}
.box-fill-orange{fill:#fff1e5;stroke:#fd8c73}
.box-fill-red{fill:#ffebe9;stroke:#ff8182}
.box-fill-yellow{fill:#fff8c5;stroke:#d4a72c}
.box-fill-gray{fill:#f6f8fa;stroke:#d0d7de}
.lbl-title{font-family:'Inter',sans-serif;font-weight:700;font-size:11.5px;fill:#1f2328}
.lbl-sub{font-family:'JetBrains Mono',monospace;font-size:9.5px;fill:#59636e}
.lbl-meta{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#818b98}
.arrow{stroke:#59636e;stroke-width:1.3;fill:none;marker-end:url(#arr)}
.arrow-dashed{stroke:#cf222e;stroke-width:1.2;fill:none;stroke-dasharray:4,3;marker-end:url(#arr-red)}
.arrow-green{stroke:#1a7f37;stroke-width:1.5;fill:none;marker-end:url(#arr-green)}</style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#59636e"></path>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"></path>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"></path>
    </marker>
  </defs>

  <!-- SLO ribbon -->
  <text x="490" y="22" text-anchor="middle" class="lbl-title" style="font-size:13px">1 PB · 5M ops/s · p99 ≤ 10 ms · O(log N) routing · RF=3 · W=2 R=1 · self-organizing</text>

  <!-- Step badges -->
  <circle cx="155" cy="60" r="11" fill="#0a66c2"></circle>
  <text x="155" y="64" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">1</text>
  <circle cx="490" cy="60" r="11" fill="#0a66c2"></circle>
  <text x="490" y="64" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">2</text>
  <circle cx="820" cy="60" r="11" fill="#0a66c2"></circle>
  <text x="820" y="64" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">3</text>
  <circle cx="490" cy="195" r="11" fill="#0a66c2"></circle>
  <text x="490" y="199" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">4</text>
  <circle cx="155" cy="345" r="11" fill="#0a66c2"></circle>
  <text x="155" y="349" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">5</text>
  <circle cx="490" cy="345" r="11" fill="#0a66c2"></circle>
  <text x="490" y="349" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">6</text>
  <circle cx="820" cy="345" r="11" fill="#0a66c2"></circle>
  <text x="820" y="349" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">7</text>
  <circle cx="155" cy="510" r="11" fill="#0a66c2"></circle>
  <text x="155" y="514" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">8</text>
  <circle cx="490" cy="510" r="11" fill="#0a66c2"></circle>
  <text x="490" y="514" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">9</text>
  <circle cx="820" cy="510" r="11" fill="#0a66c2"></circle>
  <text x="820" y="514" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">10</text>
  <circle cx="490" cy="670" r="11" fill="#0a66c2"></circle>
  <text x="490" y="674" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">11</text>

  <!-- ============ ROW 1: Clients · Coordinator · Bootstrap ============ -->
  <g>
    <rect x="20" y="85" width="270" height="80" rx="6" class="box-fill-gray"></rect>
    <text x="155" y="108" text-anchor="middle" class="lbl-title">Client SDK</text>
    <text x="155" y="125" text-anchor="middle" class="lbl-sub">Profile · InMail · Features · Connect</text>
    <text x="155" y="141" text-anchor="middle" class="lbl-sub">key cache (60 s TTL) · retry logic</text>
    <text x="155" y="157" text-anchor="middle" class="lbl-meta">~2 M app pods using SDK</text>
  </g>

  <g>
    <rect x="320" y="85" width="340" height="80" rx="6" class="box-fill-blue"></rect>
    <text x="490" y="108" text-anchor="middle" class="lbl-title">Coordinator (any node)</text>
    <text x="490" y="125" text-anchor="middle" class="lbl-sub">finger-table lookup · routes to owner</text>
    <text x="490" y="141" text-anchor="middle" class="lbl-sub">handles W/R quorum on behalf of client</text>
    <text x="490" y="157" text-anchor="middle" class="lbl-meta">stateless role · every DHT node can act</text>
  </g>

  <g>
    <rect x="680" y="85" width="280" height="80" rx="6" class="box-fill-yellow"></rect>
    <text x="820" y="108" text-anchor="middle" class="lbl-title">Bootstrap / config (Spanner)</text>
    <text x="820" y="125" text-anchor="middle" class="lbl-sub">seed node list · cluster membership</text>
    <text x="820" y="141" text-anchor="middle" class="lbl-sub">topology version · RF/quorum config</text>
    <text x="820" y="157" text-anchor="middle" class="lbl-meta">consulted once at SDK startup</text>
  </g>

  <!-- ============ ROW 2: The Ring (the heart) ============ -->
  <rect x="20" y="225" width="940" height="100" rx="8" fill="#fafbfc" stroke="#eaeef2"></rect>
  <text x="490" y="250" text-anchor="middle" class="lbl-title" style="font-size:13px">The Ring · 1000 DHT nodes per region · consistent hash on SHA-256 keyspace · 256 vnodes/node</text>

  <g>
    <rect x="40" y="265" width="130" height="55" rx="4" class="box-fill-green"></rect>
    <text x="105" y="282" text-anchor="middle" class="lbl-title">Node N₁</text>
    <text x="105" y="297" text-anchor="middle" class="lbl-sub">id: 0x07ab...</text>
    <text x="105" y="310" text-anchor="middle" class="lbl-meta">10 fingers · 32 GB cache</text>
  </g>
  <g>
    <rect x="190" y="265" width="130" height="55" rx="4" class="box-fill-green"></rect>
    <text x="255" y="282" text-anchor="middle" class="lbl-title">Node N₂</text>
    <text x="255" y="297" text-anchor="middle" class="lbl-sub">id: 0x14f3...</text>
    <text x="255" y="310" text-anchor="middle" class="lbl-meta">vnodes · finger table</text>
  </g>
  <g>
    <rect x="340" y="265" width="130" height="55" rx="4" class="box-fill-green"></rect>
    <text x="405" y="282" text-anchor="middle" class="lbl-title">Node N₃</text>
    <text x="405" y="297" text-anchor="middle" class="lbl-sub">id: 0x29bc...</text>
    <text x="405" y="310" text-anchor="middle" class="lbl-meta">1.3 TB NVMe</text>
  </g>
  <text x="510" y="297" text-anchor="middle" class="lbl-title" style="font-size:18px">···</text>
  <g>
    <rect x="540" y="265" width="130" height="55" rx="4" class="box-fill-green"></rect>
    <text x="605" y="282" text-anchor="middle" class="lbl-title">Node Nₖ</text>
    <text x="605" y="297" text-anchor="middle" class="lbl-sub">id: 0x9b21...</text>
    <text x="605" y="310" text-anchor="middle" class="lbl-meta">range owner for key K</text>
  </g>
  <g>
    <rect x="690" y="265" width="130" height="55" rx="4" class="box-fill-green"></rect>
    <text x="755" y="282" text-anchor="middle" class="lbl-title">Node Nₖ₊₁</text>
    <text x="755" y="297" text-anchor="middle" class="lbl-sub">id: 0xa3e7...</text>
    <text x="755" y="310" text-anchor="middle" class="lbl-meta">replica 2</text>
  </g>
  <g>
    <rect x="840" y="265" width="120" height="55" rx="4" class="box-fill-green"></rect>
    <text x="900" y="282" text-anchor="middle" class="lbl-title">Node N₁₀₀₀</text>
    <text x="900" y="297" text-anchor="middle" class="lbl-sub">replica 3</text>
    <text x="900" y="310" text-anchor="middle" class="lbl-meta">N=3</text>
  </g>

  <!-- ============ ROW 3: Per-node responsibilities ============ -->
  <g>
    <rect x="20" y="370" width="270" height="100" rx="6" class="box-fill-purple"></rect>
    <text x="155" y="393" text-anchor="middle" class="lbl-title">Routing layer</text>
    <text x="155" y="410" text-anchor="middle" class="lbl-sub">finger table · 10 entries</text>
    <text x="155" y="426" text-anchor="middle" class="lbl-sub">successor list (next 3 nodes)</text>
    <text x="155" y="443" text-anchor="middle" class="lbl-meta">stabilization protocol</text>
    <text x="155" y="457" text-anchor="middle" class="lbl-meta">O(log N) lookup</text>
  </g>

  <g>
    <rect x="320" y="370" width="340" height="100" rx="6" class="box-fill-orange"></rect>
    <text x="490" y="393" text-anchor="middle" class="lbl-title">Storage layer</text>
    <text x="490" y="410" text-anchor="middle" class="lbl-sub">LSM tree on NVMe · 1.3 TB/node</text>
    <text x="490" y="426" text-anchor="middle" class="lbl-sub">in-memory LRU cache · 32 GB · 85% hit</text>
    <text x="490" y="443" text-anchor="middle" class="lbl-meta">vector clock per key for conflict resolution</text>
    <text x="490" y="457" text-anchor="middle" class="lbl-meta">tombstones · TTLs · merkle tree per range</text>
  </g>

  <g>
    <rect x="680" y="370" width="280" height="100" rx="6" class="box-fill-blue"></rect>
    <text x="820" y="393" text-anchor="middle" class="lbl-title">Gossip + failure detection</text>
    <text x="820" y="410" text-anchor="middle" class="lbl-sub">SWIM protocol (every 1 s)</text>
    <text x="820" y="426" text-anchor="middle" class="lbl-sub">heartbeats to k=log(N) peers</text>
    <text x="820" y="443" text-anchor="middle" class="lbl-meta">detect failures &lt; 10 s</text>
    <text x="820" y="457" text-anchor="middle" class="lbl-meta">spread via epidemic protocol</text>
  </g>

  <!-- ============ ROW 4: Replication, Anti-entropy, Cross-region ============ -->
  <g>
    <rect x="20" y="535" width="270" height="100" rx="6" class="box-fill-red"></rect>
    <text x="155" y="558" text-anchor="middle" class="lbl-title">Replication path</text>
    <text x="155" y="575" text-anchor="middle" class="lbl-sub">RF=3, AZ-aware placement</text>
    <text x="155" y="591" text-anchor="middle" class="lbl-sub">W=2 quorum on write</text>
    <text x="155" y="608" text-anchor="middle" class="lbl-meta">R=1 on read (fast path)</text>
    <text x="155" y="622" text-anchor="middle" class="lbl-meta">hinted handoff if replica down</text>
  </g>

  <g>
    <rect x="320" y="535" width="340" height="100" rx="6" class="box-fill-yellow"></rect>
    <text x="490" y="558" text-anchor="middle" class="lbl-title">Anti-entropy (background)</text>
    <text x="490" y="575" text-anchor="middle" class="lbl-sub">Merkle tree comparison every 1 h</text>
    <text x="490" y="591" text-anchor="middle" class="lbl-sub">read-repair on inconsistency at read time</text>
    <text x="490" y="608" text-anchor="middle" class="lbl-meta">heals partition divergence</text>
    <text x="490" y="622" text-anchor="middle" class="lbl-meta">15 worker pool, throttled</text>
  </g>

  <g>
    <rect x="680" y="535" width="280" height="100" rx="6" class="box-fill-purple"></rect>
    <text x="820" y="558" text-anchor="middle" class="lbl-title">Cross-region replication</text>
    <text x="820" y="575" text-anchor="middle" class="lbl-sub">async to peer regions</text>
    <text x="820" y="591" text-anchor="middle" class="lbl-sub">~5 s lag · invalidate (not replicate)</text>
    <text x="820" y="608" text-anchor="middle" class="lbl-meta">tombstone propagation</text>
    <text x="820" y="622" text-anchor="middle" class="lbl-meta">read-your-writes via cookies</text>
  </g>

  <!-- ============ ROW 5: Observability + admission ============ -->
  <g>
    <rect x="20" y="700" width="940" height="80" rx="6" class="box-fill-gray"></rect>
    <text x="490" y="723" text-anchor="middle" class="lbl-title" style="font-size:13px">Observability · admin · admission control</text>
    <text x="490" y="740" text-anchor="middle" class="lbl-sub">per-node metrics · ring topology dashboard · load skew alerts · rate limiting</text>
    <text x="490" y="760" text-anchor="middle" class="lbl-meta">chaos injection: random node kill · network partition · slow node simulation</text>
  </g>

  <!-- ARROWS -->
  <path d="M290,125 L320,125" class="arrow"></path>
  <text x="305" y="120" text-anchor="middle" class="lbl-meta">request</text>
  <path d="M660,125 L680,125" class="arrow" stroke-dasharray="3,2"></path>
  <text x="670" y="120" text-anchor="middle" class="lbl-meta">cluster meta</text>
  <path d="M490,165 L490,225" class="arrow"></path>

  <path d="M105,320 L155,370" class="arrow"></path>
  <path d="M255,320 L490,370" class="arrow"></path>
  <path d="M755,320 L820,370" class="arrow"></path>

  <path d="M155,470 L155,535" class="arrow"></path>
  <path d="M490,470 L490,535" class="arrow"></path>
  <path d="M820,470 L820,535" class="arrow"></path>

  <path d="M155,635 L490,700" class="arrow"></path>
  <path d="M490,635 L490,700" class="arrow"></path>
  <path d="M820,635 L490,700" class="arrow"></path>
</svg>
