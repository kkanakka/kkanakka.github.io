<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 820" xmlns="http://www.w3.org/2000/svg"><style>.box-fill-blue{fill:#ddf4ff;stroke:#54aeff}
.box-fill-green{fill:#dafbe1;stroke:#4ac26b}
.box-fill-purple{fill:#fbefff;stroke:#c297ff}
.box-fill-orange{fill:#fff1e5;stroke:#fd8c73}
.box-fill-red{fill:#ffebe9;stroke:#ff8182}
.box-fill-yellow{fill:#fff8c5;stroke:#d4a72c}
.box-fill-gray{fill:#f6f8fa;stroke:#d0d7de}
.lbl-title{font-family:'Inter',sans-serif;font-weight:700;font-size:11.5px;fill:#1f2328}
.lbl-sub{font-family:'JetBrains Mono',monospace;font-size:9.5px;fill:#59636e}
.lbl-meta{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#818b98}
.arrow{stroke:#59636e;stroke-width:1.3;fill:none;marker-end:url(#arr)}
.arrow-dashed{stroke:#cf222e;stroke-width:1.2;fill:none;stroke-dasharray:4,3;marker-end:url(#arr-red)}
.arrow-green{stroke:#1a7f37;stroke-width:1.5;fill:none;marker-end:url(#arr-green)}</style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#59636e"></path>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"></path>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"></path>
    </marker>
  </defs>

  <!-- Top SLO ribbon -->
  <text x="490" y="22" text-anchor="middle" class="lbl-title" style="font-size:13px">5M alerts/day · p99 ≤ 30s delivery · 99.999% reliability · 1,667× noise reduction</text>

  <!-- Step number badges -->
  <circle cx="155" cy="60" r="11" fill="#0a66c2"></circle>
  <text x="155" y="64" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">1</text>
  <circle cx="490" cy="60" r="11" fill="#0a66c2"></circle>
  <text x="490" y="64" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">2</text>
  <circle cx="820" cy="60" r="11" fill="#0a66c2"></circle>
  <text x="820" y="64" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">3</text>
  <circle cx="490" cy="200" r="11" fill="#0a66c2"></circle>
  <text x="490" y="204" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">4</text>
  <circle cx="155" cy="335" r="11" fill="#0a66c2"></circle>
  <text x="155" y="339" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">5</text>
  <circle cx="490" cy="335" r="11" fill="#0a66c2"></circle>
  <text x="490" y="339" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">6</text>
  <circle cx="820" cy="335" r="11" fill="#0a66c2"></circle>
  <text x="820" y="339" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">7</text>
  <circle cx="490" cy="495" r="11" fill="#0a66c2"></circle>
  <text x="490" y="499" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">8</text>
  <circle cx="155" cy="665" r="11" fill="#0a66c2"></circle>
  <text x="155" y="669" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">9</text>
  <circle cx="820" cy="665" r="11" fill="#0a66c2"></circle>
  <text x="820" y="669" text-anchor="middle" fill="#fff" font-family="JetBrains Mono" font-size="11" font-weight="700">10</text>

  <!-- ============ ROW 1: Alert sources · Gateway · DLQ ============ -->
  <g>
    <rect x="20" y="85" width="270" height="80" rx="6" class="box-fill-gray"></rect>
    <text x="155" y="108" text-anchor="middle" class="lbl-title">Alert sources</text>
    <text x="155" y="125" text-anchor="middle" class="lbl-sub">Prometheus · Stackdriver</text>
    <text x="155" y="141" text-anchor="middle" class="lbl-sub">Datadog · NewRelic · custom</text>
    <text x="155" y="157" text-anchor="middle" class="lbl-meta">webhooks · gRPC · TLS auth</text>
  </g>

  <g>
    <rect x="320" y="85" width="340" height="80" rx="6" class="box-fill-blue"></rect>
    <text x="490" y="108" text-anchor="middle" class="lbl-title">Alert gateway (multi-region)</text>
    <text x="490" y="125" text-anchor="middle" class="lbl-sub">auth · rate limit · schema normalize</text>
    <text x="490" y="141" text-anchor="middle" class="lbl-sub">enrich (team owner · runbook URL)</text>
    <text x="490" y="157" text-anchor="middle" class="lbl-meta">15 nodes · 2k alerts/s each · HPA to 40</text>
  </g>

  <g>
    <rect x="680" y="85" width="280" height="80" rx="6" class="box-fill-red"></rect>
    <text x="820" y="108" text-anchor="middle" class="lbl-title">DLQ (malformed)</text>
    <text x="820" y="125" text-anchor="middle" class="lbl-sub">bad schema · auth fail · over quota</text>
    <text x="820" y="141" text-anchor="middle" class="lbl-sub">depth alert + auto-replay valid</text>
    <text x="820" y="157" text-anchor="middle" class="lbl-meta">retained 7 days</text>
  </g>

  <!-- ============ ROW 2: Kafka ============ -->
  <g>
    <rect x="20" y="225" width="940" height="80" rx="6" class="box-fill-green"></rect>
    <text x="490" y="248" text-anchor="middle" class="lbl-title" style="font-size:13px">Kafka — raw-alerts (durable, multi-region)</text>
    <text x="490" y="266" text-anchor="middle" class="lbl-sub">partitioned by hash(service + fingerprint) · 500 partitions · 3× replication</text>
    <text x="490" y="282" text-anchor="middle" class="lbl-sub">MirrorMaker2 cross-region async · 7-day retention</text>
    <text x="490" y="298" text-anchor="middle" class="lbl-meta">9 brokers · 1k alerts/s peak · 7-day replay window</text>
  </g>

  <!-- ============ ROW 3: Dedupe · Correlate · Route ============ -->
  <g>
    <rect x="20" y="360" width="280" height="120" rx="6" class="box-fill-purple"></rect>
    <text x="160" y="383" text-anchor="middle" class="lbl-title">Deduplication engine</text>
    <text x="160" y="400" text-anchor="middle" class="lbl-sub">fingerprint cache (Redis)</text>
    <text x="160" y="415" text-anchor="middle" class="lbl-sub">15-min rolling window</text>
    <text x="160" y="432" text-anchor="middle" class="lbl-sub">storm prevention: 10/min/svc cap</text>
    <text x="160" y="450" text-anchor="middle" class="lbl-meta">12 nodes · 2 MB cache</text>
    <text x="160" y="465" text-anchor="middle" class="lbl-meta">5M → 250K (20× reduction)</text>
  </g>

  <g>
    <rect x="320" y="360" width="340" height="120" rx="6" class="box-fill-purple"></rect>
    <text x="490" y="383" text-anchor="middle" class="lbl-title">Correlation &amp; grouping (causality engine)</text>
    <text x="490" y="400" text-anchor="middle" class="lbl-sub">service dependency graph (real-time)</text>
    <text x="490" y="415" text-anchor="middle" class="lbl-sub">temporal window: 60 s post-root cause</text>
    <text x="490" y="432" text-anchor="middle" class="lbl-sub">topological correlation (BFS depth 2)</text>
    <text x="490" y="450" text-anchor="middle" class="lbl-meta">50 nodes · 4k graph edges in RAM</text>
    <text x="490" y="465" text-anchor="middle" class="lbl-meta">250K → 25K (10× reduction · composite alerts)</text>
  </g>

  <g>
    <rect x="680" y="360" width="280" height="120" rx="6" class="box-fill-purple"></rect>
    <text x="820" y="383" text-anchor="middle" class="lbl-title">Priority + routing</text>
    <text x="820" y="400" text-anchor="middle" class="lbl-sub">severity map: P0/P1/P2/P3</text>
    <text x="820" y="415" text-anchor="middle" class="lbl-sub">on-call scheduler lookup</text>
    <text x="820" y="432" text-anchor="middle" class="lbl-sub">team rotation + tz awareness</text>
    <text x="820" y="450" text-anchor="middle" class="lbl-meta">15 nodes · stateless</text>
    <text x="820" y="465" text-anchor="middle" class="lbl-meta">25K → 3K pages (8× reduction)</text>
  </g>

  <!-- ============ ROW 4: Notifier (channels) ============ -->
  <g>
    <rect x="20" y="520" width="940" height="100" rx="6" class="box-fill-orange"></rect>
    <text x="490" y="543" text-anchor="middle" class="lbl-title" style="font-size:13px">Multi-channel notifier (delivery fanout)</text>

    <rect x="40" y="555" width="220" height="55" rx="4" fill="#fff" stroke="#fd8c73"></rect>
    <text x="150" y="573" text-anchor="middle" class="lbl-title">PRIMARY</text>
    <text x="150" y="590" text-anchor="middle" class="lbl-sub">PagerDuty · Email SMTP</text>
    <text x="150" y="603" text-anchor="middle" class="lbl-meta">circuit breaker · retry backoff</text>

    <rect x="285" y="555" width="220" height="55" rx="4" fill="#fff" stroke="#fd8c73"></rect>
    <text x="395" y="573" text-anchor="middle" class="lbl-title">SECONDARY</text>
    <text x="395" y="590" text-anchor="middle" class="lbl-sub">Slack · MS Teams webhooks</text>
    <text x="395" y="603" text-anchor="middle" class="lbl-meta">rich formatting · action buttons</text>

    <rect x="530" y="555" width="220" height="55" rx="4" fill="#fff" stroke="#fd8c73"></rect>
    <text x="640" y="573" text-anchor="middle" class="lbl-title">FALLBACK</text>
    <text x="640" y="590" text-anchor="middle" class="lbl-sub">SMS · push · phone call</text>
    <text x="640" y="603" text-anchor="middle" class="lbl-meta">P0/P1 only · last resort</text>

    <rect x="775" y="555" width="170" height="55" rx="4" fill="#fff" stroke="#fd8c73"></rect>
    <text x="860" y="573" text-anchor="middle" class="lbl-title">DELIVERY</text>
    <text x="860" y="590" text-anchor="middle" class="lbl-sub">strategy chain</text>
    <text x="860" y="603" text-anchor="middle" class="lbl-meta">P→S→F if no ACK</text>
  </g>

  <!-- ============ ROW 5: State + Audit + On-call ============ -->
  <g>
    <rect x="40" y="690" width="280" height="100" rx="6" class="box-fill-blue"></rect>
    <text x="180" y="713" text-anchor="middle" class="lbl-title">State store (Spanner)</text>
    <text x="180" y="730" text-anchor="middle" class="lbl-sub">FIRING · ACKED · RESOLVED</text>
    <text x="180" y="746" text-anchor="middle" class="lbl-sub">ESCALATED · SUPPRESSED</text>
    <text x="180" y="763" text-anchor="middle" class="lbl-meta">global consistency · CRDT for ACK sync</text>
    <text x="180" y="778" text-anchor="middle" class="lbl-meta">3 nodes · ACK propagation &lt; 10 s</text>
  </g>

  <g>
    <rect x="340" y="690" width="300" height="100" rx="6" class="box-fill-yellow"></rect>
    <text x="490" y="713" text-anchor="middle" class="lbl-title">Audit + analytics</text>
    <text x="490" y="730" text-anchor="middle" class="lbl-sub">event-sourced Kafka · 1y retention</text>
    <text x="490" y="746" text-anchor="middle" class="lbl-sub">time-to-ack · MTTR · FP rate</text>
    <text x="490" y="763" text-anchor="middle" class="lbl-meta">channel success rate · team scoreboard</text>
    <text x="490" y="778" text-anchor="middle" class="lbl-meta">feeds SLO tracker</text>
  </g>

  <g>
    <rect x="660" y="690" width="300" height="100" rx="6" class="box-fill-green"></rect>
    <text x="810" y="713" text-anchor="middle" class="lbl-title">On-call engineer</text>
    <text x="810" y="730" text-anchor="middle" class="lbl-sub">receives 1 composite page</text>
    <text x="810" y="746" text-anchor="middle" class="lbl-sub">acks via PD or Slack button</text>
    <text x="810" y="763" text-anchor="middle" class="lbl-meta">links to dashboards · runbook · trace</text>
    <text x="810" y="778" text-anchor="middle" class="lbl-meta">ack flows back via state store globally</text>
  </g>

  <!-- ============ ARROWS ============ -->
  <path d="M290,125 L320,125" class="arrow"></path>
  <path d="M660,110 L680,105" class="arrow-dashed"></path>
  <path d="M490,165 L490,225" class="arrow"></path>
  <path d="M490,305 L490,360" class="arrow"></path>
