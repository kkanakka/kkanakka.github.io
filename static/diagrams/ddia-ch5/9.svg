<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" style="max-width:800px;">
      <defs><marker id="aF" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#546e7a"></polygon></marker>
      <filter id="shF3" x="-3%" y="-3%" width="106%" height="110%"><fedropshadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.06"></fedropshadow></filter></defs>

      <text x="410" y="22" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="15" fill="#2e7d32">Consensus Protocol Lineage</text>

      <!-- Root: Paxos -->
      <rect x="300" y="40" width="160" height="45" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2" filter="url(#shF3)"></rect>
      <text x="380" y="60" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="12" fill="#4a148c">Paxos (1989)</text>
      <text x="380" y="77" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#787774">Lamport. Foundation.</text>

      <!-- VR -->
      <rect x="30" y="40" width="170" height="45" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" filter="url(#shF3)"></rect>
      <text x="115" y="60" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="11" fill="#0d47a1">Viewstamped Repl (1988)</text>
      <text x="115" y="77" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#787774">Liskov. Independent origin.</text>

      <!-- Branches from Paxos -->
      <line x1="340" y1="85" x2="110" y2="120" stroke="#546e7a" stroke-width="1.2" marker-end="url(#aF)"></line>
      <line x1="360" y1="85" x2="260" y2="120" stroke="#546e7a" stroke-width="1.2" marker-end="url(#aF)"></line>
      <line x1="400" y1="85" x2="420" y2="120" stroke="#546e7a" stroke-width="1.2" marker-end="url(#aF)"></line>
      <line x1="420" y1="85" x2="570" y2="120" stroke="#546e7a" stroke-width="1.2" marker-end="url(#aF)"></line>
      <line x1="440" y1="85" x2="720" y2="120" stroke="#546e7a" stroke-width="1.2" marker-end="url(#aF)"></line>

      <!-- Multi-Paxos -->
      <rect x="20" y="120" width="180" height="55" rx="8" fill="#e8eaf6" stroke="#283593" stroke-width="1.5"></rect>
      <text x="110" y="140" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="11" fill="#283593">Multi-Paxos</text>
      <text x="35" y="158" font-family="Inter,sans-serif" font-size="9" fill="#37352f">Stable leader, skip Phase 1</text>
      <text x="35" y="170" font-family="Inter,sans-serif" font-size="8" fill="#787774">Spanner, Chubby</text>

      <!-- ZAB -->
      <rect x="210" y="120" width="130" height="55" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"></rect>
      <text x="275" y="140" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="11" fill="#2e7d32">ZAB (2008)</text>
      <text x="225" y="158" font-family="Inter,sans-serif" font-size="9" fill="#37352f">4-phase recovery</text>
      <text x="225" y="170" font-family="Inter,sans-serif" font-size="8" fill="#787774">ZooKeeper only</text>

      <!-- Raft -->
      <rect x="360" y="120" width="130" height="55" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"></rect>
      <text x="425" y="140" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="12" fill="#0d47a1">Raft (2014)</text>
      <text x="375" y="158" font-family="Inter,sans-serif" font-size="9" fill="#37352f">Understandability-first</text>
      <text x="375" y="170" font-family="Inter,sans-serif" font-size="8" fill="#0d47a1">TiDB, etcd, CockroachDB</text>

      <!-- EPaxos -->
      <rect x="510" y="120" width="130" height="55" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"></rect>
      <text x="575" y="140" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="11" fill="#e65100">EPaxos (2013)</text>
      <text x="525" y="158" font-family="Inter,sans-serif" font-size="9" fill="#37352f">Leaderless, dep graph</text>
      <text x="525" y="170" font-family="Inter,sans-serif" font-size="8" fill="#787774">Research only</text>

      <!-- Fast/Flexible Paxos -->
      <rect x="660" y="120" width="140" height="55" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"></rect>
      <text x="730" y="140" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="11" fill="#c62828">Flexible Paxos (2016)</text>
      <text x="675" y="158" font-family="Inter,sans-serif" font-size="9" fill="#37352f">Quorums only need to</text>
      <text x="675" y="170" font-family="Inter,sans-serif" font-size="8" fill="#37352f">intersect, not both be majority</text>

      <!-- Raft children -->
      <line x1="425" y1="175" x2="110" y2="220" stroke="#1565c0" stroke-width="1" marker-end="url(#aF)"></line>
      <line x1="425" y1="175" x2="290" y2="220" stroke="#1565c0" stroke-width="1" marker-end="url(#aF)"></line>
      <line x1="425" y1="175" x2="460" y2="220" stroke="#1565c0" stroke-width="1" marker-end="url(#aF)"></line>
      <line x1="425" y1="175" x2="620" y2="220" stroke="#1565c0" stroke-width="1" marker-end="url(#aF)"></line>

      <rect x="20" y="220" width="170" height="35" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1"></rect>
      <text x="105" y="242" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#0d47a1">TiKV / TiDB</text>
      <rect x="210" y="220" width="150" height="35" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1"></rect>
      <text x="285" y="242" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#0d47a1">etcd / Kubernetes</text>
      <rect x="380" y="220" width="150" height="35" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1"></rect>
      <text x="455" y="242" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#0d47a1">CockroachDB / Consul</text>
      <rect x="550" y="220" width="150" height="35" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1"></rect>
      <text x="625" y="242" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#0d47a1">Kafka KRaft / MongoDB</text>

      <!-- Byzantine -->
      <rect x="20" y="290" width="780" height="55" rx="10" fill="#f7f6f3" stroke="#e3e2de" stroke-width="1"></rect>
      <text x="30" y="312" font-family="Inter,sans-serif" font-weight="700" font-size="12" fill="#37352f">Byzantine Fault Tolerant (BFT) variants — for trustless environments:</text>
      <text x="30" y="332" font-family="Inter,sans-serif" font-size="10" fill="#37352f"><tspan font-weight="600">PBFT</tspan> (1999), <tspan font-weight="600">HotStuff</tspan> (2019, Meta's Diem/Libra blockchain), <tspan font-weight="600">Tendermint</tspan> (Cosmos). Need 3f+1 nodes to tolerate f Byzantine faults (vs 2f+1 for crash faults).</text>

      <!-- CASPaxos -->
      <rect x="20" y="365" width="780" height="40" rx="8" fill="#f7f6f3" stroke="#e3e2de" stroke-width="1"></rect>
      <text x="30" y="390" font-family="Inter,sans-serif" font-size="10" fill="#37352f"><tspan font-weight="600">CASPaxos</tspan> (2018): minimalist single-register compare-and-swap. Teaching tool. | <tspan font-weight="600">Fast Paxos</tspan> (2005): skip leader for 1 RTT but needs larger quorum. Rarely used.</text>
    </svg>
