<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 310" xmlns="http://www.w3.org/2000/svg" style="max-width:800px;">
      <defs><filter id="shR2" x="-3%" y="-3%" width="106%" height="110%"><fedropshadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.06"></fedropshadow></filter></defs>

      <text x="410" y="22" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="15" fill="#2e7d32">Four Read Strategies: Consistency vs Latency</text>

      <!-- Strategy 1: Consensus Read -->
      <rect x="10" y="40" width="190" height="260" rx="10" fill="#fce4ec" stroke="#c62828" stroke-width="2" filter="url(#shR2)"></rect>
      <text x="105" y="65" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="12" fill="#c62828">Consensus Read</text>
      <text x="25" y="88" font-family="Inter,sans-serif" font-size="9" fill="#37352f">Leader runs a no-op</text>
      <text x="25" y="103" font-family="Inter,sans-serif" font-size="9" fill="#37352f">through Raft/Paxos to</text>
      <text x="25" y="118" font-family="Inter,sans-serif" font-size="9" fill="#37352f">PROVE it's still leader.</text>
      <text x="25" y="138" font-family="Inter,sans-serif" font-size="9" fill="#37352f">Then serves the read.</text>
      <rect x="25" y="155" width="160" height="22" rx="4" fill="#ef9a9a"></rect>
      <text x="105" y="170" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#c62828">Latency: 1 full RTT</text>
      <rect x="25" y="182" width="160" height="22" rx="4" fill="#c8e6c9"></rect>
      <text x="105" y="197" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#2e7d32">Consistency: Strongest</text>
      <text x="25" y="225" font-family="Inter,sans-serif" font-size="9" fill="#787774">Used: etcd (default)</text>
      <text x="25" y="245" font-family="Inter,sans-serif" font-size="9" fill="#787774">Safest but slowest</text>

      <!-- Strategy 2: Lease Read -->
      <rect x="215" y="40" width="190" height="260" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" filter="url(#shR2)"></rect>
      <text x="310" y="65" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="12" fill="#2e7d32">Lease Read</text>
      <text x="230" y="88" font-family="Inter,sans-serif" font-size="9" fill="#37352f">Leader holds a time-</text>
      <text x="230" y="103" font-family="Inter,sans-serif" font-size="9" fill="#37352f">bounded lease (e.g. 10s).</text>
      <text x="230" y="118" font-family="Inter,sans-serif" font-size="9" fill="#37352f">While valid, serves reads</text>
      <text x="230" y="133" font-family="Inter,sans-serif" font-size="9" fill="#37352f">locally. No network!</text>
      <rect x="230" y="155" width="160" height="22" rx="4" fill="#c8e6c9"></rect>
      <text x="310" y="170" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#2e7d32">Latency: ~0 (local RAM)</text>
      <rect x="230" y="182" width="160" height="22" rx="4" fill="#c8e6c9"></rect>
      <text x="310" y="197" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#2e7d32">Consistency: Strong</text>
      <text x="230" y="225" font-family="Inter,sans-serif" font-size="9" fill="#787774">Used: Spanner, Chubby</text>
      <text x="230" y="245" font-family="Inter,sans-serif" font-size="9" fill="#787774">Requires clock sync!</text>
      <text x="230" y="265" font-family="Inter,sans-serif" font-weight="600" font-size="9" fill="#2e7d32">Best for production</text>

      <!-- Strategy 3: Quorum Read -->
      <rect x="420" y="40" width="190" height="260" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shR2)"></rect>
      <text x="515" y="65" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="12" fill="#0d47a1">Quorum Read</text>
      <text x="435" y="88" font-family="Inter,sans-serif" font-size="9" fill="#37352f">Any node contacts a</text>
      <text x="435" y="103" font-family="Inter,sans-serif" font-size="9" fill="#37352f">majority of replicas.</text>
      <text x="435" y="118" font-family="Inter,sans-serif" font-size="9" fill="#37352f">Returns the newest value</text>
      <text x="435" y="133" font-family="Inter,sans-serif" font-size="9" fill="#37352f">across the majority.</text>
      <rect x="435" y="155" width="160" height="22" rx="4" fill="#fff3e0"></rect>
      <text x="515" y="170" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#e65100">Latency: 1 RTT</text>
      <rect x="435" y="182" width="160" height="22" rx="4" fill="#c8e6c9"></rect>
      <text x="515" y="197" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#2e7d32">Consistency: Strong</text>
      <text x="435" y="225" font-family="Inter,sans-serif" font-size="9" fill="#787774">Used: DynamoDB (R+W&gt;N)</text>
      <text x="435" y="245" font-family="Inter,sans-serif" font-size="9" fill="#787774">Spreads read load</text>

      <!-- Strategy 4: Follower Read -->
      <rect x="625" y="40" width="185" height="260" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2" filter="url(#shR2)"></rect>
      <text x="717" y="65" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="12" fill="#e65100">Follower Read</text>
      <text x="640" y="88" font-family="Inter,sans-serif" font-size="9" fill="#37352f">Read from any follower's</text>
      <text x="640" y="103" font-family="Inter,sans-serif" font-size="9" fill="#37352f">local state directly.</text>
      <text x="640" y="118" font-family="Inter,sans-serif" font-size="9" fill="#37352f">No coordination.</text>
      <rect x="640" y="145" width="155" height="22" rx="4" fill="#c8e6c9"></rect>
      <text x="717" y="160" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#2e7d32">Latency: ~0 (local)</text>
      <rect x="640" y="172" width="155" height="22" rx="4" fill="#ef9a9a"></rect>
      <text x="717" y="187" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#c62828">Consistency: STALE!</text>
      <text x="640" y="215" font-family="Inter,sans-serif" font-size="9" fill="#787774">Used: TiDB (opt-in),</text>
      <text x="640" y="230" font-family="Inter,sans-serif" font-size="9" fill="#787774">Espresso (follower reads)</text>
      <text x="640" y="250" font-family="Inter,sans-serif" font-size="9" fill="#787774">Fastest, cheapest, but</text>
      <text x="640" y="265" font-family="Inter,sans-serif" font-size="9" fill="#c62828">may return old data</text>
    </svg>
