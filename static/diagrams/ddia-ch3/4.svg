<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 380" xmlns="http://www.w3.org/2000/svg" style="max-width:800px;">
      <!-- B-Tree -->
      <rect x="10" y="10" width="395" height="360" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"></rect>
      <text x="207" y="40" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="16" fill="#0d47a1">B-Tree (Update In Place)</text>

      <text x="30" y="70" font-family="Inter,sans-serif" font-weight="600" font-size="12" fill="#2e7d32">Advantages:</text>
      <text x="30" y="90" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Reads are fast: one path root→leaf, O(log n)</text>
      <text x="30" y="108" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Each key exists in exactly ONE place</text>
      <text x="30" y="126" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Predictable latency (no compaction spikes)</text>
      <text x="30" y="144" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Strong transactions: locks attach to tree nodes</text>
      <text x="30" y="162" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Mature (50+ years of optimization)</text>

      <text x="30" y="192" font-family="Inter,sans-serif" font-weight="600" font-size="12" fill="#c62828">Disadvantages:</text>
      <text x="30" y="212" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Write amplification: WAL + page overwrite</text>
      <text x="30" y="230" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Fragmentation (split pages waste space)</text>
      <text x="30" y="248" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Random I/O for writes (seek to page)</text>

      <rect x="30" y="270" width="355" height="80" rx="8" fill="#bbdefb"></rect>
      <text x="207" y="292" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="11" fill="#0d47a1">Used By:</text>
      <text x="50" y="310" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• MySQL/InnoDB (inside Espresso)</text>
      <text x="50" y="326" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• PostgreSQL, Oracle, SQL Server</text>
      <text x="50" y="342" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• All traditional RDBMS</text>

      <!-- LSM-Tree -->
      <rect x="415" y="10" width="395" height="360" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"></rect>
      <text x="612" y="40" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="16" fill="#1b5e20">LSM-Tree (Append + Merge)</text>

      <text x="435" y="70" font-family="Inter,sans-serif" font-weight="600" font-size="12" fill="#2e7d32">Advantages:</text>
      <text x="435" y="90" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Sequential writes (fast on SSD + HDD)</text>
      <text x="435" y="108" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Higher write throughput</text>
      <text x="435" y="126" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Better compression (no page fragmentation)</text>
      <text x="435" y="144" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Smaller on-disk footprint</text>
      <text x="435" y="162" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Simpler concurrency (immutable segments)</text>

      <text x="435" y="192" font-family="Inter,sans-serif" font-weight="600" font-size="12" fill="#c62828">Disadvantages:</text>
      <text x="435" y="212" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Reads slower (check multiple levels)</text>
      <text x="435" y="230" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Compaction can spike tail latency (p99)</text>
      <text x="435" y="248" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Same key may exist in multiple levels</text>

      <rect x="435" y="270" width="355" height="80" rx="8" fill="#c8e6c9"></rect>
      <text x="612" y="292" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="11" fill="#1b5e20">Used By:</text>
      <text x="455" y="310" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• RocksDB (inside Venice)</text>
      <text x="455" y="326" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Cassandra, HBase, LevelDB</text>
      <text x="455" y="342" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Lucene term dictionary (Galene, Elasticsearch)</text>
    </svg>
