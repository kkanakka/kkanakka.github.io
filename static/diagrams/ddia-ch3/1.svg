<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" style="max-width:800px;">
      <defs>
        <filter id="sh1" x="-3%" y="-3%" width="106%" height="110%">
          <fedropshadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.06"></fedropshadow>
        </filter>
      </defs>

      <text x="410" y="25" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="15" fill="#b71c1c">The Index Trade-Off Spectrum</text>

      <!-- Left: No index -->
      <rect x="20" y="50" width="240" height="230" rx="12" fill="#fce4ec" stroke="#c62828" stroke-width="2" filter="url(#sh1)"></rect>
      <text x="140" y="78" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="14" fill="#c62828">No Indexes</text>
      <text x="140" y="96" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#787774">(append-only log, like the bash example)</text>
      <text x="40" y="125" font-family="Inter,sans-serif" font-size="11" fill="#2e7d32">✓ Writes: O(1) — just append</text>
      <text x="40" y="145" font-family="Inter,sans-serif" font-size="11" fill="#2e7d32">✓ Fastest possible writes</text>
      <text x="40" y="165" font-family="Inter,sans-serif" font-size="11" fill="#2e7d32">✓ No write amplification</text>
      <text x="40" y="195" font-family="Inter,sans-serif" font-size="11" fill="#c62828">✗ Reads: O(n) — full scan</text>
      <text x="40" y="215" font-family="Inter,sans-serif" font-size="11" fill="#c62828">✗ 1M records = scan all 1M</text>
      <text x="40" y="235" font-family="Inter,sans-serif" font-size="11" fill="#c62828">✗ Unusable at scale</text>
      <rect x="40" y="250" width="200" height="20" rx="4" fill="#ef9a9a"></rect>
      <text x="140" y="264" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#c62828">Kafka log segments work this way</text>

      <!-- Middle: Balanced -->
      <rect x="290" y="50" width="240" height="230" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" filter="url(#sh1)"></rect>
      <text x="410" y="78" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="14" fill="#2e7d32">Selective Indexes</text>
      <text x="410" y="96" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#787774">(primary key + 1-2 secondary indexes)</text>
      <text x="310" y="125" font-family="Inter,sans-serif" font-size="11" fill="#2e7d32">✓ Reads: O(log n) — B-tree</text>
      <text x="310" y="145" font-family="Inter,sans-serif" font-size="11" fill="#2e7d32">✓ Writes: moderate overhead</text>
      <text x="310" y="165" font-family="Inter,sans-serif" font-size="11" fill="#2e7d32">✓ Best overall balance</text>
      <text x="310" y="195" font-family="Inter,sans-serif" font-size="11" fill="#787774">Index only what you query.</text>
      <text x="310" y="215" font-family="Inter,sans-serif" font-size="11" fill="#787774">2-3x write amplification.</text>
      <rect x="310" y="250" width="200" height="20" rx="4" fill="#c8e6c9"></rect>
      <text x="410" y="264" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="9" fill="#2e7d32">Espresso, MySQL, PostgreSQL</text>

      <!-- Right: Over-indexed -->
      <rect x="560" y="50" width="240" height="230" rx="12" fill="#fff3e0" stroke="#e65100" stroke-width="2" filter="url(#sh1)"></rect>
      <text x="680" y="78" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="14" fill="#e65100">Over-Indexed</text>
      <text x="680" y="96" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#787774">(index on every field)</text>
      <text x="580" y="125" font-family="Inter,sans-serif" font-size="11" fill="#2e7d32">✓ Reads: fast for any query</text>
      <text x="580" y="145" font-family="Inter,sans-serif" font-size="11" fill="#2e7d32">✓ Any field is searchable</text>
      <text x="580" y="175" font-family="Inter,sans-serif" font-size="11" fill="#c62828">✗ Writes: 5-10x amplification</text>
      <text x="580" y="195" font-family="Inter,sans-serif" font-size="11" fill="#c62828">✗ More storage (2-3x data)</text>
      <text x="580" y="215" font-family="Inter,sans-serif" font-size="11" fill="#c62828">✗ Compaction can't keep up</text>
      <rect x="580" y="250" width="200" height="20" rx="4" fill="#ffcc80"></rect>
      <text x="680" y="264" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#e65100">Elasticsearch, Galene (by design)</text>
    </svg>
