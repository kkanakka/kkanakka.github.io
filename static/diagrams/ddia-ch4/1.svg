<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 500" xmlns="http://www.w3.org/2000/svg" style="max-width:800px;">
      <defs>
        <marker id="arrT" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#546e7a"></polygon></marker>
        <filter id="shT" x="-3%" y="-3%" width="106%" height="110%"><fedropshadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.06"></fedropshadow></filter>
      </defs>

      <!-- Client -->
      <rect x="300" y="10" width="220" height="45" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" filter="url(#shT)"></rect>
      <text x="410" y="30" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="12" fill="#1b5e20">MySQL Client / App</text>
      <text x="410" y="48" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#787774">Standard MySQL protocol — no code changes!</text>

      <line x1="410" y1="55" x2="410" y2="80" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arrT)"></line>

      <!-- TiDB Server (SQL Layer) -->
      <rect x="150" y="80" width="520" height="75" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shT)"></rect>
      <text x="410" y="105" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="15" fill="#0d47a1">TiDB Server (Stateless SQL Layer)</text>
      <text x="170" y="128" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Parse SQL → optimize → distributed execution plan</text>
      <text x="170" y="143" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Horizontally scalable (add more TiDB nodes behind load balancer)</text>
      <text x="500" y="128" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• NO data stored here</text>
      <text x="500" y="143" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Compute only</text>

      <!-- Arrows to TiKV -->
      <line x1="300" y1="155" x2="200" y2="195" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arrT)"></line>
      <line x1="410" y1="155" x2="410" y2="195" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arrT)"></line>
      <line x1="520" y1="155" x2="620" y2="195" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arrT)"></line>

      <!-- TiKV Nodes -->
      <rect x="80" y="195" width="200" height="140" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2" filter="url(#shT)"></rect>
      <text x="180" y="218" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="12" fill="#e65100">TiKV Node 1</text>
      <rect x="100" y="230" width="160" height="22" rx="4" fill="#ffcc80"></rect>
      <text x="180" y="245" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#bf360c">Region 1 (Leader) | Region 4 (Follower)</text>
      <rect x="100" y="258" width="160" height="22" rx="4" fill="#c8e6c9"></rect>
      <text x="180" y="273" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#1b5e20">Region 7 (Leader) | Region 2 (Follower)</text>
      <rect x="100" y="286" width="160" height="22" rx="4" fill="#bbdefb"></rect>
      <text x="180" y="301" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#1565c0">RocksDB (LSM-tree)</text>
      <text x="180" y="325" text-anchor="middle" font-family="Inter,sans-serif" font-size="8" fill="#787774">Raft + MVCC + Percolator</text>

      <rect x="310" y="195" width="200" height="140" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2" filter="url(#shT)"></rect>
      <text x="410" y="218" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="12" fill="#e65100">TiKV Node 2</text>
      <rect x="330" y="230" width="160" height="22" rx="4" fill="#ffcc80"></rect>
      <text x="410" y="245" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#bf360c">Region 2 (Leader) | Region 1 (Follower)</text>
      <rect x="330" y="258" width="160" height="22" rx="4" fill="#c8e6c9"></rect>
      <text x="410" y="273" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#1b5e20">Region 5 (Leader) | Region 7 (Follower)</text>
      <rect x="330" y="286" width="160" height="22" rx="4" fill="#bbdefb"></rect>
      <text x="410" y="301" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#1565c0">RocksDB (LSM-tree)</text>

      <rect x="540" y="195" width="200" height="140" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2" filter="url(#shT)"></rect>
      <text x="640" y="218" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="12" fill="#e65100">TiKV Node 3</text>
      <rect x="560" y="230" width="160" height="22" rx="4" fill="#ffcc80"></rect>
      <text x="640" y="245" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#bf360c">Region 4 (Leader) | Region 1 (Follower)</text>
      <rect x="560" y="258" width="160" height="22" rx="4" fill="#c8e6c9"></rect>
      <text x="640" y="273" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#1b5e20">Region 3 (Leader) | Region 5 (Follower)</text>
      <rect x="560" y="286" width="160" height="22" rx="4" fill="#bbdefb"></rect>
      <text x="640" y="301" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#1565c0">RocksDB (LSM-tree)</text>

      <!-- PD -->
      <rect x="30" y="380" width="760" height="100" rx="12" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2" filter="url(#shT)"></rect>
      <text x="410" y="408" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="15" fill="#4a148c">Placement Driver (PD) — The Brain (3-node Raft cluster itself)</text>
      <text x="60" y="430" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Stores cluster metadata (which Region on which node)</text>
      <text x="60" y="448" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Allocates globally unique transaction IDs (TSO)</text>
      <text x="60" y="466" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Schedules Region movement (balance load, repair replicas)</text>
      <text x="430" y="430" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Detects store failures via heartbeats</text>
      <text x="430" y="448" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Splits/merges Regions when too large/small</text>
      <text x="430" y="466" font-family="Inter,sans-serif" font-size="10" fill="#37352f">• Balances leaders, hot spots, storage capacity</text>

      <!-- Heartbeat arrows -->
      <line x1="180" y1="335" x2="200" y2="380" stroke="#6a1b9a" stroke-width="1" stroke-dasharray="4"></line>
      <line x1="410" y1="335" x2="410" y2="380" stroke="#6a1b9a" stroke-width="1" stroke-dasharray="4"></line>
      <line x1="640" y1="335" x2="620" y2="380" stroke="#6a1b9a" stroke-width="1" stroke-dasharray="4"></line>
      <text x="310" y="365" text-anchor="middle" font-family="Inter,sans-serif" font-size="8" fill="#6a1b9a">store heartbeats + region heartbeats</text>
    </svg>
