<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" style="max-width:800px;">
      <defs>
        <marker id="arrR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#546e7a"></polygon></marker>
        <marker id="arrG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e7d32"></polygon></marker>
      </defs>

      <text x="410" y="22" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="15" fill="#1565c0">Raft Write Path: INSERT INTO users VALUES (42, 'Alice')</text>

      <!-- Step 1 -->
      <rect x="20" y="40" width="780" height="55" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"></rect>
      <text x="40" y="60" font-family="Inter,sans-serif" font-weight="700" font-size="11" fill="#0d47a1">Step 1: TiDB Server receives SQL, converts to KV operations</text>
      <text x="40" y="80" font-family="Inter,sans-serif" font-size="10" fill="#37352f">TiDB Server: parse SQL → optimizer → determine Region for key "users_42" → find Leader from PD cache</text>

      <!-- Step 2 -->
      <rect x="20" y="105" width="780" height="55" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"></rect>
      <text x="40" y="125" font-family="Inter,sans-serif" font-weight="700" font-size="11" fill="#e65100">Step 2: Leader appends to its LOCAL Raft log (not committed yet)</text>
      <text x="40" y="145" font-family="Inter,sans-serif" font-size="10" fill="#37352f">Leader (Node A): write "PUT users_42 = {name: Alice}" to Raft log entry #47. State: <tspan font-weight="700" fill="#e65100">UNCOMMITTED</tspan></text>

      <!-- Step 3: Replicate -->
      <rect x="20" y="170" width="780" height="80" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"></rect>
      <text x="40" y="190" font-family="Inter,sans-serif" font-weight="700" font-size="11" fill="#c62828">Step 3: Leader sends log entry #47 to ALL followers (AppendEntries RPC)</text>

      <rect x="40" y="200" width="220" height="35" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"></rect>
      <text x="150" y="222" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#2e7d32">Node B (Follower): ACK ✓</text>
      <rect x="300" y="200" width="220" height="35" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"></rect>
      <text x="410" y="222" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#2e7d32">Node C (Follower): ACK ✓</text>
      <rect x="560" y="200" width="220" height="35" rx="6" fill="#ef9a9a" stroke="#c62828" stroke-width="1"></rect>
      <text x="670" y="222" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#c62828">Node D: TIMEOUT (down) ✗</text>

      <!-- Step 4: Majority -->
      <rect x="20" y="260" width="780" height="55" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"></rect>
      <text x="40" y="280" font-family="Inter,sans-serif" font-weight="700" font-size="11" fill="#2e7d32">Step 4: Leader got ACK from MAJORITY (2 of 3) → COMMIT!</text>
      <text x="40" y="300" font-family="Inter,sans-serif" font-size="10" fill="#37352f">Leader applies entry #47 to RocksDB (state machine). Returns SUCCESS to TiDB Server → Client.</text>

      <!-- Step 5 -->
      <rect x="20" y="325" width="780" height="40" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1"></rect>
      <text x="40" y="350" font-family="Inter,sans-serif" font-weight="700" font-size="11" fill="#6a1b9a">Step 5: Leader tells followers to commit. Followers apply to their RocksDB.</text>

      <!-- THE KEY INSIGHT -->
      <rect x="20" y="375" width="780" height="35" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"></rect>
      <text x="410" y="398" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="13" fill="#e65100">CRITICAL: Raft commits after MAJORITY ACK, NOT ALL followers! 2 of 3 is enough. This is NOT eventual consistency — it's STRONG consistency.</text>
    </svg>
