<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" height="650" style="background:#fafafa;border:1px solid #ddd;border-radius:8px;margin:16px 0;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 906 650">
    <!-- Config Authoring UI -->
    <rect x="50" y="50" width="180" height="80" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="8"></rect>
    <text x="140" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#1976d2">Config Authoring UI</text>
    <text x="140" y="95" text-anchor="middle" font-size="10" fill="#1976d2">React + LinkedIn SSO</text>
    <text x="140" y="110" text-anchor="middle" font-size="10" fill="#1976d2">RBAC + Approval Flow</text>
    <text x="140" y="125" text-anchor="middle" font-size="10" fill="#1976d2">JSON/YAML Editor</text>
    
    <!-- Schema Validator -->
    <rect x="280" y="50" width="150" height="80" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="8"></rect>
    <text x="355" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#6a1b9a">Schema Validator</text>
    <text x="355" y="95" text-anchor="middle" font-size="10" fill="#6a1b9a">JSON Schema</text>
    <text x="355" y="110" text-anchor="middle" font-size="10" fill="#6a1b9a">Policy Engine</text>
    <text x="355" y="125" text-anchor="middle" font-size="10" fill="#6a1b9a">Lint Rules</text>
    
    <!-- Config Registry -->
    <rect x="480" y="50" width="150" height="80" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="8"></rect>
    <text x="555" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">Config Registry</text>
    <text x="555" y="95" text-anchor="middle" font-size="10" fill="#1b5e20">Espresso + ZK</text>
    <text x="555" y="110" text-anchor="middle" font-size="10" fill="#1b5e20">Versioned Store</text>
    <text x="555" y="125" text-anchor="middle" font-size="10" fill="#1b5e20">Append-Only Log</text>
    
    <!-- Canary Validation -->
    <rect x="50" y="170" width="180" height="80" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="8"></rect>
    <text x="140" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">Canary Controller</text>
    <text x="140" y="215" text-anchor="middle" font-size="10" fill="#e65100">1% Fleet Rollout</text>
    <text x="140" y="230" text-anchor="middle" font-size="10" fill="#e65100">SLO Monitoring</text>
    <text x="140" y="245" text-anchor="middle" font-size="10" fill="#e65100">Auto Rollback</text>
    
    <!-- Distribution Layer -->
    <rect x="280" y="170" width="150" height="80" fill="#ffebee" stroke="#d32f2f" stroke-width="2" rx="8"></rect>
    <text x="355" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">Distribution</text>
    <text x="355" y="215" text-anchor="middle" font-size="10" fill="#c62828">Kafka + gRPC</text>
    <text x="355" y="230" text-anchor="middle" font-size="10" fill="#c62828">Push + Pull</text>
    <text x="355" y="245" text-anchor="middle" font-size="10" fill="#c62828">Regional Topics</text>
    
    <!-- Rollback Controller -->
    <rect x="480" y="170" width="150" height="80" fill="#e0f2f1" stroke="#00695c" stroke-width="2" rx="8"></rect>
    <text x="555" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#004d40">Rollback Controller</text>
    <text x="555" y="215" text-anchor="middle" font-size="10" fill="#004d40">Version Pointers</text>
    <text x="555" y="230" text-anchor="middle" font-size="10" fill="#004d40">Diff Analysis</text>
    <text x="555" y="245" text-anchor="middle" font-size="10" fill="#004d40">Emergency Mode</text>
    
    <!-- Client Agents (Regional) -->
    <rect x="50" y="290" width="130" height="70" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2" rx="4"></rect>
    <text x="115" y="315" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a237e">LTX1 Agents</text>
    <text x="115" y="330" text-anchor="middle" font-size="9" fill="#1a237e">5000 services</text>
    <text x="115" y="345" text-anchor="middle" font-size="9" fill="#1a237e">Pull + Validate</text>
    <text x="115" y="355" text-anchor="middle" font-size="9" fill="#1a237e">Drift Detection</text>
    
    <rect x="200" y="290" width="130" height="70" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2" rx="4"></rect>
    <text x="265" y="315" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a237e">LVA1 Agents</text>
    <text x="265" y="330" text-anchor="middle" font-size="9" fill="#1a237e">4000 services</text>
    <text x="265" y="345" text-anchor="middle" font-size="9" fill="#1a237e">Shadow Apply</text>
    <text x="265" y="355" text-anchor="middle" font-size="9" fill="#1a237e">Health Checks</text>
    
    <rect x="350" y="290" width="130" height="70" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2" rx="4"></rect>
    <text x="415" y="315" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a237e">EI4 Agents</text>
    <text x="415" y="330" text-anchor="middle" font-size="9" fill="#1a237e">2000 services</text>
    <text x="415" y="345" text-anchor="middle" font-size="9" fill="#1a237e">Test Environment</text>
    <text x="415" y="355" text-anchor="middle" font-size="9" fill="#1a237e">Staging Validation</text>
    
    <rect x="500" y="290" width="130" height="70" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2" rx="4"></rect>
    <text x="565" y="315" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a237e">Grid2 Agents</text>
    <text x="565" y="330" text-anchor="middle" font-size="9" fill="#1a237e">1000 services</text>
    <text x="565" y="345" text-anchor="middle" font-size="9" fill="#1a237e">DR Environment</text>
    <text x="565" y="355" text-anchor="middle" font-size="9" fill="#1a237e">Backup Configs</text>
    
    <!-- Monitoring & Alerting -->
    <rect x="50" y="400" width="200" height="60" fill="#fff8e1" stroke="#fbc02d" stroke-width="2" rx="4"></rect>
    <text x="150" y="420" text-anchor="middle" font-size="12" font-weight="bold" fill="#f57c00">Drift Monitoring</text>
    <text x="150" y="440" text-anchor="middle" font-size="10" fill="#f57c00">Hash Comparison</text>
    <text x="150" y="455" text-anchor="middle" font-size="10" fill="#f57c00">Real-time Alerts</text>
    
    <rect x="270" y="400" width="180" height="60" fill="#fff8e1" stroke="#fbc02d" stroke-width="2" rx="4"></rect>
    <text x="360" y="420" text-anchor="middle" font-size="12" font-weight="bold" fill="#f57c00">SLO Monitoring</text>
    <text x="360" y="440" text-anchor="middle" font-size="10" fill="#f57c00">Propagation Latency</text>
    <text x="360" y="455" text-anchor="middle" font-size="10" fill="#f57c00">Rollback Speed</text>
    
    <rect x="470" y="400" width="160" height="60" fill="#fff8e1" stroke="#fbc02d" stroke-width="2" rx="4"></rect>
    <text x="550" y="420" text-anchor="middle" font-size="12" font-weight="bold" fill="#f57c00">Audit Logger</text>
    <text x="550" y="440" text-anchor="middle" font-size="10" fill="#f57c00">Change History</text>
    <text x="550" y="455" text-anchor="middle" font-size="10" fill="#f57c00">Compliance</text>
    
    <!-- Emergency Freeze -->
    <rect x="50" y="500" width="580" height="50" fill="#ffcdd2" stroke="#f44336" stroke-width="3" rx="8"></rect>
    <text x="340" y="520" text-anchor="middle" font-size="14" font-weight="bold" fill="#d32f2f">EMERGENCY FREEZE MODE</text>
    <text x="340" y="540" text-anchor="middle" font-size="10" fill="#d32f2f">Prevents All Config Changes During Active Incidents — Manual Override Required</text>
    
    <!-- Arrows -->
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#666"></polygon>
      </marker>
    </defs>
    
    <!-- Flow arrows -->
    <line x1="230" y1="90" x2="280" y2="90" stroke="#666" stroke-width="2" marker-end="url(#arrow)"></line>
    <line x1="430" y1="90" x2="480" y2="90" stroke="#666" stroke-width="2" marker-end="url(#arrow)"></line>
    <line x1="140" y1="130" x2="140" y2="170" stroke="#666" stroke-width="2" marker-end="url(#arrow)"></line>
    <line x1="355" y1="130" x2="355" y2="170" stroke="#666" stroke-width="2" marker-end="url(#arrow)"></line>
    <line x1="555" y1="130" x2="555" y2="170" stroke="#666" stroke-width="2" marker-end="url(#arrow)"></line>
    
    <!-- Distribution to agents -->
    <line x1="320" y1="250" x2="115" y2="290" stroke="#666" stroke-width="2" marker-end="url(#arrow)"></line>
    <line x1="340" y1="250" x2="265" y2="290" stroke="#666" stroke-width="2" marker-end="url(#arrow)"></line>
    <line x1="360" y1="250" x2="415" y2="290" stroke="#666" stroke-width="2" marker-end="url(#arrow)"></line>
    <line x1="380" y1="250" x2="565" y2="290" stroke="#666" stroke-width="2" marker-end="url(#arrow)"></line>
    
    <!-- Monitoring connections -->
    <line x1="115" y1="360" x2="150" y2="400" stroke="#fbc02d" stroke-width="2" stroke-dasharray="3,3"></line>
    <line x1="415" y1="360" x2="360" y2="400" stroke="#fbc02d" stroke-width="2" stroke-dasharray="3,3"></line>
    
    <!-- Labels -->
    <text x="255" y="85" font-size="9" fill="#666">validate</text>
    <text x="455" y="85" font-size="9" fill="#666">store</text>
    <text x="320" y="275" font-size="9" fill="#666">distribute</text>
    <text x="200" y="385" font-size="9" fill="#fbc02d">monitor</text>
  </svg>
