<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 380" xmlns="http://www.w3.org/2000/svg"><style>.lbl-title{font-family:'Inter',sans-serif;font-weight:700;font-size:11.5px;fill:#1f2328}
.lbl-sub{font-family:'JetBrains Mono',monospace;font-size:9.5px;fill:#59636e}
.lbl-meta{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#818b98}</style>
  <defs></defs>

  <!-- Hash ring circle -->
  <circle cx="290" cy="190" r="140" fill="none" stroke="#d0d7de" stroke-width="2"></circle>
  <text x="290" y="50" text-anchor="middle" class="lbl-meta">0</text>
  <text x="445" y="195" class="lbl-meta">2³² · ¼</text>
  <text x="290" y="345" text-anchor="middle" class="lbl-meta">2³² · ½</text>
  <text x="130" y="195" class="lbl-meta" text-anchor="end">2³² · ¾</text>

  <!-- 4 shards positioned around ring -->
  <circle cx="290" cy="50" r="18" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"></circle>
  <text x="290" y="55" text-anchor="middle" class="lbl-title">S1</text>

  <circle cx="430" cy="190" r="18" fill="#dafbe1" stroke="#4ac26b" stroke-width="2"></circle>
  <text x="430" y="195" text-anchor="middle" class="lbl-title">S2</text>

  <circle cx="290" cy="330" r="18" fill="#fff1e5" stroke="#fd8c73" stroke-width="2"></circle>
  <text x="290" y="335" text-anchor="middle" class="lbl-title">S3</text>

  <circle cx="150" cy="190" r="18" fill="#fbefff" stroke="#c297ff" stroke-width="2"></circle>
  <text x="150" y="195" text-anchor="middle" class="lbl-title">S4</text>

  <!-- Sample keys positioned around -->
  <circle cx="355" cy="100" r="6" fill="#1f2328"></circle>
  <text x="365" y="105" class="lbl-sub">user_42 → S2</text>
  <circle cx="400" cy="250" r="6" fill="#1f2328"></circle>
  <text x="410" y="255" class="lbl-sub">user_99 → S3</text>
  <circle cx="200" cy="260" r="6" fill="#1f2328"></circle>
  <text x="180" y="280" class="lbl-sub">user_5 → S4</text>
  <circle cx="220" cy="100" r="6" fill="#1f2328"></circle>
  <text x="160" y="100" class="lbl-sub">user_77 → S1</text>

  <!-- Right side: explanation -->
  <text x="540" y="50" class="lbl-title" style="font-size:13px">How a key finds its shard</text>
  <text x="540" y="75" class="lbl-sub">1. hash = CRC32(key) mod 2³²</text>
  <text x="540" y="92" class="lbl-sub">2. Walk clockwise from hash to next shard</text>
  <text x="540" y="109" class="lbl-sub">3. That shard owns this key</text>

  <text x="540" y="145" class="lbl-title" style="font-size:13px">What happens when we add S5?</text>
  <text x="540" y="170" class="lbl-sub">- S5 is placed at a random position on ring</text>
  <text x="540" y="187" class="lbl-sub">- Keys in S5's slice migrate from neighbor</text>
  <text x="540" y="204" class="lbl-sub">- ONLY ~1/N of keys move (not all)</text>
  <text x="540" y="221" class="lbl-sub">- Other 3 shards untouched</text>

  <text x="540" y="255" class="lbl-title" style="font-size:13px">Virtual nodes (vnodes)</text>
  <text x="540" y="280" class="lbl-sub">In practice, each shard occupies 256 positions</text>
  <text x="540" y="297" class="lbl-sub">on the ring (vnodes). This smooths the</text>
  <text x="540" y="314" class="lbl-sub">distribution — without vnodes, removing a shard</text>
  <text x="540" y="331" class="lbl-sub">would dump all its keys on ONE neighbor.</text>
  <text x="540" y="348" class="lbl-sub">With vnodes, load spreads across all peers.</text>
</svg>
