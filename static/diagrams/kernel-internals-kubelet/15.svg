<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="atr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"></path>
    </marker>
  </defs>

  <text x="20" y="22" font-size="12" font-weight="600">"The server is frozen" · capability falls as the system gets more dead</text>

  <!-- Level 1: SSH works -->
  <rect x="40" y="50" width="820" height="60" fill="#dafbe1" stroke="#1a7f37"></rect>
  <text x="56" y="72" font-size="12" font-weight="600" fill="#1a7f37">Level 1 · SSH responds</text>
  <text x="56" y="92" font-size="10" fill="#59636e">perf top -a · bpftrace · cat /proc/PID/{stack,wchan} · offcputime · ss · iostat · journalctl</text>
  <text x="844" y="92" text-anchor="end" font-size="10" fill="#1a7f37">full live debugging</text>

  <!-- arrow down -->
  <line x1="450" y1="110" x2="450" y2="130" stroke="#1f2328" marker-end="url(#atr)"></line>

  <!-- Level 2: only console works -->
  <rect x="40" y="130" width="820" height="60" fill="#fff8c5" stroke="#9a6700"></rect>
  <text x="56" y="152" font-size="12" font-weight="600" fill="#9a6700">Level 2 · only console / BMC responds</text>
  <text x="56" y="172" font-size="10" fill="#59636e">Magic SysRq: echo t/w/l/m/p &gt; /proc/sysrq-trigger · read dmesg via console · IPMI/iLO SoL</text>
  <text x="844" y="172" text-anchor="end" font-size="10" fill="#9a6700">kernel still scheduling IRQs</text>

  <line x1="450" y1="190" x2="450" y2="210" stroke="#1f2328" marker-end="url(#atr)"></line>

  <!-- Level 3: hard lockup, NMI catches it -->
  <rect x="40" y="210" width="820" height="60" fill="#fff8c5" stroke="#9a6700"></rect>
  <text x="56" y="232" font-size="12" font-weight="600" fill="#9a6700">Level 3 · hard lockup · NMI watchdog</text>
  <text x="56" y="252" font-size="10" fill="#59636e">echo l &gt; /proc/sysrq-trigger from another CPU · or watchdog auto-prints stacks after watchdog_thresh</text>
  <text x="844" y="252" text-anchor="end" font-size="10" fill="#9a6700">only NMI escapes IRQ-off</text>

  <line x1="450" y1="270" x2="450" y2="290" stroke="#1f2328" marker-end="url(#atr)"></line>

  <!-- Level 4: dead, only kdump remains -->
  <rect x="40" y="290" width="820" height="60" fill="#ffebe9" stroke="#d1242f"></rect>
  <text x="56" y="312" font-size="12" font-weight="600" fill="#d1242f">Level 4 · totally unresponsive · kdump armed</text>
  <text x="56" y="332" font-size="10" fill="#59636e">echo c &gt; sysrq-trigger panics &amp; captures vmcore via kexec · analyse offline with crash(8)</text>
  <text x="844" y="332" text-anchor="end" font-size="10" fill="#d1242f">post-mortem only</text>

  <!-- Level 5: no kdump -->
  <text x="450" y="380" text-anchor="middle" font-size="11" fill="#d1242f" font-weight="500">No kdump? &nbsp;→&nbsp; hardware reset · no evidence · debug from firmware logs &amp; what userspace logged before</text>
</svg>
