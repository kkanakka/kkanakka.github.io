<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="apr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"></path>
    </marker>
    <marker id="aprd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d1242f"></path>
    </marker>
  </defs>

  <text x="20" y="22" font-size="12" font-weight="600">10,000 nodes · exponential waves · automatic rollback on regression</text>

  <!-- Waves -->
  <g>
    <circle cx="100" cy="170" r="22" fill="#ddf4ff" stroke="#0969da" stroke-width="2"></circle>
    <text x="100" y="174" text-anchor="middle" font-size="11" font-weight="600" fill="#0969da">10</text>
    <text x="100" y="210" text-anchor="middle" font-size="10" fill="#59636e">canary 0.1%</text>
    <text x="100" y="225" text-anchor="middle" font-size="9" fill="#59636e">soak 2 h</text>

    <circle cx="240" cy="170" r="34" fill="#ddf4ff" stroke="#0969da" stroke-width="2"></circle>
    <text x="240" y="174" text-anchor="middle" font-size="11" font-weight="600" fill="#0969da">100</text>
    <text x="240" y="220" text-anchor="middle" font-size="10" fill="#59636e">wave 1 · 1%</text>
    <text x="240" y="235" text-anchor="middle" font-size="9" fill="#59636e">soak 4 h</text>

    <circle cx="400" cy="170" r="48" fill="#ddf4ff" stroke="#0969da" stroke-width="2"></circle>
    <text x="400" y="174" text-anchor="middle" font-size="11" font-weight="600" fill="#0969da">1000</text>
    <text x="400" y="232" text-anchor="middle" font-size="10" fill="#59636e">wave 2 · 10%</text>
    <text x="400" y="247" text-anchor="middle" font-size="9" fill="#59636e">soak 8 h · diff geos</text>

    <circle cx="580" cy="170" r="62" fill="#ddf4ff" stroke="#0969da" stroke-width="2"></circle>
    <text x="580" y="174" text-anchor="middle" font-size="11" font-weight="600" fill="#0969da">5000</text>
    <text x="580" y="245" text-anchor="middle" font-size="10" fill="#59636e">wave 3 · 50%</text>
    <text x="580" y="260" text-anchor="middle" font-size="9" fill="#59636e">all geos · soak 1 d</text>

    <circle cx="780" cy="170" r="74" fill="#ddf4ff" stroke="#0969da" stroke-width="2"></circle>
    <text x="780" y="174" text-anchor="middle" font-size="11" font-weight="600" fill="#0969da">10000</text>
    <text x="780" y="259" text-anchor="middle" font-size="10" fill="#59636e">wave 4 · 100%</text>
  </g>

  <!-- arrows between -->
  <line x1="122" y1="170" x2="206" y2="170" stroke="#0969da" stroke-width="2" marker-end="url(#apr)"></line>
  <line x1="274" y1="170" x2="352" y2="170" stroke="#0969da" stroke-width="2" marker-end="url(#apr)"></line>
  <line x1="448" y1="170" x2="518" y2="170" stroke="#0969da" stroke-width="2" marker-end="url(#apr)"></line>
  <line x1="642" y1="170" x2="706" y2="170" stroke="#0969da" stroke-width="2" marker-end="url(#apr)"></line>

  <!-- health gates -->
  <text x="164" y="115" text-anchor="middle" font-size="9" fill="#1a7f37">▼ health gate</text>
  <text x="313" y="115" text-anchor="middle" font-size="9" fill="#1a7f37">▼ health gate</text>
  <text x="483" y="115" text-anchor="middle" font-size="9" fill="#1a7f37">▼ health gate</text>
  <text x="674" y="115" text-anchor="middle" font-size="9" fill="#1a7f37">▼ health gate</text>

  <text x="450" y="50" text-anchor="middle" font-size="11" fill="#1a7f37">Promote iff: kernel boots · workload SLOs ≥ baseline · no new crashes for soak window</text>

  <!-- Rollback path -->
  <text x="450" y="305" text-anchor="middle" font-size="11" fill="#d1242f" font-weight="500">On regression at any gate:</text>
  <text x="450" y="322" text-anchor="middle" font-size="10" fill="#59636e">stop promotion · revert affected nodes via A/B partition swap or reboot into previous kernel · alert on-call</text>

  <path d="M 580 232 Q 580 280 350 280 Q 200 280 240 204" stroke="#d1242f" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#aprd)"></path>
  <text x="380" y="345" text-anchor="middle" font-size="10" fill="#d1242f">rollback = mirror image of rollout · same waves, opposite direction</text>
</svg>
