<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"></path>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d1242f"></path>
    </marker>
    <marker id="arr_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"></path>
    </marker>
  </defs>

  <line x1="40" y1="55" x2="860" y2="55" stroke="#d1d9e0" stroke-dasharray="2,4"></line>
  <text x="40" y="42" fill="#0969da" font-size="11">time →</text>

  <rect x="40" y="70" width="180" height="32" fill="#dafbe1" stroke="#1a7f37"></rect>
  <text x="130" y="91" text-anchor="middle" font-size="12">task A · user mode</text>

  <rect x="220" y="70" width="280" height="32" fill="#fff8c5" stroke="#9a6700"></rect>
  <text x="360" y="91" text-anchor="middle" font-size="12">task A · kernel (syscall)</text>

  <line x1="340" y1="50" x2="340" y2="70" stroke="#d1242f" stroke-width="2" marker-end="url(#arr_red)"></line>
  <text x="344" y="46" fill="#d1242f" font-size="10" font-weight="600">⚡ IRQ</text>

  <rect x="340" y="110" width="78" height="20" fill="#ffebe9" stroke="#d1242f"></rect>
  <text x="379" y="124" text-anchor="middle" fill="#d1242f" font-size="10">hardirq</text>

  <text x="379" y="146" text-anchor="middle" font-size="10" fill="#59636e">wake_up(B)</text>
  <text x="379" y="158" text-anchor="middle" font-size="10" fill="#1a7f37">set TIF_NEED_RESCHED</text>

  <line x1="418" y1="70" x2="418" y2="200" stroke="#0969da" stroke-dasharray="3,3"></line>
  <text x="422" y="200" fill="#0969da" font-size="10">irq_exit()</text>

  <rect x="460" y="180" width="170" height="46" fill="#ddf4ff" stroke="#0969da" rx="4"></rect>
  <text x="545" y="200" text-anchor="middle" font-size="11" font-weight="600">preempt_count == 0?</text>
  <text x="545" y="216" text-anchor="middle" font-size="10" fill="#59636e">(depends on model)</text>

  <line x1="460" y1="210" x2="300" y2="260" stroke="#d1242f" stroke-width="1.5" marker-end="url(#arr_red)"></line>
  <text x="370" y="252" fill="#d1242f" font-size="10">no → finish syscall first</text>

  <line x1="630" y1="210" x2="770" y2="260" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#arr_green)"></line>
  <text x="760" y="252" fill="#1a7f37" text-anchor="end" font-size="10">yes → schedule()</text>

  <rect x="220" y="275" width="190" height="32" fill="#fff8c5" stroke="#9a6700" stroke-dasharray="3,3"></rect>
  <text x="315" y="296" text-anchor="middle" font-size="11">A finishes syscall</text>
  <rect x="410" y="275" width="110" height="32" fill="#ddf4ff" stroke="#0969da" stroke-dasharray="3,3"></rect>
  <text x="465" y="296" text-anchor="middle" font-size="11" fill="#0969da">B runs (later)</text>

  <rect x="680" y="275" width="180" height="32" fill="#ddf4ff" stroke="#0969da"></rect>
  <text x="770" y="296" text-anchor="middle" font-size="12" font-weight="600" fill="#0969da">B preempts A — now</text>

  <g transform="translate(40, 330)" font-size="11" fill="#59636e">
    <rect width="12" height="12" fill="#dafbe1" stroke="#1a7f37"></rect><text x="18" y="10">user</text>
    <rect x="70" width="12" height="12" fill="#fff8c5" stroke="#9a6700"></rect><text x="88" y="10">kernel</text>
    <rect x="150" width="12" height="12" fill="#ffebe9" stroke="#d1242f"></rect><text x="168" y="10">IRQ</text>
    <rect x="210" width="12" height="12" fill="#ddf4ff" stroke="#0969da"></rect><text x="228" y="10">other task</text>
  </g>
</svg>
