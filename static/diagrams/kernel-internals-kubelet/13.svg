<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg">
  <text x="20" y="22" font-size="12" font-weight="600">Aggregate write throughput vs concurrent threads · same NVMe</text>

  <!-- axes -->
  <line x1="80" y1="60" x2="80" y2="280" stroke="#d1d9e0"></line>
  <line x1="80" y1="280" x2="860" y2="280" stroke="#d1d9e0"></line>
  <text x="40" y="170" font-size="10" fill="#59636e" transform="rotate(-90, 40, 170)" text-anchor="middle">GB/s</text>
  <text x="470" y="310" font-size="10" fill="#59636e" text-anchor="middle">concurrent writers</text>

  <!-- y ticks -->
  <g font-size="10" fill="#59636e">
    <line x1="76" y1="280" x2="80" y2="280" stroke="#d1d9e0"></line><text x="70" y="284" text-anchor="end">0</text>
    <line x1="76" y1="225" x2="80" y2="225" stroke="#d1d9e0"></line><text x="70" y="229" text-anchor="end">2</text>
    <line x1="76" y1="170" x2="80" y2="170" stroke="#d1d9e0"></line><text x="70" y="174" text-anchor="end">4</text>
    <line x1="76" y1="115" x2="80" y2="115" stroke="#d1d9e0"></line><text x="70" y="119" text-anchor="end">6</text>
    <line x1="76" y1="60" x2="80" y2="60" stroke="#d1d9e0"></line><text x="70" y="64" text-anchor="end">8</text>
  </g>

  <!-- x ticks -->
  <g font-size="10" fill="#59636e" text-anchor="middle">
    <line x1="80" y1="280" x2="80" y2="284" stroke="#d1d9e0"></line><text x="80" y="298">1</text>
    <line x1="225" y1="280" x2="225" y2="284" stroke="#d1d9e0"></line><text x="225" y="298">4</text>
    <line x1="370" y1="280" x2="370" y2="284" stroke="#d1d9e0"></line><text x="370" y="298">16</text>
    <line x1="515" y1="280" x2="515" y2="284" stroke="#d1d9e0"></line><text x="515" y="298">64</text>
    <line x1="660" y1="280" x2="660" y2="284" stroke="#d1d9e0"></line><text x="660" y="298">256</text>
    <line x1="805" y1="280" x2="805" y2="284" stroke="#d1d9e0"></line><text x="805" y="298">1024</text>
  </g>

  <!-- XFS curve (better scaling) -->
  <path d="M 80 240 L 225 170 L 370 110 L 515 75 L 660 70 L 805 72" stroke="#0969da" stroke-width="2.5" fill="none"></path>
  <circle cx="80" cy="240" r="3" fill="#0969da"></circle>
  <circle cx="225" cy="170" r="3" fill="#0969da"></circle>
  <circle cx="370" cy="110" r="3" fill="#0969da"></circle>
  <circle cx="515" cy="75" r="3" fill="#0969da"></circle>
  <circle cx="660" cy="70" r="3" fill="#0969da"></circle>
  <circle cx="805" cy="72" r="3" fill="#0969da"></circle>
  <text x="820" y="65" font-size="11" fill="#0969da" font-weight="500">XFS</text>

  <!-- ext4 curve (good single, plateaus) -->
  <path d="M 80 230 L 225 165 L 370 140 L 515 145 L 660 155 L 805 168" stroke="#9a6700" stroke-width="2.5" fill="none"></path>
  <circle cx="80" cy="230" r="3" fill="#9a6700"></circle>
  <circle cx="225" cy="165" r="3" fill="#9a6700"></circle>
  <circle cx="370" cy="140" r="3" fill="#9a6700"></circle>
  <circle cx="515" cy="145" r="3" fill="#9a6700"></circle>
  <circle cx="660" cy="155" r="3" fill="#9a6700"></circle>
  <circle cx="805" cy="168" r="3" fill="#9a6700"></circle>
  <text x="820" y="165" font-size="11" fill="#9a6700" font-weight="500">ext4</text>

  <!-- annotation -->
  <text x="80" y="50" font-size="10" fill="#59636e">ext4 leads (or ties) for single-stream and small files</text>
  <text x="370" y="50" font-size="10" fill="#0969da">XFS pulls away with concurrency · independent AGs</text>
</svg>
