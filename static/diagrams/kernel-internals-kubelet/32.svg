<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="aev32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"></path>
    </marker>
    <marker id="aerr32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d1242f"></path>
    </marker>
    <marker id="aok32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"></path>
    </marker>
  </defs>

  <text x="20" y="22" font-size="12" font-weight="600">kubelet's housekeeping goroutine · runs every 10s</text>

  <!-- timer -->
  <ellipse cx="100" cy="58" rx="60" ry="20" fill="#1f2328"></ellipse>
  <text x="100" y="63" text-anchor="middle" font-family="ui-monospace,Menlo" font-size="11" fill="#ffffff">every 10s</text>
  <line x1="100" y1="78" x2="100" y2="98" stroke="#1f2328" stroke-width="1.5" marker-end="url(#aev32)"></line>

  <!-- Read signals -->
  <rect x="30" y="100" width="180" height="60" fill="#ddf4ff" stroke="#0969da"></rect>
  <text x="120" y="121" text-anchor="middle" font-size="11" font-weight="600" fill="#0969da">Read signals</text>
  <text x="120" y="138" text-anchor="middle" font-size="10" fill="#59636e">cAdvisor + summary API</text>
  <text x="120" y="152" text-anchor="middle" font-size="10" fill="#59636e">memory.available, nodefs.*</text>

  <line x1="210" y1="130" x2="260" y2="130" stroke="#0969da" stroke-width="1.5" marker-end="url(#aev32)"></line>

  <!-- decision diamond -->
  <polygon points="260,130 360,80 460,130 360,180" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"></polygon>
  <text x="360" y="128" text-anchor="middle" font-size="11" font-weight="600" fill="#9a6700">Any signal</text>
  <text x="360" y="144" text-anchor="middle" font-size="11" font-weight="600" fill="#9a6700">below threshold?</text>

  <!-- no path -->
  <line x1="360" y1="180" x2="360" y2="210" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#aok32)"></line>
  <text x="372" y="200" font-size="10" fill="#1a7f37" font-weight="600">no</text>

  <rect x="270" y="212" width="180" height="40" fill="#dafbe1" stroke="#1a7f37"></rect>
  <text x="360" y="232" text-anchor="middle" font-size="11" font-weight="600" fill="#1a7f37">Sleep, loop again</text>
  <text x="360" y="246" text-anchor="middle" font-size="9" fill="#59636e">no action this cycle</text>

  <!-- yes path -->
  <line x1="460" y1="130" x2="510" y2="130" stroke="#d1242f" stroke-width="1.5" marker-end="url(#aerr32)"></line>
  <text x="478" y="120" font-size="10" fill="#d1242f" font-weight="600">yes</text>

  <!-- Rank pods to evict -->
  <rect x="510" y="92" width="200" height="76" fill="#ffebe9" stroke="#d1242f"></rect>
  <text x="610" y="112" text-anchor="middle" font-size="11" font-weight="600" fill="#d1242f">Rank pods to evict</text>
  <text x="610" y="128" text-anchor="middle" font-size="10" fill="#59636e">1. BestEffort first</text>
  <text x="610" y="142" text-anchor="middle" font-size="10" fill="#59636e">2. Burstable over-request</text>
  <text x="610" y="156" text-anchor="middle" font-size="10" fill="#59636e">3. Guaranteed last resort</text>

  <line x1="710" y1="130" x2="760" y2="130" stroke="#d1242f" stroke-width="1.5" marker-end="url(#aerr32)"></line>

  <!-- Within tier -->
  <rect x="760" y="92" width="130" height="76" fill="#ffebe9" stroke="#d1242f"></rect>
  <text x="825" y="112" text-anchor="middle" font-size="11" font-weight="600" fill="#d1242f">Within tier</text>
  <text x="825" y="128" text-anchor="middle" font-size="9" fill="#59636e">priority (low first)</text>
  <text x="825" y="142" text-anchor="middle" font-size="9" fill="#59636e">usage above request</text>
  <text x="825" y="156" text-anchor="middle" font-size="9" fill="#59636e">creation time (newer)</text>

  <line x1="825" y1="168" x2="825" y2="195" stroke="#d1242f" stroke-width="1.5" marker-end="url(#aerr32)"></line>

  <!-- Evict victim -->
  <rect x="725" y="198" width="160" height="60" fill="#d1242f"></rect>
  <text x="805" y="218" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Evict victim</text>
  <text x="805" y="234" text-anchor="middle" font-size="9" fill="#ffebe9">SIGTERM (grace period)</text>
  <text x="805" y="248" text-anchor="middle" font-size="9" fill="#ffebe9">then SIGKILL</text>

  <line x1="805" y1="258" x2="805" y2="290" stroke="#d1242f" stroke-width="1.5" marker-end="url(#aerr32)"></line>

  <!-- Recovered? -->
  <polygon points="725,302 805,278 885,302 805,326" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"></polygon>
  <text x="805" y="298" text-anchor="middle" font-size="11" font-weight="600" fill="#9a6700">Recovered?</text>
  <text x="805" y="312" text-anchor="middle" font-size="9" fill="#59636e">(min-reclaim met)</text>

  <line x1="725" y1="302" x2="690" y2="248" stroke="#d1242f" stroke-width="1.5" marker-end="url(#aerr32)"></line>
  <text x="690" y="280" font-size="10" fill="#d1242f" font-weight="600">no</text>

  <line x1="805" y1="326" x2="805" y2="355" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#aok32)"></line>
  <text x="817" y="345" font-size="10" fill="#1a7f37" font-weight="600">yes</text>

  <rect x="720" y="358" width="170" height="40" fill="#dafbe1" stroke="#1a7f37"></rect>
  <text x="805" y="378" text-anchor="middle" font-size="11" font-weight="600" fill="#1a7f37">Cooldown, return to polling</text>
  <text x="805" y="392" text-anchor="middle" font-size="9" fill="#59636e">prevents thrash</text>

  <!-- bottom note -->
  <rect x="30" y="410" width="660" height="40" fill="#fff8c5" stroke="#9a6700"></rect>
  <text x="50" y="427" font-size="10" font-weight="600" fill="#9a6700">Eviction is graceful (SIGTERM → wait → SIGKILL). Kernel OOM is brutal (SIGKILL only).</text>
  <text x="50" y="441" font-size="10" fill="#59636e">If eviction can't keep up — e.g. memory pressure spikes faster than 10s polling can catch — the kernel OOM-killer beats kubelet to it and picks an arbitrary victim, possibly kubelet itself.</text>
</svg>
