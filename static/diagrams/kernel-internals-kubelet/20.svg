<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"></path>
    </marker>
  </defs>

  <text x="20" y="22" font-size="12" font-weight="600">Hot path: NIC → userspace → NIC · no syscalls, no kernel scheduler, no GC</text>

  <!-- NIC ingress -->
  <rect x="20" y="60" width="120" height="60" fill="#fff8e6" stroke="#9a6700"></rect>
  <text x="80" y="86" text-anchor="middle" font-size="11" font-weight="600">NIC RX</text>
  <text x="80" y="104" text-anchor="middle" font-size="9" fill="#59636e">DMA into hugepage</text>

  <!-- DPDK ring -->
  <rect x="180" y="60" width="150" height="60" fill="#dafbe1" stroke="#1a7f37"></rect>
  <text x="255" y="86" text-anchor="middle" font-size="11" font-weight="600" fill="#1a7f37">DPDK RX ring</text>
  <text x="255" y="104" text-anchor="middle" font-size="9" fill="#59636e">userspace · poll mode</text>

  <!-- Worker -->
  <rect x="370" y="60" width="180" height="60" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"></rect>
  <text x="460" y="84" text-anchor="middle" font-size="11" font-weight="600" fill="#1a7f37">Worker thread</text>
  <text x="460" y="100" text-anchor="middle" font-size="9" fill="#59636e">pinned to isolated core</text>
  <text x="460" y="114" text-anchor="middle" font-size="9" fill="#59636e">SCHED_FIFO · busy-spin</text>

  <!-- Lock-free queue (to next stage if pipeline) -->
  <rect x="590" y="60" width="130" height="60" fill="#dafbe1" stroke="#1a7f37"></rect>
  <text x="655" y="86" text-anchor="middle" font-size="11" font-weight="600" fill="#1a7f37">Lock-free SPSC</text>
  <text x="655" y="104" text-anchor="middle" font-size="9" fill="#59636e">cache-aligned</text>

  <!-- TX ring -->
  <rect x="760" y="60" width="120" height="60" fill="#fff8e6" stroke="#9a6700"></rect>
  <text x="820" y="86" text-anchor="middle" font-size="11" font-weight="600">NIC TX</text>

  <!-- Arrows -->
  <line x1="140" y1="90" x2="180" y2="90" stroke="#1a7f37" stroke-width="2" marker-end="url(#art)"></line>
  <line x1="330" y1="90" x2="370" y2="90" stroke="#1a7f37" stroke-width="2" marker-end="url(#art)"></line>
  <line x1="550" y1="90" x2="590" y2="90" stroke="#1a7f37" stroke-width="2" marker-end="url(#art)"></line>
  <line x1="720" y1="90" x2="760" y2="90" stroke="#1a7f37" stroke-width="2" marker-end="url(#art)"></line>

  <!-- bottom: what's NOT in the path -->
  <text x="20" y="170" font-size="11" font-weight="600" fill="#59636e">Things NOT in the hot path · each shaves μs</text>

  <g font-size="11" fill="#59636e">
    <text x="20" y="195"><tspan fill="#d1242f">✗</tspan> kernel TCP/IP stack <tspan fill="#59636e">— DPDK userspace stack instead, or AF_XDP</tspan></text>
    <text x="20" y="215"><tspan fill="#d1242f">✗</tspan> syscalls in critical section <tspan fill="#59636e">— mmap + io_uring at startup only</tspan></text>
    <text x="20" y="235"><tspan fill="#d1242f">✗</tspan> page faults <tspan fill="#59636e">— mlockall(MCL_FUTURE) + pre-touch hugepages</tspan></text>
    <text x="20" y="255"><tspan fill="#d1242f">✗</tspan> GC pauses <tspan fill="#59636e">— C++/Rust, or JVM ZGC + +AlwaysPreTouch + fixed heap</tspan></text>
    <text x="20" y="275"><tspan fill="#d1242f">✗</tspan> context switches <tspan fill="#59636e">— SCHED_FIFO + isolcpus + nohz_full</tspan></text>
    <text x="20" y="295"><tspan fill="#d1242f">✗</tspan> CPU frequency transitions <tspan fill="#59636e">— governor=performance · disable C-states deeper than C1</tspan></text>
    <text x="20" y="315"><tspan fill="#d1242f">✗</tspan> NUMA-remote memory <tspan fill="#59636e">— pin app + NIC IRQ to the same node</tspan></text>
    <text x="20" y="335"><tspan fill="#d1242f">✗</tspan> TLB misses <tspan fill="#59636e">— 2 MiB hugepages for hot buffers</tspan></text>
    <text x="20" y="355"><tspan fill="#d1242f">✗</tspan> false sharing <tspan fill="#59636e">— align hot structs to 64 B; pad per-thread state</tspan></text>
  </g>
</svg>
