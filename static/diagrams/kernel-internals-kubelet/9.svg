<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg">
  <text x="20" y="22" font-size="12" font-weight="600">cwnd over time · same path, three algorithms</text>

  <!-- axes -->
  <line x1="60" y1="60" x2="60" y2="300" stroke="#d1d9e0"></line>
  <line x1="60" y1="300" x2="860" y2="300" stroke="#d1d9e0"></line>
  <text x="40" y="180" font-size="10" fill="#59636e" transform="rotate(-90, 40, 180)" text-anchor="middle">cwnd (MSS)</text>
  <text x="450" y="328" font-size="10" fill="#59636e" text-anchor="middle">time (RTTs)</text>

  <!-- BDP reference line -->
  <line x1="60" y1="140" x2="860" y2="140" stroke="#8250df" stroke-dasharray="3,3" stroke-width="0.8"></line>
  <text x="868" y="143" font-size="10" fill="#8250df">BDP (capacity)</text>

  <!-- Slow start (shared) - exponential -->
  <path d="M 60 290 Q 80 285 100 270 Q 120 250 140 220 Q 160 185 180 145" stroke="#59636e" stroke-width="2" fill="none"></path>
  <text x="100" y="260" font-size="10" fill="#59636e">slow start (×2 / RTT)</text>

  <!-- Reno: linear, sharp halving -->
  <path d="M 180 145 L 240 130 L 240 200 L 320 175 L 320 240 L 400 220 L 400 270 L 470 255 L 470 290 L 540 277 L 540 295 L 620 285 L 620 297 L 700 290 L 700 299" stroke="#d1242f" stroke-width="2" fill="none"></path>
  <text x="200" y="120" font-size="10" fill="#d1242f">Reno · halve on loss</text>
  <circle cx="240" cy="130" r="3" fill="#d1242f"></circle>
  <circle cx="320" cy="175" r="3" fill="#d1242f"></circle>
  <circle cx="400" cy="220" r="3" fill="#d1242f"></circle>

  <!-- CUBIC: concave then convex, deeper recovery -->
  <path d="M 180 145 L 200 138 Q 230 130 270 115 Q 310 108 350 110 L 350 165 Q 380 152 420 140 Q 450 134 480 135 L 480 180 Q 510 168 540 158 Q 570 152 600 155 L 600 195" stroke="#0969da" stroke-width="2" fill="none"></path>
  <text x="370" y="100" font-size="10" fill="#0969da">CUBIC · concave-then-convex</text>
  <circle cx="350" cy="110" r="3" fill="#0969da"></circle>
  <circle cx="480" cy="135" r="3" fill="#0969da"></circle>
  <circle cx="600" cy="155" r="3" fill="#0969da"></circle>

  <!-- BBR: roughly steady around BDP -->
  <path d="M 180 145 Q 220 138 260 145 Q 300 138 340 145 Q 380 138 420 145 Q 460 138 500 145 Q 540 138 580 145 Q 620 138 660 145 Q 700 138 740 145 Q 780 138 820 145" stroke="#1a7f37" stroke-width="2" fill="none"></path>
  <text x="600" y="125" font-size="10" fill="#1a7f37">BBR · tracks bandwidth · loss-tolerant</text>

  <!-- Loss markers -->
  <g font-size="9" fill="#d1242f">
    <text x="240" y="120">loss</text>
    <text x="320" y="165">loss</text>
    <text x="400" y="210">loss</text>
  </g>

  <!-- legend -->
  <g transform="translate(60, 340)" font-size="11" fill="#59636e">
    <line x1="0" y1="-3" x2="20" y2="-3" stroke="#d1242f" stroke-width="2"></line>
    <text x="26" y="0">Reno</text>
    <line x1="90" y1="-3" x2="110" y2="-3" stroke="#0969da" stroke-width="2"></line>
    <text x="116" y="0">CUBIC (default)</text>
    <line x1="240" y1="-3" x2="260" y2="-3" stroke="#1a7f37" stroke-width="2"></line>
    <text x="266" y="0">BBR</text>
    <line x1="320" y1="-3" x2="340" y2="-3" stroke="#8250df" stroke-width="0.8" stroke-dasharray="3,3"></line>
    <text x="346" y="0">path capacity (BDP)</text>
  </g>
</svg>
