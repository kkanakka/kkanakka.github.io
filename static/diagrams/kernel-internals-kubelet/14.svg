<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="adh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"></path>
    </marker>
  </defs>

  <text x="20" y="22" font-size="12" font-weight="600">mq-deadline · per-request expiry · reads beat writes unless old</text>

  <!-- Incoming -->
  <text x="20" y="60" font-size="11" font-weight="500">Submitted (arbitrary order)</text>
  <g font-size="10">
    <rect x="20" y="74" width="50" height="30" fill="#ddf4ff" stroke="#0969da"></rect>
    <text x="45" y="93" text-anchor="middle">R sector=180</text>
    <rect x="80" y="74" width="50" height="30" fill="#fff8c5" stroke="#9a6700"></rect>
    <text x="105" y="93" text-anchor="middle">W sector=12</text>
    <rect x="140" y="74" width="50" height="30" fill="#ddf4ff" stroke="#0969da"></rect>
    <text x="165" y="93" text-anchor="middle">R sector=44</text>
    <rect x="200" y="74" width="50" height="30" fill="#fff8c5" stroke="#9a6700"></rect>
    <text x="225" y="93" text-anchor="middle">W sector=900</text>
    <rect x="260" y="74" width="50" height="30" fill="#ddf4ff" stroke="#0969da"></rect>
    <text x="285" y="93" text-anchor="middle">R sector=620</text>
  </g>

  <!-- Two queues -->
  <text x="20" y="150" font-size="11" font-weight="500" fill="#0969da">read FIFO · deadline 500 ms</text>
  <g font-size="10">
    <rect x="20" y="164" width="60" height="30" fill="#ddf4ff" stroke="#0969da"></rect>
    <text x="50" y="183" text-anchor="middle">R s=44</text>
    <rect x="90" y="164" width="60" height="30" fill="#ddf4ff" stroke="#0969da"></rect>
    <text x="120" y="183" text-anchor="middle">R s=180</text>
    <rect x="160" y="164" width="60" height="30" fill="#ddf4ff" stroke="#0969da"></rect>
    <text x="190" y="183" text-anchor="middle">R s=620</text>
  </g>
  <text x="240" y="183" font-size="10" fill="#59636e">+ sorted by sector for HDD merge</text>

  <text x="20" y="230" font-size="11" font-weight="500" fill="#9a6700">write FIFO · deadline 5 s</text>
  <g font-size="10">
    <rect x="20" y="244" width="60" height="30" fill="#fff8c5" stroke="#9a6700"></rect>
    <text x="50" y="263" text-anchor="middle">W s=12</text>
    <rect x="90" y="244" width="60" height="30" fill="#fff8c5" stroke="#9a6700"></rect>
    <text x="120" y="263" text-anchor="middle">W s=900</text>
  </g>

  <!-- Dispatch -->
  <text x="500" y="60" font-size="11" font-weight="500">Dispatched to device</text>
  <g font-size="10">
    <rect x="500" y="74" width="50" height="30" fill="#ddf4ff" stroke="#0969da"></rect>
    <text x="525" y="93" text-anchor="middle">R s=44</text>
    <rect x="560" y="74" width="50" height="30" fill="#ddf4ff" stroke="#0969da"></rect>
    <text x="585" y="93" text-anchor="middle">R s=180</text>
    <rect x="620" y="74" width="50" height="30" fill="#ddf4ff" stroke="#0969da"></rect>
    <text x="645" y="93" text-anchor="middle">R s=620</text>
    <rect x="680" y="74" width="50" height="30" fill="#ddf4ff" stroke="#0969da"></rect>
    <text x="705" y="93" text-anchor="middle">R s=…</text>
    <rect x="740" y="74" width="50" height="30" fill="#fff8c5" stroke="#9a6700"></rect>
    <text x="765" y="93" text-anchor="middle">W s=12</text>
    <rect x="800" y="74" width="50" height="30" fill="#fff8c5" stroke="#9a6700"></rect>
    <text x="825" y="93" text-anchor="middle">W s=900</text>
  </g>

  <line x1="310" y1="89" x2="500" y2="89" stroke="#1f2328" marker-end="url(#adh)"></line>
  <line x1="350" y1="179" x2="500" y2="100" stroke="#1f2328" stroke-width="0.8" stroke-dasharray="2,2"></line>
  <line x1="350" y1="259" x2="500" y2="100" stroke="#1f2328" stroke-width="0.8" stroke-dasharray="2,2"></line>

  <text x="500" y="170" font-size="10" fill="#59636e">Reads first · sorted to minimise seek (on HDD).</text>
  <text x="500" y="186" font-size="10" fill="#59636e">Once a write's age &gt; 5 s, escape hatch: it cuts the queue.</text>
  <text x="500" y="210" font-size="10" fill="#59636e">"writes_starved" counter caps consecutive reads (default 2).</text>

  <text x="500" y="260" font-size="11" fill="#0969da" font-weight="500">Result · low read latency · writes still complete bounded.</text>
</svg>
