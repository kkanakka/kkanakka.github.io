<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg">
  <text x="20" y="22" font-size="12" font-weight="600">DRAM hangs off the memory controller · devices hang off the PCIe root complex · both inside the CPU die</text>

  <!-- CPU Socket -->
  <rect x="40" y="50" width="500" height="280" fill="#fafbfc" stroke="#0969da" stroke-width="1.5" rx="4"></rect>
  <text x="60" y="74" font-size="12" font-weight="600" fill="#0969da">CPU SOCKET · silicon die</text>

  <!-- Cores -->
  <rect x="60" y="90" width="460" height="50" fill="#dafbe1" stroke="#1a7f37"></rect>
  <text x="290" y="111" text-anchor="middle" font-size="11" font-weight="500">Cores 0–7</text>
  <text x="290" y="128" text-anchor="middle" font-size="9" fill="#59636e">L1 + L2 per core</text>

  <!-- L3 -->
  <rect x="60" y="148" width="460" height="22" fill="#fff8c5" stroke="#9a6700"></rect>
  <text x="290" y="163" text-anchor="middle" font-size="10">L3 cache · 32 MB · shared</text>

  <!-- Mesh -->
  <rect x="60" y="178" width="460" height="16" fill="#eaeef2" stroke="#6e7781"></rect>
  <text x="290" y="190" text-anchor="middle" font-size="9" fill="#59636e">cache-coherent fabric (mesh / ring)</text>

  <!-- IMC -->
  <rect x="60" y="205" width="220" height="100" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"></rect>
  <text x="170" y="227" text-anchor="middle" font-size="11" font-weight="600" fill="#0969da">Memory Controller (IMC)</text>
  <text x="170" y="246" text-anchor="middle" font-size="9" fill="#59636e">DDR5 · 8 channels</text>
  <text x="170" y="260" text-anchor="middle" font-size="9" fill="#59636e">~50 GB/s per channel</text>
  <text x="170" y="274" text-anchor="middle" font-size="9" fill="#59636e">~400 GB/s aggregate</text>
  <text x="170" y="293" text-anchor="middle" font-size="9" fill="#1a7f37" font-weight="500">→ talks to DRAM</text>

  <!-- PCIe Root Complex -->
  <rect x="300" y="205" width="220" height="100" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"></rect>
  <text x="410" y="227" text-anchor="middle" font-size="11" font-weight="600" fill="#0969da">PCIe Root Complex</text>
  <text x="410" y="246" text-anchor="middle" font-size="9" fill="#59636e">Gen5 · 80 lanes typical</text>
  <text x="410" y="260" text-anchor="middle" font-size="9" fill="#59636e">~63 GB/s per x16 link</text>
  <text x="410" y="274" text-anchor="middle" font-size="9" fill="#59636e">IOMMU lives inside</text>
  <text x="410" y="293" text-anchor="middle" font-size="9" fill="#1a7f37" font-weight="500">→ talks to peripherals</text>

  <!-- DDR5 wire from IMC to DRAM -->
  <line x1="170" y1="305" x2="170" y2="360" stroke="#9a6700" stroke-width="4"></line>
  <text x="180" y="338" font-size="9" fill="#9a6700">DDR5 bus</text>

  <!-- DRAM -->
  <rect x="60" y="360" width="220" height="80" fill="#fff8e6" stroke="#9a6700" stroke-dasharray="3,2"></rect>
  <text x="170" y="380" text-anchor="middle" font-size="12" font-weight="600" fill="#9a6700">DRAM · DDR5 DIMMs</text>
  <text x="170" y="398" text-anchor="middle" font-size="10" fill="#59636e">256 GB system RAM</text>
  <text x="170" y="412" text-anchor="middle" font-size="10" fill="#59636e">~80 ns latency</text>
  <text x="170" y="426" text-anchor="middle" font-size="9" fill="#59636e">"the memory" everyone refers to</text>

  <!-- GPU -->
  <rect x="580" y="60" width="280" height="60" fill="#dafbe1" stroke="#1a7f37"></rect>
  <text x="720" y="83" text-anchor="middle" font-size="11" font-weight="600" fill="#1a7f37">GPU</text>
  <text x="720" y="99" text-anchor="middle" font-size="9" fill="#59636e">PCIe Gen5 x16 · ~63 GB/s</text>
  <text x="720" y="112" text-anchor="middle" font-size="9" fill="#59636e">motherboard slot</text>

  <!-- NIC -->
  <rect x="580" y="140" width="280" height="60" fill="#dafbe1" stroke="#1a7f37"></rect>
  <text x="720" y="163" text-anchor="middle" font-size="11" font-weight="600" fill="#1a7f37">NIC · 100 GbE</text>
  <text x="720" y="179" text-anchor="middle" font-size="9" fill="#59636e">PCIe Gen4 x8 · ~16 GB/s</text>
  <text x="720" y="192" text-anchor="middle" font-size="9" fill="#59636e">OCP / slot</text>

  <!-- NVMe -->
  <rect x="580" y="220" width="280" height="60" fill="#dafbe1" stroke="#1a7f37"></rect>
  <text x="720" y="243" text-anchor="middle" font-size="11" font-weight="600" fill="#1a7f37">NVMe SSD</text>
  <text x="720" y="259" text-anchor="middle" font-size="9" fill="#59636e">PCIe Gen4 x4 · ~8 GB/s</text>
  <text x="720" y="272" text-anchor="middle" font-size="9" fill="#59636e">M.2 · U.2 · U.3 · OCuLink (cabled)</text>

  <text x="720" y="305" text-anchor="middle" font-size="9" fill="#59636e">... more PCIe devices · accelerators · capture cards</text>

  <!-- PCIe lanes from RC to devices -->
  <line x1="520" y1="225" x2="580" y2="90" stroke="#1a7f37" stroke-width="3"></line>
  <text x="525" y="155" font-size="10" fill="#1a7f37" font-weight="500">x16</text>

  <line x1="520" y1="250" x2="580" y2="170" stroke="#1a7f37" stroke-width="2"></line>
  <text x="530" y="210" font-size="10" fill="#1a7f37" font-weight="500">x8</text>

  <line x1="520" y1="275" x2="580" y2="250" stroke="#1a7f37" stroke-width="1.5"></line>
  <text x="535" y="270" font-size="10" fill="#1a7f37" font-weight="500">x4</text>

  <!-- Annotation -->
  <text x="450" y="450" text-anchor="middle" font-size="11" fill="#59636e">Two parallel highways · cores reach both through the cache-coherent fabric · neither bottlenecks the other</text>
</svg>
