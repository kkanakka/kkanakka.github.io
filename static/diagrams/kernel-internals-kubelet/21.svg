<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <text x="20" y="22" font-size="12" font-weight="600">Every Pod is a cgroup subtree · QoS class picks where it lands in the tree</text>

  <!-- root -->
  <rect x="340" y="50" width="220" height="32" fill="#ddf4ff" stroke="#0969da" rx="3"></rect>
  <text x="450" y="70" text-anchor="middle" font-size="11" font-weight="600">/sys/fs/cgroup</text>

  <!-- kubepods -->
  <rect x="340" y="110" width="220" height="32" fill="#ddf4ff" stroke="#0969da" rx="3"></rect>
  <text x="450" y="130" text-anchor="middle" font-size="11" font-weight="600">kubepods.slice</text>
  <line x1="450" y1="82" x2="450" y2="110" stroke="#0969da"></line>

  <!-- three QoS slices -->
  <rect x="40" y="170" width="240" height="40" fill="#dafbe1" stroke="#1a7f37" rx="3"></rect>
  <text x="160" y="188" text-anchor="middle" font-size="11" font-weight="600" fill="#1a7f37">guaranteed</text>
  <text x="160" y="203" text-anchor="middle" font-size="9" fill="#59636e">requests = limits · hard caps</text>

  <rect x="330" y="170" width="240" height="40" fill="#fff8c5" stroke="#9a6700" rx="3"></rect>
  <text x="450" y="188" text-anchor="middle" font-size="11" font-weight="600" fill="#9a6700">burstable.slice</text>
  <text x="450" y="203" text-anchor="middle" font-size="9" fill="#59636e">requests &lt; limits · soft floor + hard ceiling</text>

  <rect x="620" y="170" width="240" height="40" fill="#eaeef2" stroke="#6e7781" rx="3"></rect>
  <text x="740" y="188" text-anchor="middle" font-size="11" font-weight="600" fill="#6e7781">besteffort.slice</text>
  <text x="740" y="203" text-anchor="middle" font-size="9" fill="#59636e">no requests · no limits</text>

  <line x1="450" y1="142" x2="160" y2="170" stroke="#0969da"></line>
  <line x1="450" y1="142" x2="450" y2="170" stroke="#0969da"></line>
  <line x1="450" y1="142" x2="740" y2="170" stroke="#0969da"></line>

  <!-- pod slice -->
  <rect x="330" y="240" width="240" height="44" fill="#fff8c5" stroke="#9a6700" rx="3"></rect>
  <text x="450" y="258" text-anchor="middle" font-size="11">kubepods-burstable-pod{UID}.slice</text>
  <text x="450" y="275" text-anchor="middle" font-size="9" fill="#59636e">memory.max = 4 Gi · cpu.max = 200000 100000</text>
  <line x1="450" y1="210" x2="450" y2="240" stroke="#9a6700" stroke-dasharray="3,2"></line>

  <!-- container scopes -->
  <rect x="200" y="310" width="200" height="40" fill="#fff" stroke="#9a6700" rx="3"></rect>
  <text x="300" y="328" text-anchor="middle" font-size="11">container-app.scope</text>
  <text x="300" y="342" text-anchor="middle" font-size="9" fill="#59636e">memory.max = 3.5 Gi</text>

  <rect x="500" y="310" width="200" height="40" fill="#fff" stroke="#9a6700" rx="3"></rect>
  <text x="600" y="328" text-anchor="middle" font-size="11">container-sidecar.scope</text>
  <text x="600" y="342" text-anchor="middle" font-size="9" fill="#59636e">memory.max = 500 Mi</text>

  <line x1="450" y1="284" x2="300" y2="310" stroke="#9a6700" stroke-dasharray="3,2"></line>
  <line x1="450" y1="284" x2="600" y2="310" stroke="#9a6700" stroke-dasharray="3,2"></line>

  <!-- PSI -->
  <rect x="40" y="380" width="820" height="32" fill="#f5faff" stroke="#0969da" stroke-dasharray="3,3" rx="3"></rect>
  <text x="450" y="400" text-anchor="middle" font-size="11" fill="#0969da">cpu.pressure · memory.pressure · io.pressure  ·  PSI · readable at every level — feed back to scaler</text>
</svg>
