<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg">
  <text x="20" y="22" font-size="12" font-weight="600">RX path · check counters bottom-up · first one incrementing is your culprit</text>

  <g font-size="11">
    <!-- NIC -->
    <rect x="40" y="50" width="240" height="40" fill="#fff8e6" stroke="#9a6700"></rect>
    <text x="160" y="74" text-anchor="middle" font-weight="600" fill="#9a6700">NIC RX ring</text>

    <!-- driver -->
    <rect x="40" y="110" width="240" height="40" fill="#ddf4ff" stroke="#0969da"></rect>
    <text x="160" y="134" text-anchor="middle">NAPI / softirq</text>

    <!-- backlog -->
    <rect x="40" y="170" width="240" height="40" fill="#ddf4ff" stroke="#0969da"></rect>
    <text x="160" y="194" text-anchor="middle">per-CPU backlog (RPS)</text>

    <!-- netfilter -->
    <rect x="40" y="230" width="240" height="40" fill="#ddf4ff" stroke="#0969da"></rect>
    <text x="160" y="254" text-anchor="middle">netfilter · conntrack</text>

    <!-- IP -->
    <rect x="40" y="290" width="240" height="40" fill="#ddf4ff" stroke="#0969da"></rect>
    <text x="160" y="314" text-anchor="middle">IP · reassembly</text>

    <!-- TCP -->
    <rect x="40" y="350" width="240" height="40" fill="#ddf4ff" stroke="#0969da"></rect>
    <text x="160" y="374" text-anchor="middle">TCP/UDP recv queue</text>

    <!-- app -->
    <rect x="40" y="404" width="240" height="28" fill="#dafbe1" stroke="#1a7f37"></rect>
    <text x="160" y="423" text-anchor="middle" font-weight="600" fill="#1a7f37">application</text>
  </g>

  <!-- arrows -->
  <g stroke="#1f2328" stroke-width="1.2">
    <line x1="160" y1="90" x2="160" y2="110"></line>
    <line x1="160" y1="150" x2="160" y2="170"></line>
    <line x1="160" y1="210" x2="160" y2="230"></line>
    <line x1="160" y1="270" x2="160" y2="290"></line>
    <line x1="160" y1="330" x2="160" y2="350"></line>
    <line x1="160" y1="390" x2="160" y2="404"></line>
  </g>

  <!-- Counters column -->
  <text x="330" y="44" font-size="11" font-weight="500" fill="#59636e">COUNTER · CAUSE · FIX</text>

  <g font-size="10.5" fill="#59636e">
    <text x="330" y="72"><tspan font-family="ui-monospace,Menlo" fill="#d1242f">ethtool -S eth0 | grep rx_dropped</tspan></text>
    <text x="330" y="86">IRQ rate too low · CPU not draining ring · <tspan font-family="ui-monospace,Menlo" fill="#0969da">ethtool -G eth0 rx 4096</tspan></text>

    <text x="330" y="132"><tspan font-family="ui-monospace,Menlo" fill="#d1242f">/proc/net/softnet_stat col 2 (squeezed)</tspan></text>
    <text x="330" y="146">softirq budget exhausted · <tspan font-family="ui-monospace,Menlo" fill="#0969da">sysctl net.core.netdev_budget=600</tspan></text>

    <text x="330" y="192"><tspan font-family="ui-monospace,Menlo" fill="#d1242f">/proc/net/softnet_stat col 3 (dropped)</tspan></text>
    <text x="330" y="206">RPS queue full · raise <tspan font-family="ui-monospace,Menlo" fill="#0969da">net.core.netdev_max_backlog</tspan></text>

    <text x="330" y="252"><tspan font-family="ui-monospace,Menlo" fill="#d1242f">nf_conntrack: table full · dmesg</tspan></text>
    <text x="330" y="266">conntrack table maxed · raise <tspan font-family="ui-monospace,Menlo" fill="#0969da">nf_conntrack_max</tspan></text>

    <text x="330" y="312"><tspan font-family="ui-monospace,Menlo" fill="#d1242f">nstat -az | grep IpReasm</tspan></text>
    <text x="330" y="326">reassembly timeouts · raise <tspan font-family="ui-monospace,Menlo" fill="#0969da">ipfrag_high_thresh</tspan></text>

    <text x="330" y="372"><tspan font-family="ui-monospace,Menlo" fill="#d1242f">nstat -az | grep -E 'TcpExt|UdpRcvbufErrors'</tspan></text>
    <text x="330" y="386">recv buffer too small · <tspan font-family="ui-monospace,Menlo" fill="#0969da">net.core.rmem_max</tspan> + SO_RCVBUF</text>

    <text x="330" y="422"><tspan font-family="ui-monospace,Menlo" fill="#d1242f">ss -tnm</tspan> · app not consuming fast enough</text>
  </g>
</svg>
