<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
  <text x="20" y="22" font-size="12" font-weight="600">container = (isolated view) × (capped consumption) + safety filters</text>

  <rect x="20" y="60" width="260" height="300" fill="#f6fdf9" stroke="#1a7f37" rx="3"></rect>
  <text x="150" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#1a7f37">NAMESPACES · what it sees</text>
  <line x1="20" y1="90" x2="280" y2="90" stroke="#1a7f37" stroke-width="0.5"></line>

  <g font-size="11" fill="#59636e">
    <text x="36" y="112"><tspan fill="#1a7f37" font-weight="500">MNT</tspan>   <tspan x="100" dy="0">own /, /proc, /sys</tspan></text>
    <text x="36" y="134"><tspan fill="#1a7f37" font-weight="500">PID</tspan>   <tspan x="100" dy="0">own pid=1, own ps</tspan></text>
    <text x="36" y="156"><tspan fill="#1a7f37" font-weight="500">NET</tspan>   <tspan x="100" dy="0">veth, own iptables</tspan></text>
    <text x="36" y="178"><tspan fill="#1a7f37" font-weight="500">UTS</tspan>   <tspan x="100" dy="0">own hostname</tspan></text>
    <text x="36" y="200"><tspan fill="#1a7f37" font-weight="500">IPC</tspan>   <tspan x="100" dy="0">own SysV / POSIX</tspan></text>
    <text x="36" y="222"><tspan fill="#1a7f37" font-weight="500">USER</tspan>  <tspan x="100" dy="0">uid 0 → 100000</tspan></text>
    <text x="36" y="244"><tspan fill="#1a7f37" font-weight="500">CGROUP</tspan><tspan x="100" dy="0">cgroup root</tspan></text>
    <text x="36" y="266"><tspan fill="#1a7f37" font-weight="500">TIME</tspan>  <tspan x="100" dy="0">clock offset</tspan></text>
  </g>

  <text x="36" y="300" font-size="10" fill="#59636e">created via</text>
  <text x="36" y="316" font-size="11" font-family="ui-monospace,Menlo" fill="#0969da">clone(CLONE_NEW*…)</text>
  <text x="36" y="338" font-size="10" fill="#59636e">entered via</text>
  <text x="36" y="354" font-size="11" font-family="ui-monospace,Menlo" fill="#0969da">setns(fd, type)</text>

  <rect x="320" y="140" width="260" height="160" fill="#fff" stroke="#9a6700" stroke-width="1.5" rx="3"></rect>
  <text x="450" y="160" text-anchor="middle" font-size="12" font-weight="600">container process tree</text>
  <line x1="320" y1="170" x2="580" y2="170" stroke="#9a6700" stroke-width="0.5"></line>

  <circle cx="450" cy="200" r="16" fill="#fff8c5" stroke="#9a6700"></circle>
  <text x="450" y="204" text-anchor="middle" font-size="10">init</text>
  <text x="450" y="226" text-anchor="middle" font-size="9" fill="#9a6700">ns-pid=1 · host-pid=8821</text>

  <circle cx="410" cy="260" r="12" fill="#fff8c5" stroke="#9a6700"></circle>
  <text x="410" y="264" text-anchor="middle" font-size="9">app</text>
  <circle cx="450" cy="260" r="12" fill="#fff8c5" stroke="#9a6700"></circle>
  <text x="450" y="264" text-anchor="middle" font-size="9">app</text>
  <circle cx="490" cy="260" r="12" fill="#fff8c5" stroke="#9a6700"></circle>
  <text x="490" y="264" text-anchor="middle" font-size="9">app</text>

  <line x1="450" y1="216" x2="410" y2="248" stroke="#9a6700" stroke-width="0.5"></line>
  <line x1="450" y1="216" x2="450" y2="248" stroke="#9a6700" stroke-width="0.5"></line>
  <line x1="450" y1="216" x2="490" y2="248" stroke="#9a6700" stroke-width="0.5"></line>

  <text x="450" y="290" text-anchor="middle" font-size="10" fill="#59636e">+ seccomp · capabilities · LSM</text>

  <line x1="280" y1="220" x2="320" y2="220" stroke="#1a7f37" stroke-width="1.5"></line>
  <line x1="580" y1="220" x2="620" y2="220" stroke="#9a6700" stroke-width="1.5"></line>

  <rect x="620" y="60" width="260" height="300" fill="#fff8e6" stroke="#9a6700" rx="3"></rect>
  <text x="750" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#9a6700">CGROUP · what it consumes</text>
  <line x1="620" y1="90" x2="880" y2="90" stroke="#9a6700" stroke-width="0.5"></line>

  <g font-size="11" fill="#59636e">
    <text x="636" y="112"><tspan fill="#9a6700" font-weight="500">memory.max</tspan>   <tspan x="780" dy="0">4 GiB</tspan></text>
    <text x="636" y="134"><tspan fill="#9a6700" font-weight="500">memory.high</tspan>  <tspan x="780" dy="0">3.5 GiB</tspan></text>
    <text x="636" y="156"><tspan fill="#9a6700" font-weight="500">cpu.max</tspan>      <tspan x="780" dy="0">4 CPUs</tspan></text>
    <text x="636" y="178"><tspan fill="#9a6700" font-weight="500">cpu.weight</tspan>   <tspan x="780" dy="0">200</tspan></text>
    <text x="636" y="200"><tspan fill="#9a6700" font-weight="500">io.max</tspan>       <tspan x="780" dy="0">100 MB/s</tspan></text>
    <text x="636" y="222"><tspan fill="#9a6700" font-weight="500">pids.max</tspan>     <tspan x="780" dy="0">512</tspan></text>
    <text x="636" y="244"><tspan fill="#9a6700" font-weight="500">cpuset.cpus</tspan>  <tspan x="780" dy="0">4-7</tspan></text>
    <text x="636" y="266"><tspan fill="#9a6700" font-weight="500">cpuset.mems</tspan>  <tspan x="780" dy="0">0</tspan></text>
  </g>

  <text x="636" y="300" font-size="10" fill="#59636e">membership set by</text>
  <text x="636" y="316" font-size="11" font-family="ui-monospace,Menlo" fill="#0969da">echo $pid &gt; cgroup.procs</text>
  <text x="636" y="338" font-size="10" fill="#59636e">live readable via</text>
  <text x="636" y="354" font-size="11" font-family="ui-monospace,Menlo" fill="#0969da">cat memory.pressure</text>

  <text x="450" y="385" text-anchor="middle" font-size="11" fill="#59636e">
    Docker, Podman, runc, systemd-nspawn — all stitch the same primitives.
  </text>
</svg>
