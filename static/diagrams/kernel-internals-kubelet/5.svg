  <text x="32" y="332" font-size="10" fill="#59636e">pid = 8821 (host)</text>
  <text x="32" y="348" font-size="10" fill="#59636e">nsproxy = ▸</text>

  <rect x="280" y="90" width="210" height="110" fill="#fff8c5" stroke="#9a6700" rx="3"></rect>
  <text x="385" y="108" text-anchor="middle" font-size="12" font-weight="600">nsproxy · host</text>
  <line x1="280" y1="116" x2="490" y2="116" stroke="#9a6700" stroke-width="0.5"></line>
  <text x="295" y="132" font-size="10">uts_ns  → host_uts</text>
