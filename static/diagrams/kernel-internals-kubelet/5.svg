  <text x="295" y="164" font-size="10">pid_ns  → host_pid</text>
  <text x="295" y="180" font-size="10">net_ns  → host_net</text>
  <text x="295" y="196" font-size="10" fill="#9a6700">refcount = 2</text>

  <rect x="280" y="270" width="210" height="110" fill="#dafbe1" stroke="#1a7f37" rx="3"></rect>
  <text x="385" y="288" text-anchor="middle" font-size="12" font-weight="600" fill="#1a7f37">nsproxy · container</text>
  <line x1="280" y1="296" x2="490" y2="296" stroke="#1a7f37" stroke-width="0.5"></line>
  <text x="295" y="312" font-size="10">uts_ns  → ctr_uts</text>
  <text x="295" y="328" font-size="10">mnt_ns  → ctr_mnt</text>
  <text x="295" y="344" font-size="10">pid_ns  → ctr_pid</text>
  <text x="295" y="360" font-size="10">net_ns  → ctr_net</text>
