  <text x="20" y="22" font-size="12" font-weight="600">Two host tasks share an nsproxy. A containerised task points at different namespaces.</text>

  <rect x="20" y="60" width="160" height="70" fill="#fff8e6" stroke="#9a6700" rx="3"></rect>
  <text x="100" y="78" text-anchor="middle" font-size="11" font-weight="600" fill="#9a6700">task_struct · A</text>
  <line x1="20" y1="86" x2="180" y2="86" stroke="#9a6700" stroke-width="0.5"></line>
  <text x="32" y="102" font-size="10" fill="#59636e">pid_t pid = 4012</text>
  <text x="32" y="118" font-size="10" fill="#59636e">nsproxy = ▸</text>

  <rect x="20" y="160" width="160" height="70" fill="#fff8e6" stroke="#9a6700" rx="3"></rect>
  <text x="100" y="178" text-anchor="middle" font-size="11" font-weight="600" fill="#9a6700">task_struct · B</text>
