<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg">
  <text x="20" y="22" font-size="12" font-weight="600">A task at depth N has N+1 PIDs simultaneously.</text>

  <rect x="20" y="50" width="860" height="290" fill="#fafbfc" stroke="#9a6700" rx="4"></rect>
  <text x="34" y="70" font-size="11" font-weight="600" fill="#9a6700">host pid_namespace · level 0</text>

  <circle cx="90" cy="120" r="18" fill="#fff8c5" stroke="#9a6700"></circle>
  <text x="90" y="124" text-anchor="middle" font-size="10">systemd</text>
  <text x="90" y="156" text-anchor="middle" font-size="10" fill="#9a6700">pid=1</text>

  <circle cx="200" cy="120" r="18" fill="#fff8c5" stroke="#9a6700"></circle>
  <text x="200" y="124" text-anchor="middle" font-size="10">dockerd</text>
  <text x="200" y="156" text-anchor="middle" font-size="10" fill="#9a6700">pid=842</text>

  <line x1="108" y1="120" x2="182" y2="120" stroke="#9a6700" stroke-dasharray="2,3"></line>

  <rect x="340" y="90" width="240" height="240" fill="#f6fdf9" stroke="#1a7f37" rx="3"></rect>
  <text x="354" y="108" font-size="11" font-weight="600" fill="#1a7f37">container-a pid_namespace · level 1</text>

  <circle cx="420" cy="160" r="18" fill="#dafbe1" stroke="#1a7f37"></circle>
  <text x="420" y="164" text-anchor="middle" font-size="10">nginx</text>
  <text x="420" y="194" text-anchor="middle" font-size="10" fill="#1a7f37">pid=1 (ns)</text>
  <text x="420" y="208" text-anchor="middle" font-size="10" fill="#9a6700">pid=8821 (host)</text>

  <circle cx="510" cy="160" r="18" fill="#dafbe1" stroke="#1a7f37"></circle>
  <text x="510" y="164" text-anchor="middle" font-size="10">worker</text>
  <text x="510" y="194" text-anchor="middle" font-size="10" fill="#1a7f37">pid=7 (ns)</text>
  <text x="510" y="208" text-anchor="middle" font-size="10" fill="#9a6700">pid=8945 (host)</text>

  <line x1="438" y1="160" x2="492" y2="160" stroke="#1a7f37" stroke-dasharray="2,3"></line>

  <rect x="360" y="240" width="200" height="80" fill="#f5faff" stroke="#0969da" stroke-dasharray="4,3" rx="3"></rect>
  <text x="374" y="258" font-size="10" fill="#0969da">nested pid_namespace · level 2</text>
  <circle cx="430" cy="290" r="14" fill="#ddf4ff" stroke="#0969da"></circle>
  <text x="430" y="293" text-anchor="middle" font-size="9">proc</text>
  <text x="478" y="284" font-size="9" fill="#0969da">pid=1 (lvl 2)</text>
  <text x="478" y="297" font-size="9" fill="#1a7f37">pid=23 (lvl 1)</text>
  <text x="478" y="310" font-size="9" fill="#9a6700">pid=9102 (lvl 0)</text>

  <rect x="620" y="90" width="240" height="170" fill="#f6fdf9" stroke="#1a7f37" rx="3"></rect>
  <text x="634" y="108" font-size="11" font-weight="600" fill="#1a7f37">container-b pid_namespace · level 1</text>

  <circle cx="700" cy="160" r="18" fill="#dafbe1" stroke="#1a7f37"></circle>
  <text x="700" y="164" text-anchor="middle" font-size="10">redis</text>
  <text x="700" y="194" text-anchor="middle" font-size="10" fill="#1a7f37">pid=1 (ns)</text>
  <text x="700" y="208" text-anchor="middle" font-size="10" fill="#9a6700">pid=9233 (host)</text>

  <text x="20" y="365" font-size="11" fill="#59636e">Stored in <tspan font-family="ui-monospace,Menlo" fill="#9a6700">task→thread_pid→numbers[]</tspan> — one entry per level.</text>
</svg>
