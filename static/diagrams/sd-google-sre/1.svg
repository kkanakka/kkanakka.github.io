<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 280" xmlns="http://www.w3.org/2000/svg" style="max-width:800px;">
      <defs><filter id="sh1" x="-3%" y="-3%" width="106%" height="110%"><fedropshadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.06"></fedropshadow></filter></defs>

      <!-- SWE -->
      <rect x="10" y="10" width="390" height="260" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#sh1)"></rect>
      <text x="205" y="40" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="15" fill="#0d47a1">Standard SWE System Design</text>
      <text x="30" y="70" font-family="Inter,sans-serif" font-size="11" fill="#37352f">• Draw boxes and arrows</text>
      <text x="30" y="90" font-family="Inter,sans-serif" font-size="11" fill="#37352f">• "Use a load balancer here"</text>
      <text x="30" y="110" font-family="Inter,sans-serif" font-size="11" fill="#37352f">• "Shard the database"</text>
      <text x="30" y="130" font-family="Inter,sans-serif" font-size="11" fill="#37352f">• Discuss API design</text>
      <text x="30" y="150" font-family="Inter,sans-serif" font-size="11" fill="#37352f">• Talk about scaling "if needed"</text>
      <text x="30" y="180" font-family="Inter,sans-serif" font-weight="600" font-size="11" fill="#0d47a1">Evaluated on:</text>
      <text x="30" y="200" font-family="Inter,sans-serif" font-size="10" fill="#37352f">Functional correctness, API design,</text>
      <text x="30" y="216" font-family="Inter,sans-serif" font-size="10" fill="#37352f">data model, basic scaling</text>
      <rect x="30" y="235" width="350" height="22" rx="4" fill="#bbdefb"></rect>
      <text x="205" y="250" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#0d47a1">Abstract. "Use Redis." "Use Kafka." Done.</text>

      <!-- SRE L7 -->
      <rect x="420" y="10" width="390" height="260" rx="12" fill="#fce4ec" stroke="#c62828" stroke-width="2" filter="url(#sh1)"></rect>
      <text x="615" y="40" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="15" fill="#c62828">Google SRE L7 (NALSD)</text>
      <text x="440" y="70" font-family="Inter,sans-serif" font-size="11" fill="#37352f">• <tspan font-weight="600">Calculate</tspan> machines, disks, bandwidth</text>
      <text x="440" y="90" font-family="Inter,sans-serif" font-size="11" fill="#37352f">• <tspan font-weight="600">Define SLOs</tspan> before drawing anything</text>
      <text x="440" y="110" font-family="Inter,sans-serif" font-size="11" fill="#37352f">• <tspan font-weight="600">Cost analysis</tspan>: "$10M/month at 99.99%"</text>
      <text x="440" y="130" font-family="Inter,sans-serif" font-size="11" fill="#37352f">• <tspan font-weight="600">Global failure modes</tspan>: BGP leaks, DC loss</text>
      <text x="440" y="150" font-family="Inter,sans-serif" font-size="11" fill="#37352f">• <tspan font-weight="600">Deployment safety</tspan>: schema migrations</text>
      <text x="440" y="170" font-family="Inter,sans-serif" font-size="11" fill="#37352f">• <tspan font-weight="600">Iterative design</tspan>: 1x → 10x → 100x</text>
      <text x="440" y="200" font-family="Inter,sans-serif" font-weight="600" font-size="11" fill="#c62828">Evaluated on:</text>
      <text x="440" y="218" font-family="Inter,sans-serif" font-size="10" fill="#37352f">Economics, failure planning, deployment</text>
      <text x="440" y="234" font-family="Inter,sans-serif" font-size="10" fill="#37352f">safety, operational maturity, real numbers</text>
      <rect x="440" y="245" width="350" height="22" rx="4" fill="#ef9a9a"></rect>
      <text x="615" y="260" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="10" fill="#c62828">Concrete. "We need 847 machines. Here's why."</text>
    </svg>
