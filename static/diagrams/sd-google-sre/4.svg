<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 380" xmlns="http://www.w3.org/2000/svg" style="max-width:800px;">
      <defs><marker id="aRS" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c62828"></polygon></marker>
      <filter id="shRS" x="-3%" y="-3%" width="106%" height="110%"><fedropshadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.06"></fedropshadow></filter></defs>

      <text x="410" y="22" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="15" fill="#c62828">Retry Storm: How a Small Failure Becomes a Global Outage</text>

      <!-- Normal state -->
      <rect x="20" y="40" width="250" height="70" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"></rect>
      <text x="145" y="62" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="11" fill="#2e7d32">Normal: 10K req/s</text>
      <text x="35" y="82" font-family="Inter,sans-serif" font-size="10" fill="#37352f">Auth service handles 10K req/s fine</text>
      <text x="35" y="98" font-family="Inter,sans-serif" font-size="10" fill="#37352f">All requests succeed. No retries.</text>

      <!-- Arrow -->
      <line x1="270" y1="75" x2="310" y2="75" stroke="#c62828" stroke-width="2" marker-end="url(#aRS)"></line>
      <text x="290" y="65" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#c62828">1 server dies</text>

      <!-- Degraded -->
      <rect x="310" y="40" width="250" height="70" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"></rect>
      <text x="435" y="62" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="11" fill="#e65100">Degraded: capacity = 8K req/s</text>
      <text x="325" y="82" font-family="Inter,sans-serif" font-size="10" fill="#37352f">2K req/s fail (over capacity)</text>
      <text x="325" y="98" font-family="Inter,sans-serif" font-size="10" fill="#37352f">Clients retry failed requests...</text>

      <!-- Arrow -->
      <line x1="560" y1="75" x2="600" y2="75" stroke="#c62828" stroke-width="2" marker-end="url(#aRS)"></line>
      <text x="580" y="65" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#c62828">retries!</text>

      <!-- Overloaded -->
      <rect x="600" y="40" width="200" height="70" rx="10" fill="#fce4ec" stroke="#c62828" stroke-width="2"></rect>
      <text x="700" y="62" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="11" fill="#c62828">STORM: 30K req/s!</text>
      <text x="615" y="82" font-family="Inter,sans-serif" font-size="10" fill="#c62828">10K original + 2K retries</text>
      <text x="615" y="98" font-family="Inter,sans-serif" font-size="10" fill="#c62828">+ retries of retries of retries...</text>

      <!-- Cascade -->
      <rect x="200" y="130" width="420" height="40" rx="8" fill="#c62828"></rect>
      <text x="410" y="155" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="12" fill="#fff">CASCADING FAILURE: Auth service completely down → ALL services fail</text>

      <!-- Solutions -->
      <rect x="20" y="190" width="780" height="180" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"></rect>
      <text x="410" y="215" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="14" fill="#2e7d32">Prevention: The Five Defenses Against Retry Storms</text>

      <text x="40" y="240" font-family="Inter,sans-serif" font-weight="600" font-size="11" fill="#2e7d32">1. Exponential Backoff + Jitter</text>
      <text x="45" y="258" font-family="Inter,sans-serif" font-size="10" fill="#37352f">Retry after 1s, 2s, 4s, 8s (+ random 0-1s). Spreads retries over time.</text>

      <text x="40" y="280" font-family="Inter,sans-serif" font-weight="600" font-size="11" fill="#2e7d32">2. Circuit Breaker (Hystrix pattern)</text>
      <text x="45" y="298" font-family="Inter,sans-serif" font-size="10" fill="#37352f">After 5 consecutive failures, STOP retrying for 30s. Serve cached/default response.</text>

      <text x="40" y="320" font-family="Inter,sans-serif" font-weight="600" font-size="11" fill="#2e7d32">3. Server-Side Load Shedding</text>
      <text x="45" y="338" font-family="Inter,sans-serif" font-size="10" fill="#37352f">When at 80% CPU: reject low-priority requests with 503 + Retry-After header.</text>

      <text x="430" y="240" font-family="Inter,sans-serif" font-weight="600" font-size="11" fill="#2e7d32">4. Retry Budgets</text>
      <text x="435" y="258" font-family="Inter,sans-serif" font-size="10" fill="#37352f">Each client gets max 10% retry ratio. If &gt;10% of requests are retries, stop.</text>

      <text x="430" y="280" font-family="Inter,sans-serif" font-weight="600" font-size="11" fill="#2e7d32">5. Admission Control (Google's approach)</text>
      <text x="435" y="298" font-family="Inter,sans-serif" font-size="10" fill="#37352f">Client tracks its own success rate. If &lt;50%, probabilistically drop new requests.</text>
      <text x="435" y="316" font-family="JetBrains Mono,monospace" font-size="9" fill="#37352f">P(accept) = max(0, (requests - K*accepts) / (requests+1))</text>
      <text x="435" y="338" font-family="Inter,sans-serif" font-size="10" fill="#787774">From Google SRE Book Ch. 21: "Handling Overload"</text>
    </svg>
