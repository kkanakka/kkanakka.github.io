<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg" role="img"><style>svg{display:block; max-width:100%; height:auto;}</style><defs><marker id="ah-d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#444441" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><fedropshadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#1c1b18" flood-opacity="0.13"></fedropshadow></filter></defs><g><rect x="20" y="30" width="131.67" height="66" rx="11" fill="#ffffff" stroke="#a9a79e" stroke-width="1.3" filter="url(#soft)"></rect><text x="85.83" y="53" text-anchor="middle" font-weight="700" font-size="11.5" fill="#1c1b18">Requirements</text><text x="85.83" y="69" text-anchor="middle" font-weight="600" font-size="9.5" fill="#a9a79e">millions QPS, multi-tenant,</text><text x="85.83" y="83" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">DDoS-resilient, global</text></g><line x1="151.67" y1="63" x2="165.67" y2="63" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><g><rect x="165.67" y="30" width="131.67" height="66" rx="11" fill="#d9d9d9" stroke="#1c1b18" stroke-width="1.3" filter="url(#soft)"></rect><text x="231.5" y="53" text-anchor="middle" font-weight="700" font-size="11.5" fill="#1c1b18">SLO Contract</text><text x="231.5" y="69" text-anchor="middle" font-weight="600" font-size="9.5" fill="#1c1b18">P99 &lt;10ms, 99.999% up,</text><text x="231.5" y="83" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">propagation &lt;60s</text></g><line x1="297.33" y1="63" x2="311.33" y2="63" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><g><rect x="311.33" y="30" width="131.67" height="66" rx="11" fill="#ffffff" stroke="#a9a79e" stroke-width="1.3" filter="url(#soft)"></rect><text x="377.17" y="53" text-anchor="middle" font-weight="700" font-size="11.5" fill="#1c1b18">Baseline Design</text><text x="377.17" y="69" text-anchor="middle" font-weight="600" font-size="9.5" fill="#a9a79e">4-layer: edge → auth</text><text x="377.17" y="83" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">→ recursive → data store</text></g><line x1="443" y1="63" x2="457" y2="63" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><g><rect x="457" y="30" width="131.67" height="66" rx="11" fill="#ffffff" stroke="#a9a79e" stroke-width="1.3" filter="url(#soft)"></rect><text x="522.83" y="53" text-anchor="middle" font-weight="700" font-size="11.5" fill="#1c1b18">Stressors</text><text x="522.83" y="69" text-anchor="middle" font-weight="600" font-size="9.5" fill="#a9a79e">100Gbps DDoS, BGP hijack,</text><text x="522.83" y="83" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">zone DB failure, stale cache</text></g><line x1="588.67" y1="63" x2="602.67" y2="63" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><g><rect x="602.67" y="30" width="131.67" height="66" rx="11" fill="#d9d9d9" stroke="#1c1b18" stroke-width="1.3" filter="url(#soft)"></rect><text x="668.5" y="53" text-anchor="middle" font-weight="700" font-size="11.5" fill="#1c1b18">Resilient Arch</text><text x="668.5" y="69" text-anchor="middle" font-weight="600" font-size="9.5" fill="#1c1b18">anycast, stale-if-error,</text><text x="668.5" y="83" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">RPKI, multi-PoP failover</text></g><line x1="734.33" y1="63" x2="748.33" y2="63" stroke="#444441" stroke-width="1.7" marker-end="url(#ah-d)"></line><g><rect x="748.33" y="30" width="131.67" height="66" rx="11" fill="#ffffff" stroke="#a9a79e" stroke-width="1.3" filter="url(#soft)"></rect><text x="814.17" y="53" text-anchor="middle" font-weight="700" font-size="11.5" fill="#1c1b18">Observability</text><text x="814.17" y="69" text-anchor="middle" font-weight="600" font-size="9.5" fill="#a9a79e">SLI = successful resolve %,</text><text x="814.17" y="83" text-anchor="middle" font-weight="600" font-size="10" fill="#8a8985">per-tenant QPS, NXDOMAIN</text></g><rect x="20" y="118" width="860" height="46" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.2"></rect><text x="450" y="138" text-anchor="middle" font-weight="600" font-size="10" fill="#0c447c">Trade-offs at every step: more edge PoPs → lower latency but higher infra cost • lower TTLs → faster</text><text x="450" y="152" text-anchor="middle" font-weight="600" font-size="10" fill="#0c447c">propagation but higher upstream load • stale-if-error → availability but potentially stale answers</text></svg>
