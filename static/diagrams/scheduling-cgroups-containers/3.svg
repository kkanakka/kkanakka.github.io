<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arr3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2328" stroke-width="1.5" stroke-linecap="round"></path>
        </marker>
      </defs>

      <rect x="50" y="40" width="700" height="420" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"></rect>
      <text x="70" y="66" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#1f2328">PROCESS TREE AND NAMESPACE VIEW</text>

      <rect x="80" y="90" width="300" height="140" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"></rect>
      <text x="100" y="116" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#1f2328">HOST PID NAMESPACE (what ps sees)</text>
      
      <text x="110" y="140" font-family="ui-monospace, monospace" font-size="11" fill="#1f2328">PID 1: /sbin/init</text>
      <text x="110" y="156" font-family="ui-monospace, monospace" font-size="11" fill="#59636e">├─ PID 1234: dockerd</text>
      <text x="110" y="172" font-family="ui-monospace, monospace" font-size="11" fill="#59636e">├─ PID 5678: containerd-shim</text>
      <text x="110" y="188" font-family="ui-monospace, monospace" font-size="11" fill="#0969da">├─ PID 9999: bash (container)</text>
      <text x="110" y="204" font-family="ui-monospace, monospace" font-size="11" fill="#0969da">└─ PID 10001: curl (inside container)</text>

      <rect x="420" y="90" width="280" height="140" fill="#eaeef2" stroke="#1f2328" stroke-width="1.5"></rect>
      <text x="440" y="116" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#1f2328">CONTAINER PID NAMESPACE</text>
      <text x="450" y="140" font-family="ui-monospace, monospace" font-size="11" fill="#0969da">PID 1: bash (appears as init)</text>
      <text x="450" y="156" font-family="ui-monospace, monospace" font-size="11" fill="#0969da">└─ PID 2: curl</text>
      <text x="450" y="180" font-family="-apple-system, sans-serif" font-size="10" fill="#59636e">Same processes, different</text>
      <text x="450" y="194" font-family="-apple-system, sans-serif" font-size="10" fill="#59636e">PID numbering!</text>

      <line x1="380" y1="160" x2="420" y2="160" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arr3)"></line>

      <rect x="80" y="260" width="620" height="180" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"></rect>
      <text x="100" y="286" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#1f2328">CGROUP HIERARCHY (resource limits)</text>
      
      <text x="110" y="310" font-family="ui-monospace, monospace" font-size="11" fill="#1f2328">/sys/fs/cgroup/</text>
      <text x="130" y="326" font-family="ui-monospace, monospace" font-size="11" fill="#59636e">├─ systemd/</text>
      <text x="150" y="342" font-family="ui-monospace, monospace" font-size="11" fill="#59636e">│  └─ system.slice/ (system services)</text>
      <text x="130" y="358" font-family="ui-monospace, monospace" font-size="11" fill="#59636e">└─ docker/</text>
      <text x="150" y="374" font-family="ui-monospace, monospace" font-size="11" fill="#0969da">   └─ 9abc123def456.../  (container ID)</text>
      <text x="170" y="390" font-family="ui-monospace, monospace" font-size="10" fill="#0969da">├─ memory.limit_in_bytes: 1073741824  (1GB)</text>
      <text x="170" y="404" font-family="ui-monospace, monospace" font-size="10" fill="#0969da">├─ cpu.shares: 1024</text>
      <text x="170" y="418" font-family="ui-monospace, monospace" font-size="10" fill="#0969da">└─ cgroup.procs: 9999, 10001</text>

      <line x1="530" y1="360" x2="430" y2="188" stroke="#0969da" stroke-width="1.5" stroke-dasharray="4,4"></line>
      <text x="470" y="280" font-family="-apple-system, sans-serif" font-size="10" fill="#0969da">Processes 9999,10001</text>
      <text x="470" y="294" font-family="-apple-system, sans-serif" font-size="10" fill="#0969da">limited by this cgroup</text>
    </svg>
