<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2328" stroke-width="1.5" stroke-linecap="round"></path>
        </marker>
      </defs>

      <rect x="20" y="20" width="720" height="120" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"></rect>
      <text x="40" y="46" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1f2328">LAYER 1 — KERNEL BUILD CONFIG (compile time, system-wide)</text>
      <line x1="40" y1="56" x2="720" y2="56" stroke="#d1d9e0"></line>
      <text x="40" y="84" font-family="-apple-system, sans-serif" font-size="20" font-weight="600" fill="#1f2328">PREEMPT_NONE   ·   PREEMPT_VOLUNTARY   ·   PREEMPT_RT</text>
      <text x="40" y="108" font-family="-apple-system, sans-serif" font-size="14" fill="#59636e">Q: How fast can the kernel be interrupted while running its own code?</text>
      <text x="40" y="128" font-family="ui-monospace, monospace" font-size="11" fill="#818b98">changed by installing a different kernel package or via preempt= boot param</text>

      <line x1="380" y1="145" x2="380" y2="170" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arr)"></line>

      <rect x="20" y="175" width="720" height="120" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"></rect>
      <text x="40" y="201" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1f2328">LAYER 2 — SCHEDULING CLASS (runtime, per process)</text>
      <line x1="40" y1="211" x2="720" y2="211" stroke="#d1d9e0"></line>
      <text x="40" y="239" font-family="-apple-system, sans-serif" font-size="18" font-weight="600" fill="#1f2328">SCHED_DEADLINE · SCHED_FIFO · SCHED_RR · SCHED_OTHER · BATCH · IDLE</text>
      <text x="40" y="263" font-family="-apple-system, sans-serif" font-size="14" fill="#59636e">Q: Which scheduling algorithm should run me?</text>
      <text x="40" y="283" font-family="ui-monospace, monospace" font-size="11" fill="#818b98">set with chrt(1) or sched_setscheduler(2)</text>

      <line x1="380" y1="300" x2="380" y2="325" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arr)"></line>

      <rect x="20" y="330" width="720" height="120" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"></rect>
      <text x="40" y="356" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1f2328">LAYER 3 — PRIORITY / NICE (runtime, per process)</text>
      <line x1="40" y1="366" x2="720" y2="366" stroke="#d1d9e0"></line>
      <text x="40" y="394" font-family="-apple-system, sans-serif" font-size="18" font-weight="600" fill="#1f2328">RT priority 1–99   ·   Nice value −20 to +19</text>
      <text x="40" y="418" font-family="-apple-system, sans-serif" font-size="14" fill="#59636e">Q: Where do I rank among others using the same algorithm?</text>
      <text x="40" y="438" font-family="ui-monospace, monospace" font-size="11" fill="#818b98">set with chrt (RT) or nice/renice (CFS)</text>
    </svg>
