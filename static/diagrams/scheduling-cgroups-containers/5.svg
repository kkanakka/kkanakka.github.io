      <rect x="440" y="60" width="280" height="120" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"></rect>
      <text x="460" y="86" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#1f2328">NUMA NODE 1</text>
      <rect x="480" y="100" width="40" height="30" fill="#ffffff" stroke="#bf3989"></rect>
      <text x="490" y="120" font-family="ui-monospace, monospace" font-size="9">CPU 4</text>
