      <text x="490" y="160" font-family="ui-monospace, monospace" font-size="10">LOCAL MEMORY 16GB</text>

      <path d="M360 120 Q400 120 440 120" fill="none" stroke="#1f2328" stroke-width="2" stroke-dasharray="4,4"></path>
      <text x="365" y="110" font-family="-apple-system, sans-serif" font-size="10" fill="#59636e">Interconnect</text>
      <text x="365" y="140" font-family="-apple-system, sans-serif" font-size="10" fill="#59636e">(slower)</text>

      <rect x="200" y="220" width="400" height="100" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"></rect>
      <text x="220" y="246" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#1f2328">MEMORY ACCESS LATENCY</text>
      <text x="220" y="270" font-family="-apple-system, sans-serif" font-size="12" fill="#0969da">Node 0 CPU → Node 0 Memory: ~100ns</text>
      <text x="220" y="290" font-family="-apple-system, sans-serif" font-size="12" fill="#bf3989">Node 0 CPU → Node 1 Memory: ~150ns (1.5x slower)</text>
      <text x="220" y="310" font-family="-apple-system, sans-serif" font-size="12" fill="#59636e">Performance penalty for cross-node memory access</text>
