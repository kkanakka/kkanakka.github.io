<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 540" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrRT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2328" stroke-width="1.5" stroke-linecap="round"></path>
        </marker>
      </defs>

      <rect x="20" y="20" width="720" height="80" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"></rect>
      <text x="40" y="44" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1f2328">APPLICATION LAYER</text>
      <line x1="40" y1="52" x2="720" y2="52" stroke="#d1d9e0"></line>
      <text x="40" y="74" font-family="-apple-system, sans-serif" font-size="14" fill="#1f2328">Lock-free ring buffers · pre-allocated object pools · no malloc on hot path</text>
      <text x="40" y="92" font-family="-apple-system, sans-serif" font-size="12" font-style="italic" fill="#59636e">Latency budget for business logic: ~50–500 μs</text>

      <line x1="380" y1="100" x2="380" y2="120" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrRT)"></line>

      <rect x="20" y="125" width="720" height="80" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"></rect>
      <text x="40" y="149" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1f2328">RUNTIME LAYER</text>
      <line x1="40" y1="157" x2="720" y2="157" stroke="#d1d9e0"></line>
      <text x="40" y="179" font-family="-apple-system, sans-serif" font-size="14" fill="#1f2328">CPU pinning to cores 2–15 · mlockall · pre-faulted huge pages · NUMA-local allocation</text>
      <text x="40" y="197" font-family="-apple-system, sans-serif" font-size="12" font-style="italic" fill="#59636e">Disable swap, THP, KSM — all introduce latency spikes</text>

      <line x1="380" y1="205" x2="380" y2="225" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrRT)"></line>

      <rect x="20" y="230" width="350" height="100" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"></rect>
      <text x="40" y="254" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1f2328">NETWORK · DPDK</text>
      <line x1="40" y1="262" x2="360" y2="262" stroke="#d1d9e0"></line>
      <text x="40" y="284" font-family="-apple-system, sans-serif" font-size="13" fill="#1f2328">Userspace driver, kernel bypass</text>
      <text x="40" y="302" font-family="-apple-system, sans-serif" font-size="13" fill="#1f2328">Poll mode — no IRQs</text>
      <text x="40" y="320" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#1a7f37">~5–10 μs NIC-to-app</text>

      <rect x="390" y="230" width="350" height="100" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"></rect>
      <text x="410" y="254" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1f2328">NETWORK · XDP</text>
      <line x1="410" y1="262" x2="730" y2="262" stroke="#d1d9e0"></line>
      <text x="410" y="284" font-family="-apple-system, sans-serif" font-size="13" fill="#1f2328">eBPF at NIC driver level</text>
      <text x="410" y="302" font-family="-apple-system, sans-serif" font-size="13" fill="#1f2328">Shares NIC with kernel stack</text>
      <text x="410" y="320" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#a04000">~20–30 μs NIC-to-app</text>

      <line x1="380" y1="330" x2="380" y2="350" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrRT)"></line>

      <rect x="20" y="355" width="720" height="80" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"></rect>
      <text x="40" y="379" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1f2328">KERNEL LAYER</text>
      <line x1="40" y1="387" x2="720" y2="387" stroke="#d1d9e0"></line>
      <text x="40" y="409" font-family="-apple-system, sans-serif" font-size="14" fill="#1f2328">PREEMPT_RT · isolcpus=2-15 · nohz_full=2-15 · rcu_nocbs=2-15 · threaded IRQs</text>
      <text x="40" y="427" font-family="-apple-system, sans-serif" font-size="12" font-style="italic" fill="#59636e">Cores 2-15 do ONLY your application — no scheduler tick, no IRQs, no kworkers</text>

      <line x1="380" y1="435" x2="380" y2="455" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrRT)"></line>

      <rect x="20" y="460" width="720" height="80" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"></rect>
      <text x="40" y="484" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1f2328">HARDWARE LAYER</text>
      <line x1="40" y1="492" x2="720" y2="492" stroke="#d1d9e0"></line>
      <text x="40" y="514" font-family="-apple-system, sans-serif" font-size="14" fill="#1f2328">Disable C-states · pin CPU frequency · NUMA-aware NIC placement · SR-IOV VFs</text>
      <text x="40" y="532" font-family="-apple-system, sans-serif" font-size="12" font-style="italic" fill="#59636e">Disable hyper-threading on isolated cores — SMT contention adds jitter</text>
    </svg>
