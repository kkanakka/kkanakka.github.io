          <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2328" stroke-width="1.5" stroke-linecap="round"></path>
        </marker>
        <marker id="arrK8-loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L8 5L2 9" fill="none" stroke="#0969da" stroke-width="1.5" stroke-linecap="round"></path>
        </marker>
      </defs>

      <rect x="20" y="20" width="720" height="76" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"></rect>
      <text x="40" y="44" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1f2328">POD SPEC (DECLARED)</text>
      <line x1="40" y1="52" x2="720" y2="52" stroke="#d1d9e0"></line>
      <text x="40" y="74" font-family="ui-monospace, monospace" font-size="13" fill="#1f2328">requests.cpu 500m · limits.cpu 2 · requests.memory 1Gi · limits.memory 4Gi</text>
      <text x="40" y="92" font-family="-apple-system, sans-serif" font-size="12" font-style="italic" fill="#59636e">QoS class derived: Guaranteed · Burstable · BestEffort</text>

      <line x1="380" y1="96" x2="380" y2="116" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrK8)"></line>

      <rect x="20" y="120" width="720" height="76" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"></rect>
      <text x="40" y="144" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1f2328">KUBELET TRANSLATES TO CGROUP WRITES</text>
      <line x1="40" y1="152" x2="720" y2="152" stroke="#d1d9e0"></line>
      <text x="40" y="174" font-family="ui-monospace, monospace" font-size="13" fill="#1f2328">cpu.weight ← request · cpu.max ← limit · memory.max ← limit · memory.high ← request</text>
      <text x="40" y="192" font-family="-apple-system, sans-serif" font-size="12" font-style="italic" fill="#59636e">cpuset.cpus ← CPU Manager static (Guaranteed integer-CPU pods only)</text>

      <line x1="380" y1="196" x2="380" y2="216" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrK8)"></line>

      <rect x="20" y="220" width="720" height="86" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"></rect>
      <text x="40" y="244" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1f2328">CGROUP V2 HIERARCHY ENFORCES</text>
      <line x1="40" y1="252" x2="720" y2="252" stroke="#d1d9e0"></line>
      <text x="40" y="274" font-family="ui-monospace, monospace" font-size="13" fill="#1f2328">/sys/fs/cgroup/kubepods.slice/&lt;qos&gt;.slice/&lt;pod-uid&gt;/</text>
      <text x="40" y="292" font-family="-apple-system, sans-serif" font-size="13" fill="#1f2328">CFS bandwidth throttling at quota boundary · OOM kill at memory.max breach</text>

      <line x1="380" y1="306" x2="380" y2="326" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrK8)"></line>

      <rect x="20" y="330" width="350" height="90" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"></rect>
      <text x="40" y="354" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1f2328">OBSERVABILITY</text>
      <line x1="40" y1="362" x2="360" y2="362" stroke="#d1d9e0"></line>
      <text x="40" y="384" font-family="ui-monospace, monospace" font-size="12" fill="#1f2328">cpu.stat · memory.current</text>
      <text x="40" y="402" font-family="ui-monospace, monospace" font-size="12" fill="#1f2328">cpu.pressure · memory.pressure</text>

      <rect x="390" y="330" width="350" height="90" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"></rect>
      <text x="410" y="354" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1f2328">AUTOSCALERS</text>
      <line x1="410" y1="362" x2="730" y2="362" stroke="#d1d9e0"></line>
      <text x="410" y="384" font-family="-apple-system, sans-serif" font-size="13" fill="#1f2328">HPA: scale replicas on CPU/PSI</text>
      <text x="410" y="402" font-family="-apple-system, sans-serif" font-size="13" fill="#1f2328">VPA: recommend new requests</text>

      <line x1="195" y1="420" x2="195" y2="440" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrK8)"></line>
      <line x1="565" y1="420" x2="565" y2="440" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrK8)"></line>

      <rect x="20" y="444" width="350" height="76" fill="#ffffff" stroke="#1f2328" stroke-width="1"></rect>
      <text x="40" y="468" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1f2328">IN-PLACE RESIZE (1.27+)</text>
      <line x1="40" y1="476" x2="360" y2="476" stroke="#d1d9e0"></line>
      <text x="40" y="498" font-family="-apple-system, sans-serif" font-size="13" fill="#1f2328">Update cpu.max live · no pod restart</text>
      <text x="40" y="514" font-family="-apple-system, sans-serif" font-size="12" font-style="italic" fill="#59636e">Memory shrinks need restart</text>

      <rect x="390" y="444" width="350" height="76" fill="#ffffff" stroke="#1f2328" stroke-width="1"></rect>
      <text x="410" y="468" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1f2328">EVICTION (KUBELET)</text>
      <line x1="410" y1="476" x2="730" y2="476" stroke="#d1d9e0"></line>
      <text x="410" y="498" font-family="-apple-system, sans-serif" font-size="13" fill="#1f2328">PSI threshold breach → evict</text>
      <text x="410" y="514" font-family="-apple-system, sans-serif" font-size="12" font-style="italic" fill="#59636e">BestEffort → Burstable → Guaranteed</text>

      <path d="M 195 520 L 195 555 L 5 555 L 5 60 L 20 60" stroke="#0969da" stroke-width="1.5" fill="none" marker-end="url(#arrK8-loop)"></path>

      <text x="40" y="580" font-family="-apple-system, sans-serif" font-size="13" font-style="italic" fill="#0969da">Loop: pressure → autoscaler decision → new cgroup limits → kernel enforces → repeat</text>
    </svg>
