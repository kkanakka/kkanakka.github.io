<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrEB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2328" stroke-width="1.5" stroke-linecap="round"></path>
        </marker>
      </defs>

      <rect x="20" y="20" width="350" height="120" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"></rect>
      <text x="40" y="44" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1f2328">USERSPACE — write &amp; load</text>
      <line x1="40" y1="52" x2="360" y2="52" stroke="#d1d9e0"></line>
      <text x="40" y="74" font-family="-apple-system, sans-serif" font-size="13" fill="#1f2328">1. Write program in C (or Rust, Go via libbpf)</text>
      <text x="40" y="94" font-family="-apple-system, sans-serif" font-size="13" fill="#1f2328">2. Compile to BPF bytecode (clang -target bpf)</text>
      <text x="40" y="114" font-family="-apple-system, sans-serif" font-size="13" fill="#1f2328">3. Load via bpf() syscall</text>
      <text x="40" y="132" font-family="-apple-system, sans-serif" font-size="12" font-style="italic" fill="#59636e">Tools: bcc, libbpf, bpftrace, Cilium</text>

      <line x1="370" y1="80" x2="395" y2="80" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrEB)"></line>

      <rect x="395" y="20" width="345" height="120" fill="#fffaf0" stroke="#a04000" stroke-width="1.5"></rect>
      <text x="415" y="44" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#a04000">KERNEL — verifier</text>
      <line x1="415" y1="52" x2="730" y2="52" stroke="#d1d9e0"></line>
      <text x="415" y="74" font-family="-apple-system, sans-serif" font-size="13" fill="#a04000">Walks all paths · proves termination</text>
      <text x="415" y="94" font-family="-apple-system, sans-serif" font-size="13" fill="#a04000">No unbounded loops · no out-of-bounds</text>
      <text x="415" y="114" font-family="-apple-system, sans-serif" font-size="13" fill="#a04000">Max 1M instructions · ≤8 KB stack</text>
      <text x="415" y="132" font-family="-apple-system, sans-serif" font-size="12" font-style="italic" fill="#a04000">Reject = program never runs</text>

      <line x1="565" y1="140" x2="565" y2="170" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrEB)"></line>

      <rect x="395" y="175" width="345" height="80" fill="#e6f4ea" stroke="#1a7f37" stroke-width="1.5"></rect>
      <text x="415" y="199" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1a7f37">JIT COMPILE</text>
      <line x1="415" y1="207" x2="730" y2="207" stroke="#d1d9e0"></line>
      <text x="415" y="229" font-family="-apple-system, sans-serif" font-size="13" fill="#1a7f37">BPF bytecode → native CPU instructions</text>
      <text x="415" y="247" font-family="-apple-system, sans-serif" font-size="12" font-style="italic" fill="#1a7f37">Runs at native speed, no interpretation</text>

      <line x1="565" y1="255" x2="565" y2="285" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrEB)"></line>

      <rect x="395" y="290" width="345" height="100" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"></rect>
      <text x="415" y="314" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1f2328">ATTACH TO HOOK</text>
      <line x1="415" y1="322" x2="730" y2="322" stroke="#d1d9e0"></line>
      <text x="415" y="344" font-family="-apple-system, sans-serif" font-size="13" fill="#1f2328">kprobes · uprobes · tracepoints</text>
      <text x="415" y="362" font-family="-apple-system, sans-serif" font-size="13" fill="#1f2328">XDP · TC · cgroup · LSM · perf</text>
      <text x="415" y="380" font-family="-apple-system, sans-serif" font-size="13" fill="#1f2328">Now runs whenever the hook fires</text>

      <line x1="195" y1="140" x2="195" y2="290" stroke="#1f2328" stroke-width="1.5" stroke-dasharray="4 4"></line>

      <rect x="20" y="290" width="350" height="100" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"></rect>
      <text x="40" y="314" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1f2328">BPF MAPS — shared state</text>
      <line x1="40" y1="322" x2="360" y2="322" stroke="#d1d9e0"></line>
      <text x="40" y="344" font-family="-apple-system, sans-serif" font-size="13" fill="#1f2328">Hash, array, ring buffer, perf-event</text>
      <text x="40" y="362" font-family="-apple-system, sans-serif" font-size="13" fill="#1f2328">Userspace ↔ kernel data exchange</text>
      <text x="40" y="380" font-family="-apple-system, sans-serif" font-size="13" fill="#1f2328">Per-CPU variants for lock-free access</text>

      <line x1="370" y1="340" x2="395" y2="340" stroke="#1f2328" stroke-width="1.5" stroke-dasharray="4 4"></line>

      <rect x="20" y="410" width="720" height="40" fill="#fffaf0" stroke="#1f2328" stroke-width="1"></rect>
      <text x="40" y="435" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#1f2328">Result: kernel-side logic that's safe, fast, and updatable without rebooting</text>
    </svg>
