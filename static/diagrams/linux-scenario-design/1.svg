<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 540" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2328" stroke-width="1.5" stroke-linecap="round"></path>
        </marker>
      </defs>

      <rect x="20" y="20" width="720" height="80" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"></rect>
      <text x="40" y="44" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1f2328">BUILD &amp; SIGN — done once per patch</text>
      <line x1="40" y1="52" x2="720" y2="52" stroke="#d1d9e0"></line>
      <text x="40" y="74" font-family="-apple-system, sans-serif" font-size="14" fill="#1f2328">Git commit → CI builds RPM/DEB → cosign signature → immutable artifact registry</text>
      <text x="40" y="92" font-family="-apple-system, sans-serif" font-size="12" font-style="italic" fill="#59636e">Every agent verifies the cosign signature before installing — no signature, no install.</text>

      <line x1="380" y1="100" x2="380" y2="120" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrA)"></line>

      <rect x="20" y="125" width="170" height="80" fill="#ffffff" stroke="#1f2328" stroke-width="1"></rect>
      <text x="105" y="155" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#1f2328">Pre-canary</text>
      <text x="105" y="175" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#1f2328">5 nodes</text>
      <text x="105" y="193" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#59636e">4 h soak</text>

      <rect x="200" y="125" width="170" height="80" fill="#ffffff" stroke="#1f2328" stroke-width="1"></rect>
      <text x="285" y="155" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#1f2328">Canary</text>
      <text x="285" y="175" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#1f2328">50 nodes (1%)</text>
      <text x="285" y="193" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#59636e">24 h soak</text>

      <rect x="380" y="125" width="170" height="80" fill="#ffffff" stroke="#1f2328" stroke-width="1"></rect>
      <text x="465" y="155" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#1f2328">Stage</text>
      <text x="465" y="175" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#1f2328">1000 nodes (10%)</text>
      <text x="465" y="193" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#59636e">48 h soak</text>

      <rect x="560" y="125" width="180" height="80" fill="#fff5e8" stroke="#a04000" stroke-width="1.5"></rect>
