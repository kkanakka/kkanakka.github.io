<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrAg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2328" stroke-width="1.5" stroke-linecap="round"></path>
        </marker>
        <marker id="arrAg-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L8 5L2 9" fill="none" stroke="#1a7f37" stroke-width="1.5" stroke-linecap="round"></path>
        </marker>
        <marker id="arrAg-err" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L8 5L2 9" fill="none" stroke="#a04000" stroke-width="1.5" stroke-linecap="round"></path>
        </marker>
      </defs>

      <rect x="310" y="30" width="160" height="56" fill="#f0f0f0" stroke="#1f2328" stroke-width="1"></rect>
      <text x="390" y="54" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#1f2328">IDLE</text>
      <text x="390" y="74" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#59636e">poll every 60 s</text>

      <line x1="390" y1="86" x2="390" y2="110" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrAg)"></line>

      <rect x="290" y="115" width="200" height="56" fill="#ffffff" stroke="#1f2328" stroke-width="1"></rect>
      <text x="390" y="139" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#1f2328">POLL ORCHESTRATOR</text>
      <text x="390" y="159" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#59636e">fetch desired_state</text>

      <line x1="290" y1="143" x2="220" y2="143" stroke="#a04000" stroke-width="1.5" marker-end="url(#arrAg-err)"></line>
      <text x="225" y="135" font-family="-apple-system, sans-serif" font-size="11" font-style="italic" fill="#a04000">offline</text>

      <line x1="490" y1="143" x2="560" y2="143" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#arrAg-ok)"></line>
      <text x="495" y="135" font-family="-apple-system, sans-serif" font-size="11" font-style="italic" fill="#1a7f37">online</text>

      <rect x="20" y="115" width="200" height="80" fill="#fff5e8" stroke="#a04000" stroke-width="1.5"></rect>
      <text x="120" y="139" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#a04000">UNREACHABLE</text>
      <text x="120" y="159" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#a04000">use cached state</text>
      <text x="120" y="178" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#a04000">alert after 24 h</text>

      <rect x="560" y="115" width="180" height="56" fill="#e6f4ea" stroke="#1a7f37" stroke-width="1"></rect>
      <text x="650" y="139" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#1a7f37">RECONCILE</text>
      <text x="650" y="159" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#1a7f37">already-patched? skip</text>

      <line x1="650" y1="171" x2="650" y2="200" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrAg)"></line>

      <rect x="560" y="205" width="180" height="56" fill="#ffffff" stroke="#1f2328" stroke-width="1"></rect>
      <text x="650" y="229" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#1f2328">PRE-CHECKS</text>
      <text x="650" y="249" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#59636e">drain · snapshot</text>

      <line x1="650" y1="261" x2="650" y2="290" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrAg)"></line>

      <rect x="560" y="295" width="180" height="56" fill="#ffffff" stroke="#1f2328" stroke-width="1"></rect>
      <text x="650" y="319" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#1f2328">APPLY PATCH</text>
      <text x="650" y="339" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#59636e">verify signature first</text>

      <line x1="560" y1="323" x2="490" y2="323" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrAg)"></line>

      <rect x="290" y="295" width="200" height="56" fill="#ffffff" stroke="#1f2328" stroke-width="1"></rect>
      <text x="390" y="319" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#1f2328">POST-CHECKS</text>
      <text x="390" y="339" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#59636e">smoke tests · OBHC</text>

      <path d="M 390 295 L 390 270 L 250 270 L 250 60 L 310 60" stroke="#1a7f37" stroke-width="1.5" fill="none" marker-end="url(#arrAg-ok)"></path>
      <text x="260" y="200" font-family="-apple-system, sans-serif" font-size="11" font-style="italic" fill="#1a7f37">pass → idle</text>

      <line x1="290" y1="323" x2="220" y2="323" stroke="#a04000" stroke-width="1.5" marker-end="url(#arrAg-err)"></line>
      <text x="225" y="316" font-family="-apple-system, sans-serif" font-size="11" font-style="italic" fill="#a04000">fail</text>

      <rect x="20" y="295" width="200" height="56" fill="#fff5e8" stroke="#a04000" stroke-width="1.5"></rect>
      <text x="120" y="319" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#a04000">ROLLBACK</text>
      <text x="120" y="339" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#a04000">kexec or grub revert</text>

      <path d="M 120 295 L 120 195" stroke="#a04000" stroke-width="1.5" fill="none" marker-end="url(#arrAg-err)"></path>

      <rect x="20" y="385" width="720" height="60" fill="#fffaf0" stroke="#1f2328" stroke-width="1"></rect>
      <text x="40" y="408" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#1f2328">Why pull-based?</text>
      <text x="40" y="428" font-family="-apple-system, sans-serif" font-size="12" fill="#1f2328">Survives partitions: agent uses cached desired state. Survives orchestrator restart: no in-flight RPCs to lose.</text>
    </svg>
