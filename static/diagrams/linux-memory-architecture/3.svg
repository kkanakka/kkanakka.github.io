<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="auto" role="img" aria-label="C versus Java process memory comparison"><style>.svg-label{font-family: Inter, sans-serif;
  font-size: 11px;
  fill: #1f2328;}
.svg-muted{fill: #59636e;
  font-size: 10px;
  font-family: Inter, sans-serif;}
.svg-mono{font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  fill: #1f2328;}</style>
      <defs>
        <marker id="ac" markerWidth="7" markerHeight="7" refX="3.5" refY="7" orient="auto">
          <polygon points="3.5 0, 0 7, 7 7" fill="#8250df"></polygon>
        </marker>
      </defs>
      <text x="225" y="30" text-anchor="middle" class="svg-label" font-weight="700" fill="#0969da">C Process</text>
      <text x="675" y="30" text-anchor="middle" class="svg-label" font-weight="700" fill="#1a7f37">Java Process</text>

      <rect x="40" y="45" width="370" height="310" fill="#f6f8fa" stroke="#d1d9e0"></rect>
      <rect x="490" y="45" width="370" height="310" fill="#f6f8fa" stroke="#d1d9e0"></rect>

      <!-- C column blocks -->
      <rect x="55" y="58" width="340" height="42" fill="#ddf4ff" stroke="#0969da"></rect>
      <text x="225" y="84" text-anchor="middle" class="svg-mono" font-size="11px">text — program + libc code</text>
      <rect x="55" y="106" width="340" height="40" fill="#dafbe1" stroke="#1a7f37"></rect>
      <text x="225" y="132" text-anchor="middle" class="svg-mono" font-size="11px">data — initialized globals</text>
      <rect x="55" y="152" width="340" height="38" fill="#ffffff" stroke="#1a7f37" stroke-dasharray="4 3"></rect>
      <text x="225" y="176" text-anchor="middle" class="svg-mono" font-size="11px">BSS — uninitialized globals</text>
      <rect x="55" y="196" width="340" height="78" fill="#f5f0ff" stroke="#8250df"></rect>
      <text x="225" y="222" text-anchor="middle" class="svg-mono" font-size="11px">heap — malloc / free</text>
      <text x="225" y="240" text-anchor="middle" class="svg-muted" font-size="10px">explicit lifetime</text>
      <rect x="55" y="282" width="340" height="58" fill="#fff8c5" stroke="#9a6700"></rect>
      <text x="225" y="308" text-anchor="middle" class="svg-mono" font-size="11px">stack — automatic storage</text>
      <text x="225" y="326" text-anchor="middle" class="svg-muted" font-size="10px">function frames</text>

      <!-- Java column blocks -->
      <rect x="505" y="58" width="340" height="42" fill="#ddf4ff" stroke="#0969da"></rect>
      <text x="675" y="78" text-anchor="middle" class="svg-mono" font-size="10px">text — libjvm.so + JIT CodeCache</text>
      <text x="675" y="92" text-anchor="middle" class="svg-muted" font-size="9px">interpreter + dynamically emitted code</text>
      <rect x="505" y="106" width="340" height="40" fill="#dafbe1" stroke="#1a7f37"></rect>
      <text x="675" y="132" text-anchor="middle" class="svg-mono" font-size="10px">data — constant pool → Metaspace tables</text>
      <rect x="505" y="152" width="340" height="38" fill="#ffffff" stroke="#1a7f37" stroke-dasharray="4 3"></rect>
      <text x="675" y="176" text-anchor="middle" class="svg-mono" font-size="10px">BSS — null static refs (native); objects on heap</text>
      <rect x="505" y="196" width="165" height="78" fill="#f5f0ff" stroke="#8250df"></rect>
      <text x="587" y="222" text-anchor="middle" class="svg-mono" font-size="10px">Java Heap</text>
      <text x="587" y="240" text-anchor="middle" class="svg-muted" font-size="9px">Eden → S → Old</text>
      <text x="587" y="256" text-anchor="middle" class="svg-muted" font-size="9px">GC-managed</text>
      <rect x="678" y="196" width="167" height="78" fill="#ffebe9" stroke="#d1242f"></rect>
      <text x="761" y="222" text-anchor="middle" class="svg-mono" font-size="10px">Native Heap</text>
      <text x="761" y="240" text-anchor="middle" class="svg-muted" font-size="9px">Metaspace · DirectBuf</text>
      <text x="761" y="256" text-anchor="middle" class="svg-muted" font-size="9px">malloc zones</text>
      <rect x="505" y="282" width="340" height="58" fill="#fff8c5" stroke="#9a6700"></rect>
      <text x="675" y="308" text-anchor="middle" class="svg-mono" font-size="10px">stack — per-thread Java frames</text>
      <text x="675" y="326" text-anchor="middle" class="svg-muted" font-size="10px">-Xss; JNI attic frames when native</text>

      <!-- Connector arrows between columns -->
      <line x1="395" y1="79" x2="505" y2="79" stroke="#8250df" stroke-width="1.5" stroke-dasharray="5 4"></line>
      <polygon points="500,79 505,75 505,83" fill="#8250df"></polygon>
      <line x1="395" y1="126" x2="505" y2="126" stroke="#8250df" stroke-width="1.5" stroke-dasharray="5 4"></line>
      <polygon points="500,126 505,122 505,130" fill="#8250df"></polygon>
      <line x1="395" y1="171" x2="505" y2="171" stroke="#8250df" stroke-width="1.5" stroke-dasharray="5 4"></line>
      <polygon points="500,171 505,167 505,175" fill="#8250df"></polygon>
      <line x1="395" y1="225" x2="505" y2="225" stroke="#8250df" stroke-width="1.5" stroke-dasharray="5 4"></line>
      <polygon points="500,225 505,221 505,229" fill="#8250df"></polygon>
      <line x1="395" y1="311" x2="505" y2="311" stroke="#8250df" stroke-width="1.5" stroke-dasharray="5 4"></line>
      <polygon points="500,311 505,307 505,315" fill="#8250df"></polygon>

      <rect x="250" y="338" width="400" height="32" fill="#f5f0ff" stroke="#8250df" rx="4"></rect>
      <text x="450" y="358" text-anchor="middle" class="svg-label" font-size="11px" fill="#8250df">Layer of indirection: bytecode verify + GC + barriers + Metaspace class metadata</text>
    </svg>
