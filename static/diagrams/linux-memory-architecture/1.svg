<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="auto" role="img" aria-label="Java process memory layout from low to high address"><style>.svg-label{font-family: Inter, sans-serif;
  font-size: 11px;
  fill: #1f2328;}
.svg-muted{fill: #59636e;
  font-size: 10px;
  font-family: Inter, sans-serif;}
.svg-mono{font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  fill: #1f2328;}</style>
      <defs>
        <marker id="arr-up" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
          <polygon points="0,0 8,4 0,8" fill="#0969da"></polygon>
        </marker>
        <marker id="arr-g" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
          <polygon points="0,0 8,4 0,8" fill="#1a7f37"></polygon>
        </marker>
      </defs>
      <!-- Address axis labels -->
      <text x="18" y="38" class="svg-muted">0xFFFF_FFFF_FFFF_FFFF</text>
      <text x="18" y="488" class="svg-muted">0x0000_0000_0040_0000</text>
      <text x="120" y="265" class="svg-muted" transform="rotate(-90 120 265)">Virtual address →</text>

      <!-- KERNEL SPACE -->
      <rect x="160" y="28" width="680" height="52" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="2"></rect>
      <text x="500" y="52" text-anchor="middle" class="svg-label" font-weight="700" fill="#59636e">KERNEL SPACE</text>
      <text x="500" y="68" text-anchor="middle" class="svg-muted" font-size="10px">socket buffers · page cache · fd table · epoll</text>

      <!-- STACK -->
      <rect x="160" y="88" width="680" height="95" fill="#fff8c5" stroke="#9a6700" stroke-width="2"></rect>
      <text x="500" y="108" text-anchor="middle" class="svg-label" font-weight="700" fill="#9a6700">STACK (per-thread, grows ↓)</text>
      <text x="500" y="124" text-anchor="middle" class="svg-label" font-size="11px">200 threads × 1 MiB ≈ 200 MiB reserved (typical sizing)</text>
      <rect x="180" y="132" width="56" height="40" fill="#ffffff" stroke="#d1d9e0"></rect>
      <rect x="242" y="132" width="56" height="40" fill="#ffffff" stroke="#d1d9e0"></rect>
      <rect x="304" y="132" width="56" height="40" fill="#ffffff" stroke="#d1d9e0"></rect>
      <text x="218" y="156" text-anchor="middle" class="svg-mono" font-size="9px">T1</text>
      <text x="270" y="156" text-anchor="middle" class="svg-mono" font-size="9px">T2</text>
      <text x="332" y="156" text-anchor="middle" class="svg-mono" font-size="9px">T3</text>
      <text x="420" y="156" class="svg-muted" font-size="10px">…</text>
      <rect x="730" y="132" width="90" height="40" fill="#ffffff" stroke="#d1d9e0"></rect>
      <text x="775" y="156" text-anchor="middle" class="svg-mono" font-size="9px">T200</text>
      <text x="500" y="178" text-anchor="middle" class="svg-muted" font-size="10px">Each box: -Xss frames, local vars, reference slots (oop maps)</text>

      <!-- mmap region -->
      <rect x="160" y="191" width="680" height="42" fill="#f6f8fa" stroke="#59636e" stroke-width="1" stroke-dasharray="4 3"></rect>
      <text x="500" y="210" text-anchor="middle" class="svg-label" font-weight="600" fill="#59636e">Memory-mapped files &amp; anonymous mappings</text>
      <text x="500" y="226" text-anchor="middle" class="svg-muted" font-size="10px">JAR/class data · CDS · huge pages · other mmap</text>

      <!-- HEAP outer -->
      <rect x="160" y="241" width="680" height="168" fill="#f5f0ff" stroke="#8250df" stroke-width="2"></rect>
      <text x="500" y="260" text-anchor="middle" class="svg-label" font-weight="700" fill="#8250df">HEAP — Java managed + native arenas</text>

      <!-- Java heap left -->
      <rect x="175" y="270" width="320" height="125" fill="#ffffff" stroke="#8250df" stroke-width="1"></rect>
      <text x="335" y="288" text-anchor="middle" class="svg-label" font-weight="600" fill="#8250df">Java Heap (GC-managed)</text>
      <rect x="188" y="298" width="70" height="36" fill="#dafbe1" stroke="#1a7f37"></rect>
      <text x="223" y="320" text-anchor="middle" class="svg-mono" font-size="10px">Eden</text>
      <polygon points="260,306 274,306 274,298 286,316 274,334 274,326 260,326" fill="#0969da"></polygon>
      <rect x="292" y="298" width="44" height="36" fill="#ddf4ff" stroke="#0969da"></rect>
      <text x="314" y="320" text-anchor="middle" class="svg-mono" font-size="9px">S0</text>
      <polygon points="338,306 352,306 352,298 364,316 352,334 352,326 338,326" fill="#0969da"></polygon>
      <rect x="370" y="298" width="44" height="36" fill="#ddf4ff" stroke="#0969da"></rect>
      <text x="392" y="320" text-anchor="middle" class="svg-mono" font-size="9px">S1</text>
      <polygon points="418,306 432,306 432,298 444,316 432,334 432,326 418,326" fill="#0969da"></polygon>
      <rect x="452" y="298" width="130" height="85" fill="#f5f0ff" stroke="#8250df"></rect>
      <text x="517" y="322" text-anchor="middle" class="svg-mono" font-size="11px">Old Gen</text>
      <text x="517" y="340" text-anchor="middle" class="svg-muted" font-size="9px">long-lived objects</text>
      <path d="M223 296 L314 294" stroke="#1a7f37" stroke-width="1.2" marker-end="url(#arr-g)"></path>

      <!-- Native heap right -->
      <rect x="510" y="270" width="315" height="125" fill="#ffffff" stroke="#8250df" stroke-width="1"></rect>
      <text x="667" y="288" text-anchor="middle" class="svg-label" font-weight="600" fill="#8250df">Native Heap / JVM arenas</text>
      <rect x="525" y="298" width="92" height="38" fill="#ffebe9" stroke="#d1242f"></rect>
      <text x="571" y="321" text-anchor="middle" class="svg-mono" font-size="10px">Metaspace</text>
      <rect x="627" y="298" width="92" height="38" fill="#ffebe9" stroke="#d1242f"></rect>
      <text x="673" y="321" text-anchor="middle" class="svg-mono" font-size="9px">DirectByteBuf</text>
      <rect x="729" y="298" width="82" height="38" fill="#ffebe9" stroke="#d1242f"></rect>
      <text x="770" y="321" text-anchor="middle" class="svg-mono" font-size="9px">CodeCache</text>
      <text x="667" y="370" text-anchor="middle" class="svg-muted" font-size="10px">malloc zones · arena allocators · thread-local buffers</text>

      <!-- BSS -->
      <rect x="160" y="415" width="680" height="28" fill="#ffffff" stroke="#1a7f37" stroke-width="1" stroke-dasharray="4 3"></rect>
      <text x="500" y="434" text-anchor="middle" class="svg-label" font-weight="600" fill="#1a7f37">BSS — uninitialized statics · zero-filled at startup</text>

      <!-- DATA -->
      <rect x="160" y="447" width="680" height="28" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"></rect>
      <text x="500" y="466" text-anchor="middle" class="svg-label" font-weight="600" fill="#1a7f37">DATA — static finals · version strings · signal handlers</text>

      <!-- TEXT -->
      <rect x="160" y="479" width="680" height="32" fill="#ddf4ff" stroke="#0969da" stroke-width="2"></rect>
      <text x="500" y="500" text-anchor="middle" class="svg-label" font-weight="700" fill="#0969da">TEXT — libjvm.so · JIT CodeCache · interpreter</text>

      <!-- Side address callouts -->
      <text x="18" y="58" class="svg-mono" font-size="9px" fill="#59636e">0xFFFF…</text>
      <text x="18" y="135" class="svg-mono" font-size="9px" fill="#59636e">0x7FFF…</text>
      <text x="18" y="220" class="svg-mono" font-size="9px" fill="#59636e">brk/mmap band</text>
      <text x="18" y="330" class="svg-mono" font-size="9px" fill="#59636e">growing ↑</text>
      <text x="18" y="492" class="svg-mono" font-size="9px" fill="#59636e">0x0040…</text>
      <line x1="848" y1="44" x2="870" y2="44" stroke="#0969da" stroke-width="1.5" marker-end="url(#arr-up)"></line>
      <text x="855" y="38" class="svg-muted" font-size="9px" text-anchor="end">high</text>
      <text x="855" y="505" class="svg-muted" font-size="9px" text-anchor="end">low</text>
    </svg>
