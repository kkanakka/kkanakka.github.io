<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" aria-labelledby="fig5-title">
      <title id="fig5-title">thread mapping Java pthread kernel</title>
      <defs>
        <marker id="arr5b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0969da"></path></marker>
        <marker id="arr5g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1a7f37"></path></marker>
      </defs>
      <!-- Java layer -->
      <rect x="30" y="20" width="560" height="90" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="2"></rect>
      <text x="40" y="42" fill="#1f2328" font-size="13" font-weight="600">Java Layer</text>
      <rect x="50" y="52" width="120" height="48" rx="4" fill="#f6f8fa" stroke="#0969da" stroke-width="1"></rect><text x="110" y="80" text-anchor="middle" fill="#1f2328" font-size="11">Thread("main")</text>
      <rect x="180" y="52" width="120" height="48" rx="4" fill="#f6f8fa" stroke="#0969da" stroke-width="1"></rect><text x="240" y="80" text-anchor="middle" fill="#1f2328" font-size="11">Thread("GC-0")</text>
      <rect x="310" y="52" width="130" height="48" rx="4" fill="#f6f8fa" stroke="#0969da" stroke-width="1"></rect><text x="375" y="80" text-anchor="middle" fill="#1f2328" font-size="10">Thread("RequestProc-1")</text>
      <rect x="450" y="52" width="125" height="48" rx="4" fill="#f6f8fa" stroke="#0969da" stroke-width="1"></rect><text x="512" y="80" text-anchor="middle" fill="#1f2328" font-size="10">Thread("EventLoop-0")</text>

      <!-- Native layer -->
      <rect x="30" y="150" width="560" height="90" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"></rect>
      <text x="40" y="172" fill="#1f2328" font-size="13" font-weight="600">Native Layer</text>
      <rect x="50" y="182" width="120" height="48" rx="4" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1"></rect><text x="110" y="210" text-anchor="middle" fill="#1f2328" font-size="11">pthread_t</text>
      <rect x="180" y="182" width="120" height="48" rx="4" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1"></rect><text x="240" y="210" text-anchor="middle" fill="#1f2328" font-size="11">pthread_t</text>
      <rect x="310" y="182" width="130" height="48" rx="4" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1"></rect><text x="375" y="210" text-anchor="middle" fill="#1f2328" font-size="11">pthread_t</text>
      <rect x="450" y="182" width="125" height="48" rx="4" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1"></rect><text x="512" y="210" text-anchor="middle" fill="#1f2328" font-size="11">pthread_t</text>

      <!-- Kernel layer -->
      <rect x="30" y="280" width="560" height="70" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="2"></rect>
      <text x="40" y="302" fill="#1f2328" font-size="13" font-weight="600">Kernel Layer</text>
      <rect x="50" y="310" width="120" height="32" rx="3" fill="#f6f8fa" stroke="#9a6700" stroke-width="1"></rect><text x="110" y="330" text-anchor="middle" fill="#1f2328" font-size="10">task_struct (PID 12345)</text>
      <rect x="180" y="310" width="120" height="32" rx="3" fill="#f6f8fa" stroke="#9a6700" stroke-width="1"></rect><text x="240" y="330" text-anchor="middle" fill="#1f2328" font-size="10">task_struct (TID 12346)</text>
      <rect x="310" y="310" width="130" height="32" rx="3" fill="#f6f8fa" stroke="#9a6700" stroke-width="1"></rect><text x="375" y="330" text-anchor="middle" fill="#1f2328" font-size="10">task_struct (TID 12347)</text>
      <rect x="450" y="310" width="125" height="32" rx="3" fill="#f6f8fa" stroke="#9a6700" stroke-width="1"></rect><text x="512" y="330" text-anchor="middle" fill="#1f2328" font-size="10">task_struct (TID 12348)</text>

      <!-- vertical connectors -->
      <line x1="110" y1="118" x2="110" y2="146" stroke="#0969da" stroke-width="2" marker-end="url(#arr5b)"></line>
      <line x1="240" y1="118" x2="240" y2="146" stroke="#0969da" stroke-width="2" marker-end="url(#arr5b)"></line>
      <line x1="375" y1="118" x2="375" y2="146" stroke="#0969da" stroke-width="2" marker-end="url(#arr5b)"></line>
      <line x1="512" y1="118" x2="512" y2="146" stroke="#0969da" stroke-width="2" marker-end="url(#arr5b)"></line>
      <text x="640" y="138" fill="#59636e" font-size="11">Thread.start()</text>

      <line x1="110" y1="246" x2="110" y2="274" stroke="#1a7f37" stroke-width="2" marker-end="url(#arr5g)"></line>
      <line x1="240" y1="246" x2="240" y2="274" stroke="#1a7f37" stroke-width="2" marker-end="url(#arr5g)"></line>
      <line x1="375" y1="246" x2="375" y2="274" stroke="#1a7f37" stroke-width="2" marker-end="url(#arr5g)"></line>
      <line x1="512" y1="246" x2="512" y2="274" stroke="#1a7f37" stroke-width="2" marker-end="url(#arr5g)"></line>
      <text x="640" y="268" fill="#59636e" font-size="11">clone(CLONE_VM|CLONE_FILES|CLONE_THREAD)</text>

      <!-- Side annotations -->
      <rect x="700" y="60" width="180" height="52" rx="4" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"></rect>
      <text x="708" y="78" fill="#1f2328" font-size="11" font-weight="600">All share:</text>
      <text x="708" y="94" fill="#59636e" font-size="10">mm_struct, files_struct</text>
      <text x="708" y="108" fill="#59636e" font-size="10">Java heap</text>

      <rect x="700" y="200" width="180" height="52" rx="4" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"></rect>
      <text x="708" y="218" fill="#1f2328" font-size="11" font-weight="600">Each owns:</text>
      <text x="708" y="234" fill="#59636e" font-size="10">stack, registers</text>
      <text x="708" y="248" fill="#59636e" font-size="10">scheduling priority</text>
    </svg>
