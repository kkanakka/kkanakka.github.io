name: Build AI System Design index

on:
  push:
    branches: [main]
    paths:
      - 'ai-system-design/**'
      - 'scripts/build_ai_index.py'
      - '.github/workflows/build-ai-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ai-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate index
        run: python3 scripts/build_ai_index.py

      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain ai-index.html index.html)" ]]; then
            echo "No index changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-index.html index.html
          git commit -m "Rebuild AI System Design index [skip ci]"
          git push
