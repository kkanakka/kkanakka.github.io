name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # showLastUpdateTime needs real history

      - uses: actions/setup-node@v4
        with:
          node-version: 24        # npm 11, matching the lockfile's writer
          cache: npm

      # npm ci is the strict path; fall back to install so a lockfile written
      # by a different npm major can't take the site offline.
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      # Turn anything dropped into ai-system-design/ into pages in the
      # AI System Design section. Never touches the other sections.
      - name: Refresh AI System Design section
        run: node scripts/convert.js --ai-only

      # Keep the old .html URLs alive.
      - name: Generate redirect stubs
        run: node scripts/gen-redirects.js

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
